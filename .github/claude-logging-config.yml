# Claude Code Interaction Logging Configuration

# 🎛️ Automation Levels
automation:
  level: "smart" # off | minimal | balanced | aggressive | smart
  
  # Smart filtering rules
  filters:
    auto_create_on:
      - interaction_type: ["feature-implementation", "architecture-decision", "bug-fix"]
        priority: ["critical", "high"]
        file_changes: ">= 3"
      
      - interaction_type: ["performance-optimization"]
        priority: ["medium", "high", "critical"]
        file_changes: ">= 1"
        
      - interaction_type: ["refactoring"]
        priority: ["high", "critical"]
        file_changes: ">= 5"
    
    batch_process_on:
      - interaction_type: ["documentation-update", "configuration-change"]
        priority: ["low", "medium"]
        file_changes: "<= 2"
      
      - interaction_type: ["testing"]
        priority: ["low"]
        file_changes: "any"
    
    ignore_on:
      - interaction_type: ["discussion-analysis"]
        priority: ["info"]
        file_changes: "0"
        duration: "< 5 minutes"

# 📊 Analysis Configuration  
analysis:
  frequency:
    daily_insights: false
    weekly_summary: true
    monthly_deep_dive: true
    quarterly_trends: true
  
  metrics:
    track_performance: true
    measure_impact: true
    detect_patterns: true
    predict_trends: true
  
  quality_gates:
    min_confidence: 0.75
    max_noise_ratio: 0.25
    required_metadata: ["timestamp", "type", "priority"]

# 🏷️ Labeling Strategy
labels:
  prefixes:
    type: "type:"
    priority: "priority:" 
    domain: "domain:"
    status: "status:"
    
  auto_labels:
    - name: "claude-code"
      always: true
      
    - name: "automated"
      condition: "source == 'workflow'"
      
    - name: "needs-review"
      condition: "priority in ['critical', 'high'] and confidence < 0.8"
      
    - name: "follow-up-needed"
      condition: "outcomes.followUpNeeded.length > 0"

# 🔍 Search and Discovery
search:
  indexing:
    full_text: true
    metadata_fields: true
    code_snippets: true
    
  aliases:
    recent: "label:claude-code created:>7d"
    high_impact: "label:claude-code label:priority:high,priority:critical"
    bugs: "label:claude-code label:type:bug-fix"
    features: "label:claude-code label:type:feature-implementation"

# 📈 Reporting Configuration
reports:
  weekly_summary:
    enabled: true
    day: "monday"
    time: "09:00"
    include:
      - interaction_stats
      - priority_distribution  
      - top_keywords
      - trend_analysis
      - recommendations
      
  monthly_insights:
    enabled: true
    day: 1
    time: "10:00"
    include:
      - pattern_analysis
      - performance_metrics
      - comparative_analysis
      - strategic_recommendations

# 🚨 Alerting and Notifications
notifications:
  channels:
    github_issues: true
    email_digest: false
    slack_webhook: false
    
  triggers:
    high_priority_interaction:
      condition: "priority == 'critical'"
      immediate: true
      
    unusual_activity:
      condition: "daily_interactions > avg * 2"
      delay: "end_of_day"
      
    error_threshold:
      condition: "error_rate > 0.1"
      delay: "15 minutes"

# 🔧 Maintenance
maintenance:
  cleanup:
    old_reports: "90 days"
    low_priority_issues: "never"
    duplicate_entries: "immediate"
    
  optimization:
    reindex_frequency: "weekly"
    cache_refresh: "daily"
    backup_frequency: "monthly"

# 🎯 Success Metrics
success_criteria:
  engagement:
    min_weekly_issues: 5
    avg_response_time: "< 2 hours"
    user_satisfaction: "> 4.0/5.0"
    
  quality:
    classification_accuracy: "> 90%"
    duplicate_rate: "< 5%"
    false_positive_rate: "< 10%"
    
  impact:
    decision_traceability: "> 95%"
    knowledge_reuse: "> 30%"
    development_velocity: "maintained or improved"