# 🎯 PMP学習管理システム - 楽しい自動ラベル適用設定
# PRの変更ファイルに基づいて楽しいラベルを自動適用

# ==========================================
# 📄 ドキュメント関連
# ==========================================
"📄 ドキュメント":
  - "**/*.md"
  - "docs/**/*"
  - "README*"
  - ".claude/**/*"

# ==========================================
# 🎨 UI・UX関連
# ==========================================
"🎨 UI・UX":
  - "src/components/**/*"
  - "src/pages/**/*"
  - "**/*.jsx"
  - "**/*.tsx"
  - "**/*.css"
  - "**/*.scss"
  - "**/tailwind*"
  - "**/postcss*"

# ==========================================
# 📊 視覚化機能関連
# ==========================================
"📊 視覚化":
  - "src/components/visualizations/**/*"
  - "src/components/**/Enhanced*"
  - "src/components/**/Sankey*"
  - "src/components/**/Network*"
  - "src/components/**/Heatmap*"
  - "src/components/**/Graph*"

# ==========================================
# 🎓 学習機能関連
# ==========================================
"🎓 学習機能":
  - "src/components/learning/**/*"
  - "src/components/**/FlashCard*"
  - "src/components/**/MockExam*"
  - "src/components/**/Progress*"
  - "src/components/**/Glossary*"

# ==========================================
# 📱 モバイル関連
# ==========================================
"📱 モバイル":
  - "src/components/mobile/**/*"
  - "src/components/**/Mobile*"
  - "src/lib/pwa/**/*"
  - "**/service-worker*"
  - "public/manifest.json"

# ==========================================
# ⚡ パフォーマンス関連
# ==========================================
"⚡ パフォーマンス":
  - "**/*performance*"
  - ".bundlesizerc*"
  - "*lighthouse*"
  - "src/lib/cache/**/*"
  - "src/utils/performance*"

# ==========================================
# 🔐 セキュリティ関連
# ==========================================
"🔐 セキュリティ":
  - ".github/workflows/security*.yml"
  - "src/lib/security/**/*"
  - "src/server/auth/**/*"
  - "**/security/**/*"

# ==========================================
# 🌍 アクセシビリティ関連
# ==========================================
"🌍 アクセシビリティ":
  - "src/test/utils/accessibility*"
  - "**/*a11y*"
  - "**/accessibility*"

# ==========================================
# 📚 学習コンテンツ関連
# ==========================================
"📚 学習コンテンツ":
  - "src/data/**/*"
  - "data/**/*"
  - "**/*glossary*"
  - "**/*processData*"
  - "**/*pmbok*"
  - "**/mock-exam*"

# ==========================================
# 🚀 スピードアップ（設定・最適化）
# ==========================================
"🚀 スピードアップ":
  - "*.config.*"
  - ".*rc*"
  - ".env*"
  - "package.json"
  - "package-lock.json"
  - "tsconfig.json"
  - "vite.config.*"
  - "vitest.config.*"
  - "playwright.config.*"