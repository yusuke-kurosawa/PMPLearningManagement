# Branch Protection Configuration
# This file documents the recommended branch protection settings for the repository

# Main Branch Protection
main_branch:
  protection_rules:
    # Require pull request reviews
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
      require_last_push_approval: false
      
    # Require status checks
    required_status_checks:
      strict: true  # Require branches to be up to date before merging
      contexts:
        - "Quality Gates"
        - "Unit Tests (unit)"
        - "Unit Tests (coverage)"
        - "E2E Tests (chromium, 1/3)"
        - "E2E Tests (chromium, 2/3)"
        - "E2E Tests (chromium, 3/3)"
        - "Accessibility Tests"
        - "Performance Analysis"
        - "Security Scan"
        
    # Branch restrictions
    restrictions:
      users: []  # No user restrictions
      teams: []  # No team restrictions
      apps: []   # No app restrictions
      
    # Additional settings
    enforce_admins: false  # Allow admins to bypass
    allow_force_pushes: false
    allow_deletions: false
    block_creations: false
    required_linear_history: false
    allow_fork_syncing: true

# Develop Branch Protection (if using GitFlow)
develop_branch:
  protection_rules:
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: false
      require_code_owner_reviews: false
      
    required_status_checks:
      strict: false  # Allow merging without being up to date
      contexts:
        - "Quality Gates"
        - "Unit Tests (unit)"
        - "Unit Tests (coverage)"
        - "Accessibility Tests"
        
    enforce_admins: false
    allow_force_pushes: false
    allow_deletions: false

# Feature Branch Naming Convention
branch_naming:
  patterns:
    feature: "feature/*"
    bugfix: "bugfix/*"
    hotfix: "hotfix/*"
    release: "release/*"
    
  examples:
    - "feature/add-dark-mode"
    - "bugfix/fix-navigation-issue"
    - "hotfix/security-patch"
    - "release/v1.2.0"

# Quality Gates Configuration
quality_gates:
  # Code Quality
  code_quality:
    linting:
      required: true
      failing_threshold: 0  # No linting errors allowed
      
    test_coverage:
      required: true
      minimum_percentage: 80
      
    complexity:
      maximum_cyclomatic: 10
      maximum_cognitive: 15
      
  # Security
  security:
    vulnerability_scan:
      required: true
      severity_threshold: "high"  # Block high+ severity
      
    dependency_check:
      required: true
      auto_merge_minor: false
      
  # Performance
  performance:
    bundle_size:
      maximum_mb: 5
      increase_threshold: "10%"
      
    lighthouse_scores:
      performance: 80
      accessibility: 95
      best_practices: 90
      seo: 80
      
  # Documentation
  documentation:
    changelog_required: false  # Optional for now
    api_docs_required: false
    
# Automated Checks
automated_checks:
  # Dependency Updates
  dependabot:
    enabled: true
    auto_merge:
      security_updates: true
      patch_updates: false
      minor_updates: false
      
  # Code Scanning
  code_scanning:
    codeql:
      enabled: true
      languages: ["javascript"]
      schedule: "weekly"
      
  # Secret Scanning
  secret_scanning:
    enabled: true
    push_protection: true
    
# Merge Settings
merge_settings:
  # Merge Methods
  allow_merge_commit: true
  allow_squash_merging: true
  allow_rebase_merging: false
  
  # Default merge method
  default_merge_method: "squash"
  
  # Auto-delete head branches
  delete_branch_on_merge: true
  
  # Commit message template for squash merges
  squash_merge_commit_title: "PR_TITLE"
  squash_merge_commit_message: "PR_BODY"

# Notification Settings
notifications:
  # Required reviewers (by file pattern)
  code_owners:
    enabled: false  # Can be enabled later
    file: ".github/CODEOWNERS"
    
  # Auto-assignment
  auto_assign:
    enabled: false
    reviewers: []
    team_reviewers: []
    
  # Status checks
  status_check_notifications:
    required: true
    channels:
      - "email"
      - "github_notifications"

# Emergency Procedures
emergency_procedures:
  # Hotfix Process
  hotfix:
    allow_direct_push: false  # Even hotfixes go through PR
    required_reviewers: 1
    bypass_ci: false
    
  # Production Issues
  production_issues:
    escalation_path:
      - "Create hotfix branch"
      - "Minimal fix implementation"
      - "Fast-track PR review"
      - "Immediate deployment"
      - "Post-incident review"
      
  # Rollback Process
  rollback:
    automated_triggers:
      - "Health check failures"
      - "Critical error threshold"
      - "Performance degradation"
    
    manual_triggers:
      - "Security incidents"
      - "Data integrity issues"
      - "User-reported critical bugs"

# Compliance Requirements
compliance:
  # Audit Trail
  audit_trail:
    required: true
    retention_period: "2 years"
    
  # Change Management
  change_management:
    documentation_required: false  # For now
    approval_required: true  # Via PR review
    
  # Security Compliance
  security_compliance:
    signed_commits: false  # Optional for now
    verified_commits: false
    gpg_required: false

# Review Guidelines
review_guidelines:
  # Review Checklist
  checklist:
    - "Code follows project conventions"
    - "Tests cover new functionality"
    - "Documentation is updated if needed"
    - "No security vulnerabilities introduced"
    - "Performance impact is acceptable"
    - "Accessibility requirements are met"
    
  # Review Criteria
  criteria:
    functional: "Does the code work as intended?"
    readable: "Is the code easy to understand?"
    maintainable: "Can the code be easily modified?"
    testable: "Is the code properly tested?"
    secure: "Does the code introduce security risks?"
    
  # Review Process
  process:
    - "Automated checks must pass first"
    - "Self-review by author"
    - "Peer review by team member"
    - "Address all review comments"
    - "Final approval and merge"