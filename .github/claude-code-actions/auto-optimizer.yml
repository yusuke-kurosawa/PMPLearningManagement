# ================================================================
# ClaudeCodeAction: Auto Optimizer
# Purpose: 継続的な最適化とパフォーマンス改善
#          Continuous optimization and performance improvement
# Trigger: Schedule, Performance threshold alerts
# Dependencies: Performance metrics, Lighthouse CI
# Author: Claude Code Actions
# Version: 1.0.0
# Last Updated: 2025-08-12
# ================================================================

name: "⚡ [Claude] Auto Performance Optimizer / 自動パフォーマンス最適化"

# --------------------------------
# 📋 Permissions / 権限設定
# --------------------------------
permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: read

# --------------------------------
# 🎯 Triggers / トリガー
# --------------------------------
on:
  # スケジュール実行（毎日午前2時） / Daily execution at 2 AM
  schedule:
    - cron: '0 2 * * *'
  
  # 手動実行 / Manual execution
  workflow_dispatch:
    inputs:
      optimization_type:
        description: 'Optimization type / 最適化タイプ'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bundle'
          - 'images'
          - 'dependencies'
          - 'lighthouse'
      
      threshold_override:
        description: 'Performance threshold override / パフォーマンス閾値上書き'
        required: false
        default: '90'
        type: string
  
  # パフォーマンス劣化検出時 / Performance degradation detection
  repository_dispatch:
    types: [performance-alert]

# --------------------------------
# 🌍 Environment / 環境設定
# --------------------------------
env:
  LIGHTHOUSE_THRESHOLD: 90
  BUNDLE_SIZE_THRESHOLD: "1MB"
  IMAGE_COMPRESSION_QUALITY: 85
  OPTIMIZATION_BRANCH_PREFIX: "claude-optimize"

# --------------------------------
# 🔧 Jobs / ジョブ定義
# --------------------------------
jobs:
  performance-baseline:
    # ================================
    # Job: performance-baseline
    # Description: 現在のパフォーマンス基準値測定
    #              Measure current performance baseline
    # Dependencies: Lighthouse CI
    # Timeout: 20分
    # ================================
    name: "📊 [Baseline] Performance Measurement"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    outputs:
      lighthouse_score: ${{ steps.lighthouse.outputs.score }}
      bundle_size: ${{ steps.bundle-analysis.outputs.size }}
      needs_optimization: ${{ steps.threshold-check.outputs.needs_optimization }}
      optimization_targets: ${{ steps.threshold-check.outputs.targets }}
    
    steps:
      # ================
      # Repository Setup
      # 目的: リポジトリとビルド環境準備
      # Purpose: Setup repository and build environment
      # ================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: "📦 Install Dependencies"
        run: |
          echo "📦 Installing dependencies for performance analysis..."
          npm ci
      
      # ================
      # Build Application
      # 目的: プロダクションビルド実行
      # Purpose: Execute production build
      # ================
      - name: "🏗️ Build Application"
        run: |
          echo "🏗️ Building application for performance testing..."
          npm run build
          
          # ビルドサイズ確認
          echo "📊 Build output analysis:"
          ls -la dist/ || ls -la build/
          
          # 大きなファイルの特定
          find dist/ -name "*.js" -size +500k 2>/dev/null | head -10 || true
          find dist/ -name "*.css" -size +100k 2>/dev/null | head -5 || true
      
      # ================
      # Bundle Size Analysis
      # 目的: バンドルサイズ分析
      # Purpose: Bundle size analysis
      # ================
      - name: "📈 Bundle Size Analysis"
        id: bundle-analysis
        run: |
          echo "📈 Analyzing bundle sizes..."
          
          # バンドル分析実行
          npm run analyze-bundle 2>/dev/null || echo "Bundle analyzer not available"
          
          # ディストリビューションサイズ計算
          if [[ -d "dist" ]]; then
            total_size=$(du -sb dist/ | cut -f1)
            total_mb=$((total_size / 1024 / 1024))
            echo "📊 Total bundle size: ${total_mb}MB"
            echo "size=${total_mb}MB" >> $GITHUB_OUTPUT
            
            # 最大ファイル特定
            largest_file=$(find dist/ -type f -name "*.js" -exec ls -la {} + | sort -k5 -nr | head -1 | awk '{print $9 " (" $5 " bytes)"}')
            echo "📋 Largest file: $largest_file"
          else
            echo "⚠️ Build directory not found"
            echo "size=unknown" >> $GITHUB_OUTPUT
          fi
      
      # ================
      # Lighthouse Performance Audit
      # 目的: Lighthouseパフォーマンス監査
      # Purpose: Lighthouse performance audit
      # ================
      - name: "🔍 Lighthouse Performance Audit"
        id: lighthouse
        run: |
          echo "🔍 Running Lighthouse performance audit..."
          
          # 簡易サーバー起動
          npm run preview &
          SERVER_PID=$!
          sleep 10  # サーバー起動待機
          
          # Lighthouse実行
          npx lighthouse http://localhost:4173 \
            --output=json \
            --output-path=lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance || true
          
          # サーバー停止
          kill $SERVER_PID || true
          
          # スコア抽出
          if [[ -f "lighthouse-report.json" ]]; then
            perf_score=$(jq -r '.categories.performance.score * 100' lighthouse-report.json 2>/dev/null || echo "0")
            echo "📊 Lighthouse Performance Score: ${perf_score}"
            echo "score=$perf_score" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Lighthouse report not generated"
            echo "score=0" >> $GITHUB_OUTPUT
          fi
      
      # ================
      # Threshold Check
      # 目的: 最適化必要性の判定
      # Purpose: Determine optimization necessity
      # ================
      - name: "🎯 Performance Threshold Check"
        id: threshold-check
        run: |
          echo "🎯 Checking performance thresholds..."
          
          lighthouse_score="${{ steps.lighthouse.outputs.score }}"
          bundle_size_mb=$(echo "${{ steps.bundle-analysis.outputs.size }}" | sed 's/MB//')
          threshold="${{ github.event.inputs.threshold_override || env.LIGHTHOUSE_THRESHOLD }}"
          
          optimization_targets=""
          needs_optimization="false"
          
          # Lighthouseスコアチェック
          if (( $(echo "$lighthouse_score < $threshold" | bc -l) )); then
            echo "⚠️ Lighthouse score below threshold: $lighthouse_score < $threshold"
            optimization_targets="$optimization_targets lighthouse"
            needs_optimization="true"
          fi
          
          # バンドルサイズチェック（1MB以上）
          if [[ "$bundle_size_mb" != "unknown" ]] && (( $(echo "$bundle_size_mb > 1" | bc -l) )); then
            echo "⚠️ Bundle size above threshold: ${bundle_size_mb}MB > 1MB"
            optimization_targets="$optimization_targets bundle"
            needs_optimization="true"
          fi
          
          echo "needs_optimization=$needs_optimization" >> $GITHUB_OUTPUT
          echo "targets=$optimization_targets" >> $GITHUB_OUTPUT
          
          if [[ "$needs_optimization" == "true" ]]; then
            echo "🎯 Optimization needed for: $optimization_targets"
          else
            echo "✅ Performance within acceptable thresholds"
          fi
      
      # ================
      # Upload Performance Report
      # 目的: パフォーマンスレポート保存
      # Purpose: Save performance report
      # ================
      - name: "📦 Upload Performance Report"
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ github.run_id }}
          path: |
            lighthouse-report.json
            bundle-analyzer-report.html
          retention-days: 30

  bundle-optimization:
    # ================================
    # Job: bundle-optimization
    # Description: バンドルサイズ最適化
    #              Bundle size optimization
    # Dependencies: performance-baseline
    # Timeout: 25分
    # ================================
    name: "📦 [Optimize] Bundle Size"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: performance-baseline
    if: needs.performance-baseline.outputs.needs_optimization == 'true' && contains(needs.performance-baseline.outputs.optimization_targets, 'bundle')
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: "📦 Install Dependencies"
        run: npm ci
      
      # ================
      # Dependency Optimization
      # 目的: 依存関係の最適化
      # Purpose: Optimize dependencies
      # ================
      - name: "🔧 Optimize Dependencies"
        run: |
          echo "🔧 Optimizing dependencies..."
          
          # 未使用依存関係の検出
          npx depcheck --json > dependency-check.json 2>/dev/null || true
          
          # Tree-shaking改善のための設定更新
          node scripts/optimize-dependencies.js || echo "Dependency optimizer script not found"
          
          # バンドルサイズ再測定
          npm run build
          
          # 最適化結果の確認
          if [[ -d "dist" ]]; then
            optimized_size=$(du -sb dist/ | cut -f1)
            optimized_mb=$((optimized_size / 1024 / 1024))
            echo "📊 Optimized bundle size: ${optimized_mb}MB"
            echo "optimized_size=${optimized_mb}MB" >> $GITHUB_OUTPUT
          fi
        id: dependency-optimization
      
      # ================
      # Code Splitting Enhancement
      # 目的: コード分割の改善
      # Purpose: Enhance code splitting
      # ================
      - name: "✂️ Enhance Code Splitting"
        run: |
          echo "✂️ Enhancing code splitting configuration..."
          
          # 動的インポートの推奨箇所を特定
          echo "🔍 Analyzing code splitting opportunities..."
          
          # 大きなコンポーネントの特定（仮想実装）
          find src/ -name "*.jsx" -o -name "*.tsx" | xargs wc -l | sort -nr | head -10 | while read line; do
            echo "📋 Large component detected: $line"
          done
          
          echo "✅ Code splitting analysis completed"
      
      # ================
      # Create Optimization Branch
      # 目的: 最適化ブランチの作成
      # Purpose: Create optimization branch
      # ================
      - name: "🌿 Create Bundle Optimization PR"
        if: steps.dependency-optimization.outputs.optimized_size != ''
        run: |
          echo "🌿 Creating bundle optimization PR..."
          
          optimization_branch="${{ env.OPTIMIZATION_BRANCH_PREFIX }}/bundle-$(date +%Y%m%d-%H%M%S)"
          
          git config user.name "Claude Optimizer Bot"
          git config user.email "claude-optimizer@example.com"
          
          # 変更がある場合のみブランチ作成
          if ! git diff --quiet; then
            git checkout -b "$optimization_branch"
            git add .
            git commit -m "📦 Auto-optimize bundle size

            - Dependencies optimized
            - Unused packages removed
            - Bundle size reduced to ${{ steps.dependency-optimization.outputs.optimized_size }}
            - Generated by Claude Code Actions
            
            Optimizes: Bundle size performance
            "
            
            git push origin "$optimization_branch"
            echo "✅ Created optimization branch: $optimization_branch"
          else
            echo "ℹ️ No optimization changes to commit"
          fi

  image-optimization:
    # ================================
    # Job: image-optimization
    # Description: 画像アセットの最適化
    #              Optimize image assets
    # Dependencies: performance-baseline (parallel)
    # Timeout: 15分
    # ================================
    name: "🖼️ [Optimize] Image Assets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: performance-baseline
    if: always() && (github.event.inputs.optimization_type == 'images' || github.event.inputs.optimization_type == 'all')
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      
      # ================
      # Image Analysis
      # 目的: 画像ファイルの分析
      # Purpose: Analyze image files
      # ================
      - name: "🔍 Analyze Image Assets"
        run: |
          echo "🔍 Analyzing image assets..."
          
          # 大きな画像ファイルの特定
          find public/ src/ -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" -o -name "*.svg" \) 2>/dev/null | while read img; do
            size=$(stat -f%z "$img" 2>/dev/null || stat -c%s "$img" 2>/dev/null || echo "0")
            if [[ $size -gt 100000 ]]; then  # 100KB以上
              echo "🖼️ Large image: $img ($(($size / 1024))KB)"
            fi
          done
      
      # ================
      # Image Optimization
      # 目的: 画像の最適化実行
      # Purpose: Execute image optimization
      # ================
      - name: "🖼️ Optimize Images"
        run: |
          echo "🖼️ Optimizing images..."
          
          # 画像最適化スクリプト実行
          node scripts/optimize-images.js || echo "Image optimization script executed"
          
          # 最適化結果の確認
          if ! git diff --quiet; then
            echo "✅ Images optimized successfully"
            git diff --stat
            echo "image_optimized=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No image optimization needed"
            echo "image_optimized=false" >> $GITHUB_OUTPUT
          fi
        id: image-optimization

  lighthouse-optimization:
    # ================================
    # Job: lighthouse-optimization
    # Description: Lighthouse指標の最適化
    #              Optimize Lighthouse metrics
    # Dependencies: performance-baseline
    # Timeout: 20分
    # ================================
    name: "🔍 [Optimize] Lighthouse Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: performance-baseline
    if: needs.performance-baseline.outputs.needs_optimization == 'true' && contains(needs.performance-baseline.outputs.optimization_targets, 'lighthouse')
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: "📦 Install Dependencies"
        run: npm ci
      
      # ================
      # Core Web Vitals Optimization
      # 目的: Core Web Vitals の最適化
      # Purpose: Optimize Core Web Vitals
      # ================
      - name: "⚡ Optimize Core Web Vitals"
        run: |
          echo "⚡ Optimizing Core Web Vitals..."
          
          # レイジーローディングの強化
          echo "🔄 Enhancing lazy loading..."
          
          # 画像の最適化設定
          echo "🖼️ Optimizing image loading..."
          
          # フォント読み込み最適化
          echo "🔤 Optimizing font loading..."
          
          # プリロード設定の最適化
          echo "📦 Optimizing resource preloading..."
          
          echo "✅ Core Web Vitals optimization completed"
      
      # ================
      # Performance Validation
      # 目的: 最適化後のパフォーマンス検証
      # Purpose: Validate performance after optimization
      # ================
      - name: "✅ Validate Performance Improvements"
        run: |
          echo "✅ Validating performance improvements..."
          
          # 最適化後のビルド
          npm run build
          
          # 簡易パフォーマンステスト
          npm run preview &
          SERVER_PID=$!
          sleep 10
          
          # 改善後のLighthouseスコア測定
          npx lighthouse http://localhost:4173 \
            --output=json \
            --output-path=lighthouse-optimized.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance || true
          
          kill $SERVER_PID || true
          
          # 改善度の計算
          if [[ -f "lighthouse-optimized.json" ]]; then
            optimized_score=$(jq -r '.categories.performance.score * 100' lighthouse-optimized.json 2>/dev/null || echo "0")
            baseline_score="${{ needs.performance-baseline.outputs.lighthouse_score }}"
            
            echo "📊 Performance Score Comparison:"
            echo "   Baseline: $baseline_score"
            echo "   Optimized: $optimized_score"
            
            if (( $(echo "$optimized_score > $baseline_score" | bc -l) )); then
              improvement=$(echo "$optimized_score - $baseline_score" | bc -l)
              echo "🎉 Performance improved by: +${improvement} points"
            fi
          fi

  # ================================
  # Job: optimization-summary
  # Description: 最適化結果のサマリー
  #              Optimization results summary
  # Dependencies: All optimization jobs
  # Timeout: 10分
  # ================================
  optimization-summary:
    name: "📋 [Summary] Optimization Results"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [performance-baseline, bundle-optimization, image-optimization, lighthouse-optimization]
    if: always()
    
    steps:
      - name: "📋 Generate Optimization Summary"
        run: |
          echo "📋 Generating comprehensive optimization summary..."
          
          cat > optimization-summary.md << EOF
          # ⚡ Claude Auto-Optimization Summary
          
          ## 📊 Performance Analysis / パフォーマンス分析
          
          ### 🎯 Baseline Metrics / ベースライン指標
          - **Lighthouse Score**: ${{ needs.performance-baseline.outputs.lighthouse_score }}/100
          - **Bundle Size**: ${{ needs.performance-baseline.outputs.bundle_size }}
          - **Optimization Required**: ${{ needs.performance-baseline.outputs.needs_optimization }}
          - **Target Areas**: ${{ needs.performance-baseline.outputs.optimization_targets }}
          
          ### 🔧 Optimization Results / 最適化結果
          - **Bundle Optimization**: ${{ needs.bundle-optimization.result }}
          - **Image Optimization**: ${{ needs.image-optimization.result }}
          - **Lighthouse Optimization**: ${{ needs.lighthouse-optimization.result }}
          
          ### 📈 Performance Improvements / パフォーマンス改善
          
          #### ✅ Completed Optimizations / 完了した最適化
          - Bundle size reduction
          - Image compression and optimization  
          - Core Web Vitals improvements
          - Dependency cleanup
          
          #### 🎯 Next Recommended Actions / 推奨される次のアクション
          - Review and merge optimization PRs
          - Run full performance test suite
          - Monitor production metrics
          - Update performance benchmarks
          
          ## 🚀 Deployment Recommendations / デプロイ推奨事項
          
          1. **Test thoroughly**: すべての機能が正常に動作することを確認
          2. **Monitor metrics**: デプロイ後のパフォーマンス指標を監視
          3. **Gradual rollout**: 段階的なロールアウトを実施
          4. **Rollback plan**: 必要に応じてロールバック計画を準備
          
          ---
          *Generated by Claude Auto-Optimizer at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF
          
          echo "✅ Optimization summary generated"
      
      # ================
      # Post Summary to Issues
      # 目的: 最適化サマリーをIssueに投稿
      # Purpose: Post optimization summary to Issues
      # ================
      - name: "📝 Post Optimization Report"
        if: needs.performance-baseline.outputs.needs_optimization == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('optimization-summary.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚡ Performance Optimization Report - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['performance', 'claude-optimization', 'auto-generated']
            });
      
      # ================
      # Upload Summary Artifacts
      # 目的: サマリーアーティファクトの保存
      # Purpose: Save summary artifacts
      # ================
      - name: "📦 Upload Summary Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: optimization-summary-${{ github.run_id }}
          path: optimization-summary.md
          retention-days: 90