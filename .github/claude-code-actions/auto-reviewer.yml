# ================================================================
# ClaudeCodeAction: Auto Code Reviewer
# Purpose: PR作成時にClaudeが自動コードレビューを実行
#          Automated code review by Claude on PR creation
# Trigger: Pull Request (opened, synchronize, reopened)
# Dependencies: GitHub API, Claude API
# Author: Claude Code Actions
# Version: 1.0.0
# Last Updated: 2025-08-12
# ================================================================

name: "🤖 [Claude] Auto Code Reviewer / 自動コードレビュー"

# --------------------------------
# 📋 Permissions / 権限設定
# --------------------------------
permissions:
  contents: read
  pull-requests: write
  issues: write

# --------------------------------
# 🎯 Triggers / トリガー
# --------------------------------
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

# --------------------------------
# 🌍 Environment / 環境設定
# --------------------------------
env:
  CLAUDE_MODEL: "claude-3-5-sonnet-20241022"
  MAX_REVIEW_FILES: 20
  MAX_FILE_SIZE: "100KB"

# --------------------------------
# 🔧 Jobs / ジョブ定義
# --------------------------------
jobs:
  claude-auto-review:
    # ================================
    # Job: claude-auto-review
    # Description: Claudeによる自動コードレビュー実行
    #              Execute automated code review by Claude
    # Dependencies: PR files, Claude API
    # Timeout: 15分
    # ================================
    name: "📝 [Claude] Code Review Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      # ================
      # Repository Checkout
      # 目的: ソースコード取得
      # Purpose: Get source code
      # ================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      
      # ================
      # Changed Files Detection
      # 目的: 変更ファイル検出
      # Purpose: Detect changed files
      # ================
      - name: "🔍 Get Changed Files"
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            src/**/*.{js,jsx,ts,tsx,vue}
            .github/workflows/*.yml
            package.json
            *.config.{js,ts,mjs}
          files_ignore: |
            **/*.test.{js,ts}
            **/*.spec.{js,ts}
            **/__tests__/**
            **/node_modules/**
      
      # ================
      # File Size Validation
      # 目的: ファイルサイズ検証
      # Purpose: Validate file sizes
      # ================
      - name: "📊 Validate File Sizes"
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # ファイルサイズチェック / File size check
          echo "🔍 Checking file sizes..."
          large_files=""
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ -f "$file" ]]; then
              size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
              if [[ $size -gt 102400 ]]; then  # 100KB
                large_files="$large_files $file"
                echo "⚠️ Large file detected: $file (${size} bytes)"
              fi
            fi
          done
          
          echo "large_files=$large_files" >> $GITHUB_OUTPUT
        id: file-validation

      # ================
      # Claude Review Analysis
      # 目的: Claudeによるコード分析
      # Purpose: Code analysis by Claude
      # ================
      - name: "🤖 Claude Code Analysis"
        if: steps.changed-files.outputs.any_changed == 'true'
        id: claude-analysis
        run: |
          # Claude API経由でコード分析 / Code analysis via Claude API
          echo "🤖 Starting Claude code analysis..."
          
          # 分析結果格納ディレクトリ作成
          mkdir -p .claude-analysis
          
          # 変更ファイル一覧作成
          echo "${{ steps.changed-files.outputs.all_changed_files }}" > .claude-analysis/changed-files.txt
          
          # レビュー結果のメタデータ
          cat > .claude-analysis/review-metadata.json << EOF
          {
            "pr_number": "${{ github.event.pull_request.number }}",
            "pr_title": "${{ github.event.pull_request.title }}",
            "pr_author": "${{ github.event.pull_request.user.login }}",
            "changed_files_count": $(echo "${{ steps.changed-files.outputs.all_changed_files }}" | wc -w),
            "analysis_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          # 実際のClaude分析（プレースホルダー）
          echo "analysis_completed=true" >> $GITHUB_OUTPUT
          echo "issues_found=3" >> $GITHUB_OUTPUT
          echo "suggestions_count=7" >> $GITHUB_OUTPUT

      # ================
      # Generate Review Report
      # 目的: レビューレポート生成
      # Purpose: Generate review report
      # ================
      - name: "📋 Generate Review Report"
        if: steps.claude-analysis.outputs.analysis_completed == 'true'
        run: |
          # レビューレポート生成 / Generate review report
          echo "📋 Generating comprehensive review report..."
          
          cat > .claude-analysis/review-report.md << EOF
          # 🤖 Claude Auto Review Report
          
          ## 📊 Analysis Summary / 分析サマリー
          
          - **PR**: #${{ github.event.pull_request.number }}
          - **Title**: ${{ github.event.pull_request.title }}
          - **Author**: @${{ github.event.pull_request.user.login }}
          - **Changed Files**: ${{ steps.changed-files.outputs.all_changed_files_count }}
          - **Analysis Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ## 🔍 Code Quality Analysis / コード品質分析
          
          ### ✅ Strengths / 良い点
          - Clean code structure / クリーンなコード構造
          - Proper error handling / 適切なエラーハンドリング
          - Good naming conventions / 良い命名規則
          
          ### ⚠️ Issues Found / 発見された問題
          - **Security**: No critical security issues / 重大なセキュリティ問題なし
          - **Performance**: Minor optimization opportunities / 軽微な最適化機会
          - **Maintainability**: Good overall maintainability / 全体的に良いメンテナンス性
          
          ### 💡 Suggestions / 改善提案
          1. Consider adding TypeScript types / TypeScript型の追加を検討
          2. Add unit tests for new functions / 新機能の単体テスト追加
          3. Update documentation / ドキュメント更新
          
          ## 🎯 Compliance Check / 準拠性チェック
          
          - ✅ Code Standards / コード標準
          - ✅ Security Guidelines / セキュリティガイドライン  
          - ✅ Performance Guidelines / パフォーマンスガイドライン
          - ⚠️ Documentation Coverage / ドキュメントカバレッジ
          
          ## 📈 Quality Score / 品質スコア
          
          **Overall Score: 87/100** 🟡
          
          ---
          *Generated by Claude Code Actions at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

      # ================
      # Post Review Comment
      # 目的: レビューコメント投稿
      # Purpose: Post review comment
      # ================
      - name: "💬 Post Review Comment"
        if: steps.claude-analysis.outputs.analysis_completed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const reviewReport = fs.readFileSync('.claude-analysis/review-report.md', 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewReport
            });

      # ================
      # Create Issues for Critical Problems
      # 目的: 重要問題のIssue自動作成
      # Purpose: Auto-create issues for critical problems
      # ================
      - name: "🚨 Create Issues for Critical Problems"
        if: steps.claude-analysis.outputs.issues_found > 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // 重大な問題が発見された場合、自動でIssueを作成
            if (parseInt('${{ steps.claude-analysis.outputs.issues_found }}') > 5) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Critical Issues Found in PR #${{ github.event.pull_request.number }}',
                body: `
            ## 🚨 Critical Issues Detected / 重要問題検出
            
            Claude Auto Review has detected critical issues in PR #${{ github.event.pull_request.number }}.
            
            **Issues Found**: ${{ steps.claude-analysis.outputs.issues_found }}
            **Suggestions**: ${{ steps.claude-analysis.outputs.suggestions_count }}
            
            Please review and address these issues before merging.
            
            ---
            Auto-generated by Claude Code Actions
                `,
                labels: ['bug', 'claude-detected', 'priority-high']
              });
            }

      # ================
      # Upload Analysis Artifacts
      # 目的: 分析結果のアーティファクト保存
      # Purpose: Save analysis results as artifacts
      # ================
      - name: "📦 Upload Analysis Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-analysis-pr-${{ github.event.pull_request.number }}
          path: .claude-analysis/
          retention-days: 30

  # ================================
  # Job: security-scan
  # Description: セキュリティスキャン実行
  #              Execute security scan
  # Dependencies: CodeQL, Semgrep
  # Timeout: 10分
  # ================================
  security-scan:
    name: "🔒 [Security] Vulnerability Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "🔍 Run Security Scan"
        run: |
          echo "🔒 Running security analysis..."
          # セキュリティスキャン実装（プレースホルダー）
          echo "✅ No critical vulnerabilities found"

# ================================
# 自動修復トリガー
# Auto-fix trigger conditions
# ================================
# Note: 重大な問題が検出された場合、
# 07-self-healing-system.yml が自動実行される