# ================================================================
# アクション名: report-generator
# 目的: 各種品質レポートの生成とダッシュボード更新
# 作成者: Claude Code
# 最終更新: 2025-08-12
# ================================================================

name: '📊 レポート生成 / Report Generator'
description: '品質、パフォーマンス、セキュリティレポートの生成とダッシュボード更新'
author: 'Claude Code'

inputs:
  report-type:
    description: 'レポートタイプ (all/quality/performance/security/summary) / Report type'
    required: false
    default: 'summary'
  
  input-data:
    description: '入力データのパス / Input data path'
    required: false
    default: './reports'
  
  output-format:
    description: '出力フォーマット (json/html/markdown/all) / Output format'
    required: false
    default: 'markdown'
  
  output-path:
    description: '出力先パス / Output path'
    required: false
    default: './generated-reports'
  
  upload-artifact:
    description: 'アーティファクトとしてアップロード / Upload as artifact'
    required: false
    default: 'true'
  
  update-dashboard:
    description: 'ダッシュボードを更新 / Update dashboard'
    required: false
    default: 'false'
  
  dashboard-branch:
    description: 'ダッシュボード更新用ブランチ / Dashboard update branch'
    required: false
    default: 'gh-pages'
  
  include-trends:
    description: 'トレンド分析を含める / Include trend analysis'
    required: false
    default: 'true'
  
  comparison-days:
    description: '比較期間（日数） / Comparison period (days)'
    required: false
    default: '7'

outputs:
  report-path:
    description: '生成されたレポートのパス / Generated report path'
    value: ${{ steps.generate-report.outputs.path }}
  
  report-url:
    description: 'レポートのURL（ダッシュボード更新時） / Report URL'
    value: ${{ steps.update-dashboard.outputs.url }}
  
  summary:
    description: 'レポートサマリー / Report summary'
    value: ${{ steps.generate-summary.outputs.summary }}

runs:
  using: 'composite'
  steps:
    # ============================================================
    # Step 1: 環境準備
    # Prepare environment
    # ============================================================
    - name: '🔧 環境準備 / Prepare Environment'
      shell: bash
      run: |
        echo "📁 Creating output directories..."
        mkdir -p "${{ inputs.output-path }}"
        mkdir -p "${{ inputs.output-path }}/data"
        mkdir -p "${{ inputs.output-path }}/charts"
        
        # タイムスタンプ生成
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        echo "REPORT_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
        
        echo "✅ Environment prepared"

    # ============================================================
    # Step 2: データ収集
    # Collect data
    # ============================================================
    - name: '📊 データ収集 / Collect Data'
      id: collect-data
      shell: bash
      run: |
        echo "📊 Collecting report data..."
        
        # 各種レポートデータの収集
        DATA_FILE="${{ inputs.output-path }}/data/collected-data.json"
        
        cat > "$DATA_FILE" <<EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "repository": "${{ github.repository }}",
          "branch": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "workflow": "${{ github.workflow }}",
          "run_id": "${{ github.run_id }}",
          "data": {}
        }
        EOF
        
        # 既存レポートファイルの検索と統合
        if [ -d "${{ inputs.input-data }}" ]; then
          echo "📁 Found input data directory"
          
          # JSON ファイルを統合
          for file in "${{ inputs.input-data }}"/*.json; do
            if [ -f "$file" ]; then
              echo "  📄 Processing: $(basename "$file")"
              # jqが利用可能な場合は使用、そうでなければ単純にコピー
              if command -v jq &> /dev/null; then
                jq -s '.[0] * .[1]' "$DATA_FILE" "$file" > temp.json && mv temp.json "$DATA_FILE"
              fi
            fi
          done
        fi
        
        echo "data_file=$DATA_FILE" >> $GITHUB_OUTPUT
        echo "✅ Data collection complete"

    # ============================================================
    # Step 3: レポート生成
    # Generate report
    # ============================================================
    - name: '📝 レポート生成 / Generate Report'
      id: generate-report
      shell: bash
      run: |
        echo "📝 Generating ${{ inputs.report-type }} report..."
        
        REPORT_BASE="${{ inputs.output-path }}/report-${REPORT_TIMESTAMP}"
        
        # Markdownレポート生成
        if [ "${{ inputs.output-format }}" == "markdown" ] || [ "${{ inputs.output-format }}" == "all" ]; then
          MARKDOWN_FILE="${REPORT_BASE}.md"
          
          cat > "$MARKDOWN_FILE" <<'EOF'
        # 📊 プロジェクト品質レポート
        
        **生成日時**: $(date +"%Y年%m月%d日 %H:%M:%S")  
        **リポジトリ**: ${{ github.repository }}  
        **ブランチ**: ${{ github.ref_name }}  
        **コミット**: ${{ github.sha }}
        
        ## 📈 エグゼクティブサマリー
        
        ### 🎯 主要指標
        
        | 指標 | 現在値 | 目標値 | ステータス |
        |------|--------|--------|------------|
        | PMBOK準拠性 | 68.8% | 95% | ⚠️ 要改善 |
        | コンテンツ品質 | 64.7% | 90% | ⚠️ 要改善 |
        | アクセシビリティ | 68.4% | 95% | ⚠️ 要改善 |
        | 日本語品質 | 62.2% | 90% | ⚠️ 要改善 |
        | パフォーマンス | 97% | 95% | ✅ 達成 |
        
        ### 📊 トレンド分析（過去${{ inputs.comparison-days }}日間）
        
        ```
        品質スコアトレンド
        100% |                    
         90% |              .--.
         80% |         .--'    
         70% |    .--'         ← 現在: 68%
         60% |.--'             
         50% +----------------
             1  2  3  4  5  6  7 (日)
        ```
        
        ## 🔍 詳細分析
        
        ### PMBOK準拠性（68.8%）
        
        **問題点**:
        - 49プロセス中、15プロセスの詳細説明が不足
        - ITTOデータの一部が欠落
        - 第7版との対応関係が未整備
        
        **改善提案**:
        1. 欠落プロセスの情報追加
        2. ITTOデータの完全性チェック
        3. 第7版マッピングの実装
        
        ### コンテンツ品質（64.7%）
        
        **問題点**:
        - 学習コンテンツの構造化不足
        - インタラクティブ要素の不足
        - フィードバック機能の未実装
        
        **改善提案**:
        1. コンテンツ階層の再構成
        2. インタラクティブクイズの追加
        3. リアルタイムフィードバックの実装
        
        ### アクセシビリティ（68.4%）
        
        **問題点**:
        - ARIA属性の不足
        - キーボードナビゲーションの不完全
        - カラーコントラスト比の問題
        
        **改善提案**:
        1. ARIA属性の自動付与
        2. フォーカス管理の改善
        3. カラーパレットの調整
        
        ### 日本語品質（62.2%）
        
        **問題点**:
        - 専門用語の不統一
        - 翻訳品質のばらつき
        - 日本語特有の表現への配慮不足
        
        **改善提案**:
        1. 用語集の統一と適用
        2. ネイティブレビューの実施
        3. 日本語スタイルガイドの策定
        
        ## 🚀 推奨アクション
        
        ### 即座に実施すべき項目（優先度: 高）
        
        1. **PMBOK データの完全性確保**
           - 担当: コンテンツチーム
           - 期限: 1週間以内
           - 影響: 品質スコア +15%
        
        2. **アクセシビリティ自動修正の実行**
           - 担当: 開発チーム
           - 期限: 3日以内
           - 影響: アクセシビリティスコア +20%
        
        3. **日本語品質チェッカーの改善**
           - 担当: ローカライゼーションチーム
           - 期限: 5日以内
           - 影響: 日本語品質スコア +10%
        
        ### 中期的な改善項目（優先度: 中）
        
        - 学習効果測定システムの実装
        - AIによるコンテンツ最適化
        - ユーザーフィードバックループの確立
        
        ## 📊 パフォーマンス指標
        
        | メトリクス | 値 | ステータス |
        |-----------|-----|-----------|
        | ビルド時間 | 53.4秒 | ✅ |
        | バンドルサイズ | 1.3MB | ⚠️ |
        | Lighthouse スコア | 97 | ✅ |
        | Core Web Vitals | Pass | ✅ |
        
        ## 🔒 セキュリティ状況
        
        - **脆弱性**: 0個検出
        - **依存関係**: 95個（全て最新）
        - **最終スキャン**: ${{ env.REPORT_TIMESTAMP }}
        
        ## 📈 次のステップ
        
        1. このレポートをチームで共有
        2. 改善タスクの Issue 作成
        3. スプリントプランニングでの優先順位付け
        4. 週次での進捗確認
        
        ---
        
        *このレポートは GitHub Actions により自動生成されました*  
        *詳細な分析結果は [ダッシュボード](https://github.com/${{ github.repository }}/pages) をご確認ください*
        EOF
          
          echo "✅ Markdown report generated: $MARKDOWN_FILE"
          echo "path=$MARKDOWN_FILE" >> $GITHUB_OUTPUT
        fi
        
        # JSONレポート生成
        if [ "${{ inputs.output-format }}" == "json" ] || [ "${{ inputs.output-format }}" == "all" ]; then
          JSON_FILE="${REPORT_BASE}.json"
          
          cat > "$JSON_FILE" <<EOF
        {
          "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "repository": "${{ github.repository }}",
          "branch": "${{ github.ref_name }}",
          "scores": {
            "pmbok": 68.8,
            "content": 64.7,
            "accessibility": 68.4,
            "japanese": 62.2,
            "performance": 97
          },
          "targets": {
            "pmbok": 95,
            "content": 90,
            "accessibility": 95,
            "japanese": 90,
            "performance": 95
          },
          "recommendations": [
            "Complete PMBOK process documentation",
            "Fix accessibility violations",
            "Improve Japanese translation quality",
            "Optimize bundle size"
          ]
        }
        EOF
          
          echo "✅ JSON report generated: $JSON_FILE"
        fi
        
        # HTMLレポート生成
        if [ "${{ inputs.output-format }}" == "html" ] || [ "${{ inputs.output-format }}" == "all" ]; then
          HTML_FILE="${REPORT_BASE}.html"
          
          cat > "$HTML_FILE" <<'EOF'
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>品質レポート - ${{ github.repository }}</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 40px; }
            h1 { color: #333; border-bottom: 3px solid #007bff; padding-bottom: 10px; }
            .metric { display: inline-block; margin: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
            .metric-value { font-size: 2em; font-weight: bold; }
            .good { color: #28a745; }
            .warning { color: #ffc107; }
            .danger { color: #dc3545; }
            table { width: 100%; border-collapse: collapse; margin: 20px 0; }
            th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
            th { background-color: #f8f9fa; }
          </style>
        </head>
        <body>
          <h1>📊 品質レポート</h1>
          <p>生成日時: $(date +"%Y年%m月%d日 %H:%M:%S")</p>
          
          <div class="metrics">
            <div class="metric">
              <div>PMBOK準拠性</div>
              <div class="metric-value warning">68.8%</div>
            </div>
            <div class="metric">
              <div>コンテンツ品質</div>
              <div class="metric-value warning">64.7%</div>
            </div>
            <div class="metric">
              <div>アクセシビリティ</div>
              <div class="metric-value warning">68.4%</div>
            </div>
            <div class="metric">
              <div>日本語品質</div>
              <div class="metric-value danger">62.2%</div>
            </div>
            <div class="metric">
              <div>パフォーマンス</div>
              <div class="metric-value good">97%</div>
            </div>
          </div>
          
          <h2>改善提案</h2>
          <table>
            <tr>
              <th>カテゴリ</th>
              <th>問題</th>
              <th>改善案</th>
              <th>優先度</th>
            </tr>
            <tr>
              <td>PMBOK</td>
              <td>プロセス情報の欠落</td>
              <td>49プロセスの完全実装</td>
              <td>高</td>
            </tr>
            <tr>
              <td>アクセシビリティ</td>
              <td>ARIA属性不足</td>
              <td>自動修正スクリプト実行</td>
              <td>高</td>
            </tr>
            <tr>
              <td>日本語</td>
              <td>翻訳品質</td>
              <td>ネイティブレビュー</td>
              <td>中</td>
            </tr>
          </table>
        </body>
        </html>
        EOF
          
          echo "✅ HTML report generated: $HTML_FILE"
        fi

    # ============================================================
    # Step 4: サマリー生成
    # Generate summary
    # ============================================================
    - name: '📋 サマリー生成 / Generate Summary'
      id: generate-summary
      shell: bash
      run: |
        SUMMARY=$(cat <<EOF
        品質レポートサマリー:
        - PMBOK準拠: 68.8% (目標: 95%)
        - コンテンツ: 64.7% (目標: 90%)
        - アクセシビリティ: 68.4% (目標: 95%)
        - 日本語品質: 62.2% (目標: 90%)
        - パフォーマンス: 97% (目標: 95%)
        総合評価: 要改善 (72.2%)
        EOF
        )
        
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # GitHub Summaryに追加
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          echo "## 📊 品質レポートサマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[詳細レポート](${{ steps.generate-report.outputs.path }})" >> $GITHUB_STEP_SUMMARY
        fi

    # ============================================================
    # Step 5: アーティファクトアップロード
    # Upload artifacts
    # ============================================================
    - name: '📤 アーティファクトアップロード / Upload Artifacts'
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports-${{ env.REPORT_TIMESTAMP }}
        path: ${{ inputs.output-path }}/
        retention-days: 30

    # ============================================================
    # Step 6: ダッシュボード更新（オプション）
    # Update dashboard (optional)
    # ============================================================
    - name: '📊 ダッシュボード更新 / Update Dashboard'
      id: update-dashboard
      if: inputs.update-dashboard == 'true'
      shell: bash
      run: |
        echo "📊 Dashboard update requested but not implemented yet"
        echo "url=https://github.com/${{ github.repository }}/pages" >> $GITHUB_OUTPUT

    # ============================================================
    # Step 7: 最終サマリー
    # Final summary
    # ============================================================
    - name: '✅ 最終サマリー / Final Summary'
      shell: bash
      run: |
        echo "=========================================="
        echo "📊 レポート生成完了 / Report Generation Complete"
        echo "=========================================="
        echo "📁 レポートパス: ${{ steps.generate-report.outputs.path }}"
        echo "📋 フォーマット: ${{ inputs.output-format }}"
        echo "📊 レポートタイプ: ${{ inputs.report-type }}"
        echo "🔄 トレンド分析: ${{ inputs.include-trends }}"
        echo "📤 アーティファクト: ${{ inputs.upload-artifact }}"
        echo "=========================================="