        echo "node-version=$(node --version)" >> $GITHUB_OUTPUT
        echo "npm-version=$(npm --version)" >> $GITHUB_OUTPUT
        echo "📊 環境情報:"
        echo "  Node.js: $(node --version)"
        echo "  npm: $(npm --version)"
        echo "  Working directory: $(pwd)"
        echo "  Platform: ${{ runner.os }}"
    
    # ================================================================
    # Step 3: package.json検証
    # ================================================================
    - name: 📦 Validate package.json
      shell: bash
      run: |
        if [ ! -f "package.json" ]; then
          echo "❌ package.json が見つかりません"
          exit 1
        fi
        
        if [ ! -f "package-lock.json" ]; then
          echo "⚠️ package-lock.json が見つかりません"
          echo "npm installでロックファイルを生成します"
        fi
        
        echo "✅ package.json 検証完了"
        
        # package.jsonの基本情報表示
        if command -v jq &> /dev/null; then
          echo "📊 プロジェクト情報:"
          jq -r '. | "  名前: \(.name // "N/A")"' package.json
          jq -r '. | "  バージョン: \(.version // "N/A")"' package.json
          jq -r '. | "  説明: \(.description // "N/A")"' package.json
        fi
    
    # ================================================================
    # Step 4: 依存関係インストール
    # ================================================================
    - name: 📦 Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        echo "📦 依存関係インストール開始..."
        
        # npm cache の状態確認
        echo "🔍 npm cache 状態:"
        npm cache verify
        
        # インストール実行
        if [ "${{ inputs.production-only }}" = "true" ]; then
          echo "🏭 プロダクション依存関係のみインストール..."
          npm ci --production --no-audit --prefer-offline
        else
          echo "🛠️ 全ての依存関係をインストール..."
          npm ci --no-audit --prefer-offline
        fi
        
        echo "✅ 依存関係インストール完了"
    
