# ============================================================
# Composite Action: 最適化ビルド実行
# Description: プロダクションビルドの実行、最適化、パフォーマンス分析を統合実行
# Usage: steps: - uses: ./.github/actions/composite/build-optimize
# Author: Claude Code DevOps Team
# Version: 1.0.0
# Last Modified: 2025-08-12
# ============================================================

name: '最適化ビルド実行'
description: 'プロダクションビルド、バンドル最適化、パフォーマンス分析を統合実行'

# ------------------------------------------------------------
# Input Parameters
# ------------------------------------------------------------
inputs:
  build-command:
    description: 'ビルドコマンド（デフォルト: npm run build）'
    required: false
    default: 'npm run build'
  optimize-build:
    description: '最適化ビルドを使用するか（デフォルト: true）'
    required: false
    default: 'true'
  analyze-bundle:
    description: 'バンドル分析を実行するか（デフォルト: true）'
    required: false
    default: 'true'
  performance-budget:
    description: 'パフォーマンスバジェットをチェックするか（デフォルト: true）'
    required: false
    default: 'true'
  upload-artifact:
    description: 'ビルド成果物をアップロードするか（デフォルト: true）'
    required: false
    default: 'true'

# ------------------------------------------------------------
# Outputs Definition  
# ------------------------------------------------------------
outputs:
  build-size:
    description: 'ビルドサイズ（バイト）'
    value: ${{ steps.build-analysis.outputs.build-size }}
  build-status:
    description: 'ビルドステータス（success/failure）'
    value: ${{ steps.build-execute.outcome }}
  bundle-report:
    description: 'バンドル分析レポートのパス'
    value: ${{ steps.bundle-analysis.outputs.report-path }}

# ------------------------------------------------------------
# Composite Steps Definition
# ------------------------------------------------------------
runs:
  using: 'composite'
  steps:
    # ========================================
    # Step 1: ビルド前の環境準備
    # ========================================
    - name: 🛠️  ビルド環境準備
      shell: bash
      run: |
        echo "🛠️  ビルド環境を準備中..."
        
        # ビルドディレクトリのクリーンアップ
        if [ -d "dist" ]; then
          echo "🧹 既存のdistディレクトリを削除"
          rm -rf dist
        fi
        
        # ビルド用環境変数の設定
        export NODE_ENV=production
        export GENERATE_SOURCEMAP=false
        export SKIP_ENV_VALIDATION=true
        
        echo "✅ ビルド環境準備完了"
        echo "📋 環境設定:"
        echo "   NODE_ENV=production"
        echo "   GENERATE_SOURCEMAP=false"
        echo "   SKIP_ENV_VALIDATION=true"

    # ========================================
    # Step 2: プロダクションビルド実行
    # ========================================
    - name: 🏗️  プロダクションビルド実行
      id: build-execute
      shell: bash
      run: |
        echo "🏗️  プロダクションビルドを開始..."
        
        BUILD_START_TIME=$(date +%s)
        
        if [ "${{ inputs.optimize-build }}" == "true" ] && npm run build:optimized; then
          echo "✅ 最適化ビルドが成功しました"
        elif ${{ inputs.build-command }}; then
          echo "✅ 標準ビルドが成功しました"
        else
          echo "❌ ビルドに失敗しました"
          exit 1
        fi
        
        BUILD_END_TIME=$(date +%s)
        BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
        
        echo "⏱️  ビルド時間: ${BUILD_DURATION}秒"
        echo "build-duration=$BUILD_DURATION" >> $GITHUB_OUTPUT

    # ========================================
    # Step 3: ビルド成果物の分析
    # ========================================
    - name: 📊 ビルド成果物分析
      id: build-analysis
      shell: bash
      run: |
        echo "📊 ビルド成果物を分析中..."
        
        if [ -d "dist" ]; then
          # ビルドサイズの計算
          BUILD_SIZE=$(du -sb dist | cut -f1)
          BUILD_SIZE_MB=$(echo "scale=2; $BUILD_SIZE / 1024 / 1024" | bc -l 2>/dev/null || echo "N/A")
          
          echo "📦 ビルドサイズ: ${BUILD_SIZE_MB}MB (${BUILD_SIZE} bytes)"
          echo "build-size=$BUILD_SIZE" >> $GITHUB_OUTPUT
          
          # ファイル別サイズ分析
          echo "📋 主要ファイルサイズ:"
          find dist -name "*.js" -exec du -h {} + | sort -hr | head -5 || echo "JSファイルなし"
          find dist -name "*.css" -exec du -h {} + | sort -hr | head -3 || echo "CSSファイルなし"
          
          # PWA要件の確認
          echo "📱 PWA要件チェック:"
          if [ -f "dist/manifest.json" ]; then
            echo "✅ PWA manifest.json 存在"
          else
            echo "⚠️  PWA manifest.json 不在"
          fi
          
          if [ -f "dist/sw.js" ] || [ -f "dist/service-worker.js" ]; then
            echo "✅ Service Worker 存在" 
          else
            echo "⚠️  Service Worker 不在"
          fi
          
        else
          echo "❌ distディレクトリが見つかりません"
          exit 1
        fi

    # ========================================
    # Step 4: バンドル分析（オプション）
    # ========================================
    - name: 📈 バンドル分析
      id: bundle-analysis
      if: inputs.analyze-bundle == 'true'
      shell: bash
      continue-on-error: true
      run: |
        echo "📈 バンドル分析を実行中..."
        
        # webpack-bundle-analyzerまたは代替ツールでの分析
        if command -v npx >/dev/null && npm list webpack-bundle-analyzer >/dev/null 2>&1; then
          npx webpack-bundle-analyzer dist/static/js/*.js --report bundle-report.html --mode static --no-open || echo "バンドル分析は参考情報です"
          echo "report-path=bundle-report.html" >> $GITHUB_OUTPUT
        else
          echo "📊 バンドル分析ツールが利用できません（オプション機能）"
          echo "report-path=none" >> $GITHUB_OUTPUT
        fi

    # ========================================
    # Step 5: パフォーマンスバジェットチェック
    # ========================================
    - name: ⚡ パフォーマンスバジェットチェック
      if: inputs.performance-budget == 'true'
      shell: bash
      continue-on-error: true
      run: |
        echo "⚡ パフォーマンスバジェットをチェック中..."
        
        if npm run performance:budget; then
          echo "✅ パフォーマンスバジェット: すべての制限内です"
        else
          echo "⚠️  パフォーマンスバジェット: 制限を超過している項目があります"
          echo "🛠️  最適化の推奨事項:"
          echo "   - 未使用コードの削除"
          echo "   - 画像の最適化"
          echo "   - コード分割の適用" 
          echo "   - 依存関係の軽量化"
        fi

    # ========================================
    # Step 6: ビルド成果物のアップロード
    # ========================================
    - name: 📤 ビルド成果物アップロード
      if: inputs.upload-artifact == 'true' && success()
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: |
          dist/
          bundle-report.html
        retention-days: 7
        compression-level: 6

    # ========================================
    # Step 7: ビルドサマリーレポート
    # ========================================
    - name: 📋 ビルドサマリーレポート
      shell: bash
      run: |
        echo "=== 🏗️  ビルド結果サマリー ==="
        echo "ステータス: ${{ steps.build-execute.outcome }}"
        echo "ビルドサイズ: $(echo '${{ steps.build-analysis.outputs.build-size }}' | awk '{printf "%.2f MB", $1/1024/1024}')"
        echo "ビルド時間: ${{ steps.build-execute.outputs.build-duration }}秒"
        echo "=============================="
        
        # GitHub Step Summaryにレポートを追加
        echo "## 🏗️ ビルド結果サマリー" >> $GITHUB_STEP_SUMMARY
        echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ ビルドステータス | ${{ steps.build-execute.outcome }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 ビルドサイズ | $(echo '${{ steps.build-analysis.outputs.build-size }}' | awk '{printf "%.2f MB", $1/1024/1024}') |" >> $GITHUB_STEP_SUMMARY
        echo "| ⏱️ ビルド時間 | ${{ steps.build-execute.outputs.build-duration }}秒 |" >> $GITHUB_STEP_SUMMARY
        echo "| 📈 バンドル分析 | ${{ steps.bundle-analysis.outputs.report-path }} |" >> $GITHUB_STEP_SUMMARY