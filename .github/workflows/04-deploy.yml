# ================================================================
# ワークフロー: Production Deployment
# カテゴリ: デプロイメント
# 目的: GitHub Pagesへの本番デプロイメント
# トリガー: push to main
# 依存関係: build artifacts, GitHub Pages
# 作成者: DevOps自動化システム
# 最終更新: 2025-08-16
# Issue: #109 - GitHub Actions動作確認テストコミット
# ================================================================

name: '📦 Production Deployment & PWA'

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '18'
  SITE_URL: 'https://yusuke-kurosawa.github.io/PMPLearningManagement/'

jobs:
  # Build Test
  build-test:
    name: 🏗️ ビルドテスト
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:optimized
        env:
          SKIP_ENV_VALIDATION: true
          NODE_ENV: production

      - name: Analyze build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build completed successfully"
            echo "Build size analysis:"
            du -sh dist/
            echo "Asset breakdown:"
            find dist -name "*.js" -exec du -h {} + | sort -hr | head -5
            
            # Check for essential files
            if [ -f "dist/index.html" ]; then
              echo "✅ Index file found"
            else
              echo "❌ Index file missing"
              exit 1
            fi
            
            if [ -f "dist/.nojekyll" ]; then
              echo "✅ GitHub Pages configuration ready"
            else
              echo "❌ GitHub Pages configuration missing"
              exit 1
            fi
          else
            echo "❌ Build failed - no dist directory found"
            exit 1
          fi

  # Deploy to GitHub Pages
  deploy-pages:
    name: 🚀 GitHub Pagesへのデプロイ
    runs-on: ubuntu-latest
    needs: [build-test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build optimized production bundle
        run: npm run build:optimized
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Health check
  health-check:
    name: ✅ デプロイ後ヘルスチェック
    runs-on: ubuntu-latest
    needs: [deploy-pages]
    if: success()
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Comprehensive site health check
        run: |
          URL="${{ env.SITE_URL }}"
          echo "Running health check for: $URL"
          
          # Basic accessibility check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is accessible"
          else
            echo "❌ Site returned HTTP $HTTP_CODE"
            exit 1
          fi
          
          # Check for SPA routing
          HASH_ROUTE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}#/matrix" || echo "000")
          if [ "$HASH_ROUTE_CODE" = "200" ]; then
            echo "✅ Hash routing is working"
          else
            echo "⚠️  Hash routing returned HTTP $HASH_ROUTE_CODE"
          fi
          
          echo "Health check completed successfully!"