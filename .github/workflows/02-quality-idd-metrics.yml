# ================================================================
# 📊 品質: IDDメトリクス収集・ダッシュボード
# ================================================================
# 目的: IDDコンプライアンス率の測定と可視化
# 実行タイミング: 6時間ごとの定期実行、mainへのpush時、手動実行
# 主な処理:
#   - コミット・Issue・PRのメトリクス収集
#   - コンプライアンス率の計算
#   - ダッシュボードHTML生成
#   - GitHub Pagesへのデプロイ
# ================================================================

name: '📊 Quality - IDD Metrics'

on:
  schedule:
    - cron: '0 */6 * * *' # 6時間ごとに実行
  workflow_dispatch:
  push:
    branches: [main]

# パーミッション設定
permissions:
  contents: write      # README更新用
  issues: read        # Issueメトリクス収集用
  pull-requests: read # PRメトリクス収集用
  pages: write       # GitHub Pagesデプロイ用
  id-token: write    # GitHub Pages認証用

# ワークフロー同時実行制御
concurrency:
  group: "idd-metrics-${{ github.ref }}"
  cancel-in-progress: false  # メトリクス収集はキャンセルしない

jobs:
  collect-metrics:
    name: Collect IDD Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Collect Repository Metrics
        id: collect-metrics
        run: |
          # メトリクス収集開始
          echo "📊 Collecting IDD metrics..."
          
          # 基本統計
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          TOTAL_BRANCHES=$(git branch -r | wc -l)
          
          # 過去30日間のメトリクス
          THIRTY_DAYS_AGO=$(date -d '30 days ago' '+%Y-%m-%d')
          
          # コミットの分析
          RECENT_COMMITS=$(git log --since="$THIRTY_DAYS_AGO" --format="%H|%s|%an|%ae|%ad" --date=iso --no-merges)
          
          COMMITS_30D=0
          COMPLIANT_30D=0
          UNIQUE_AUTHORS=""
          DAILY_STATS=""
          
          while IFS='|' read -r sha subject author email date; do
            if [ -z "$sha" ]; then continue; fi
            
            COMMITS_30D=$((COMMITS_30D + 1))
            
            if echo "$subject" | grep -qE '#[0-9]+'; then
              COMPLIANT_30D=$((COMPLIANT_30D + 1))
            fi
            
            # 日別統計
            DAY=$(echo "$date" | cut -d' ' -f1)
            if [ -n "$DAY" ]; then
              if echo "$DAILY_STATS" | grep -q "$DAY"; then
                # 既存の日付を更新
                OLD_COUNT=$(echo "$DAILY_STATS" | grep "$DAY" | cut -d',' -f2)
                OLD_COMPLIANT=$(echo "$DAILY_STATS" | grep "$DAY" | cut -d',' -f3)
                NEW_COUNT=$((OLD_COUNT + 1))
                if echo "$subject" | grep -qE '#[0-9]+'; then
                  NEW_COMPLIANT=$((OLD_COMPLIANT + 1))
                else
                  NEW_COMPLIANT=$OLD_COMPLIANT
                fi
                DAILY_STATS=$(echo "$DAILY_STATS" | sed "s/$DAY,$OLD_COUNT,$OLD_COMPLIANT/$DAY,$NEW_COUNT,$NEW_COMPLIANT/")
              else
                if echo "$subject" | grep -qE '#[0-9]+'; then
                  DAILY_STATS="$DAILY_STATS\n$DAY,1,1"
                else
                  DAILY_STATS="$DAILY_STATS\n$DAY,1,0"
                fi
              fi
            fi
            
            # ユニーク著者の追跡
            if ! echo "$UNIQUE_AUTHORS" | grep -q "$email"; then
              UNIQUE_AUTHORS="$UNIQUE_AUTHORS\n$email"
            fi
          done <<< "$RECENT_COMMITS"
          
          # 著者数をカウント
          AUTHOR_COUNT=$(echo -e "$UNIQUE_AUTHORS" | grep -v '^$' | wc -l)
          
          # コンプライアンス率を計算
          if [ $COMMITS_30D -gt 0 ]; then
            COMPLIANCE_RATE_30D=$((COMPLIANT_30D * 100 / COMMITS_30D))
          else
            COMPLIANCE_RATE_30D=0
          fi
          
          # JSON形式でメトリクスを生成
          echo "{" > metrics.json
          echo "  \"timestamp\": \"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"," >> metrics.json
          echo "  \"repository\": {" >> metrics.json
          echo "    \"total_commits\": $TOTAL_COMMITS," >> metrics.json
          echo "    \"total_branches\": $TOTAL_BRANCHES" >> metrics.json
          echo "  }," >> metrics.json
          echo "  \"last_30_days\": {" >> metrics.json
          echo "    \"total_commits\": $COMMITS_30D," >> metrics.json
          echo "    \"compliant_commits\": $COMPLIANT_30D," >> metrics.json
          echo "    \"compliance_rate\": $COMPLIANCE_RATE_30D," >> metrics.json
          echo "    \"unique_authors\": $AUTHOR_COUNT" >> metrics.json
          echo "  }," >> metrics.json
          echo "  \"daily_stats\": [" >> metrics.json
          echo -e "$DAILY_STATS" | grep -v '^$' | while IFS=',' read -r date total compliant; do
            [ -n "$date" ] && echo "    {\"date\":\"$date\",\"total\":$total,\"compliant\":$compliant}," >> metrics.json
          done
          # 最後のカンマを削除
          sed -i '$ s/,$//' metrics.json
          echo "  ]" >> metrics.json
          echo "}" >> metrics.json
          
          echo "compliance_rate=$COMPLIANCE_RATE_30D" >> $GITHUB_OUTPUT

      - name: Fetch Issue and PR Metrics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));
            
            // Issue統計を取得
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              since: new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString()
            });
            
            const openIssues = issues.data.filter(i => !i.pull_request && i.state === 'open').length;
            const closedIssues = issues.data.filter(i => !i.pull_request && i.state === 'closed').length;
            
            // PR統計を取得
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            let compliantPRs = 0;
            let totalPRs = 0;
            
            for (const pr of prs.data.slice(0, 30)) { // 最新30件のPR
              totalPRs++;
              if (pr.title.match(/#\d+/) || (pr.body && pr.body.match(/#\d+/))) {
                compliantPRs++;
              }
            }
            
            // メトリクスを更新
            metrics.issues = {
              open: openIssues,
              closed_last_30_days: closedIssues,
              total: openIssues + closedIssues
            };
            
            metrics.pull_requests = {
              total_recent: totalPRs,
              compliant: compliantPRs,
              compliance_rate: totalPRs > 0 ? Math.round(compliantPRs * 100 / totalPRs) : 0
            };
            
            // 更新されたメトリクスを保存
            fs.writeFileSync('metrics.json', JSON.stringify(metrics, null, 2));

      - name: Generate Dashboard HTML
        run: |
          cat << 'EOF' > dashboard.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>IDD Compliance Dashboard</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  
                  .container {
                      max-width: 1400px;
                      margin: 0 auto;
                  }
                  
                  .header {
                      background: white;
                      border-radius: 15px;
                      padding: 30px;
                      margin-bottom: 30px;
                      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                  }
                  
                  .header h1 {
                      color: #333;
                      font-size: 2.5em;
                      margin-bottom: 10px;
                  }
                  
                  .header p {
                      color: #666;
                      font-size: 1.1em;
                  }
                  
                  .metrics-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                      gap: 20px;
                      margin-bottom: 30px;
                  }
                  
                  .metric-card {
                      background: white;
                      border-radius: 10px;
                      padding: 20px;
                      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                      transition: transform 0.3s ease;
                  }
                  
                  .metric-card:hover {
                      transform: translateY(-5px);
                  }
                  
                  .metric-card h3 {
                      color: #666;
                      font-size: 0.9em;
                      text-transform: uppercase;
                      margin-bottom: 10px;
                  }
                  
                  .metric-value {
                      font-size: 2.5em;
                      font-weight: bold;
                      color: #333;
                      margin-bottom: 5px;
                  }
                  
                  .metric-label {
                      color: #999;
                      font-size: 0.9em;
                  }
                  
                  .chart-container {
                      background: white;
                      border-radius: 10px;
                      padding: 20px;
                      margin-bottom: 20px;
                      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                  }
                  
                  .chart-container h2 {
                      color: #333;
                      margin-bottom: 20px;
                      font-size: 1.5em;
                  }
                  
                  .status-good {
                      color: #10b981;
                  }
                  
                  .status-warning {
                      color: #f59e0b;
                  }
                  
                  .status-bad {
                      color: #ef4444;
                  }
                  
                  .chart-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
                      gap: 20px;
                  }
                  
                  canvas {
                      max-height: 300px;
                  }
                  
                  .footer {
                      text-align: center;
                      color: white;
                      margin-top: 40px;
                      padding: 20px;
                  }
                  
                  .badge {
                      display: inline-block;
                      padding: 5px 10px;
                      border-radius: 20px;
                      font-size: 0.8em;
                      font-weight: bold;
                      margin-left: 10px;
                  }
                  
                  .badge-success {
                      background: #10b981;
                      color: white;
                  }
                  
                  .badge-warning {
                      background: #f59e0b;
                      color: white;
                  }
                  
                  .badge-danger {
                      background: #ef4444;
                      color: white;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>📊 IDD Compliance Dashboard</h1>
                      <p>Real-time Issue-Driven Development metrics for PMPLearningManagement</p>
                      <p style="margin-top: 10px; font-size: 0.9em; color: #999;">
                          Last updated: <span id="lastUpdated"></span>
                      </p>
                  </div>
                  
                  <div class="metrics-grid">
                      <div class="metric-card">
                          <h3>30-Day Compliance</h3>
                          <div class="metric-value" id="complianceRate">--%</div>
                          <div class="metric-label">of commits reference issues</div>
                      </div>
                      
                      <div class="metric-card">
                          <h3>Total Commits (30d)</h3>
                          <div class="metric-value" id="totalCommits">--</div>
                          <div class="metric-label">commits made</div>
                      </div>
                      
                      <div class="metric-card">
                          <h3>Active Contributors</h3>
                          <div class="metric-value" id="uniqueAuthors">--</div>
                          <div class="metric-label">unique authors</div>
                      </div>
                      
                      <div class="metric-card">
                          <h3>Open Issues</h3>
                          <div class="metric-value" id="openIssues">--</div>
                          <div class="metric-label">issues to resolve</div>
                      </div>
                      
                      <div class="metric-card">
                          <h3>PR Compliance</h3>
                          <div class="metric-value" id="prCompliance">--%</div>
                          <div class="metric-label">of PRs reference issues</div>
                      </div>
                      
                      <div class="metric-card">
                          <h3>Issues Closed (30d)</h3>
                          <div class="metric-value" id="closedIssues">--</div>
                          <div class="metric-label">issues resolved</div>
                      </div>
                  </div>
                  
                  <div class="chart-grid">
                      <div class="chart-container">
                          <h2>Daily Compliance Trend</h2>
                          <canvas id="trendChart"></canvas>
                      </div>
                      
                      <div class="chart-container">
                          <h2>Compliance Distribution</h2>
                          <canvas id="pieChart"></canvas>
                      </div>
                  </div>
                  
                  <div class="chart-container">
                      <h2>Weekly Compliance Heatmap</h2>
                      <canvas id="heatmapChart"></canvas>
                  </div>
                  
                  <div class="footer">
                      <p>🚀 Powered by GitHub Actions | IDD Compliance System v1.0</p>
                      <p style="margin-top: 10px;">
                          <a href="metrics.json" style="color: white;">📄 View Raw Metrics</a> | 
                          <a href="https://github.com/your-org/PMPLearningManagement" style="color: white;">📚 Repository</a>
                      </p>
                  </div>
              </div>
              
              <script>
                  // メトリクスを読み込んで表示
                  fetch('metrics.json')
                      .then(response => response.json())
                      .then(data => {
                          // 基本メトリクスを更新
                          document.getElementById('lastUpdated').textContent = new Date(data.timestamp).toLocaleString();
                          document.getElementById('complianceRate').textContent = data.last_30_days.compliance_rate + '%';
                          document.getElementById('totalCommits').textContent = data.last_30_days.total_commits;
                          document.getElementById('uniqueAuthors').textContent = data.last_30_days.unique_authors;
                          document.getElementById('openIssues').textContent = data.issues?.open || '-';
                          document.getElementById('closedIssues').textContent = data.issues?.closed_last_30_days || '-';
                          document.getElementById('prCompliance').textContent = (data.pull_requests?.compliance_rate || 0) + '%';
                          
                          // コンプライアンス率に基づいて色を設定
                          const rate = data.last_30_days.compliance_rate;
                          const rateElement = document.getElementById('complianceRate');
                          if (rate >= 95) {
                              rateElement.className = 'metric-value status-good';
                          } else if (rate >= 80) {
                              rateElement.className = 'metric-value status-warning';
                          } else {
                              rateElement.className = 'metric-value status-bad';
                          }
                          
                          // トレンドチャートを描画
                          const trendCtx = document.getElementById('trendChart').getContext('2d');
                          const dailyStats = data.daily_stats || [];
                          
                          new Chart(trendCtx, {
                              type: 'line',
                              data: {
                                  labels: dailyStats.map(d => d.date),
                                  datasets: [{
                                      label: 'Compliance Rate',
                                      data: dailyStats.map(d => d.total > 0 ? (d.compliant * 100 / d.total) : 0),
                                      borderColor: '#667eea',
                                      backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                      tension: 0.4
                                  }]
                              },
                              options: {
                                  responsive: true,
                                  maintainAspectRatio: false,
                                  scales: {
                                      y: {
                                          beginAtZero: true,
                                          max: 100,
                                          ticks: {
                                              callback: function(value) {
                                                  return value + '%';
                                              }
                                          }
                                      }
                                  }
                              }
                          });
                          
                          // パイチャートを描画
                          const pieCtx = document.getElementById('pieChart').getContext('2d');
                          new Chart(pieCtx, {
                              type: 'doughnut',
                              data: {
                                  labels: ['Compliant', 'Non-compliant'],
                                  datasets: [{
                                      data: [
                                          data.last_30_days.compliant_commits,
                                          data.last_30_days.total_commits - data.last_30_days.compliant_commits
                                      ],
                                      backgroundColor: ['#10b981', '#ef4444']
                                  }]
                              },
                              options: {
                                  responsive: true,
                                  maintainAspectRatio: false
                              }
                          });
                          
                          // ヒートマップを描画（簡易版）
                          const heatmapCtx = document.getElementById('heatmapChart').getContext('2d');
                          const weeklyData = [];
                          const weekLabels = [];
                          
                          // 週ごとのデータを集計
                          for (let i = 0; i < 4; i++) {
                              weekLabels.push(`Week ${i + 1}`);
                              const weekStart = i * 7;
                              const weekEnd = weekStart + 7;
                              const weekStats = dailyStats.slice(weekStart, weekEnd);
                              
                              const weekTotal = weekStats.reduce((sum, d) => sum + d.total, 0);
                              const weekCompliant = weekStats.reduce((sum, d) => sum + d.compliant, 0);
                              
                              weeklyData.push(weekTotal > 0 ? (weekCompliant * 100 / weekTotal) : 0);
                          }
                          
                          new Chart(heatmapCtx, {
                              type: 'bar',
                              data: {
                                  labels: weekLabels,
                                  datasets: [{
                                      label: 'Weekly Compliance Rate',
                                      data: weeklyData,
                                      backgroundColor: weeklyData.map(rate => 
                                          rate >= 95 ? '#10b981' :
                                          rate >= 80 ? '#f59e0b' : '#ef4444'
                                      )
                                  }]
                              },
                              options: {
                                  responsive: true,
                                  maintainAspectRatio: false,
                                  scales: {
                                      y: {
                                          beginAtZero: true,
                                          max: 100,
                                          ticks: {
                                              callback: function(value) {
                                                  return value + '%';
                                              }
                                          }
                                      }
                                  }
                              }
                          });
                      })
                      .catch(error => {
                          console.error('Error loading metrics:', error);
                      });
              </script>
          </body>
          </html>
          EOF

      - name: Prepare GitHub Pages
        run: |
          mkdir -p .github/pages
          cp dashboard.html .github/pages/index.html
          cp metrics.json .github/pages/
          
          # GitHub Pages用の設定ファイル
          echo "theme: jekyll-theme-minimal" > .github/pages/_config.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/pages
          destination_dir: idd-dashboard

      - name: Update README with Dashboard Link
        run: |
          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/idd-dashboard/"
          COMPLIANCE_RATE="${{ steps.collect-metrics.outputs.compliance_rate }}"
          
          # READMEにダッシュボードバッジを追加
          if ! grep -q "IDD Compliance Dashboard" README.md 2>/dev/null; then
            # バッジの色を決定
            if [ "$COMPLIANCE_RATE" -ge 95 ]; then
              BADGE_COLOR="success"
            else
              BADGE_COLOR="yellow"
            fi
            
            echo "" >> README.md
            echo "## 📊 IDD Compliance Dashboard" >> README.md
            echo "" >> README.md
            echo "[![IDD Compliance](https://img.shields.io/badge/IDD%20Compliance-${COMPLIANCE_RATE}%25-${BADGE_COLOR})](${DASHBOARD_URL})" >> README.md
            echo "" >> README.md
            echo "View our real-time IDD compliance metrics: [Dashboard](${DASHBOARD_URL})" >> README.md
            
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add README.md
            git diff --quiet && git diff --staged --quiet || git commit -m "docs: Update IDD compliance badge"
            git push
          fi