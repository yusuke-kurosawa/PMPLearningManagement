# ====================================================================
# 📊 Quality - IDD Metrics
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - スケジュール実行
#   - 手動実行
#   - コードプッシュ時
#
# 主な処理:
#   1. 📌 処理: Collect IDD Metrics
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F4CA Quality - IDD Metrics"
'on':
  schedule:
    - cron: 0 */6 * * *
  workflow_dispatch: null
  push:
    branches:
      - main
permissions:
  contents: write
  issues: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: 'idd-metrics-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  collect-metrics:
    name: "\U0001F4CC 処理: Collect IDD Metrics"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Collect Repository Metrics
        id: collect-metrics
        run: "# メトリクス収集開始\necho \"\U0001F4CA Collecting IDD metrics...\"\n\n# 基本統計\nTOTAL_COMMITS=$(git rev-list --count HEAD)\nTOTAL_BRANCHES=$(git branch -r | wc -l)\n\n# 過去30日間のメトリクス\nTHIRTY_DAYS_AGO=$(date -d '30 days ago' '+%Y-%m-%d')\n\n# コミットの分析\nRECENT_COMMITS=$(git log --since=\"$THIRTY_DAYS_AGO\" --format=\"%H|%s|%an|%ae|%ad\" --date=iso --no-merges)\n\nCOMMITS_30D=0\nCOMPLIANT_30D=0\nUNIQUE_AUTHORS=\"\"\nDAILY_STATS=\"\"\n\nwhile IFS='|' read -r sha subject author email date; do\n  if [ -z \"$sha\" ]; then continue; fi\n  \n  COMMITS_30D=$((COMMITS_30D + 1))\n  \n  if echo \"$subject\" | grep -qE '#[0-9]+'; then\n    COMPLIANT_30D=$((COMPLIANT_30D + 1))\n  fi\n  \n  # 日別統計\n  DAY=$(echo \"$date\" | cut -d' ' -f1)\n  if [ -n \"$DAY\" ]; then\n    if echo \"$DAILY_STATS\" | grep -q \"$DAY\"; then\n      # 既存の日付を更新\n      OLD_COUNT=$(echo \"$DAILY_STATS\" | grep \"$DAY\" | cut -d',' -f2)\n      OLD_COMPLIANT=$(echo \"$DAILY_STATS\" | grep \"$DAY\" | cut -d',' -f3)\n      NEW_COUNT=$((OLD_COUNT + 1))\n      if echo \"$subject\" | grep -qE '#[0-9]+'; then\n        NEW_COMPLIANT=$((OLD_COMPLIANT + 1))\n      else\n        NEW_COMPLIANT=$OLD_COMPLIANT\n      fi\n      DAILY_STATS=$(echo \"$DAILY_STATS\" | sed \"s/$DAY,$OLD_COUNT,$OLD_COMPLIANT/$DAY,$NEW_COUNT,$NEW_COMPLIANT/\")\n    else\n      if echo \"$subject\" | grep -qE '#[0-9]+'; then\n        DAILY_STATS=\"$DAILY_STATS\\n$DAY,1,1\"\n      else\n        DAILY_STATS=\"$DAILY_STATS\\n$DAY,1,0\"\n      fi\n    fi\n  fi\n  \n  # ユニーク著者の追跡\n  if ! echo \"$UNIQUE_AUTHORS\" | grep -q \"$email\"; then\n    UNIQUE_AUTHORS=\"$UNIQUE_AUTHORS\\n$email\"\n  fi\ndone <<< \"$RECENT_COMMITS\"\n\n# 著者数をカウント\nAUTHOR_COUNT=$(echo -e \"$UNIQUE_AUTHORS\" | grep -v '^$' | wc -l)\n\n# コンプライアンス率を計算\nif [ $COMMITS_30D -gt 0 ]; then\n  COMPLIANCE_RATE_30D=$((COMPLIANT_30D * 100 / COMMITS_30D))\nelse\n  COMPLIANCE_RATE_30D=0\nfi\n\n# JSON形式でメトリクスを生成\necho \"{\" > metrics.json\necho \"  \\\"timestamp\\\": \\\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\\\",\" >> metrics.json\necho \"  \\\"repository\\\": {\" >> metrics.json\necho \"    \\\"total_commits\\\": $TOTAL_COMMITS,\" >> metrics.json\necho \"    \\\"total_branches\\\": $TOTAL_BRANCHES\" >> metrics.json\necho \"  },\" >> metrics.json\necho \"  \\\"last_30_days\\\": {\" >> metrics.json\necho \"    \\\"total_commits\\\": $COMMITS_30D,\" >> metrics.json\necho \"    \\\"compliant_commits\\\": $COMPLIANT_30D,\" >> metrics.json\necho \"    \\\"compliance_rate\\\": $COMPLIANCE_RATE_30D,\" >> metrics.json\necho \"    \\\"unique_authors\\\": $AUTHOR_COUNT\" >> metrics.json\necho \"  },\" >> metrics.json\necho \"  \\\"daily_stats\\\": [\" >> metrics.json\necho -e \"$DAILY_STATS\" | grep -v '^$' | while IFS=',' read -r date total compliant; do\n  [ -n \"$date\" ] && echo \"    {\\\"date\\\":\\\"$date\\\",\\\"total\\\":$total,\\\"compliant\\\":$compliant},\" >> metrics.json\ndone\n# 最後のカンマを削除\nsed -i '$ s/,$//' metrics.json\necho \"  ]\" >> metrics.json\necho \"}\" >> metrics.json\n\necho \"compliance_rate=$COMPLIANCE_RATE_30D\" >> $GITHUB_OUTPUT\n"
      - name: Fetch Issue and PR Metrics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));

            // Issue統計を取得
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              since: new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString()
            });

            const openIssues = issues.data.filter(i => !i.pull_request && i.state === 'open').length;
            const closedIssues = issues.data.filter(i => !i.pull_request && i.state === 'closed').length;

            // PR統計を取得
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            let compliantPRs = 0;
            let totalPRs = 0;

            for (const pr of prs.data.slice(0, 30)) { // 最新30件のPR
              totalPRs++;
              if (pr.title.match(/#\d+/) || (pr.body && pr.body.match(/#\d+/))) {
                compliantPRs++;
              }
            }

            // メトリクスを更新
            metrics.issues = {
              open: openIssues,
              closed_last_30_days: closedIssues,
              total: openIssues + closedIssues
            };

            metrics.pull_requests = {
              total_recent: totalPRs,
              compliant: compliantPRs,
              compliance_rate: totalPRs > 0 ? Math.round(compliantPRs * 100 / totalPRs) : 0
            };

            // 更新されたメトリクスを保存
            fs.writeFileSync('metrics.json', JSON.stringify(metrics, null, 2));
      - name: Generate Dashboard HTML
        run: "cat << 'EOF' > dashboard.html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IDD Compliance Dashboard</title>\n    <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"></script>\n    <style>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n        \n        body {\n            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            min-height: 100vh;\n            padding: 20px;\n        }\n        \n        .container {\n            max-width: 1400px;\n            margin: 0 auto;\n        }\n        \n        .header {\n            background: white;\n            border-radius: 15px;\n            padding: 30px;\n            margin-bottom: 30px;\n            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);\n        }\n        \n        .header h1 {\n            color: #333;\n            font-size: 2.5em;\n            margin-bottom: 10px;\n        }\n        \n        .header p {\n            color: #666;\n            font-size: 1.1em;\n        }\n        \n        .metrics-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n            gap: 20px;\n            margin-bottom: 30px;\n        }\n        \n        .metric-card {\n            background: white;\n            border-radius: 10px;\n            padding: 20px;\n            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);\n            transition: transform 0.3s ease;\n        }\n        \n        .metric-card:hover {\n            transform: translateY(-5px);\n        }\n        \n        .metric-card h3 {\n            color: #666;\n            font-size: 0.9em;\n            text-transform: uppercase;\n            margin-bottom: 10px;\n        }\n        \n        .metric-value {\n            font-size: 2.5em;\n            font-weight: bold;\n            color: #333;\n            margin-bottom: 5px;\n        }\n        \n        .metric-label {\n            color: #999;\n            font-size: 0.9em;\n        }\n        \n        .chart-container {\n            background: white;\n            border-radius: 10px;\n            padding: 20px;\n            margin-bottom: 20px;\n            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);\n        }\n        \n        .chart-container h2 {\n            color: #333;\n            margin-bottom: 20px;\n            font-size: 1.5em;\n        }\n        \n        .status-good {\n            color: #10b981;\n        }\n        \n        .status-warning {\n            color: #f59e0b;\n        }\n        \n        .status-bad {\n            color: #ef4444;\n        }\n        \n        .chart-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));\n            gap: 20px;\n        }\n        \n        canvas {\n            max-height: 300px;\n        }\n        \n        .footer {\n            text-align: center;\n            color: white;\n            margin-top: 40px;\n            padding: 20px;\n        }\n        \n        .badge {\n            display: inline-block;\n            padding: 5px 10px;\n            border-radius: 20px;\n            font-size: 0.8em;\n            font-weight: bold;\n            margin-left: 10px;\n        }\n        \n        .badge-success {\n            background: #10b981;\n            color: white;\n        }\n        \n        .badge-warning {\n            background: #f59e0b;\n            color: white;\n        }\n        \n        .badge-danger {\n            background: #ef4444;\n            color: white;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <div class=\"header\">\n            <h1>\U0001F4CA IDD Compliance Dashboard</h1>\n            <p>Real-time Issue-Driven Development metrics for PMPLearningManagement</p>\n            <p style=\"margin-top: 10px; font-size: 0.9em; color: #999;\">\n                Last updated: <span id=\"lastUpdated\"></span>\n            </p>\n        </div>\n        \n        <div class=\"metrics-grid\">\n            <div class=\"metric-card\">\n                <h3>30-Day Compliance</h3>\n                <div class=\"metric-value\" id=\"complianceRate\">--%</div>\n                <div class=\"metric-label\">of commits reference issues</div>\n            </div>\n            \n            <div class=\"metric-card\">\n                <h3>Total Commits (30d)</h3>\n                <div class=\"metric-value\" id=\"totalCommits\">--</div>\n                <div class=\"metric-label\">commits made</div>\n            </div>\n            \n            <div class=\"metric-card\">\n                <h3>Active Contributors</h3>\n                <div class=\"metric-value\" id=\"uniqueAuthors\">--</div>\n                <div class=\"metric-label\">unique authors</div>\n            </div>\n            \n            <div class=\"metric-card\">\n                <h3>Open Issues</h3>\n                <div class=\"metric-value\" id=\"openIssues\">--</div>\n                <div class=\"metric-label\">issues to resolve</div>\n            </div>\n            \n            <div class=\"metric-card\">\n                <h3>PR Compliance</h3>\n                <div class=\"metric-value\" id=\"prCompliance\">--%</div>\n                <div class=\"metric-label\">of PRs reference issues</div>\n            </div>\n            \n            <div class=\"metric-card\">\n                <h3>Issues Closed (30d)</h3>\n                <div class=\"metric-value\" id=\"closedIssues\">--</div>\n                <div class=\"metric-label\">issues resolved</div>\n            </div>\n        </div>\n        \n        <div class=\"chart-grid\">\n            <div class=\"chart-container\">\n                <h2>Daily Compliance Trend</h2>\n                <canvas id=\"trendChart\"></canvas>\n            </div>\n            \n            <div class=\"chart-container\">\n                <h2>Compliance Distribution</h2>\n                <canvas id=\"pieChart\"></canvas>\n            </div>\n        </div>\n        \n        <div class=\"chart-container\">\n            <h2>Weekly Compliance Heatmap</h2>\n            <canvas id=\"heatmapChart\"></canvas>\n        </div>\n        \n        <div class=\"footer\">\n            <p>\U0001F680 Powered by GitHub Actions | IDD Compliance System v1.0</p>\n            <p style=\"margin-top: 10px;\">\n                <a href=\"metrics.json\" style=\"color: white;\">\U0001F4C4 View Raw Metrics</a> | \n                <a href=\"https://github.com/your-org/PMPLearningManagement\" style=\"color: white;\">\U0001F4DA Repository</a>\n            </p>\n        </div>\n    </div>\n    \n    <script>\n        // メトリクスを読み込んで表示\n        fetch('metrics.json')\n            .then(response => response.json())\n            .then(data => {\n                // 基本メトリクスを更新\n                document.getElementById('lastUpdated').textContent = new Date(data.timestamp).toLocaleString();\n                document.getElementById('complianceRate').textContent = data.last_30_days.compliance_rate + '%';\n                document.getElementById('totalCommits').textContent = data.last_30_days.total_commits;\n                document.getElementById('uniqueAuthors').textContent = data.last_30_days.unique_authors;\n                document.getElementById('openIssues').textContent = data.issues?.open || '-';\n                document.getElementById('closedIssues').textContent = data.issues?.closed_last_30_days || '-';\n                document.getElementById('prCompliance').textContent = (data.pull_requests?.compliance_rate || 0) + '%';\n                \n                // コンプライアンス率に基づいて色を設定\n                const rate = data.last_30_days.compliance_rate;\n                const rateElement = document.getElementById('complianceRate');\n                if (rate >= 95) {\n                    rateElement.className = 'metric-value status-good';\n                } else if (rate >= 80) {\n                    rateElement.className = 'metric-value status-warning';\n                } else {\n                    rateElement.className = 'metric-value status-bad';\n                }\n                \n                // トレンドチャートを描画\n                const trendCtx = document.getElementById('trendChart').getContext('2d');\n                const dailyStats = data.daily_stats || [];\n                \n                new Chart(trendCtx, {\n                    type: 'line',\n                    data: {\n                        labels: dailyStats.map(d => d.date),\n                        datasets: [{\n                            label: 'Compliance Rate',\n                            data: dailyStats.map(d => d.total > 0 ? (d.compliant * 100 / d.total) : 0),\n                            borderColor: '#667eea',\n                            backgroundColor: 'rgba(102, 126, 234, 0.1)',\n                            tension: 0.4\n                        }]\n                    },\n                    options: {\n                        responsive: true,\n                        maintainAspectRatio: false,\n                        scales: {\n                            y: {\n                                beginAtZero: true,\n                                max: 100,\n                                ticks: {\n                                    callback: function(value) {\n                                        return value + '%';\n                                    }\n                                }\n                            }\n                        }\n                    }\n                });\n                \n                // パイチャートを描画\n                const pieCtx = document.getElementById('pieChart').getContext('2d');\n                new Chart(pieCtx, {\n                    type: 'doughnut',\n                    data: {\n                        labels: ['Compliant', 'Non-compliant'],\n                        datasets: [{\n                            data: [\n                                data.last_30_days.compliant_commits,\n                                data.last_30_days.total_commits - data.last_30_days.compliant_commits\n                            ],\n                            backgroundColor: ['#10b981', '#ef4444']\n                        }]\n                    },\n                    options: {\n                        responsive: true,\n                        maintainAspectRatio: false\n                    }\n                });\n                \n                // ヒートマップを描画（簡易版）\n                const heatmapCtx = document.getElementById('heatmapChart').getContext('2d');\n                const weeklyData = [];\n                const weekLabels = [];\n                \n                // 週ごとのデータを集計\n                for (let i = 0; i < 4; i++) {\n                    weekLabels.push(`Week ${i + 1}`);\n                    const weekStart = i * 7;\n                    const weekEnd = weekStart + 7;\n                    const weekStats = dailyStats.slice(weekStart, weekEnd);\n                    \n                    const weekTotal = weekStats.reduce((sum, d) => sum + d.total, 0);\n                    const weekCompliant = weekStats.reduce((sum, d) => sum + d.compliant, 0);\n                    \n                    weeklyData.push(weekTotal > 0 ? (weekCompliant * 100 / weekTotal) : 0);\n                }\n                \n                new Chart(heatmapCtx, {\n                    type: 'bar',\n                    data: {\n                        labels: weekLabels,\n                        datasets: [{\n                            label: 'Weekly Compliance Rate',\n                            data: weeklyData,\n                            backgroundColor: weeklyData.map(rate => \n                                rate >= 95 ? '#10b981' :\n                                rate >= 80 ? '#f59e0b' : '#ef4444'\n                            )\n                        }]\n                    },\n                    options: {\n                        responsive: true,\n                        maintainAspectRatio: false,\n                        scales: {\n                            y: {\n                                beginAtZero: true,\n                                max: 100,\n                                ticks: {\n                                    callback: function(value) {\n                                        return value + '%';\n                                    }\n                                }\n                            }\n                        }\n                    }\n                });\n            })\n            .catch(error => {\n                console.error('Error loading metrics:', error);\n            });\n    </script>\n</body>\n</html>\nEOF\n"
      - name: Prepare GitHub Pages
        run: |
          mkdir -p .github/pages
          cp dashboard.html .github/pages/index.html
          cp metrics.json .github/pages/

          # GitHub Pages用の設定ファイル
          echo "theme: jekyll-theme-minimal" > .github/pages/_config.yml
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: .github/pages
          destination_dir: idd-dashboard
      - name: Update README with Dashboard Link
        run: "DASHBOARD_URL=\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/idd-dashboard/\"\nCOMPLIANCE_RATE=\"${{ steps.collect-metrics.outputs.compliance_rate }}\"\n\n# READMEにダッシュボードバッジを追加\nif ! grep -q \"IDD Compliance Dashboard\" README.md 2>/dev/null; then\n  # バッジの色を決定\n  if [ \"$COMPLIANCE_RATE\" -ge 95 ]; then\n    BADGE_COLOR=\"success\"\n  else\n    BADGE_COLOR=\"yellow\"\n  fi\n  \n  echo \"\" >> README.md\n  echo \"## \U0001F4CA IDD Compliance Dashboard\" >> README.md\n  echo \"\" >> README.md\n  echo \"[![IDD Compliance](https://img.shields.io/badge/IDD%20Compliance-${COMPLIANCE_RATE}%25-${BADGE_COLOR})](${DASHBOARD_URL})\" >> README.md\n  echo \"\" >> README.md\n  echo \"View our real-time IDD compliance metrics: [Dashboard](${DASHBOARD_URL})\" >> README.md\n  \n  git config --local user.email \"action@github.com\"\n  git config --local user.name \"GitHub Action\"\n  git add README.md\n  git diff --quiet && git diff --staged --quiet || git commit -m \"docs: Update IDD compliance badge\"\n  git push\nfi\n"
    timeout-minutes: 30
