export class ExamEngine {
  private questions: Array<ExamQuestion> = [];
  private currentScore: f32 = 0;
  
  addQuestion(id: i32, text: string, options: Array<string>, correctAnswer: i32): void {
    let question = new ExamQuestion();
    question.id = id;
    question.text = text;
    question.options = options;
    question.correctAnswer = correctAnswer;
    this.questions.push(question);
  }
  
  calculateScore(answers: Array<i32>): f32 {
    let correct: i32 = 0;
    for (let i = 0; i < answers.length; i++) {
      if (i < this.questions.length && answers[i] === this.questions[i].correctAnswer) {
        correct++;
      }
    }
    return f32(correct) / f32(this.questions.length) * 100.0;
  }
  
  getRecommendations(score: f32): Array<string> {
    let recommendations: Array<string> = [];
    if (score < 70) {
      recommendations.push(\"Focus on knowledge areas with low scores\");
