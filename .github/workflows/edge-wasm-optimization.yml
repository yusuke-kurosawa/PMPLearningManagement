const CACHE_NAME = 'pmp-learning-v2.0-wasm';
const urlsToCache = [
  '/',
  '/static/js/',
  '/static/css/',
  '/wasm/',
  '/manifest.json'
];

// Install event - cache resources
self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME)
      .then(cache => cache.addAll(urlsToCache))
  );
});

// Fetch event - serve from cache with WASM optimization
self.addEventListener('fetch', event => {
  event.respondWith(
    caches.match(event.request)
      .then(response => {
        // Return cached version or fetch from network
        if (response) {
          return response;
        }
        
        // Clone the request for WASM optimization
        const fetchRequest = event.request.clone();
        
        return fetch(fetchRequest).then(response => {
          // Check if response is valid
          if (!response || response.status !== 200 || response.type !== 'basic') {
            return response;
          }
          
          // Clone response for caching
          const responseToCache = response.clone();
          
          caches.open(CACHE_NAME)
            .then(cache => {
              cache.put(event.request, responseToCache);
            });
          
          return response;
        });
      })
  );
});

// Background sync for performance data
self.addEventListener('sync', event => {
  if (event.tag === 'performance-data') {
    event.waitUntil(syncPerformanceData());
  }
});

async function syncPerformanceData() {
  // Sync performance metrics when online
  console.log('🔄 Syncing performance data...');
}
