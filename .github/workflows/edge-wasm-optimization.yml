name = \"pmbok-parser\"
version = \"1.0.0\"
edition = \"2021\"

[lib]
crate-type = [\"cdylib\"]

[dependencies]
wasm-bindgen = \"0.2\"
serde = { version = \"1.0\", features = [\"derive\"] }
serde_json = \"1.0\"

[dependencies.web-sys]
version = \"0.3\"
features = [\"console\"]
EOF

              cat > src/lib.rs << 'EOF'
use wasm_bindgen::prelude::*;
use serde::{Deserialize, Serialize};

#[derive(Serialize, Deserialize)]
pub struct PMBOKProcess {
    pub id: String,
    pub name: String,
    pub knowledge_area: String,
    pub process_group: String,
    pub inputs: Vec<String>,
    pub tools: Vec<String>,
    pub outputs: Vec<String>,
}

#[wasm_bindgen]
pub struct PMBOKParser {
    processes: Vec<PMBOKProcess>,
}

#[wasm_bindgen]
impl PMBOKParser {
    #[wasm_bindgen(constructor)]
    pub fn new() -> PMBOKParser {
        PMBOKParser {
            processes: Vec::new(),
        }
    }
    
    #[wasm_bindgen]
    pub fn parse_processes(&mut self, json_data: &str) -> Result<usize, JsValue> {
        let processes: Vec<PMBOKProcess> = serde_json::from_str(json_data)
            .map_err(|e| JsValue::from_str(&e.to_string()))?;
        
        self.processes = processes;
        Ok(self.processes.len())
    }
    
    #[wasm_bindgen]
    pub fn find_related_processes(&self, process_id: &str) -> String {
        // High-performance ITTO relationship analysis
        let related: Vec<&PMBOKProcess> = self.processes
            .iter()
            .filter(|p| p.id != process_id)
            .filter(|p| {
                self.processes.iter()
                    .find(|target| target.id == process_id)
                    .map_or(false, |target| {
                        p.inputs.iter().any(|input| target.outputs.contains(input)) ||
                        p.outputs.iter().any(|output| target.inputs.contains(output))
                    })
            })
            .collect();
            
        serde_json::to_string(&related).unwrap_or_default()
    }
}
