use wasm_bindgen::prelude::*;

#[wasm_bindgen]
pub struct GraphRenderer {
    nodes: Vec<Node>,
    edges: Vec<Edge>,
}

#[wasm_bindgen]
pub struct Node {
    pub id: u32,
    pub x: f64,
    pub y: f64,
    pub weight: f64,
}

#[wasm_bindgen]
pub struct Edge {
    pub source: u32,
    pub target: u32,
    pub weight: f64,
}

#[wasm_bindgen]
impl GraphRenderer {
    #[wasm_bindgen(constructor)]
    pub fn new() -> GraphRenderer {
        GraphRenderer {
            nodes: Vec::new(),
            edges: Vec::new(),
        }
    }
    
    #[wasm_bindgen]
    pub fn add_node(&mut self, id: u32, x: f64, y: f64, weight: f64) {
        self.nodes.push(Node { id, x, y, weight });
    }
    
    #[wasm_bindgen]
    pub fn add_edge(&mut self, source: u32, target: u32, weight: f64) {
        self.edges.push(Edge { source, target, weight });
    }
    
    #[wasm_bindgen]
    pub fn force_layout_step(&mut self) -> js_sys::Float64Array {
        // High-performance force-directed layout algorithm
        let mut positions = Vec::new();
        
        for node in &mut self.nodes {
            let mut fx = 0.0;
            let mut fy = 0.0;
            
            // Repulsion forces
            for other in &self.nodes {
                if node.id != other.id {
                    let dx = node.x - other.x;
                    let dy = node.y - other.y;
                    let distance = (dx*dx + dy*dy).sqrt();
                    if distance > 0.0 {
                        let force = 1000.0 / (distance * distance);
                        fx += dx / distance * force;
                        fy += dy / distance * force;
                    }
                }
            }
            
            // Attraction forces from edges
            for edge in &self.edges {
                if edge.source == node.id || edge.target == node.id {
                    let other_id = if edge.source == node.id { edge.target } else { edge.source };
                    if let Some(other) = self.nodes.iter().find(|n| n.id == other_id) {
                        let dx = other.x - node.x;
                        let dy = other.y - node.y;
                        let distance = (dx*dx + dy*dy).sqrt();
                        if distance > 0.0 {
                            let force = distance * edge.weight * 0.01;
                            fx += dx / distance * force;
                            fy += dy / distance * force;
                        }
                    }
                }
            }
            
            // Update position
            node.x += fx * 0.01;
            node.y += fy * 0.01;
            
            positions.push(node.x);
            positions.push(node.y);
        }
        
        js_sys::Float64Array::from(positions.as_slice())
    }
}
