/**
 * High-Performance WebAssembly Module Loader
 * Supports progressive enhancement and fallbacks
 */
class WASMLoader {
  constructor() {
    this.wasmSupported = typeof WebAssembly === 'object';
    this.loadedModules = new Map();
  }
  
  async loadModule(name, wasmPath, jsPath) {
    if (this.loadedModules.has(name)) {
      return this.loadedModules.get(name);
    }
    
    try {
      if (this.wasmSupported) {
        const wasmModule = await this.loadWASM(wasmPath);
        this.loadedModules.set(name, wasmModule);
        console.log(`✅ WASM module loaded: ${name}`);
        return wasmModule;
      } else {
        // Fallback to JavaScript implementation
        const jsModule = await this.loadJS(jsPath);
        this.loadedModules.set(name, jsModule);
        console.log(`📦 JS fallback loaded: ${name}`);
        return jsModule;
      }
    } catch (error) {
      console.error(`❌ Failed to load module ${name}:`, error);
      throw error;
    }
  }
  
  async loadWASM(path) {
    const response = await fetch(path);
    const bytes = await response.arrayBuffer();
    const module = await WebAssembly.instantiate(bytes);
    return module.instance.exports;
  }
  
  async loadJS(path) {
    return import(path);
  }
}

// Global WASM loader instance
window.wasmLoader = new WASMLoader();
