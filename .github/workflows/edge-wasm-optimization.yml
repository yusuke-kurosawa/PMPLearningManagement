          # Create performance monitor
          cat > performance-build/performance-monitor.js << 'EOF'
/**
 * Real-time Performance Monitoring
 * Tracks Core Web Vitals and custom metrics
 */
class PerformanceMonitor {
  constructor() {
    this.metrics = {
      lcp: null,
      fid: null,
      cls: null,
      ttfb: null,
      wasmLoadTime: null
    };
    this.initializeObservers();
  }
  
  initializeObservers() {
    // Largest Contentful Paint
    new PerformanceObserver((list) => {
      for (const entry of list.getEntries()) {
        this.metrics.lcp = entry.startTime;
        this.reportMetric('lcp', entry.startTime);
      }
    }).observe({ entryTypes: ['largest-contentful-paint'] });
    
    // First Input Delay
    new PerformanceObserver((list) => {
      for (const entry of list.getEntries()) {
        this.metrics.fid = entry.processingStart - entry.startTime;
        this.reportMetric('fid', this.metrics.fid);
      }
    }).observe({ entryTypes: ['first-input'] });
    
    // Cumulative Layout Shift
    new PerformanceObserver((list) => {
      let cumulativeScore = 0;
      for (const entry of list.getEntries()) {
        cumulativeScore += entry.value;
      }
      this.metrics.cls = cumulativeScore;
      this.reportMetric('cls', cumulativeScore);
    }).observe({ entryTypes: ['layout-shift'] });
  }
  
  reportMetric(name, value) {
    console.log(`📊 Performance metric - ${name}: ${value}`);
    
    // Send to analytics endpoint
    if (typeof gtag !== 'undefined') {
      gtag('event', 'performance_metric', {
        metric_name: name,
        metric_value: value,
        custom_parameter: 'edge_optimized'
      });
    }
  }
  
  getMetricsSummary() {
    return {
      ...this.metrics,
      performanceScore: this.calculatePerformanceScore()
    };
  }
  
  calculatePerformanceScore() {
    let score = 100;
    
    if (this.metrics.lcp > 2500) score -= 20;
    else if (this.metrics.lcp > 1200) score -= 10;
    
    if (this.metrics.fid > 300) score -= 20;
    else if (this.metrics.fid > 100) score -= 10;
    
    if (this.metrics.cls > 0.25) score -= 20;
    else if (this.metrics.cls > 0.1) score -= 10;
    
    return Math.max(0, score);
  }
}

// Initialize performance monitoring
window.performanceMonitor = new PerformanceMonitor();
