      - name: Optimize WASM Binary
        run: |
          echo \"⚡ Optimizing WASM binary for ${{ matrix.wasm-module }}...\"
          
          # Install wasm-opt for binary optimization
          wget https://github.com/WebAssembly/binaryen/releases/download/version_114/binaryen-version_114-x86_64-linux.tar.gz
          tar xzf binaryen-version_114-x86_64-linux.tar.gz
          export PATH=$PATH:$PWD/binaryen-version_114/bin
          
          cd wasm-modules/${{ matrix.wasm-module }}
          
          # Find and optimize WASM files
          find . -name \"*.wasm\" -exec wasm-opt -O3 --enable-bulk-memory {} -o {}.optimized \\;
          find . -name \"*.wasm.optimized\" -exec sh -c 'mv \"$1\" \"${1%.optimized}\"' _ {} \\;
          
          # Compress with Brotli and Gzip
          find . -name \"*.wasm\" -exec brotli -q 11 {} \\;
          find . -name \"*.wasm\" -exec gzip -9 -k {} \\;
          
          echo \"📊 WASM optimization results:\"
          find . -name \"*.wasm*\" -exec ls -lh {} \\;
          
      - name: Upload Optimized WASM Module
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.wasm-module }}
          path: wasm-modules/${{ matrix.wasm-module }}/
          retention-days: 30

