#include <emscripten/bind.h>
#include <emscripten/val.h>
#include <vector>
#include <algorithm>
#include <cmath>

class LearningAnalytics {
private:
    std::vector<double> studyTimes;
    std::vector<double> scores;
    
public:
    void addStudySession(double timeMinutes, double score) {
        studyTimes.push_back(timeMinutes);
        scores.push_back(score);
    }
    
    double calculateLearningVelocity() {
        if (scores.size() < 2) return 0.0;
        
        double totalImprovement = 0.0;
        for (size_t i = 1; i < scores.size(); i++) {
            totalImprovement += std::max(0.0, scores[i] - scores[i-1]);
        }
        
        double totalTime = 0.0;
        for (double time : studyTimes) {
            totalTime += time;
        }
        
        return totalTime > 0 ? totalImprovement / totalTime : 0.0;
    }
    
    emscripten::val predictNextScore() {
        if (scores.size() < 3) {
            return emscripten::val::null();
        }
        
        // Linear regression for prediction
        double sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
        size_t n = scores.size();
        
        for (size_t i = 0; i < n; i++) {
            double x = static_cast<double>(i);
            double y = scores[i];
            sumX += x;
            sumY += y;
            sumXY += x * y;
            sumX2 += x * x;
        }
        
        double slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
        double intercept = (sumY - slope * sumX) / n;
        
        double nextScore = slope * n + intercept;
        return emscripten::val(std::min(100.0, std::max(0.0, nextScore)));
    }
};

EMSCRIPTEN_BINDINGS(learning_analytics) {
    emscripten::class_<LearningAnalytics>(\"LearningAnalytics\")
        .constructor()
        .function(\"addStudySession\", &LearningAnalytics::addStudySession)
        .function(\"calculateLearningVelocity\", &LearningAnalytics::calculateLearningVelocity)
        .function(\"predictNextScore\", &LearningAnalytics::predictNextScore);
}
