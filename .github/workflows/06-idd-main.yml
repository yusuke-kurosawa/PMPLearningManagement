name: '📋 Issue-Driven Development Workflow'

on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, edited, synchronize, closed]
  push:
    branches: [main, develop]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Validate issue format and auto-label
  validate-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    name: Validate Issue Format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Issue Template
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Check if issue follows template structure
            const hasRequiredSections = [
              '## 📋',  // Description section
              '## 🔍',  // Steps/Details section
              '## ✅'   // Acceptance criteria
            ].every(section => body.includes(section));
            
            if (!hasRequiredSections) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ **Issue Template Validation Failed**
                
                This issue doesn't follow the required template structure. Please update your issue to include:
                - Clear description section
                - Detailed steps or requirements
                - Acceptance criteria
                
                Use one of our issue templates to ensure proper formatting.`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-template', 'status:blocked']
              });
            } else {
              // Remove validation labels if they exist
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'needs-template'
                });
              } catch (e) {} // Label might not exist
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['status:ready']
              });
            }

      - name: Auto-assign based on labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            
            // Auto-assign based on area
            let assignees = [];
            if (labels.includes('area:ui') || labels.includes('area:frontend')) {
              assignees.push('frontend-team-member');
            }
            if (labels.includes('area:backend') || labels.includes('area:api')) {
              assignees.push('backend-team-member');
            }
            if (labels.includes('type:security')) {
              assignees.push('security-team-member');
            }
            if (labels.includes('type:database')) {
              assignees.push('database-admin');
            }
            
            if (assignees.length > 0) {
              // Note: Replace with actual GitHub usernames
              console.log('Would assign to:', assignees);
            }

  # Validate PR has linked issues
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Validate Pull Request
    steps:
      - name: Check PR has linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            
            // Check for issue references in PR body or title
            const issueReferences = [
              /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#\d+/gi,
              /(?:refs?|references?)\s+#\d+/gi,
              /#\d+/gi
            ];
            
            const hasIssueReference = issueReferences.some(pattern => 
              pattern.test(body) || pattern.test(title)
            );
            
            if (!hasIssueReference) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'REQUEST_CHANGES',
                body: `🚫 **Issue-Driven Development Violation**
                
                This pull request must reference at least one issue. Please:
                
                1. Link to the issue(s) this PR addresses using:
                   - "Closes #123" or "Fixes #123" to auto-close issues
                   - "Refs #123" or "References #123" for related issues
                
                2. Update the PR description to explain how this addresses the linked issue(s)
                
                **No code can be merged without proper issue traceability.**`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs-issue-link', 'status:blocked']
              });
              
              return;
            }
            
            // Extract issue numbers
            const issueNumbers = [];
            body.replace(/#(\d+)/g, (match, num) => {
              issueNumbers.push(parseInt(num));
            });
            title.replace(/#(\d+)/g, (match, num) => {
              issueNumbers.push(parseInt(num));
            });
            
            // Verify referenced issues exist and are open
            for (const issueNum of [...new Set(issueNumbers)]) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNum
                });
                
                if (issue.data.state === 'closed') {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    event: 'COMMENT',
                    body: `⚠️ **Warning**: Referenced issue #${issueNum} is already closed. Please verify this is intentional.`
                  });
                }
              } catch (error) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  event: 'REQUEST_CHANGES',
                  body: `❌ **Invalid Issue Reference**: Issue #${issueNum} does not exist. Please reference valid issues.`
                });
              }
            }

  # Validate commit messages reference issues
  validate-commits:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Validate Commit Messages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "Checking commit messages for issue references..."
          
          # Get commit range
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha=${{ github.event.pull_request.base.sha }}
            head_sha=${{ github.event.pull_request.head.sha }}
          else
            # For push events, check last 5 commits
            base_sha=$(git rev-parse HEAD~5)
            head_sha=$(git rev-parse HEAD)
          fi
          
          # Check each commit message
          commits=$(git rev-list --reverse $base_sha..$head_sha)
          invalid_commits=()
          
          for commit in $commits; do
            message=$(git log -1 --pretty=format:"%s %b" $commit)
            
            # Check for issue reference pattern
            if ! echo "$message" | grep -qE "(#[0-9]+|closes|fixes|resolves|refs|references)"; then
              invalid_commits+=("$commit: $message")
            fi
          done
          
          if [ ${#invalid_commits[@]} -gt 0 ]; then
            echo "❌ Commits without issue references found:"
            printf '%s\n' "${invalid_commits[@]}"
            echo "
            All commits must reference issues using one of these patterns:
            - feat: add new feature (#123)
            - fix: resolve login bug (closes #124)
            - docs: update API documentation (refs #125)
            "
            exit 1
          else
            echo "✅ All commits properly reference issues"
          fi

  # Generate IDD compliance report
  generate-report:
    runs-on: ubuntu-latest
    name: Generate IDD Compliance Report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate compliance report
        uses: actions/github-script@v7
        with:
          script: |
            // Get all issues and PRs from last 30 days
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              since: thirtyDaysAgo.toISOString(),
              per_page: 100
            });
            
            const pulls = issues.filter(item => item.pull_request);
            const actualIssues = issues.filter(item => !item.pull_request);
            
            // Calculate metrics
            const totalPRs = pulls.length;
            const prsWithIssues = pulls.filter(pr => {
              const body = pr.body || '';
              return /#\d+/.test(body);
            }).length;
            
            const totalCommits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: thirtyDaysAgo.toISOString(),
              per_page: 100
            });
            
            const commitsWithIssues = totalCommits.data.filter(commit => {
              const message = commit.commit.message;
              return /#\d+/.test(message);
            }).length;
            
            const compliance = {
              prCompliance: (prsWithIssues / totalPRs * 100).toFixed(1),
              commitCompliance: (commitsWithIssues / totalCommits.data.length * 100).toFixed(1),
              totalIssues: actualIssues.length,
              openIssues: actualIssues.filter(i => i.state === 'open').length,
              avgIssueAge: 'TBD', // Calculate average age of open issues
            };
            
            const report = `# IDD Compliance Report
            
            Generated: ${new Date().toISOString()}
            Period: Last 30 days
            
            ## Metrics
            
            - **PR Compliance**: ${compliance.prCompliance}% (${prsWithIssues}/${totalPRs} PRs link to issues)
            - **Commit Compliance**: ${compliance.commitCompliance}% (${commitsWithIssues}/${totalCommits.data.length} commits reference issues)
            - **Total Issues**: ${compliance.totalIssues}
            - **Open Issues**: ${compliance.openIssues}
            
            ## Recommendations
            
            ${compliance.prCompliance < 90 ? '⚠️ PR compliance is below 90%. Ensure all PRs reference issues.' : '✅ PR compliance is good.'}
            ${compliance.commitCompliance < 80 ? '⚠️ Commit compliance is below 80%. Ensure commits reference issues.' : '✅ Commit compliance is good.'}
            `;
            
            console.log(report);
            
            // Store report as artifact or comment
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `IDD Compliance Report - ${new Date().toLocaleDateString()}`,
              body: report,
              labels: ['report', 'automation', 'idd-metrics']
            });

  # Notify on IDD violations
  notify-violations:
    runs-on: ubuntu-latest
    name: Notify IDD Violations
    if: failure()
    steps:
      - name: Notify team of violations
        uses: actions/github-script@v7
        with:
          script: |
            console.log('IDD workflow failed - sending notifications');
            // Here you could integrate with Slack, Discord, or email notifications