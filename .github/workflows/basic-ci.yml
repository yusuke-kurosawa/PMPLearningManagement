name: 'Basic CI'

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ================================================================
  # ジョブ: 基本チェック
  # ================================================================
  basic-check:
    name: 'Basic Check'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Basic validation'
        run: |
          echo "✅ Repository checked out successfully"
          echo "✅ Basic CI check passed"