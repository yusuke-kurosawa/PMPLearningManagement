# ================================================================
# ワークフロー: Core CI/CD Pipeline
# カテゴリ: CI/CD
# 目的: メインの継続的インテグレーション・デプロイメント
# トリガー: push, pull_request
# 依存関係: Node.js, npm, ESLint, TypeScript
# 作成者: DevOps自動化システム
# 最終更新: 2025-08-14
# Issue: #88 - ESLint警告ゼロ達成とTypeScript完全移行
# ================================================================

name: '📦 Core CI/CD Pipeline'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # 毎週月曜日の午前6時

env:
  NODE_VERSION: '20'
  CACHE_VERSION: v1

jobs:
  # ================================================================
  # Stage 1: 再利用可能ワークフローによる統合チェック
  # ================================================================
  integrated-checks:
    name: 🔄 統合品質・ビルドチェック
    uses: ./.github/workflows/00-reusable-workflows.yml
    with:
      workflow-type: 'full'
      node-version: '20'
      skip-tests: false

  # ================================================================
  # Stage 2: Claude Code統合セキュリティスキャン
  # ================================================================
  claude-security-scan:
    name: 🤖 Claude統合セキュリティスキャン
    uses: ./.github/workflows/00-reusable-workflows.yml
    needs: integrated-checks
    with:
      workflow-type: 'security'
      node-version: '20'
      skip-tests: true

  # ================================================================
  # Stage 4: GitHub Pages デプロイ
  # ================================================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [integrated-checks, claude-security-scan]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for production
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pmp-learning.dev
          enable_jekyll: false

      - name: 🎯 Performance audit
        run: |
          if [ -f "scripts/lighthouse-audit.js" ]; then
            npm run audit:lighthouse
          fi

  # ================================================================
  # Stage 5: デプロイ後検証
  # ================================================================
  post-deploy-validation:
    name: ✅ Post-Deploy Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Health check
        run: |
          sleep 30  # Wait for deployment
          curl -f https://pmp-learning.dev || exit 1

      - name: 📊 Performance metrics
        run: |
          if [ -f "scripts/performance-metrics.js" ]; then
            npm run metrics:performance
          fi

      - name: 📢 Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful to https://pmp-learning.dev"