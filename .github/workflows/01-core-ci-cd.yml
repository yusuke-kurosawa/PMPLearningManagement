# ================================================================
# ワークフロー: Core CI/CD Pipeline
# カテゴリ: CI/CD
# 目的: メインの継続的インテグレーション・デプロイメント
# トリガー: push, pull_request
# 依存関係: Node.js, npm, ESLint, TypeScript
# 作成者: DevOps自動化システム
# 最終更新: 2025-08-14
# Issue: #88 - ESLint警告ゼロ達成とTypeScript完全移行
# ================================================================

name: '📦 Core CI/CD Pipeline'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # 毎週月曜日の午前6時

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  # ================================================================
  # Stage 1: コード品質チェック
  # ================================================================
  quality-checks:
    name: 🔍 Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 ESLint check
        run: npm run lint

      - name: 🔍 TypeScript check
        run: npm run type-check
        continue-on-error: true

      - name: 💎 Prettier check
        run: npm run format:check

      - name: 📊 Upload quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/
            coverage/

  # ================================================================
  # Stage 2: セキュリティ監査
  # ================================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level moderate

      - name: 🛡️ Security scan
        run: |
          if [ -f "scripts/security-audit.js" ]; then
            npm run security:audit
          fi

  # ================================================================
  # Stage 3: ビルドテスト
  # ================================================================
  build-test:
    name: 🏗️ Build Test
    runs-on: ubuntu-latest
    needs: [quality-checks, security-audit]
    outputs:
      build-success: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Run tests
        run: npm test

      - name: 🏗️ Build application
        id: build
        run: npm run build

      - name: 📋 Bundle analysis
        run: |
          if [ -f "scripts/analyze-bundle.js" ]; then
            npm run analyze:bundle
          fi

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # ================================================================
  # Stage 4: GitHub Pages デプロイ
  # ================================================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-test
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for production
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pmp-learning.dev
          enable_jekyll: false

      - name: 🎯 Performance audit
        run: |
          if [ -f "scripts/lighthouse-audit.js" ]; then
            npm run audit:lighthouse
          fi

  # ================================================================
  # Stage 5: デプロイ後検証
  # ================================================================
  post-deploy-validation:
    name: ✅ Post-Deploy Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Health check
        run: |
          sleep 30  # Wait for deployment
          curl -f https://pmp-learning.dev || exit 1

      - name: 📊 Performance metrics
        run: |
          if [ -f "scripts/performance-metrics.js" ]; then
            npm run metrics:performance
          fi

      - name: 📢 Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful to https://pmp-learning.dev"