name: Bundle Analysis & Optimization

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Weekly Monday 2AM
  workflow_dispatch:

jobs:
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for analysis
        run: npm run build
        env:
          NODE_ENV: production
          GENERATE_SOURCEMAP: false

      - name: Install bundle analyzer
        run: |
          npm install -g webpack-bundle-analyzer
          npm install --save-dev @bundle-analyzer/webpack-plugin
          npm install --save-dev bundlesize

      - name: Analyze bundle
        run: |
          echo "🔍 Analyzing bundle composition..."
          node ./scripts/analyze-bundle.js

      - name: Check bundle size limits
        run: |
          echo "📏 Checking bundle size limits..."
          node ./scripts/check-bundle-size.js

      - name: Generate optimization report
        run: |
          echo "📊 Generating optimization recommendations..."
          node ./scripts/generate-optimization-report.js

      - name: Upload bundle analysis
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: bundle-analysis-${{ github.run_id }}
          path: |
            ./bundle-analysis/
            ./dist/stats.json
            ./bundle-report.html

      - name: Comment PR with bundle analysis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = './bundle-analysis/bundle-summary.json';
            
            if (fs.existsSync(path)) {
              const analysis = JSON.parse(fs.readFileSync(path, 'utf8'));
              
              const comment = `## 📦 Bundle Analysis Report
              
              ### Bundle Size Summary
              - **Total Size**: ${analysis.totalSize}
              - **Gzipped Size**: ${analysis.gzippedSize}
              - **Change**: ${analysis.sizeChange} (${analysis.sizeChangePercent})
              
              ### Top Large Dependencies
              ${analysis.largeDependencies.map((dep, i) => 
                `${i + 1}. **${dep.name}**: ${dep.size} (${dep.percentage}%)`
              ).join('\\n')}
              
              ### Optimization Opportunities
              ${analysis.optimizations.map((opt, i) => 
                `${i + 1}. **${opt.type}**: ${opt.description} (${opt.potentialSaving})`
              ).join('\\n')}
              
              ### Recommendations
              ${analysis.recommendations.map((rec, i) => 
                `${i + 1}. ${rec}`
              ).join('\\n')}
              
              ${analysis.budgetStatus === 'exceeded' ? '⚠️ **Bundle size budget exceeded!**' : '✅ Bundle size within budget'}
              
              [View detailed analysis](${analysis.reportUrl})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  treeshaking-optimization:
    name: Tree Shaking Optimization
    runs-on: ubuntu-latest
    needs: bundle-analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install analysis tools
        run: |
          npm install -g webpack-unused
          npm install --save-dev unused-webpack-plugin
          npm install --save-dev duplicate-package-checker-webpack-plugin

      - name: Analyze unused code
        run: |
          echo "🔍 Analyzing unused code..."
          node ./scripts/analyze-unused-code.js

      - name: Check for duplicate dependencies
        run: |
          echo "🔍 Checking for duplicate dependencies..."
          node ./scripts/check-duplicate-dependencies.js

      - name: Generate tree shaking report
        run: |
          echo "🌳 Generating tree shaking optimization report..."
          node ./scripts/generate-treeshaking-report.js

      - name: Create optimization PR
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const reportPath = './bundle-analysis/treeshaking-report.json';
            
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              if (report.optimizationsFound > 0) {
                // Create a new branch for optimizations
                const branchName = `bundle-optimization-${Date.now()}`;
                
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/heads/${branchName}`,
                  sha: context.sha
                });
                
                console.log(`Created optimization branch: ${branchName}`);
              }
            }

  code-splitting-analysis:
    name: Code Splitting Analysis
    runs-on: ubuntu-latest
    needs: bundle-analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze code splitting opportunities
        run: |
          echo "✂️ Analyzing code splitting opportunities..."
          node ./scripts/analyze-code-splitting.js

      - name: Generate route-based splitting recommendations
        run: |
          echo "🛣️ Analyzing route-based splitting..."
          node ./scripts/analyze-route-splitting.js

      - name: Check lazy loading implementation
        run: |
          echo "⏰ Checking lazy loading implementation..."
          node ./scripts/check-lazy-loading.js

      - name: Upload code splitting analysis
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: code-splitting-analysis-${{ github.run_id }}
          path: ./code-splitting-analysis/

  performance-regression-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: [bundle-analysis, treeshaking-optimization, code-splitting-analysis]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Download analysis artifacts
        uses: actions/download-artifact@v3
        with:
          pattern: '*-analysis-*'
          merge-multiple: true
          path: ./analysis-results/

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'

      - name: Check for performance regressions
        run: |
          echo "📉 Checking for performance regressions..."
          node ./scripts/check-performance-regression.js

      - name: Generate final optimization report
        run: |
          echo "📋 Generating final optimization report..."
          node ./scripts/generate-final-report.js

      - name: Fail if critical regressions found
        run: |
          if [ -f "./analysis-results/critical-regressions.json" ]; then
            echo "❌ Critical performance regressions detected!"
            cat ./analysis-results/critical-regressions.json
            exit 1
          else
            echo "✅ No critical performance regressions detected"
          fi
