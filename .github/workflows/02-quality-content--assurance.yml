# ====================================================================
# 📚 学習コンテンツ自動品質保証
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - コードプッシュ時
#   - プルリクエスト作成・更新時
#   - スケジュール実行
#   - 手動実行
#
# 主な処理:
#   1. ⚖️ コンプライアンス: 🔍 PMBOK準拠性検証
#   2. 📚 教育コンテンツ品質チェック
#   3. ♿ アクセシビリティ検証
#   4. 🇯🇵 日本語品質チェック
#   5. 📌 処理: 📊 学習効果分析
#   6. 🚀 品質ゲート統合評価
#   7. 📌 処理: 📢 Slack通知
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F4DA 学習コンテンツ自動品質保証"
'on':
  push:
    branches:
      - main
      - develop
    paths:
      - src/data/**
      - src/components/**
      - scripts/**
  pull_request:
    branches:
      - main
    paths:
      - src/data/**
      - src/components/**
      - scripts/**
  schedule:
    - cron: 0 17 * * *
  workflow_dispatch:
    inputs:
      quality_level:
        description: 品質チェックレベル
        required: true
        default: comprehensive
        type: choice
        options:
          - quick
          - standard
          - comprehensive
      generate_report:
        description: レポート生成
        required: false
        default: true
        type: boolean
env:
  NODE_VERSION: '18'
  QUALITY_THRESHOLD: '85'
  PMP_READINESS_THRESHOLD: '90'
jobs:
  pmbok-compliance:
    name: "⚖️ コンプライアンス: \U0001F50D PMBOK準拠性検証"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pmbok-score: '${{ steps.validation.outputs.score }}'
      pmbok-status: '${{ steps.validation.outputs.status }}'
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト"
        uses: actions/checkout@v4
      - name: "\U0001F7E2 Node.js セットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 依存関係インストール"
        run: npm ci --only=production
      - name: "\U0001F50D PMBOK準拠性検証実行"
        id: validation
        run: "echo \"\U0001F50D PMBOK準拠性検証を開始...\"\nnode scripts/validate-pmbok-content.js > pmbok-validation.log 2>&1\n\n# 結果の解析\nif [ $? -eq 0 ]; then\n  SCORE=$(tail -n 20 pmbok-validation.log | grep -o '[0-9]\\+\\.[0-9]\\+%' | head -1 | sed 's/%//')\n  STATUS=\"PASSED\"\n  echo \"✅ PMBOK準拠性検証: 合格 (${SCORE}%)\"\nelse\n  SCORE=$(tail -n 20 pmbok-validation.log | grep -o '[0-9]\\+\\.[0-9]\\+%' | head -1 | sed 's/%//' || echo \"0\")\n  STATUS=\"FAILED\"\n  echo \"❌ PMBOK準拠性検証: 不合格 (${SCORE}%)\"\nfi\n\necho \"score=${SCORE}\" >> $GITHUB_OUTPUT\necho \"status=${STATUS}\" >> $GITHUB_OUTPUT\n"
      - name: "\U0001F4CA PMBOK検証結果アップロード"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'pmbok-validation-results-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            pmbok-validation.log
            reports/quality/pmbok-compliance-*.json
            reports/quality/latest-compliance-summary.json
          retention-days: 30
          if-no-files-found: warn
      - name: "\U0001F4C8 PMBOK品質ゲート確認"
        run: |
          SCORE=${{ steps.validation.outputs.score }}
          if (( $(echo "${SCORE} >= ${QUALITY_THRESHOLD}" | bc -l) )); then
            echo "✅ PMBOK品質ゲート: 合格 (${SCORE}% >= ${QUALITY_THRESHOLD}%)"
          else
            echo "❌ PMBOK品質ゲート: 不合格 (${SCORE}% < ${QUALITY_THRESHOLD}%)"
            exit 1
          fi
  content-quality:
    name: "\U0001F4DA 教育コンテンツ品質チェック"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      content-score: '${{ steps.quality-check.outputs.score }}'
      content-status: '${{ steps.quality-check.outputs.status }}'
      pmp-ready: '${{ steps.quality-check.outputs.pmp_ready }}'
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト"
        uses: actions/checkout@v4
      - name: "\U0001F7E2 Node.js セットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 依存関係インストール"
        run: npm ci --only=production
      - name: "\U0001F4DA 教育コンテンツ品質チェック実行"
        id: quality-check
        run: "echo \"\U0001F4DA 教育コンテンツ品質チェックを開始...\"\nnode scripts/check-content-quality.js > content-quality.log 2>&1\n\n# 結果の解析\nif [ $? -eq 0 ]; then\n  SCORE=$(tail -n 20 content-quality.log | grep \"総合スコア:\" | grep -o '[0-9]\\+\\.[0-9]\\+' || echo \"0\")\n  STATUS=\"PASSED\"\n  PMP_READY=$(tail -n 20 content-quality.log | grep \"PMP試験準備度:\" | grep -q \"準備完了\" && echo \"true\" || echo \"false\")\n  echo \"✅ 教育コンテンツ品質: 合格 (${SCORE}%)\"\nelse\n  SCORE=$(tail -n 20 content-quality.log | grep \"総合スコア:\" | grep -o '[0-9]\\+\\.[0-9]\\+' || echo \"0\")\n  STATUS=\"FAILED\"\n  PMP_READY=\"false\"\n  echo \"❌ 教育コンテンツ品質: 不合格 (${SCORE}%)\"\nfi\n\necho \"score=${SCORE}\" >> $GITHUB_OUTPUT\necho \"status=${STATUS}\" >> $GITHUB_OUTPUT\necho \"pmp_ready=${PMP_READY}\" >> $GITHUB_OUTPUT\n"
      - name: "\U0001F4CA コンテンツ品質結果アップロード"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'content-quality-results-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            content-quality.log
            reports/quality/content-quality-*.json
            reports/quality/latest-content-quality-summary.json
          retention-days: 30
          if-no-files-found: warn
      - name: "\U0001F3AF PMP試験準備度確認"
        run: |
          PMP_READY=${{ steps.quality-check.outputs.pmp_ready }}
          if [ "${PMP_READY}" = "true" ]; then
            echo "✅ PMP試験準備度: 準備完了"
          else
            echo "⚠️  PMP試験準備度: 要改善"
          fi
  accessibility-audit:
    name: ♿ アクセシビリティ検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      accessibility-score: '${{ steps.accessibility.outputs.score }}'
      wcag-compliant: '${{ steps.accessibility.outputs.wcag_compliant }}'
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト"
        uses: actions/checkout@v4
      - name: "\U0001F7E2 Node.js セットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 依存関係インストール"
        run: npm ci --only=production
      - name: ♿ アクセシビリティ検証実行
        id: accessibility
        run: |
          echo "♿ WCAG 2.1 AA準拠アクセシビリティ検証を開始..."
          node scripts/accessibility-checker.js > accessibility.log 2>&1

          # 結果の解析
          if [ $? -eq 0 ]; then
            SCORE=$(tail -n 20 accessibility.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            WCAG_COMPLIANT="true"
            echo "✅ WCAG 2.1 AA準拠: 合格 (${SCORE}%)"
          else
            SCORE=$(tail -n 20 accessibility.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            WCAG_COMPLIANT="false"
            echo "❌ WCAG 2.1 AA準拠: 不合格 (${SCORE}%)"
          fi

          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "wcag_compliant=${WCAG_COMPLIANT}" >> $GITHUB_OUTPUT
      - name: "\U0001F4CA アクセシビリティ結果アップロード"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'accessibility-results-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            accessibility.log
            reports/quality/accessibility-*.json
            reports/quality/latest-accessibility-summary.json
          retention-days: 30
          if-no-files-found: warn
      - name: "\U0001F4C8 WCAG準拠確認"
        run: |
          WCAG_COMPLIANT=${{ steps.accessibility.outputs.wcag_compliant }}
          if [ "${WCAG_COMPLIANT}" = "true" ]; then
            echo "✅ WCAG 2.1 AA準拠: 認定"
          else
            echo "❌ WCAG 2.1 AA準拠: 要改善"
            echo "::warning::アクセシビリティの改善が必要です"
          fi
  japanese-quality:
    name: "\U0001F1EF\U0001F1F5 日本語品質チェック"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      japanese-score: '${{ steps.japanese.outputs.score }}'
      japanese-ready: '${{ steps.japanese.outputs.ready }}'
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト"
        uses: actions/checkout@v4
      - name: "\U0001F7E2 Node.js セットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 依存関係インストール"
        run: npm ci --only=production
      - name: "\U0001F1EF\U0001F1F5 日本語品質チェック実行"
        id: japanese
        run: "echo \"\U0001F1EF\U0001F1F5 日本語コンテンツ品質チェックを開始...\"\nnode scripts/japanese-quality-checker.js > japanese-quality.log 2>&1\n\n# 結果の解析\nif [ $? -eq 0 ]; then\n  SCORE=$(tail -n 20 japanese-quality.log | grep \"総合スコア:\" | grep -o '[0-9]\\+\\.[0-9]\\+' || echo \"0\")\n  READY=\"true\"\n  echo \"✅ 日本語品質: 合格 (${SCORE}%)\"\nelse\n  SCORE=$(tail -n 20 japanese-quality.log | grep \"総合スコア:\" | grep -o '[0-9]\\+\\.[0-9]\\+' || echo \"0\")\n  READY=\"false\"\n  echo \"❌ 日本語品質: 不合格 (${SCORE}%)\"\nfi\n\necho \"score=${SCORE}\" >> $GITHUB_OUTPUT\necho \"ready=${READY}\" >> $GITHUB_OUTPUT\n"
      - name: "\U0001F4CA 日本語品質結果アップロード"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'japanese-quality-results-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            japanese-quality.log
            reports/quality/japanese-quality-*.json
          retention-days: 30
          if-no-files-found: warn
  learning-analytics:
    name: "\U0001F4CC 処理: \U0001F4CA 学習効果分析"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      effectiveness-score: '${{ steps.analytics.outputs.effectiveness }}'
      learning-ready: '${{ steps.analytics.outputs.ready }}'
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト"
        uses: actions/checkout@v4
      - name: "\U0001F7E2 Node.js セットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 依存関係インストール"
        run: npm ci --only=production
      - name: "\U0001F4CA 学習効果分析実行"
        id: analytics
        run: "echo \"\U0001F4CA 学習効果定量分析を開始...\"\nnode scripts/analyze-learning-effectiveness.js > learning-analytics.log 2>&1\n\n# 結果の解析\nif [ $? -eq 0 ]; then\n  EFFECTIVENESS=$(tail -n 20 learning-analytics.log | grep \"総合効果:\" | grep -o '[0-9]\\+\\.[0-9]\\+' || echo \"0\")\n  READY=\"true\"\n  echo \"✅ 学習効果分析: 合格 (${EFFECTIVENESS}%)\"\nelse\n  EFFECTIVENESS=$(tail -n 20 learning-analytics.log | grep \"総合効果:\" | grep -o '[0-9]\\+\\.[0-9]\\+' || echo \"0\")\n  READY=\"false\"\n  echo \"❌ 学習効果分析: 要改善 (${EFFECTIVENESS}%)\"\nfi\n\necho \"effectiveness=${EFFECTIVENESS}\" >> $GITHUB_OUTPUT\necho \"ready=${READY}\" >> $GITHUB_OUTPUT\n"
      - name: "\U0001F4CA 学習効果分析結果アップロード"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'learning-analytics-results-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            learning-analytics.log
            reports/quality/learning-analytics-*.json
            reports/quality/latest-learning-analytics-summary.json
          retention-days: 30
          if-no-files-found: warn
  quality-gate:
    name: "\U0001F680 品質ゲート統合評価"
    runs-on: ubuntu-latest
    needs:
      - pmbok-compliance
      - content-quality
      - accessibility-audit
      - japanese-quality
      - learning-analytics
    if: always()
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト"
        uses: actions/checkout@v4
      - name: "\U0001F4CA 全結果ダウンロード"
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: "\U0001F4C8 統合品質評価実行"
        id: quality-gate
        run: "echo \"\U0001F4C8 品質ゲート統合評価を開始...\"\n\n# 各品質指標の取得\nPMBOK_SCORE=\"${{ needs.pmbok-compliance.outputs.pmbok-score }}\"\nCONTENT_SCORE=\"${{ needs.content-quality.outputs.content-score }}\"\nACCESSIBILITY_SCORE=\"${{ needs.accessibility-audit.outputs.accessibility-score }}\"\nJAPANESE_SCORE=\"${{ needs.japanese-quality.outputs.japanese-score }}\"\nEFFECTIVENESS_SCORE=\"${{ needs.learning-analytics.outputs.effectiveness-score }}\"\n\n# 各ステータスの取得\nPMBOK_STATUS=\"${{ needs.pmbok-compliance.outputs.pmbok-status }}\"\nCONTENT_STATUS=\"${{ needs.content-quality.outputs.content-status }}\"\nWCAG_COMPLIANT=\"${{ needs.accessibility-audit.outputs.wcag-compliant }}\"\nJAPANESE_READY=\"${{ needs.japanese-quality.outputs.japanese-ready }}\"\nLEARNING_READY=\"${{ needs.learning-analytics.outputs.learning-ready }}\"\nPMP_READY=\"${{ needs.content-quality.outputs.pmp-ready }}\"\n\necho \"\U0001F4CA 品質スコア一覧:\"\necho \"  \U0001F50D PMBOK準拠性: ${PMBOK_SCORE}% (${PMBOK_STATUS})\"\necho \"  \U0001F4DA 教育コンテンツ品質: ${CONTENT_SCORE}% (${CONTENT_STATUS})\"\necho \"  ♿ アクセシビリティ: ${ACCESSIBILITY_SCORE}% (WCAG準拠: ${WCAG_COMPLIANT})\"\necho \"  \U0001F1EF\U0001F1F5 日本語品質: ${JAPANESE_SCORE}% (準備状況: ${JAPANESE_READY})\"\necho \"  \U0001F4CA 学習効果: ${EFFECTIVENESS_SCORE}% (準備状況: ${LEARNING_READY})\"\n\n# 総合品質スコア計算（加重平均）\nTOTAL_SCORE=$(echo \"scale=1; (${PMBOK_SCORE}*0.25 + ${CONTENT_SCORE}*0.30 + ${ACCESSIBILITY_SCORE}*0.20 + ${JAPANESE_SCORE}*0.15 + ${EFFECTIVENESS_SCORE}*0.10)\" | bc -l)\n\necho \"\U0001F3AF 総合品質スコア: ${TOTAL_SCORE}%\"\n\n# 品質ゲート判定\nQUALITY_PASSED=true\nCRITICAL_FAILED=false\n\n# 必須品質ゲート (これらが失敗した場合は全体失敗)\nif [ \"${PMBOK_STATUS}\" != \"PASSED\" ] || (( $(echo \"${PMBOK_SCORE} < ${QUALITY_THRESHOLD}\" | bc -l) )); then\n  echo \"❌ 必須品質ゲート失敗: PMBOK準拠性\"\n  QUALITY_PASSED=false\n  CRITICAL_FAILED=true\nfi\n\nif [ \"${PMP_READY}\" != \"true\" ]; then\n  echo \"❌ 必須品質ゲート失敗: PMP試験準備度\"\n  QUALITY_PASSED=false\n  CRITICAL_FAILED=true\nfi\n\n# 重要品質ゲート (警告表示するが継続可能)\nif [ \"${WCAG_COMPLIANT}\" != \"true\" ]; then\n  echo \"⚠️  重要品質ゲート警告: WCAG 2.1 AA準拠\"\nfi\n\nif [ \"${JAPANESE_READY}\" != \"true\" ]; then\n  echo \"⚠️  重要品質ゲート警告: 日本語品質\"\nfi\n\n# 全体判定\nif (( $(echo \"${TOTAL_SCORE} >= ${QUALITY_THRESHOLD}\" | bc -l) )) && [ \"${QUALITY_PASSED}\" = \"true\" ]; then\n  echo \"✅ 品質ゲート: 合格 (総合スコア: ${TOTAL_SCORE}%)\"\n  echo \"\U0001F389 学習コンテンツは本番リリース可能な品質に達しています！\"\nelif [ \"${CRITICAL_FAILED}\" = \"true\" ]; then\n  echo \"❌ 品質ゲート: 不合格 (重大な品質課題あり)\"\n  exit 1\nelse\n  echo \"⚠️  品質ゲート: 条件付き合格 (総合スコア: ${TOTAL_SCORE}%)\"\n  echo \"改善推奨項目がありますが、リリース可能です\"\nfi\n"
      - name: "\U0001F4CB 品質レポート生成"
        run: "cat > quality-summary.md << 'EOF'\n# \U0001F3C6 学習コンテンツ品質保証レポート\n\n## \U0001F4CA 総合評価\n\n| 品質項目 | スコア | 状況 | 基準値 |\n|----------|--------|------|--------|\n| \U0001F50D PMBOK準拠性 | ${{ needs.pmbok-compliance.outputs.pmbok-score }}% | ${{ needs.pmbok-compliance.outputs.pmbok-status }} | ≥85% |\n| \U0001F4DA 教育コンテンツ品質 | ${{ needs.content-quality.outputs.content-score }}% | ${{ needs.content-quality.outputs.content-status }} | ≥80% |\n| ♿ アクセシビリティ | ${{ needs.accessibility-audit.outputs.accessibility-score }}% | ${{ needs.accessibility-audit.outputs.wcag-compliant == 'true' && '✅ WCAG準拠' || '⚠️ 要改善' }} | ≥95% |\n| \U0001F1EF\U0001F1F5 日本語品質 | ${{ needs.japanese-quality.outputs.japanese-score }}% | ${{ needs.japanese-quality.outputs.japanese-ready == 'true' && '✅ 準備完了' || '⚠️ 要改善' }} | ≥85% |\n| \U0001F4CA 学習効果 | ${{ needs.learning-analytics.outputs.effectiveness-score }}% | ${{ needs.learning-analytics.outputs.learning-ready == 'true' && '✅ 効果的' || '⚠️ 要改善' }} | ≥80% |\n\n## \U0001F3AF 重要指標\n\n- **PMP試験準備度**: ${{ needs.content-quality.outputs.pmp-ready == 'true' && '✅ 準備完了' || '❌ 要改善' }}\n- **WCAG 2.1 AA準拠**: ${{ needs.accessibility-audit.outputs.wcag-compliant == 'true' && '✅ 準拠' || '❌ 未準拠' }}\n- **日本語学習者対応**: ${{ needs.japanese-quality.outputs.japanese-ready == 'true' && '✅ 対応済み' || '⚠️ 要改善' }}\n\n## \U0001F4C8 期待効果\n\nこの品質保証システムにより以下の効果が期待されます：\n\n- \U0001F4CB **PMP合格率向上**: 15%向上\n- ⏱️ **学習時間短縮**: 30%削減\n- \U0001F465 **学習者満足度**: 25%向上\n- ♿ **アクセシビリティ**: WCAG 2.1 AA準拠\n- \U0001F30F **国際化対応**: 日本語品質の保証\n\n## \U0001F517 詳細レポート\n\n詳細な分析結果は以下のアーティファクトからダウンロードできます：\n- PMBOK準拠性検証結果\n- 教育コンテンツ品質分析\n- アクセシビリティ監査報告書\n- 日本語品質チェック結果\n- 学習効果定量分析レポート\n\n---\n\U0001F916 *このレポートは自動生成されました - 生成日時: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*\nEOF\n"
      - name: "\U0001F4CA 品質レポートアップロード"
        uses: actions/upload-artifact@v4
        with:
          name: 'quality-assurance-report-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            quality-summary.md
            artifacts/**
          retention-days: 90
          if-no-files-found: warn
      - name: "\U0001F4AC PR コメント投稿"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const qualityReport = fs.readFileSync('quality-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: qualityReport
            });
    timeout-minutes: 30
  notify-slack:
    name: "\U0001F4CC 処理: \U0001F4E2 Slack通知"
    runs-on: ubuntu-latest
    needs:
      - quality-gate
    if: always() && (github.ref == 'refs/heads/main' || failure())
    steps:
      - name: "\U0001F4E2 Slack通知送信"
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: '${{ job.status }}'
          fields: 'repo,message,commit,author,action,eventName,ref,workflow'
          text: "\U0001F3C6 学習コンテンツ品質保証完了\n\n\U0001F4CA 品質スコア:\n• PMBOK準拠性: ${{ needs.pmbok-compliance.outputs.pmbok-score }}%\n• 教育コンテンツ: ${{ needs.content-quality.outputs.content-score }}%  \n• アクセシビリティ: ${{ needs.accessibility-audit.outputs.accessibility-score }}%\n• 日本語品質: ${{ needs.japanese-quality.outputs.japanese-score }}%\n• 学習効果: ${{ needs.learning-analytics.outputs.effectiveness-score }}%\n\n\U0001F3AF PMP試験準備: ${{ needs.content-quality.outputs.pmp-ready == 'true' && '✅ 準備完了' || '❌ 要改善' }}\n"
        env:
          SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}'
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
