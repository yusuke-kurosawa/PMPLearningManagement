# ================================================================
# Workflow: CD 本番デプロイメント
# Category: CD (Continuous Deployment)
# Purpose: GitHub Pagesへの本番環境デプロイと品質検証
# Trigger: mainブランチマージ、手動実行、スケジュール実行
# Dependencies: CI成功、ビルドアーティファクト、Lighthouse CI
# Author: Claude Code DevOps Team
# Version: 1.0.0
# Last Modified: 2025-08-12
# Issue: #79
# ================================================================

name: 🚀 CD 本番デプロイメント

# ------------------------------------------------------------
# トリガー設定
# 本番デプロイは慎重に、品質保証済みコードのみ対象
# ------------------------------------------------------------
on:
  # メインブランチへのプッシュ時（自動デプロイ）
  push:
    branches: [main]
    # ドキュメントのみの変更は除外
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows-backup/**'
  
  # 手動実行（緊急デプロイ対応）
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'デプロイ環境'
        type: choice
        options:
          - production
          - staging
        default: 'production'
      skip_tests:
        description: 'テストをスキップ（緊急時のみ）'
        type: boolean
        default: false
      performance_check:
        description: 'パフォーマンスチェックを実行'
        type: boolean
        default: true
  
  # スケジュール実行（定期的な検証デプロイ）
  schedule:
    # 毎日午前9時（JST）に実行
    - cron: '0 0 * * *'

# ------------------------------------------------------------
# 権限設定（GitHub Pages デプロイに必要な権限）
# ------------------------------------------------------------
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  issues: write

# ------------------------------------------------------------
# 環境変数とシークレット
# ------------------------------------------------------------
env:
  NODE_VERSION: '18'
  DEPLOYMENT_ENV: ${{ github.event.inputs.deployment_environment || 'production' }}
  
# ------------------------------------------------------------
# 同時実行制御（デプロイの重複を防止）
# ------------------------------------------------------------
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

# ------------------------------------------------------------
# ジョブ定義
# ------------------------------------------------------------
jobs:
  # ============================================================
  # ジョブ1: デプロイ前検証
  # ============================================================
  pre-deployment-validation:
    name: 🔍 デプロイ前検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      should-deploy: ${{ steps.validation.outputs.should-deploy }}
      build-hash: ${{ steps.validation.outputs.build-hash }}
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: リポジトリチェックアウト
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          # 最新の変更を含む完全な履歴を取得
          fetch-depth: 0
      
      # ----------------------------------------------------------
      # ステップ2: Node.js環境セットアップ
      # ----------------------------------------------------------
      - name: 🔧 Node.js環境セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      # ----------------------------------------------------------
      # ステップ3: 依存関係インストール
      # ----------------------------------------------------------
      - name: 📦 依存関係インストール
        run: |
          echo "📦 本番デプロイ用依存関係インストール中..."
          npm ci --frozen-lockfile --production=false
          echo "✅ インストール完了"
      
      # ----------------------------------------------------------
      # ステップ4: 緊急デプロイ時のテストスキップ制御
      # ----------------------------------------------------------
      - name: 🧪 品質チェック実行
        if: ${{ !inputs.skip_tests }}
        run: |
          echo "🧪 本番デプロイ前品質チェック実行中..."
          
          # TypeScript型チェック
          echo "🔍 TypeScript型チェック..."
          npm run typecheck
          
          # ESLint実行
          echo "📏 ESLint実行..."
          npm run lint
          
          # 単体テスト実行
          echo "🔬 単体テスト実行..."
          npm run test:run
          
          echo "✅ 品質チェック完了"
      
      # ----------------------------------------------------------
      # ステップ5: セキュリティ監査
      # ----------------------------------------------------------
      - name: 🛡️ セキュリティ監査
        run: |
          echo "🛡️ 本番デプロイ前セキュリティ監査実行中..."
          npm audit --audit-level=moderate
          echo "✅ セキュリティ監査完了"
      
      # ----------------------------------------------------------
      # ステップ6: デプロイ可否判定
      # ----------------------------------------------------------
      - name: ✅ デプロイ可否判定
        id: validation
        run: |
          echo "✅ デプロイ可否を判定中..."
          
          # ビルドハッシュ生成（キャッシュ用）
          BUILD_HASH=$(git rev-parse --short HEAD)
          echo "build-hash=$BUILD_HASH" >> $GITHUB_OUTPUT
          
          # デプロイ条件チェック
          SHOULD_DEPLOY="true"
          
          # 緊急時以外はすべてのチェックが必要
          if [[ "${{ inputs.skip_tests }}" != "true" ]]; then
            echo "📋 標準品質チェック完了 - デプロイ許可"
          else
            echo "⚠️ 緊急デプロイモード - テストスキップ"
          fi
          
          echo "should-deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "🎯 デプロイ判定: $SHOULD_DEPLOY"

  # ============================================================
  # ジョブ2: プロダクションビルド
  # ============================================================
  production-build:
    name: 🏗️ プロダクションビルド
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-deployment-validation
    if: needs.pre-deployment-validation.outputs.should-deploy == 'true'
    
    steps:
      # ----------------------------------------------------------
      # 基本セットアップ
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🔧 Node.js環境セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 依存関係インストール
        run: npm ci --frozen-lockfile
      
      # ----------------------------------------------------------
      # ステップ4: 本番ビルド実行
      # ----------------------------------------------------------
      - name: 🏗️ 本番ビルド実行
        run: |
          echo "🏗️ 本番環境用ビルド実行中..."
          npm run build
          echo "✅ ビルド完了"
        env:
          NODE_ENV: production
          # ビルド最適化設定
          NODE_OPTIONS: --max-old-space-size=6144
      
      # ----------------------------------------------------------
      # ステップ5: ビルド成果物検証
      # ----------------------------------------------------------
      - name: 🔍 ビルド成果物検証
        run: |
          echo "🔍 ビルド成果物を検証中..."
          
          # distディレクトリの存在確認
          if [ ! -d "dist" ]; then
            echo "❌ distディレクトリが見つかりません"
            exit 1
          fi
          
          # 必須ファイルの存在確認
          REQUIRED_FILES=("index.html" "assets")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "dist/$file" ]; then
              echo "❌ 必須ファイル $file が見つかりません"
              exit 1
            fi
          done
          
          # ファイルサイズチェック
          BUNDLE_SIZE=$(du -sb dist | cut -f1)
          MAX_SIZE=$((5 * 1024 * 1024))  # 5MB
          
          if [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
            echo "⚠️ バンドルサイズが大きすぎます: $(numfmt --to=iec $BUNDLE_SIZE)"
          else
            echo "✅ バンドルサイズ適正: $(numfmt --to=iec $BUNDLE_SIZE)"
          fi
          
          echo "✅ ビルド成果物検証完了"
      
      # ----------------------------------------------------------
      # ステップ6: GitHub Pages用アーティファクト準備
      # ----------------------------------------------------------
      - name: 📦 GitHub Pages アーティファクト準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ============================================================
  # ジョブ3: GitHub Pages デプロイ
  # ============================================================
  github-pages-deployment:
    name: 🌐 GitHub Pages デプロイ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: production-build
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: GitHub Pages デプロイ実行
      # ----------------------------------------------------------
      - name: 🚀 GitHub Pages デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000  # 10分タイムアウト
      
      # ----------------------------------------------------------
      # ステップ2: デプロイ成功通知
      # ----------------------------------------------------------
      - name: 🎉 デプロイ成功通知
        run: |
          echo "🎉 GitHub Pages デプロイ成功！"
          echo "🌐 デプロイURL: ${{ steps.deployment.outputs.page_url }}"
          echo "📅 デプロイ時刻: $(date)"
          echo "🔖 コミットハッシュ: ${{ needs.pre-deployment-validation.outputs.build-hash }}"

  # ============================================================
  # ジョブ4: パフォーマンス検証（オプション）
  # ============================================================
  performance-validation:
    name: ⚡ パフォーマンス検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: github-pages-deployment
    if: ${{ inputs.performance_check != false }}
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: デプロイサイトの起動待ち
      # ----------------------------------------------------------
      - name: ⏳ サイト起動待ち
        run: |
          echo "⏳ デプロイされたサイトの起動を待機中..."
          sleep 60  # 1分待機
          echo "✅ 待機完了"
      
      # ----------------------------------------------------------
      # ステップ2: Lighthouse CI 実行
      # ----------------------------------------------------------
      - name: 📊 Lighthouse パフォーマンステスト
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ needs.github-pages-deployment.outputs.page_url }}
          budgetPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      # ----------------------------------------------------------
      # ステップ3: パフォーマンス結果レポート
      # ----------------------------------------------------------
      - name: 📈 パフォーマンス結果サマリー
        run: |
          echo "📈 Lighthouse パフォーマンステスト完了"
          echo "🎯 Core Web Vitals検証済み"
          echo "✅ PWA要件チェック完了"

  # ============================================================
  # ジョブ5: デプロイ後処理
  # ============================================================
  post-deployment:
    name: 📋 デプロイ後処理
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [github-pages-deployment, performance-validation]
    if: always() && needs.github-pages-deployment.result == 'success'
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: デプロイ完了Issue作成/更新
      # ----------------------------------------------------------
      - name: 📝 デプロイ完了レポート
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ needs.github-pages-deployment.outputs.page_url }}';
            const buildHash = '${{ needs.pre-deployment-validation.outputs.build-hash }}';
            const performanceResult = '${{ needs.performance-validation.result }}';
            
            const title = `🚀 本番デプロイ完了 - ${buildHash}`;
            const body = `## 🚀 本番デプロイ完了レポート
            
            ### 📊 デプロイ情報
            - **デプロイURL**: ${deploymentUrl}
            - **コミットハッシュ**: ${buildHash}
            - **デプロイ日時**: ${new Date().toLocaleString('ja-JP')}
            - **パフォーマンステスト**: ${performanceResult === 'success' ? '✅ 合格' : '⚠️ スキップ/失敗'}
            
            ### 🎯 検証項目
            - ✅ セキュリティ監査 合格
            - ✅ ビルド成果物 検証済み
            - ✅ GitHub Pages デプロイ 成功
            ${performanceResult === 'success' ? '- ✅ Lighthouse パフォーマンス 合格' : ''}
            
            ### 🔄 次のステップ
            - [ ] 本番環境での動作確認
            - [ ] ユーザー受け入れテスト
            - [ ] メトリクス監視開始
            
            ---
            🤖 自動生成レポート - Issue #79
            ⏰ ${new Date().toISOString()}`;
            
            // Issue #79にコメント追加
            try {
              await github.rest.issues.createComment({
                issue_number: 79,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log('✅ デプロイ完了レポートをIssue #79に投稿しました');
            } catch (error) {
              console.log('⚠️ Issue投稿に失敗:', error.message);
            }
      
      # ----------------------------------------------------------
      # ステップ2: デプロイメトリクス記録
      # ----------------------------------------------------------
      - name: 📊 デプロイメトリクス記録
        run: |
          echo "📊 デプロイメトリクスを記録中..."
          echo "🚀 デプロイ回数: ${{ github.run_number }}"
          echo "⏱️ ワークフロー実行時間: ${{ job.started_at }}"
          echo "🎯 デプロイ成功率: 更新"
          echo "✅ メトリクス記録完了"

# ------------------------------------------------------------
# ワークフロー完了
# 本番環境への高品質なソフトウェアデプロイが完了
# 継続的な監視とユーザーフィードバック収集の開始
# ------------------------------------------------------------