# ====================================================================
# 世界No.1 DevOps実践ベンチマーク検証パイプライン
# ====================================================================
# 目的: 実装されたDevOps実践がグローバルベンチマークを達成し、
#      業界リーダーシップを確立していることを検証する
# 
# 実行タイミング:
#   - 月次実行（第1日曜日）
#   - 四半期レビュー（1,4,7,10月）
#   - 手動実行（DevOps成熟度評価）
#   - メジャーリリース後
#
# 主な処理:
#   1. DevOps Four Key Metricsの計測と業界比較
#   2. DORA State of DevOps基準との照合
#   3. 技術的卓越性指標の評価
#   4. 組織的成熟度アセスメント
#   5. 持続可能性・ESG指標の測定
#   6. グローバルベンチマーク達成証明書の生成
# ====================================================================

name: 🏆 World-Class DevOps Benchmark Verification

on:
  schedule:
    # First Sunday of each month at 09:00 JST
    - cron: '0 0 1-7 * 0'
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark assessment type'
        required: true
        default: 'comprehensive'
        type: choice
        options:
        - comprehensive
        - technical-only
        - organizational-only
        - sustainability-focus
      comparison_year:
        description: 'Year for industry comparison'
        required: true
        default: '2024'
        type: string

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

env:
  BENCHMARK_VERSION: '2024.3'
  DORA_METRICS_STANDARD: 'elite'
  INDUSTRY_PERCENTILE_TARGET: 95

jobs:
  # DORA Four Key Metrics Assessment
  dora-four-key-metrics:
    name: 🎯 DORA Four Key Metrics Assessment
    runs-on: ubuntu-latest
    outputs:
      deployment_frequency_score: ${{ steps.calculate-dora.outputs.deployment_frequency_score }}
      lead_time_score: ${{ steps.calculate-dora.outputs.lead_time_score }}
      mttr_score: ${{ steps.calculate-dora.outputs.mttr_score }}
      change_failure_score: ${{ steps.calculate-dora.outputs.change_failure_score }}
      overall_dora_rating: ${{ steps.calculate-dora.outputs.overall_rating }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          
      - name: Setup Python for Analytics
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Analysis Dependencies
        run: |
          pip install pandas numpy matplotlib seaborn requests python-dateutil PyGithub
          
      - name: Calculate DORA Four Key Metrics
        id: calculate-dora
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > dora_metrics_calculator.py
          #!/usr/bin/env python3
          import os
          import requests
          import json
          import pandas as pd
          from datetime import datetime, timedelta
          from github import Github
          
          def calculate_dora_metrics():
              """Calculate DORA Four Key Metrics with industry benchmarking"""
              
              # Initialize GitHub client
              g = Github(os.environ['GITHUB_TOKEN'])
              repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
              
              # Time range: last 90 days
              end_date = datetime.now()
              start_date = end_date - timedelta(days=90)
              
              print("🔍 Analyzing DORA Four Key Metrics...")
              
              # 1. Deployment Frequency
              workflows = repo.get_workflows()
              deploy_runs = []
              
              for workflow in workflows:
                  if 'deploy' in workflow.name.lower() or 'production' in workflow.name.lower():
                      runs = workflow.get_runs(created=f">{start_date.isoformat()}")
                      for run in runs:
                          if run.conclusion == 'success':
                              deploy_runs.append(run.created_at)
              
              # Calculate deployment frequency per day
              days_in_period = (end_date - start_date).days
              deployment_frequency = len(deploy_runs) / days_in_period if days_in_period > 0 else 0
              
              # 2. Lead Time for Changes
              pulls = repo.get_pulls(state='closed', sort='updated', direction='desc')
              lead_times = []
              
              for pr in pulls:
                  if pr.merged and pr.created_at >= start_date:
                      # Lead time = time from first commit to merge
                      commits = list(pr.get_commits())
                      if commits:
                          first_commit_date = commits[0].commit.author.date
                          lead_time_hours = (pr.merged_at - first_commit_date).total_seconds() / 3600
                          lead_times.append(lead_time_hours)
                          
                      if len(lead_times) >= 50:  # Limit sample size
                          break
              
              avg_lead_time_hours = sum(lead_times) / len(lead_times) if lead_times else 0
              
              # 3. Mean Time to Recovery (MTTR)
              issues = repo.get_issues(state='closed', labels=['bug', 'hotfix', 'critical'])
              recovery_times = []
              
              for issue in issues:
                  if issue.created_at >= start_date and issue.closed_at:
                      recovery_time_hours = (issue.closed_at - issue.created_at).total_seconds() / 3600
                      recovery_times.append(recovery_time_hours)
                      
                      if len(recovery_times) >= 30:
                          break
              
              avg_mttr_hours = sum(recovery_times) / len(recovery_times) if recovery_times else 0
              
              # 4. Change Failure Rate
              recent_deploys = [run for run in deploy_runs if run >= start_date]
              failed_deploys = 0
              
              for workflow in workflows:
                  if 'deploy' in workflow.name.lower():
                      runs = workflow.get_runs(created=f">{start_date.isoformat()}")
                      for run in runs:
                          if run.conclusion == 'failure':
                              failed_deploys += 1
              
              total_deploys = len(recent_deploys)
              change_failure_rate = (failed_deploys / total_deploys * 100) if total_deploys > 0 else 0
              
              # DORA Elite Performance Benchmarks
              elite_benchmarks = {
                  'deployment_frequency': {'elite': 1.0, 'high': 0.5, 'medium': 0.1},  # per day
                  'lead_time_hours': {'elite': 24, 'high': 168, 'medium': 720},  # hours
                  'mttr_hours': {'elite': 1, 'high': 24, 'medium': 168},  # hours
                  'change_failure_rate': {'elite': 15, 'high': 20, 'medium': 30}  # percentage
              }
              
              # Calculate scores (0-100)
              def calculate_score(value, benchmarks, reverse=False):
                  if reverse:  # Lower is better (lead time, MTTR, failure rate)
                      if value <= benchmarks['elite']:
                          return 100
                      elif value <= benchmarks['high']:
                          return 85
                      elif value <= benchmarks['medium']:
                          return 70
                      else:
                          return max(0, 50 - (value - benchmarks['medium']) / benchmarks['medium'] * 30)
                  else:  # Higher is better (deployment frequency)
                      if value >= benchmarks['elite']:
                          return 100
                      elif value >= benchmarks['high']:
                          return 85
                      elif value >= benchmarks['medium']:
                          return 70
                      else:
                          return max(0, 50 - (benchmarks['medium'] - value) / benchmarks['medium'] * 30)
              
              deployment_frequency_score = calculate_score(deployment_frequency, elite_benchmarks['deployment_frequency'])
              lead_time_score = calculate_score(avg_lead_time_hours, elite_benchmarks['lead_time_hours'], reverse=True)
              mttr_score = calculate_score(avg_mttr_hours, elite_benchmarks['mttr_hours'], reverse=True)
              change_failure_score = calculate_score(change_failure_rate, elite_benchmarks['change_failure_rate'], reverse=True)
              
              overall_score = (deployment_frequency_score + lead_time_score + mttr_score + change_failure_score) / 4
              
              # Determine DORA rating
              if overall_score >= 90:
                  rating = "ELITE"
              elif overall_score >= 75:
                  rating = "HIGH"
              elif overall_score >= 60:
                  rating = "MEDIUM"
              else:
                  rating = "LOW"
              
              # Generate detailed report
              report = {
                  'metrics': {
                      'deployment_frequency_per_day': round(deployment_frequency, 3),
                      'lead_time_hours': round(avg_lead_time_hours, 2),
                      'mttr_hours': round(avg_mttr_hours, 2),
                      'change_failure_rate_percent': round(change_failure_rate, 2)
                  },
                  'scores': {
                      'deployment_frequency': round(deployment_frequency_score, 1),
                      'lead_time': round(lead_time_score, 1),
                      'mttr': round(mttr_score, 1),
                      'change_failure': round(change_failure_score, 1),
                      'overall': round(overall_score, 1)
                  },
                  'rating': rating,
                  'period': f"{start_date.strftime('%Y-%m-%d')} to {end_date.strftime('%Y-%m-%d')}",
                  'analysis_timestamp': datetime.now().isoformat()
              }
              
              # Save detailed report
              with open('dora_metrics_report.json', 'w') as f:
                  json.dump(report, f, indent=2)
              
              # Output for GitHub Actions
              print(f"deployment_frequency_score={deployment_frequency_score}")
              print(f"lead_time_score={lead_time_score}")
              print(f"mttr_score={mttr_score}")
              print(f"change_failure_score={change_failure_score}")
              print(f"overall_rating={rating}")
              
              print(f"\n🎯 DORA Four Key Metrics Results:")
              print(f"• Deployment Frequency: {deployment_frequency:.3f}/day (Score: {deployment_frequency_score:.1f})")
              print(f"• Lead Time: {avg_lead_time_hours:.2f}h (Score: {lead_time_score:.1f})")
              print(f"• MTTR: {avg_mttr_hours:.2f}h (Score: {mttr_score:.1f})")
              print(f"• Change Failure Rate: {change_failure_rate:.2f}% (Score: {change_failure_score:.1f})")
              print(f"• Overall DORA Rating: {rating} ({overall_score:.1f}/100)")
              
              return report
          
          if __name__ == "__main__":
              calculate_dora_metrics()
          EOF
          
          python dora_metrics_calculator.py >> $GITHUB_OUTPUT
          
      - name: Upload DORA Metrics Report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: dora-metrics-report
          path: dora_metrics_report.json
          retention-days: 90

  # Technical Excellence Assessment
  technical-excellence:
    name: 🔧 Technical Excellence Benchmark
    runs-on: ubuntu-latest
    outputs:
      automation_score: ${{ steps.tech-assessment.outputs.automation_score }}
      architecture_score: ${{ steps.tech-assessment.outputs.architecture_score }}
      security_score: ${{ steps.tech-assessment.outputs.security_score }}
      performance_score: ${{ steps.tech-assessment.outputs.performance_score }}
      overall_tech_score: ${{ steps.tech-assessment.outputs.overall_tech_score }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          
      - name: Technical Excellence Assessment
        id: tech-assessment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > technical_excellence_assessment.py
          #!/usr/bin/env python3
          import os
          import json
          import subprocess
          from pathlib import Path
          from datetime import datetime
          
          def assess_technical_excellence():
              """Comprehensive technical excellence benchmark assessment"""
              
              print("🔧 Assessing Technical Excellence...")
              
              scores = {}
              
              # 1. Infrastructure as Code Coverage
              iac_files = list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml'))
              workflow_files = [f for f in iac_files if '.github/workflows' in str(f)]
              
              advanced_workflows = [
                  'quantum-cicd.yml',
                  'chaos-engineering.yml', 
                  'edge-wasm-optimization.yml',
                  'ai-monitoring-analytics.yml',
                  'multicloud-kubernetes.yml',
                  'green-devops-esg.yml',
                  'developer-experience-culture.yml',
                  'compliance-governance-automation.yml'
              ]
              
              implemented_workflows = sum(1 for wf in advanced_workflows if any(str(wf) in str(f) for f in workflow_files))
              automation_score = (implemented_workflows / len(advanced_workflows)) * 100
              
              # 2. Architecture Modernization Score
              architecture_indicators = {
                  'containerization': any(f.name == 'Dockerfile' for f in Path('.').rglob('*')),
                  'kubernetes': any('kubernetes' in f.name.lower() for f in Path('.').rglob('*')),
                  'microservices': any('service' in f.name.lower() for f in Path('.').rglob('*')),
                  'api_first': any('api' in f.name.lower() for f in Path('.').rglob('*')),
                  'event_driven': any('event' in f.name.lower() or 'message' in f.name.lower() for f in Path('.').rglob('*')),
                  'observability': any('monitoring' in f.name.lower() or 'metrics' in f.name.lower() for f in Path('.').rglob('*')),
                  'edge_computing': any('edge' in str(f).lower() for f in workflow_files),
                  'serverless': any('serverless' in str(f).lower() or 'lambda' in str(f).lower() for f in workflow_files)
              }
              
              architecture_score = (sum(architecture_indicators.values()) / len(architecture_indicators)) * 100
              
              # 3. Security Integration Score
              security_indicators = {
                  'secrets_scanning': any('secret' in str(f).lower() for f in workflow_files),
                  'vulnerability_scanning': any('security' in str(f).lower() for f in workflow_files),
                  'compliance_automation': any('compliance' in str(f).lower() for f in workflow_files),
                  'policy_as_code': any('policy' in str(f).lower() or 'opa' in str(f).lower() for f in workflow_files),
                  'secure_supply_chain': any('supply' in str(f).lower() or 'sbom' in str(f).lower() for f in workflow_files),
                  'runtime_security': any('runtime' in str(f).lower() for f in workflow_files),
                  'zero_trust': any('zero-trust' in str(f).lower() for f in workflow_files),
                  'threat_modeling': any('threat' in str(f).lower() for f in workflow_files)
              }
              
              security_score = (sum(security_indicators.values()) / len(security_indicators)) * 100
              
              # 4. Performance Engineering Score
              performance_indicators = {
                  'performance_testing': any('performance' in str(f).lower() for f in workflow_files),
                  'load_testing': any('load' in str(f).lower() for f in workflow_files),
                  'chaos_engineering': any('chaos' in str(f).lower() for f in workflow_files),
                  'observability': any('monitoring' in str(f).lower() for f in workflow_files),
                  'edge_optimization': any('edge' in str(f).lower() for f in workflow_files),
                  'caching_strategy': any('cache' in str(f).lower() for f in workflow_files),
                  'cdn_optimization': any('cdn' in str(f).lower() for f in workflow_files),
                  'wasm_optimization': any('wasm' in str(f).lower() or 'webassembly' in str(f).lower() for f in workflow_files)
              }
              
              performance_score = (sum(performance_indicators.values()) / len(performance_indicators)) * 100
              
              # Calculate overall technical score
              overall_tech_score = (automation_score + architecture_score + security_score + performance_score) / 4
              
              # Generate assessment report
              assessment = {
                  'automation': {
                      'score': round(automation_score, 1),
                      'implemented_workflows': implemented_workflows,
                      'total_workflows': len(advanced_workflows),
                      'coverage_percent': round((implemented_workflows / len(advanced_workflows)) * 100, 1)
                  },
                  'architecture': {
                      'score': round(architecture_score, 1),
                      'indicators': architecture_indicators,
                      'modernization_level': 'cutting-edge' if architecture_score >= 80 else 'advanced' if architecture_score >= 60 else 'moderate'
                  },
                  'security': {
                      'score': round(security_score, 1),
                      'indicators': security_indicators,
                      'security_posture': 'world-class' if security_score >= 80 else 'strong' if security_score >= 60 else 'baseline'
                  },
                  'performance': {
                      'score': round(performance_score, 1),
                      'indicators': performance_indicators,
                      'optimization_level': 'elite' if performance_score >= 80 else 'high' if performance_score >= 60 else 'standard'
                  },
                  'overall': {
                      'score': round(overall_tech_score, 1),
                      'rating': 'WORLD_CLASS' if overall_tech_score >= 85 else 'ELITE' if overall_tech_score >= 75 else 'HIGH_PERFORMING'
                  },
                  'assessment_timestamp': datetime.now().isoformat()
              }
              
              # Save assessment report
              with open('technical_excellence_report.json', 'w') as f:
                  json.dump(assessment, f, indent=2)
              
              # Output for GitHub Actions
              print(f"automation_score={automation_score}")
              print(f"architecture_score={architecture_score}")
              print(f"security_score={security_score}")
              print(f"performance_score={performance_score}")
              print(f"overall_tech_score={overall_tech_score}")
              
              print(f"\n🔧 Technical Excellence Assessment:")
              print(f"• Automation Coverage: {automation_score:.1f}% ({implemented_workflows}/{len(advanced_workflows)} workflows)")
              print(f"• Architecture Modernization: {architecture_score:.1f}%")
              print(f"• Security Integration: {security_score:.1f}%")  
              print(f"• Performance Engineering: {performance_score:.1f}%")
              print(f"• Overall Technical Score: {overall_tech_score:.1f}/100")
              print(f"• Technical Rating: {assessment['overall']['rating']}")
              
              return assessment
          
          if __name__ == "__main__":
              assess_technical_excellence()
          EOF
          
          python technical_excellence_assessment.py >> $GITHUB_OUTPUT
          
      - name: Upload Technical Excellence Report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: technical-excellence-report
          path: technical_excellence_report.json
          retention-days: 90

  # Organizational Maturity Assessment
  organizational-maturity:
    name: 👥 Organizational DevOps Maturity
    runs-on: ubuntu-latest
    outputs:
      culture_score: ${{ steps.org-assessment.outputs.culture_score }}
      collaboration_score: ${{ steps.org-assessment.outputs.collaboration_score }}
      learning_score: ${{ steps.org-assessment.outputs.learning_score }}
      innovation_score: ${{ steps.org-assessment.outputs.innovation_score }}
      overall_org_score: ${{ steps.org-assessment.outputs.overall_org_score }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          
      - name: Organizational Maturity Assessment
        id: org-assessment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > organizational_maturity_assessment.py
          #!/usr/bin/env python3
          import os
          import json
          import subprocess
          from datetime import datetime, timedelta
          from github import Github
          
          def assess_organizational_maturity():
              """Assess organizational DevOps maturity and culture"""
              
              print("👥 Assessing Organizational DevOps Maturity...")
              
              g = Github(os.environ['GITHUB_TOKEN'])
              repo = g.get_repo(os.environ['GITHUB_REPOSITORY'])
              
              # Time range for analysis
              end_date = datetime.now()
              start_date = end_date - timedelta(days=90)
              
              # 1. Culture & Collaboration Score
              # Measure PR collaboration patterns
              pulls = list(repo.get_pulls(state='all', sort='updated', direction='desc'))
              recent_pulls = [pr for pr in pulls if pr.created_at >= start_date]
              
              collaboration_indicators = {
                  'cross_team_reviews': 0,
                  'knowledge_sharing_comments': 0,
                  'constructive_feedback': 0,
                  'pair_programming_evidence': 0
              }
              
              for pr in recent_pulls[:50]:  # Limit to recent PRs
                  reviews = list(pr.get_reviews())
                  comments = list(pr.get_review_comments()) + list(pr.get_issue_comments())
                  
                  # Count cross-team collaboration
                  if len(reviews) >= 2:
                      collaboration_indicators['cross_team_reviews'] += 1
                  
                  # Count knowledge sharing comments (educational/explanatory)
                  educational_keywords = ['learn', 'understand', 'explain', 'teach', 'share', 'knowledge']
                  for comment in comments:
                      if any(keyword in comment.body.lower() for keyword in educational_keywords):
                          collaboration_indicators['knowledge_sharing_comments'] += 1
              
              culture_score = min(100, (collaboration_indicators['cross_team_reviews'] / max(1, len(recent_pulls))) * 100)
              collaboration_score = min(100, collaboration_indicators['knowledge_sharing_comments'] * 2)  # Scale up
              
              # 2. Learning & Growth Score
              # Measure documentation, experimentation, and improvement
              learning_indicators = {
                  'documentation_updates': 0,
                  'experimental_branches': 0,
                  'learning_issues': 0,
                  'knowledge_base_growth': 0
              }
              
              # Count documentation files
              doc_files = [f for f in repo.get_contents('.') if f.name.endswith('.md')]
              learning_indicators['documentation_updates'] = len(doc_files)
              
              # Count experimental/feature branches
              branches = list(repo.get_branches())
              experimental_branches = [b for b in branches if any(keyword in b.name.lower() 
                                                                for keyword in ['experiment', 'poc', 'research', 'spike', 'explore'])]
              learning_indicators['experimental_branches'] = len(experimental_branches)
              
              # Count learning/improvement issues
              issues = list(repo.get_issues(state='all', labels=['enhancement', 'research', 'learning']))
              learning_indicators['learning_issues'] = len(issues)
              
              learning_score = min(100, (learning_indicators['documentation_updates'] * 10 + 
                                       learning_indicators['experimental_branches'] * 20 +
                                       learning_indicators['learning_issues'] * 15))
              
              # 3. Innovation Score
              # Measure adoption of cutting-edge technologies and practices
              innovation_indicators = {
                  'ai_ml_integration': any('ai' in str(f).lower() or 'ml' in str(f).lower() 
                                         for f in repo.get_contents('.github/workflows')),
                  'quantum_readiness': any('quantum' in str(f).lower() 
                                         for f in repo.get_contents('.github/workflows')),
                  'edge_computing': any('edge' in str(f).lower() 
                                      for f in repo.get_contents('.github/workflows')),
                  'chaos_engineering': any('chaos' in str(f).lower() 
                                         for f in repo.get_contents('.github/workflows')),
                  'sustainability_focus': any('green' in str(f).lower() or 'carbon' in str(f).lower() or 'esg' in str(f).lower()
                                            for f in repo.get_contents('.github/workflows')),
                  'advanced_monitoring': any('monitoring' in str(f).lower() or 'observability' in str(f).lower()
                                           for f in repo.get_contents('.github/workflows')),
                  'policy_as_code': any('policy' in str(f).lower() or 'compliance' in str(f).lower()
                                      for f in repo.get_contents('.github/workflows')),
                  'developer_experience': any('dx' in str(f).lower() or 'developer-experience' in str(f).lower()
                                            for f in repo.get_contents('.github/workflows'))
              }
              
              innovation_score = (sum(innovation_indicators.values()) / len(innovation_indicators)) * 100
              
              # Calculate overall organizational score
              overall_org_score = (culture_score + collaboration_score + learning_score + innovation_score) / 4
              
              # Generate maturity rating
              if overall_org_score >= 85:
                  maturity_rating = "TRANSFORMATIONAL"
              elif overall_org_score >= 75:
                  maturity_rating = "OPTIMIZING"
              elif overall_org_score >= 60:
                  maturity_rating = "MANAGED"
              else:
                  maturity_rating = "DEFINED"
              
              # Generate assessment report
              assessment = {
                  'culture': {
                      'score': round(culture_score, 1),
                      'cross_team_collaboration': collaboration_indicators['cross_team_reviews'],
                      'total_prs_analyzed': len(recent_pulls)
                  },
                  'collaboration': {
                      'score': round(collaboration_score, 1),
                      'knowledge_sharing_comments': collaboration_indicators['knowledge_sharing_comments'],
                      'collaboration_level': 'excellent' if collaboration_score >= 80 else 'good' if collaboration_score >= 60 else 'developing'
                  },
                  'learning': {
                      'score': round(learning_score, 1),
                      'indicators': learning_indicators,
                      'learning_culture': 'advanced' if learning_score >= 80 else 'developing' if learning_score >= 50 else 'basic'
                  },
                  'innovation': {
                      'score': round(innovation_score, 1),
                      'indicators': innovation_indicators,
                      'innovation_level': 'cutting-edge' if innovation_score >= 80 else 'progressive' if innovation_score >= 60 else 'traditional'
                  },
                  'overall': {
                      'score': round(overall_org_score, 1),
                      'maturity_rating': maturity_rating
