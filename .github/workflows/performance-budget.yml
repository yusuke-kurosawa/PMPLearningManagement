name: Performance Budget Enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      strict_mode:
        description: 'Enable strict enforcement'
        required: false
        default: false
        type: boolean

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
  STRICT_MODE: ${{ github.event.inputs.strict_mode || 'false' }}

jobs:
  budget-validation:
    name: Validate Performance Budget
    runs-on: ubuntu-latest
    
    outputs:
      has-violations: ${{ steps.budget-check.outputs.has-violations }}
      severity: ${{ steps.budget-check.outputs.severity }}
      report-url: ${{ steps.budget-check.outputs.report-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          GENERATE_SOURCEMAP: false

      - name: Install performance testing tools
        run: |
          npm install -g @lhci/cli lighthouse
          npm install -g bundlesize webpack-bundle-analyzer

      - name: Start preview server
        run: |
          npm run preview &
          sleep 10
          curl -f http://localhost:3000 || (echo "Server failed to start" && exit 1)

      - name: Run Lighthouse performance audit
        run: |
          echo "🔍 Running Lighthouse performance audit..."
          lhci autorun --config=.lighthouserc.js

      - name: Analyze bundle sizes
        run: |
          echo "📦 Analyzing bundle sizes..."
          node ./scripts/check-bundle-size.js --budget=./performance-budget.json

      - name: Run custom performance tests
        run: |
          echo "⚡ Running custom performance tests..."
          node ./scripts/run-performance-tests.js

      - name: Check performance budget compliance
        id: budget-check
        run: |
          echo "💰 Checking performance budget compliance..."
          node ./scripts/check-performance-budget.js --environment=${{ env.ENVIRONMENT }} --strict=${{ env.STRICT_MODE }}
          
          # Set outputs based on results
          if [ -f "./budget-violations.json" ]; then
            violations=$(cat ./budget-violations.json | jq '.violations | length')
            severity=$(cat ./budget-violations.json | jq -r '.severity')
            
            if [ "$violations" -gt "0" ]; then
              echo "has-violations=true" >> $GITHUB_OUTPUT
              echo "severity=$severity" >> $GITHUB_OUTPUT
            else
              echo "has-violations=false" >> $GITHUB_OUTPUT
              echo "severity=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "has-violations=false" >> $GITHUB_OUTPUT
            echo "severity=none" >> $GITHUB_OUTPUT
          fi
          
          echo "report-url=https://performance-budget-report.example.com" >> $GITHUB_OUTPUT

      - name: Generate detailed performance report
        if: always()
        run: |
          echo "📊 Generating detailed performance report..."
          node ./scripts/generate-performance-report.js --output=./performance-report.json

      - name: Upload performance artifacts
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        if: always()
        with:
          name: performance-budget-results-${{ github.run_id }}
          path: |
            ./performance-report.json
            ./budget-violations.json
            ./lighthouse-results/
            ./bundle-analysis/

      - name: Comment PR with budget results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 💰 Performance Budget Report\n\n';
            
            // Check for violations
            if (fs.existsSync('./budget-violations.json')) {
              const violations = JSON.parse(fs.readFileSync('./budget-violations.json', 'utf8'));
              
              if (violations.violations.length > 0) {
                comment += `### ⚠️ Budget Violations Found (${violations.severity})\n\n`;
                comment += '| Metric | Current | Budget | Status |\n';
                comment += '|--------|---------|--------|---------|\n';
                
                violations.violations.forEach(violation => {
                  const status = violation.severity === 'error' ? '❌' : '⚠️';
                  comment += `| ${violation.metric} | ${violation.current} | ${violation.limit} | ${status} |\n`;
                });
                
                comment += '\n';
              } else {
                comment += '### ✅ All Performance Budgets Compliant\n\n';
              }
            }
            
            // Add performance summary
            if (fs.existsSync('./performance-report.json')) {
              const report = JSON.parse(fs.readFileSync('./performance-report.json', 'utf8'));
              
              comment += '### Performance Summary\n';
              comment += `- **Lighthouse Performance**: ${report.lighthouse.performance}/100\n`;
              comment += `- **Core Web Vitals**: LCP ${report.coreWebVitals.lcp}ms, FID ${report.coreWebVitals.fid}ms, CLS ${report.coreWebVitals.cls}\n`;
              comment += `- **Bundle Size**: ${report.bundleSize.total} (${report.bundleSize.change})\n`;
              comment += `- **Load Time**: ${report.loadTime}s\n\n`;
              
              if (report.recommendations.length > 0) {
                comment += '### Recommendations\n';
                report.recommendations.slice(0, 5).forEach((rec, i) => {
                  comment += `${i + 1}. ${rec}\n`;
                });
              }
            }
            
            comment += '\n[View detailed report](${{ steps.budget-check.outputs.report-url }})\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail build if budget violated in strict mode
        if: steps.budget-check.outputs.has-violations == 'true' && steps.budget-check.outputs.severity == 'error' && env.STRICT_MODE == 'true'
        run: |
          echo "❌ Performance budget violated in strict mode!"
          exit 1

  route-specific-tests:
    name: Route-Specific Performance Tests
    runs-on: ubuntu-latest
    needs: budget-validation
    if: always()
    
    strategy:
      matrix:
        route: ['/', '/matrix', '/flashcards', '/mock-exam', '/visualizations', '/progress', '/glossary']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview &
          sleep 10

      - name: Test route performance
        run: |
          echo "🔍 Testing route: ${{ matrix.route }}"
          lighthouse "http://localhost:3000/PMPLearningManagement/#${{ matrix.route }}" \
            --only-categories=performance \
            --output=json \
            --output-path="./lighthouse-${{ matrix.route }}.json" \
            --chrome-flags="--headless --no-sandbox"

      - name: Check route-specific budgets
        run: |
          echo "💰 Checking route-specific budget for ${{ matrix.route }}"
          node ./scripts/check-route-budget.js --route="${{ matrix.route }}" --report="./lighthouse-${{ matrix.route }}.json"

      - name: Upload route results
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: route-performance-${{ matrix.route }}-${{ github.run_id }}
          path: ./lighthouse-${{ matrix.route }}.json

  mobile-performance-test:
    name: Mobile Performance Budget
    runs-on: ubuntu-latest
    needs: budget-validation
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview &
          sleep 10

      - name: Run mobile Lighthouse audit
        run: |
          echo "📱 Running mobile performance audit..."
          lighthouse "http://localhost:3000/PMPLearningManagement/" \
            --preset=mobile \
            --output=json \
            --output-path="./lighthouse-mobile.json" \
            --chrome-flags="--headless --no-sandbox"

      - name: Check mobile performance budgets
        run: |
          echo "💰 Checking mobile performance budgets..."
          node ./scripts/check-mobile-budget.js --report="./lighthouse-mobile.json"

      - name: Upload mobile results
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: mobile-performance-${{ github.run_id }}
          path: ./lighthouse-mobile.json

  third-party-budget:
    name: Third-Party Performance Impact
    runs-on: ubuntu-latest
    needs: budget-validation
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze third-party impact
        run: |
          echo "🔍 Analyzing third-party script impact..."
          node ./scripts/analyze-third-party-impact.js

      - name: Check third-party budgets
        run: |
          echo "💰 Checking third-party performance budgets..."
          node ./scripts/check-third-party-budget.js

  performance-regression-check:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [budget-validation, route-specific-tests, mobile-performance-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          pattern: '*-performance-*'
          merge-multiple: true
          path: ./performance-results/

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'

      - name: Check for performance regressions
        run: |
          echo "📉 Checking for performance regressions..."
          node ./scripts/detect-performance-regression.js --results=./performance-results/

      - name: Create regression report
        if: always()
        run: |
          echo "📊 Creating performance regression report..."
          node ./scripts/create-regression-report.js

  budget-monitoring-setup:
    name: Setup Continuous Monitoring
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [budget-validation, route-specific-tests, mobile-performance-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup performance monitoring
        run: |
          echo "📊 Setting up continuous performance monitoring..."
          # This would integrate with monitoring services like:
          # - Lighthouse CI server
          # - SpeedCurve
          # - Calibre
          # - WebPageTest
          echo "Monitoring setup complete"

      - name: Schedule performance reports
        run: |
          echo "📅 Scheduling performance reports..."
          # This would set up scheduled reports and alerts
          echo "Scheduling complete"

  create-performance-issue:
    name: Create Performance Issue
    runs-on: ubuntu-latest
    if: needs.budget-validation.outputs.has-violations == 'true' && needs.budget-validation.outputs.severity == 'error' && github.ref == 'refs/heads/main'
    needs: [budget-validation, route-specific-tests, mobile-performance-test, performance-regression-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Create performance issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = '🚨 Performance Budget Violations Detected';
            const body = `## Performance Budget Violations
            
            Performance budget violations have been detected in the main branch.
            
            ### Details
            - **Severity**: ${{ needs.budget-validation.outputs.severity }}
            - **Environment**: ${{ env.ENVIRONMENT }}
            - **Date**: ${new Date().toISOString()}
            
            ### Actions Required
            - [ ] Review performance report
            - [ ] Identify root cause
            - [ ] Implement optimizations
            - [ ] Verify fixes
            
            ### Resources
            - [Performance Report](${{ needs.budget-validation.outputs.report-url }})
            - [Performance Budget Configuration](./performance-budget.json)
            - [Optimization Guide](./docs/performance-optimization.md)
            
            **Auto-generated by Performance Budget Workflow**
            `;
            
            // Check if issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'performance,budget-violation',
              state: 'open'
            });
            
            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['performance', 'budget-violation', 'priority-high'],
                assignees: []
              });
              
              console.log('Performance issue created');
            } else {
              console.log('Performance issue already exists');
            }
