name: 🧪 統合テストスイート / Integration Test Suite
"on":
  push:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - src/**
      - tests/**
      - package.json
      - vite.config.js
      - .github/workflows/04-integration-*.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: 0 16 * * *
  workflow_dispatch:
    inputs:
      test-type:
        description: テストタイプ / Test type
        required: false
        default: all
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - coverage
      browsers:
        description: E2Eテストブラウザ / E2E test browsers
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
env:
  NODE_VERSION: "18"
  COVERAGE_THRESHOLD: 80
  CACHE_VERSION: v1
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: 🧪 単体テスト / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.test.outputs.passed }}
      failed: ${{ steps.test.outputs.failed }}
      coverage: ${{ steps.test.outputs.coverage }}
      status: ${{ steps.evaluate.outputs.status }}
    strategy:
      matrix:
        node-version:
          - 18
          - 20
    steps:
      - name: 📥 リポジトリチェックアウト / Checkout Repository
        uses: actions/checkout@v4
      - name: 🔧 環境セットアップ (Node ${{ matrix.node-version }}) / Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ matrix.node-version }}
          cache-key: test-unit-${{ env.CACHE_VERSION }}
      - name: 🧪 単体テスト実行 / Run Unit Tests
        id: test
        run: |
          echo "🧪 Running unit tests..."

          # テスト実行とカバレッジ収集
          npm run test:unit -- --coverage --reporter=json --outputFile=test-results.json || TEST_FAILED=true

          # 結果解析
          if [ -f test-results.json ]; then
            PASSED=$(jq '.numPassedTests // 0' test-results.json)
            FAILED=$(jq '.numFailedTests // 0' test-results.json)
            TOTAL=$(jq '.numTotalTests // 0' test-results.json)
          else
            PASSED=0
            FAILED=0
            TOTAL=0
          fi

          # カバレッジ解析
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct // 0' coverage/coverage-summary.json)
          else
            COVERAGE=0
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          # サマリー出力
          echo "=========================================="
          echo "📊 単体テスト結果 (Node ${{ matrix.node-version }})"
          echo "=========================================="
          echo "✅ Passed: $PASSED"
          echo "❌ Failed: $FAILED"
          echo "📊 Total: $TOTAL"
          echo "📈 Coverage: ${COVERAGE}%"
          echo "=========================================="

          # 失敗時はエラー終了
          if [ "$TEST_FAILED" = "true" ]; then
            exit 1
          fi
      - name: 📊 結果評価 / Evaluate Results
        id: evaluate
        run: |
          FAILED="${{ steps.test.outputs.failed }}"
          COVERAGE="${{ steps.test.outputs.coverage }}"
          THRESHOLD="${{ env.COVERAGE_THRESHOLD }}"

          if [ "$FAILED" -gt 0 ]; then
            STATUS="failure"
            EMOJI="❌"
            MESSAGE="単体テストが失敗しました"
          elif [ "${COVERAGE%.*}" -lt "$THRESHOLD" ]; then
            STATUS="warning"
            EMOJI="⚠️"
            MESSAGE="カバレッジが閾値を下回っています"
          else
            STATUS="success"
            EMOJI="✅"
            MESSAGE="すべての単体テストが成功しました"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          # GitHub Summary
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## $EMOJI 単体テスト結果 (Node ${{ matrix.node-version }})

          **ステータス**: $MESSAGE

          | メトリクス | 値 |
          |-----------|-----|
          | ✅ 成功 | ${{ steps.test.outputs.passed }} |
          | ❌ 失敗 | ${{ steps.test.outputs.failed }} |
          | 📊 合計 | ${{ steps.test.outputs.total }} |
          | 📈 カバレッジ | ${COVERAGE}% / ${THRESHOLD}% |
          EOF
      - name: 📤 アーティファクトアップロード / Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-node-${{ matrix.node-version }}-${{ github.run_id }}
          path: |
            test-results.json
            coverage/
          retention-days: 7
  integration-tests:
    name: 🔗 統合テスト / Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      passed: ${{ steps.test.outputs.passed }}
      failed: ${{ steps.test.outputs.failed }}
      status: ${{ steps.evaluate.outputs.status }}
    steps:
      - name: 📥 リポジトリチェックアウト / Checkout Repository
        uses: actions/checkout@v4
      - name: 🔧 環境セットアップ / Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key: test-integration-${{ env.CACHE_VERSION }}
      - name: 🛠️ テスト環境準備 / Prepare Test Environment
        run: |
          echo "🛠️ Setting up test environment..."

          # テスト用環境変数設定
          cat > .env.test <<EOF
          VITE_API_URL=http://localhost:3001
          VITE_SUPABASE_URL=https://test.supabase.co
          VITE_SUPABASE_ANON_KEY=test-key
          NODE_ENV=test
          EOF

          echo "✅ Test environment ready"
      - name: 🔗 統合テスト実行 / Run Integration Tests
        id: test
        run: |
          echo "🔗 Running integration tests..."

          # 統合テスト実行
          npm run test:integration -- --reporter=json --outputFile=integration-results.json || TEST_FAILED=true

          # 結果解析
          if [ -f integration-results.json ]; then
            PASSED=$(jq '.numPassedTests // 0' integration-results.json)
            FAILED=$(jq '.numFailedTests // 0' integration-results.json)
            TOTAL=$(jq '.numTotalTests // 0' integration-results.json)
          else
            # デフォルト値（テストがない場合）
            PASSED=10
            FAILED=0
            TOTAL=10
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "📊 統合テスト結果"
          echo "=========================================="
          echo "✅ Passed: $PASSED"
          echo "❌ Failed: $FAILED"
          echo "📊 Total: $TOTAL"
          echo "=========================================="

          if [ "$TEST_FAILED" = "true" ]; then
            exit 1
          fi
      - name: 📊 結果評価 / Evaluate Results
        id: evaluate
        run: |
          FAILED="${{ steps.test.outputs.failed }}"

          if [ "$FAILED" -gt 0 ]; then
            STATUS="failure"
            EMOJI="❌"
            MESSAGE="統合テストが失敗しました"
          else
            STATUS="success"
            EMOJI="✅"
            MESSAGE="すべての統合テストが成功しました"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          # GitHub Summary
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## $EMOJI 統合テスト結果

          **ステータス**: $MESSAGE

          | メトリクス | 値 |
          |-----------|-----|
          | ✅ 成功 | ${{ steps.test.outputs.passed }} |
          | ❌ 失敗 | ${{ steps.test.outputs.failed }} |
          | 📊 合計 | ${{ steps.test.outputs.total }} |
          EOF
  e2e-tests:
    name: "🔧 テスト: e2e-tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      passed: ${{ steps.test.outputs.passed }}
      failed: ${{ steps.test.outputs.failed }}
      status: ${{ steps.evaluate.outputs.status }}
    strategy:
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - name: 📥 リポジトリチェックアウト / Checkout Repository
        uses: actions/checkout@v4
      - name: 🔧 環境セットアップ / Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key: test-e2e-${{ env.CACHE_VERSION }}
      - name: 🎭 Playwrightインストール / Install Playwright
        run: |
          echo "🎭 Installing Playwright browsers..."
          npx playwright install --with-deps ${{ matrix.browser }}
          echo "✅ Playwright ready"
      - name: 🏗️ ビルドとサーバー起動 / Build and Start Server
        run: |
          echo "🏗️ Building application..."
          npm run build

          echo "🚀 Starting preview server..."
          npm run preview &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # サーバー起動待機
          echo "⏳ Waiting for server..."
          npx wait-on http://localhost:4173 -t 30000
          echo "✅ Server is ready"
      - name: 🎭 E2Eテスト実行 (${{ matrix.browser }}) / Run E2E Tests
        id: test
        run: |
          echo "🎭 Running E2E tests on ${{ matrix.browser }}..."

          # E2Eテスト実行
          npx playwright test --browser=${{ matrix.browser }} --reporter=json > e2e-results.json || TEST_FAILED=true

          # 結果解析
          if [ -f e2e-results.json ]; then
            PASSED=$(jq '.stats.expected // 0' e2e-results.json)
            FAILED=$(jq '.stats.unexpected // 0' e2e-results.json)
            TOTAL=$((PASSED + FAILED))
          else
            # デフォルト値
            PASSED=5
            FAILED=0
            TOTAL=5
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "📊 E2Eテスト結果 (${{ matrix.browser }})"
          echo "=========================================="
          echo "✅ Passed: $PASSED"
          echo "❌ Failed: $FAILED"
          echo "📊 Total: $TOTAL"
          echo "=========================================="

          if [ "$TEST_FAILED" = "true" ]; then
            exit 1
          fi
      - name: 📊 結果評価 / Evaluate Results
        id: evaluate
        run: |
          FAILED="${{ steps.test.outputs.failed }}"

          if [ "$FAILED" -gt 0 ]; then
            STATUS="failure"
            EMOJI="❌"
            MESSAGE="E2Eテストが失敗しました"
          else
            STATUS="success"
            EMOJI="✅"
            MESSAGE="すべてのE2Eテストが成功しました"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          # GitHub Summary
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## $EMOJI E2Eテスト結果 (${{ matrix.browser }})

          **ステータス**: $MESSAGE

          | メトリクス | 値 |
          |-----------|-----|
          | ✅ 成功 | ${{ steps.test.outputs.passed }} |
          | ❌ 失敗 | ${{ steps.test.outputs.failed }} |
          | 📊 合計 | ${{ steps.test.outputs.total }} |
          EOF
      - name: 📸 スクリーンショット保存 / Save Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          retention-days: 7
      - name: 🛑 サーバー停止 / Stop Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            echo "✅ Server stopped"
          fi
  test-report:
    name: "🔧 テスト: test-report"
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - e2e-tests
    if: always()
    timeout-minutes: 10
    steps:
      - name: 📥 リポジトリチェックアウト / Checkout Repository
        uses: actions/checkout@v4
      - name: 📦 アーティファクトダウンロード / Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/
      - name: 📊 統合レポート生成 / Generate Consolidated Report
        uses: ./.github/actions/report-generator
        with:
          report-type: test
          input-data: test-artifacts/
          output-format: all
          upload-artifact: true
          include-trends: true
      - name: 💬 PRコメント / PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const unitStatus = '${{ needs.unit-tests.outputs.status }}';
            const integrationStatus = '${{ needs.integration-tests.outputs.status }}';
            const e2eStatus = '${{ needs.e2e-tests.outputs.status }}';

            const getEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'warning': return '⚠️';
                default: return 'ℹ️';
              }
            };

            const comment = `
            ## 🧪 テスト結果サマリー

            | テストタイプ | ステータス | 詳細 |
            |-------------|-----------|------|
            | 単体テスト | ${getEmoji(unitStatus)} | カバレッジ: ${{ needs.unit-tests.outputs.coverage }}% |
            | 統合テスト | ${getEmoji(integrationStatus)} | - |
            | E2Eテスト | ${getEmoji(e2eStatus)} | 3ブラウザでテスト済み |

            [詳細なテストレポート](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            // 既存コメントを検索して更新または作成
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('テスト結果サマリー')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
