      - name: ai-coach
        image: ai-developer-coach:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8090
          name: metrics
        env:
        - name: AI_MODEL_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ai-coaching-secrets
              key: ai-model-endpoint
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-coaching-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-coaching-secrets
              key: anthropic-api-key
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-developer-coach-service
  namespace: developer-experience
  labels:
    app: ai-developer-coach
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: metrics
  selector:
    app: ai-developer-coach
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-coach-ingress
  namespace: developer-experience
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: \"100\"
spec:
  tls:
  - hosts:
    - ai-coach.pmp-learning.io
    secretName: ai-coach-tls
  rules:
  - host: ai-coach.pmp-learning.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-developer-coach-service
            port:
              number: 80
