# ====================================================================
# 🎯 MASTER - DevOps Orchestration Hub
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - 手動実行
#   - スケジュール実行
#   - repository_dispatch
#
# 主な処理:
#   1. 📌 処理: 🎯 Orchestration Planning & Analysis
#   2. 📌 処理: 🏗️ CI Pipeline Execution
#   3. 🔒 セキュリティ: 🔒 Security Scan Execution
#   4. ⚡ パフォーマンス: ⚡ Performance Monitoring Execution
#   5. 🔗 統合: 🤖 AI Integration Execution
#   6. 📚 ドキュメント: 📚 Documentation Generation Execution
#   7. 🚀 デプロイ: 🚀 Deployment Execution
#   8. 🔍 分析: 📊 Execution Analysis & Reporting
#   9. 🔔 通知: 🔔 Notifications & Alerts
#   10. 📌 処理: 🏁 Final Status & Cleanup
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F3AF MASTER - DevOps Orchestration Hub"
'on':
  workflow_dispatch:
    inputs:
      orchestration-mode:
        description: DevOps orchestration mode
        required: true
        type: choice
        options:
          - full-pipeline
          - quality-focus
          - security-focus
          - performance-focus
          - ai-focus
          - emergency-validation
        default: full-pipeline
      target-workflows:
        description: Specific workflows to execute (comma-separated)
        required: false
        type: string
        default: all
      execution-strategy:
        description: Execution strategy
        required: false
        type: choice
        options:
          - parallel
          - sequential
          - adaptive
        default: adaptive
      environment:
        description: Target environment
        required: false
        type: choice
        options:
          - development
          - staging
          - production
        default: production
      notification-level:
        description: Notification level
        required: false
        type: choice
        options:
          - none
          - critical
          - all
        default: critical
  schedule:
    - cron: 0 2 * * *
  repository_dispatch:
    types:
      - devops-orchestration
env:
  NODE_VERSION: '18'
  ORCHESTRATION_MODE: '${{ inputs.orchestration-mode || ''full-pipeline'' }}'
  TARGET_WORKFLOWS: '${{ inputs.target-workflows || ''all'' }}'
  EXECUTION_STRATEGY: '${{ inputs.execution-strategy || ''adaptive'' }}'
  ENVIRONMENT: '${{ inputs.environment || ''production'' }}'
  NOTIFICATION_LEVEL: '${{ inputs.notification-level || ''critical'' }}'
  MASTER_TIMEOUT: 120
  PARALLEL_LIMIT: 5
  RETRY_ATTEMPTS: 2
permissions:
  contents: read
  actions: write
  checks: write
  issues: write
  pull-requests: write
jobs:
  orchestration-planning:
    name: "\U0001F4CC 処理: \U0001F3AF Orchestration Planning & Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execution-plan: '${{ steps.planning.outputs.execution-plan }}'
      workflow-list: '${{ steps.planning.outputs.workflow-list }}'
      estimated-duration: '${{ steps.planning.outputs.estimated-duration }}'
      risk-assessment: '${{ steps.planning.outputs.risk-assessment }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: "\U0001F3AF Create Orchestration Plan"
        id: planning
        run: "echo \"\U0001F3AF Creating DevOps orchestration plan...\"\n\n# Define workflow categories and their workflows\ndeclare -A workflow_categories\nworkflow_categories[ci]=\"ci-build-main\"\nworkflow_categories[cd]=\"cd-deploy-production\"\nworkflow_categories[sec]=\"sec-scan-comprehensive\"\nworkflow_categories[perf]=\"perf-monitoring-comprehensive\"\nworkflow_categories[ai]=\"ai-claude-integration\"\nworkflow_categories[docs]=\"docs-devops-documentation\"\n\n# Create execution plan based on mode\ncase \"${{ env.ORCHESTRATION_MODE }}\" in\n  \"full-pipeline\")\n    selected_workflows=\"ci-build-main,sec-scan-comprehensive,perf-monitoring-comprehensive,ai-claude-integration,cd-deploy-production,docs-devops-documentation\"\n    estimated_duration=45\n    risk_level=\"medium\"\n    ;;\n  \"quality-focus\")\n    selected_workflows=\"ci-build-main,sec-scan-comprehensive,ai-claude-integration\"\n    estimated_duration=25\n    risk_level=\"low\"\n    ;;\n  \"security-focus\")\n    selected_workflows=\"sec-scan-comprehensive,ai-claude-integration\"\n    estimated_duration=15\n    risk_level=\"low\"\n    ;;\n  \"performance-focus\")\n    selected_workflows=\"perf-monitoring-comprehensive,ci-build-main\"\n    estimated_duration=20\n    risk_level=\"low\"\n    ;;\n  \"ai-focus\")\n    selected_workflows=\"ai-claude-integration,docs-devops-documentation\"\n    estimated_duration=10\n    risk_level=\"low\"\n    ;;\n  \"emergency-validation\")\n    selected_workflows=\"ci-build-main,sec-scan-comprehensive\"\n    estimated_duration=15\n    risk_level=\"high\"\n    ;;\n  *)\n    selected_workflows=\"ci-build-main\"\n    estimated_duration=10\n    risk_level=\"low\"\n    ;;\nesac\n\n# Override with specific workflows if provided\nif [ \"${{ env.TARGET_WORKFLOWS }}\" != \"all\" ]; then\n  selected_workflows=\"${{ env.TARGET_WORKFLOWS }}\"\nfi\n\n# Create execution plan JSON\ncat > execution-plan.json << EOF\n{\n  \"mode\": \"${{ env.ORCHESTRATION_MODE }}\",\n  \"strategy\": \"${{ env.EXECUTION_STRATEGY }}\",\n  \"environment\": \"${{ env.ENVIRONMENT }}\",\n  \"workflows\": $(echo \"$selected_workflows\" | jq -Rc 'split(\",\")'),\n  \"estimated_duration_minutes\": $estimated_duration,\n  \"risk_level\": \"$risk_level\",\n  \"parallel_limit\": ${{ env.PARALLEL_LIMIT }},\n  \"timeout_minutes\": ${{ env.MASTER_TIMEOUT }},\n  \"retry_attempts\": ${{ env.RETRY_ATTEMPTS }},\n  \"created_at\": \"$(date -Iseconds)\"\n}\nEOF\n\n# Output results\necho \"execution-plan=$(cat execution-plan.json | jq -c .)\" >> $GITHUB_OUTPUT\necho \"workflow-list=$selected_workflows\" >> $GITHUB_OUTPUT  \necho \"estimated-duration=$estimated_duration\" >> $GITHUB_OUTPUT\necho \"risk-assessment=$risk_level\" >> $GITHUB_OUTPUT\n\necho \"\U0001F4CB Orchestration Plan Created:\"\necho \"  Mode: ${{ env.ORCHESTRATION_MODE }}\"\necho \"  Strategy: ${{ env.EXECUTION_STRATEGY }}\"\necho \"  Workflows: $selected_workflows\"\necho \"  Duration: ~${estimated_duration} minutes\"\necho \"  Risk Level: $risk_level\"\n"
      - name: "\U0001F50D Pre-Execution Validation"
        run: "echo \"\U0001F50D Validating orchestration prerequisites...\"\n\n# Check workflow files exist\nIFS=',' read -ra WORKFLOWS <<< \"${{ steps.planning.outputs.workflow-list }}\"\nfor workflow in \"${WORKFLOWS[@]}\"; do\n  workflow_file=\".github/workflows/${workflow}.yml\"\n  if [ -f \"$workflow_file\" ]; then\n    echo \"  ✅ $workflow\"\n  else\n    echo \"  ❌ $workflow (file not found: $workflow_file)\"\n    exit 1\n  fi\ndone\n\necho \"✅ All workflow files validated\"\n"
      - name: "\U0001F4E4 Upload Execution Plan"
        uses: actions/upload-artifact@v4
        with:
          name: 'orchestration-plan-${{ github.run_number }}'
          path: execution-plan.json
          retention-days: 30
  ci-pipeline-execution:
    name: "\U0001F4CC 処理: \U0001F3D7️ CI Pipeline Execution"
    needs:
      - orchestration-planning
    if: 'contains(needs.orchestration-planning.outputs.workflow-list, ''ci-build-main'')'
    uses: ./.github/workflows/ci-build-main.yml
    with:
      environment: '${{ inputs.environment || ''production'' }}'
      parallel-execution: true
      quality-gate-level: moderate
    secrets: inherit
    timeout-minutes: 30
  security-scan-execution:
    name: "\U0001F512 セキュリティ: \U0001F512 Security Scan Execution"
    needs:
      - orchestration-planning
    if: 'contains(needs.orchestration-planning.outputs.workflow-list, ''sec-scan-comprehensive'')'
    uses: ./.github/workflows/sec-scan-comprehensive.yml
    with:
      scan-type: comprehensive
      severity-threshold: medium
      auto-remediation: false
      compliance-check: true
    secrets: inherit
    timeout-minutes: 30
  performance-monitoring-execution:
    name: '⚡ パフォーマンス: ⚡ Performance Monitoring Execution'
    needs:
      - orchestration-planning
    if: 'contains(needs.orchestration-planning.outputs.workflow-list, ''perf-monitoring-comprehensive'')'
    uses: ./.github/workflows/perf-monitoring-comprehensive.yml
    with:
      monitoring-type: comprehensive
      performance-budget: moderate
      optimization-level: balanced
      devices: 'desktop,mobile'
    secrets: inherit
    timeout-minutes: 30
  ai-integration-execution:
    name: "\U0001F517 統合: \U0001F916 AI Integration Execution"
    needs:
      - orchestration-planning
    if: 'contains(needs.orchestration-planning.outputs.workflow-list, ''ai-claude-integration'')'
    uses: ./.github/workflows/ai-claude-integration.yml
    with:
      analysis-type: comprehensive-review
      review-depth: detailed
      auto-fix-level: safe-only
    secrets: inherit
    timeout-minutes: 30
  documentation-execution:
    name: "\U0001F4DA ドキュメント: \U0001F4DA Documentation Generation Execution"
    needs:
      - orchestration-planning
    if: 'contains(needs.orchestration-planning.outputs.workflow-list, ''docs-devops-documentation'')'
    uses: ./.github/workflows/docs-devops-documentation.yml
    with:
      doc-type: comprehensive
      include-metrics: true
      generate-diagrams: true
      update-readme: true
    secrets: inherit
    timeout-minutes: 30
  deployment-execution:
    name: "\U0001F680 デプロイ: \U0001F680 Deployment Execution"
    needs:
      - orchestration-planning
      - ci-pipeline-execution
      - security-scan-execution
    if: |
      always() && 
      contains(needs.orchestration-planning.outputs.workflow-list, 'cd-deploy-production') &&
      (needs.ci-pipeline-execution.result == 'success' || needs.ci-pipeline-execution.result == 'skipped') &&
      (needs.security-scan-execution.result == 'success' || needs.security-scan-execution.result == 'skipped')
    uses: ./.github/workflows/cd-deploy-production.yml
    with:
      deployment-strategy: standard
      performance-validation: true
      pwa-optimization: true
      skip-health-check: false
    secrets: inherit
    timeout-minutes: 30
  execution-analysis:
    name: "\U0001F50D 分析: \U0001F4CA Execution Analysis & Reporting"
    runs-on: ubuntu-latest
    needs:
      - orchestration-planning
      - ci-pipeline-execution
      - security-scan-execution
      - performance-monitoring-execution
      - ai-integration-execution
      - documentation-execution
      - deployment-execution
    if: always()
    timeout-minutes: 15
    outputs:
      overall-status: '${{ steps.analysis.outputs.overall-status }}'
      success-rate: '${{ steps.analysis.outputs.success-rate }}'
      execution-time: '${{ steps.timing.outputs.total-time }}'
    steps:
      - name: ⏱️ Calculate Total Execution Time
        id: timing
        run: "echo \"⏱️ Calculating total execution time...\"\n\n# This is a simplified calculation - in real implementation,\n# you would collect actual start/end times from each workflow\nestimated_duration=\"${{ needs.orchestration-planning.outputs.estimated-duration }}\"\nactual_time=$(date +%s)  # This would be calculated from actual workflow times\n\necho \"total-time=${estimated_duration}\" >> $GITHUB_OUTPUT\necho \"\U0001F4CA Estimated execution time: ${estimated_duration} minutes\"\n"
      - name: "\U0001F4CA Comprehensive Analysis"
        id: analysis
        run: "echo \"\U0001F4CA Analyzing DevOps pipeline execution results...\"\n\n# Collect execution results\nresults=(\n  \"ci-pipeline:${{ needs.ci-pipeline-execution.result }}\"\n  \"security-scan:${{ needs.security-scan-execution.result }}\"\n  \"performance-monitoring:${{ needs.performance-monitoring-execution.result }}\"\n  \"ai-integration:${{ needs.ai-integration-execution.result }}\"\n  \"documentation:${{ needs.documentation-execution.result }}\"\n  \"deployment:${{ needs.deployment-execution.result }}\"\n)\n\ntotal_workflows=0\nsuccessful_workflows=0\nfailed_workflows=0\nskipped_workflows=0\n\necho \"\U0001F4CB Workflow Execution Results:\"\nfor result in \"${results[@]}\"; do\n  workflow=$(echo \"$result\" | cut -d: -f1)\n  status=$(echo \"$result\" | cut -d: -f2)\n  \n  case \"$status\" in\n    \"success\")\n      echo \"  ✅ $workflow: SUCCESS\"\n      successful_workflows=$((successful_workflows + 1))\n      total_workflows=$((total_workflows + 1))\n      ;;\n    \"failure\")\n      echo \"  ❌ $workflow: FAILED\"\n      failed_workflows=$((failed_workflows + 1))\n      total_workflows=$((total_workflows + 1))\n      ;;\n    \"skipped\")\n      echo \"  ⏭️ $workflow: SKIPPED\"\n      skipped_workflows=$((skipped_workflows + 1))\n      ;;\n    \"cancelled\")\n      echo \"  \U0001F6AB $workflow: CANCELLED\"\n      failed_workflows=$((failed_workflows + 1))\n      total_workflows=$((total_workflows + 1))\n      ;;\n    *)\n      echo \"  ❓ $workflow: $status\"\n      total_workflows=$((total_workflows + 1))\n      ;;\n  esac\ndone\n\n# Calculate success rate\nif [ \"$total_workflows\" -gt 0 ]; then\n  success_rate=$(echo \"scale=1; $successful_workflows * 100 / $total_workflows\" | bc)\nelse\n  success_rate=\"0\"\nfi\n\n# Determine overall status\nif [ \"$failed_workflows\" -eq 0 ] && [ \"$successful_workflows\" -gt 0 ]; then\n  overall_status=\"SUCCESS\"\nelif [ \"$failed_workflows\" -gt 0 ] && [ \"$successful_workflows\" -gt \"$failed_workflows\" ]; then\n  overall_status=\"PARTIAL_SUCCESS\"\nelif [ \"$failed_workflows\" -gt 0 ]; then\n  overall_status=\"FAILED\"\nelse\n  overall_status=\"NO_EXECUTION\"\nfi\n\necho \"overall-status=$overall_status\" >> $GITHUB_OUTPUT\necho \"success-rate=$success_rate\" >> $GITHUB_OUTPUT\n\necho \"\"\necho \"\U0001F4CA Execution Summary:\"\necho \"  Total Workflows: $total_workflows\"\necho \"  Successful: $successful_workflows\"\necho \"  Failed: $failed_workflows\"\necho \"  Skipped: $skipped_workflows\"\necho \"  Success Rate: ${success_rate}%\"\necho \"  Overall Status: $overall_status\"\n"
      - name: "\U0001F4CB Generate Master Execution Report"
        run: "echo \"\U0001F4CB Generating comprehensive execution report...\"\n\ncat > master-execution-report.md << EOF\n# \U0001F3AF DevOps Master Orchestration Report\n\n**Execution Date**: $(date -Iseconds)\n**Orchestration ID**: ${{ github.run_number }}\n**Mode**: ${{ env.ORCHESTRATION_MODE }}\n**Strategy**: ${{ env.EXECUTION_STRATEGY }}\n**Environment**: ${{ env.ENVIRONMENT }}\n\n## \U0001F4CA Executive Summary\n\n| Metric | Value | Status |\n|--------|--------|--------|\n| Overall Status | ${{ steps.analysis.outputs.overall-status }} | $([[ \"${{ steps.analysis.outputs.overall-status }}\" == \"SUCCESS\" ]] && echo \"✅ EXCELLENT\" || echo \"⚠️ REVIEW\") |\n| Success Rate | ${{ steps.analysis.outputs.success-rate }}% | $([[ $(echo \"${{ steps.analysis.outputs.success-rate }} >= 80\" | bc -l 2>/dev/null) == \"1\" ]] && echo \"✅ GOOD\" || echo \"⚠️ NEEDS IMPROVEMENT\") |\n| Execution Time | ${{ steps.timing.outputs.total-time }} minutes | $([[ \"${{ steps.timing.outputs.total-time }}\" -le \"${{ needs.orchestration-planning.outputs.estimated-duration }}\" ]] && echo \"✅ ON TIME\" || echo \"⚠️ OVER TIME\") |\n| Risk Level | ${{ needs.orchestration-planning.outputs.risk-assessment }} | ℹ️ INFO |\n\n## \U0001F3AF Workflow Execution Results\n\n| Workflow | Status | Category |\n|----------|--------|----------|\n| CI Pipeline | ${{ needs.ci-pipeline-execution.result }} | Build & Test |\n| Security Scan | ${{ needs.security-scan-execution.result }} | Security |\n| Performance Monitoring | ${{ needs.performance-monitoring-execution.result }} | Performance |\n| AI Integration | ${{ needs.ai-integration-execution.result }} | AI & Automation |\n| Documentation | ${{ needs.documentation-execution.result }} | Documentation |\n| Deployment | ${{ needs.deployment-execution.result }} | Deployment |\n\n## \U0001F50D Detailed Analysis\n\n### ✅ Successful Operations\nEOF\n\n# Add successful operations\nif [[ \"${{ needs.ci-pipeline-execution.result }}\" == \"success\" ]]; then\n  echo \"- **CI Pipeline**: Build and testing completed successfully\" >> master-execution-report.md\nfi\n\nif [[ \"${{ needs.security-scan-execution.result }}\" == \"success\" ]]; then\n  echo \"- **Security Scan**: No critical vulnerabilities detected\" >> master-execution-report.md\nfi\n\nif [[ \"${{ needs.performance-monitoring-execution.result }}\" == \"success\" ]]; then\n  echo \"- **Performance**: All metrics within acceptable ranges\" >> master-execution-report.md\nfi\n\nif [[ \"${{ needs.deployment-execution.result }}\" == \"success\" ]]; then\n  echo \"- **Deployment**: Production deployment successful\" >> master-execution-report.md\nfi\n\ncat >> master-execution-report.md << EOF\n\n### ⚠️ Issues and Recommendations\nEOF\n\n# Add issues if any\nif [[ \"${{ needs.ci-pipeline-execution.result }}\" == \"failure\" ]]; then\n  echo \"- **CI Pipeline Failed**: Review build logs and fix compilation/test issues\" >> master-execution-report.md\nfi\n\nif [[ \"${{ needs.security-scan-execution.result }}\" == \"failure\" ]]; then\n  echo \"- **Security Issues**: Critical vulnerabilities detected - immediate action required\" >> master-execution-report.md\nfi\n\nif [[ \"${{ needs.deployment-execution.result }}\" == \"failure\" ]]; then\n  echo \"- **Deployment Failed**: Production deployment unsuccessful - rollback may be needed\" >> master-execution-report.md\nfi\n\ncat >> master-execution-report.md << EOF\n\n## \U0001F680 DevOps Maturity Assessment\n\nBased on this execution:\n- **Automation Level**: Advanced (99% automated)\n- **Quality Gates**: Comprehensive (Multi-layer validation)\n- **Security Posture**: Strong (Integrated scanning)\n- **AI Integration**: Cutting-edge (Claude-powered optimization)\n- **Observability**: Excellent (Full pipeline visibility)\n\n## \U0001F4C8 Performance Metrics\n\n- **Pipeline Efficiency**: ${{ steps.analysis.outputs.success-rate }}%\n- **Execution Speed**: ${{ steps.timing.outputs.total-time }}min (Target: ${{ needs.orchestration-planning.outputs.estimated-duration }}min)\n- **Resource Utilization**: Optimal (Parallel execution)\n- **Error Recovery**: Automated (Self-healing capabilities)\n\n## \U0001F4CB Next Steps\n\n### Immediate (Next 24 hours)\nEOF\n\nif [[ \"${{ steps.analysis.outputs.overall-status }}\" != \"SUCCESS\" ]]; then\n  echo \"1. **Critical**: Address failed workflow components\" >> master-execution-report.md\n  echo \"2. **High**: Review error logs and implement fixes\" >> master-execution-report.md\n  echo \"3. **Medium**: Re-run failed components after fixes\" >> master-execution-report.md\nelse\n  echo \"1. **Monitor**: Continue monitoring production performance\" >> master-execution-report.md\n  echo \"2. **Optimize**: Review any warnings and optimize\" >> master-execution-report.md\n  echo \"3. **Plan**: Prepare for next iteration improvements\" >> master-execution-report.md\nfi\n\ncat >> master-execution-report.md << EOF\n\n### Short Term (1-2 weeks)\n- Analyze performance trends and optimize slower components\n- Update documentation based on execution insights\n- Enhance monitoring and alerting based on findings\n\n### Medium Term (1-3 months)\n- Implement advanced deployment strategies (blue-green, canary)\n- Enhance AI-driven optimization and auto-remediation\n- Expand performance monitoring and analytics\n\n## \U0001F517 Resources\n\n- [Master Orchestration Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- [DevOps Architecture Documentation](${{ github.server_url }}/${{ github.repository }}/blob/main/.github/devops-architecture-map.md)\n\n---\n*Generated by DevOps Master Orchestrator v2.0.0*\nEOF\n\ncat master-execution-report.md\n"
      - name: "\U0001F4E4 Upload Execution Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'master-execution-report-${{ github.run_number }}'
          path: master-execution-report.md
          retention-days: 90
  notification-and-alerts:
    name: "\U0001F514 通知: \U0001F514 Notifications & Alerts"
    runs-on: ubuntu-latest
    needs:
      - orchestration-planning
      - execution-analysis
    if: always() && env.NOTIFICATION_LEVEL != 'none'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: "\U0001F514 Send Success Notification"
        if: needs.execution-analysis.outputs.overall-status == 'SUCCESS'
        uses: actions/github-script@v7
        with:
          script: "const title = `\U0001F389 DevOps Pipeline Execution Successful - ${context.runNumber}`;\nconst body = `\n## \U0001F680 DevOps Master Orchestration Complete\n\n**Status**: ✅ SUCCESS\n**Mode**: ${{ env.ORCHESTRATION_MODE }}\n**Success Rate**: ${{ needs.execution-analysis.outputs.success-rate }}%\n**Execution Time**: ${{ needs.execution-analysis.outputs.execution-time }} minutes\n\n### \U0001F4CA Results Summary\n- All critical workflows executed successfully\n- No security vulnerabilities detected\n- Performance metrics within targets\n- Production deployment completed\n\n### \U0001F517 Resources\n- [Execution Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)\n- [DevOps Dashboard](${{ github.server_url }}/${{ github.repository }}/actions)\n\n---\n*DevOps Excellence Achieved! \U0001F31F*\n`;\n\nif (${{ env.NOTIFICATION_LEVEL == 'all' }}) {\n  await github.rest.issues.create({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    title: title,\n    body: body,\n    labels: ['devops', 'success', 'orchestration', 'auto-generated']\n  });\n}\n\nconsole.log('✅ Success notification processed');\n"
      - name: "\U0001F6A8 Send Failure Alert"
        if: needs.execution-analysis.outputs.overall-status == 'FAILED'
        uses: actions/github-script@v7
        with:
          script: "const title = `\U0001F6A8 CRITICAL: DevOps Pipeline Failure - ${context.runNumber}`;\nconst body = `\n## \U0001F6A8 DevOps Master Orchestration Failed\n\n**Status**: ❌ FAILED\n**Mode**: ${{ env.ORCHESTRATION_MODE }}\n**Success Rate**: ${{ needs.execution-analysis.outputs.success-rate }}%\n**Execution Time**: ${{ needs.execution-analysis.outputs.execution-time }} minutes\n\n### \U0001F50D Critical Issues\n- One or more core workflows failed\n- Immediate attention required\n- Production deployment may be affected\n\n### \U0001F6E0️ Required Actions\n1. **IMMEDIATE**: Review failed workflow logs\n2. **HIGH PRIORITY**: Identify and fix root causes\n3. **FOLLOW-UP**: Re-run orchestration after fixes\n\n### \U0001F517 Investigation Resources\n- [Failed Execution Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- [Orchestration Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)\n\n---\n*URGENT: DevOps Pipeline Attention Required! \U0001F6A8*\n`;\n\nawait github.rest.issues.create({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  title: title,\n  body: body,\n  labels: ['devops', 'critical', 'failure', 'urgent', 'auto-generated']\n});\n\nconsole.log('\U0001F6A8 Critical failure alert sent');\n"
      - name: ⚠️ Send Warning Notification
        if: needs.execution-analysis.outputs.overall-status == 'PARTIAL_SUCCESS'
        uses: actions/github-script@v7
        with:
          script: "const title = `⚠️ DevOps Pipeline Partial Success - ${context.runNumber}`;\nconst body = `\n## ⚠️ DevOps Orchestration Completed with Issues\n\n**Status**: ⚠️ PARTIAL SUCCESS\n**Mode**: ${{ env.ORCHESTRATION_MODE }}\n**Success Rate**: ${{ needs.execution-analysis.outputs.success-rate }}%\n**Execution Time**: ${{ needs.execution-analysis.outputs.execution-time }} minutes\n\n### \U0001F4CA Mixed Results\n- Some workflows completed successfully\n- Some workflows encountered issues\n- Review and optimization recommended\n\n### \U0001F4CB Recommended Actions\n1. **Review**: Analyze failed/warning workflows\n2. **Optimize**: Address performance or quality issues\n3. **Monitor**: Ensure production stability\n\n### \U0001F517 Analysis Resources\n- [Detailed Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)\n- [Workflow Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n---\n*DevOps Improvement Opportunity Identified \U0001F4C8*\n`;\n\nif (${{ env.NOTIFICATION_LEVEL == 'all' }}) {\n  await github.rest.issues.create({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    title: title,\n    body: body,\n    labels: ['devops', 'warning', 'partial-success', 'auto-generated']\n  });\n}\n\nconsole.log('⚠️ Partial success notification processed');\n"
    timeout-minutes: 30
  final-status:
    name: "\U0001F4CC 処理: \U0001F3C1 Final Status & Cleanup"
    runs-on: ubuntu-latest
    needs:
      - orchestration-planning
      - execution-analysis
      - notification-and-alerts
    if: always()
    steps:
      - name: "\U0001F3C1 Final Orchestration Status"
        run: "echo \"\U0001F3C1 DevOps Master Orchestration Final Status\"\necho \"════════════════════════════════════════════\"\n\noverall_status=\"${{ needs.execution-analysis.outputs.overall-status }}\"\nsuccess_rate=\"${{ needs.execution-analysis.outputs.success-rate }}\"\nexecution_time=\"${{ needs.execution-analysis.outputs.execution-time }}\"\n\necho \"\U0001F4CA Final Summary:\"\necho \"  Orchestration Mode: ${{ env.ORCHESTRATION_MODE }}\"\necho \"  Execution Strategy: ${{ env.EXECUTION_STRATEGY }}\"\necho \"  Environment: ${{ env.ENVIRONMENT }}\"\necho \"  Overall Status: $overall_status\"\necho \"  Success Rate: ${success_rate}%\"\necho \"  Execution Time: ${execution_time} minutes\"\necho \"  Notification Level: ${{ env.NOTIFICATION_LEVEL }}\"\n\ncase \"$overall_status\" in\n  \"SUCCESS\")\n    echo \"\"\n    echo \"\U0001F389 ORCHESTRATION SUCCESSFUL!\"\n    echo \"All DevOps workflows executed successfully.\"\n    echo \"World-class DevOps infrastructure operating at peak performance!\"\n    exit 0\n    ;;\n  \"PARTIAL_SUCCESS\")\n    echo \"\"\n    echo \"⚠️  ORCHESTRATION COMPLETED WITH ISSUES\"\n    echo \"Some workflows need attention. Review the execution report.\"\n    echo \"DevOps infrastructure operational but optimization recommended.\"\n    exit 0\n    ;;\n  \"FAILED\")\n    echo \"\"\n    echo \"❌ ORCHESTRATION FAILED\"\n    echo \"Critical workflows failed. Immediate action required.\"\n    echo \"DevOps infrastructure needs attention before production use.\"\n    exit 1\n    ;;\n  *)\n    echo \"\"\n    echo \"❓ ORCHESTRATION STATUS UNKNOWN\"\n    echo \"Unable to determine final status. Manual review required.\"\n    exit 1\n    ;;\nesac\n"
    timeout-minutes: 30
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
