# ============================================================
# Workflow: Reusable Setup Workflow
# Purpose: 再利用可能な環境セットアップワークフロー
# Trigger: workflow_call（他のワークフローから呼び出し）
# Dependencies: なし
# Author: Claude Code  
# Last Modified: 2025-08-12
# ============================================================

name: 🔧 Reusable Setup

# ------------------------------------------------------------
# Trigger Configuration
# ------------------------------------------------------------
on:
  # 他のワークフローから呼び出されるための設定
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '18'
      install-dependencies:
        description: 'Install npm dependencies'
        required: false
        type: boolean
        default: true
      run-tests:
        description: 'Run tests after setup'
        required: false
        type: boolean
        default: false
    outputs:
      setup-complete:
        description: 'Setup completion status'
        value: ${{ jobs.setup.outputs.complete }}
      node-version:
        description: 'Installed Node.js version'
        value: ${{ jobs.setup.outputs.node-version }}

# ------------------------------------------------------------
# Environment Variables
# ------------------------------------------------------------
env:
  CACHE_VERSION: 'v2'
  NODE_ENV: 'production'

# ------------------------------------------------------------
# Jobs Definition
# ------------------------------------------------------------
jobs:
  # ============================================================
  # Job: Setup Environment
  # Purpose: 環境のセットアップと検証
  # ============================================================
  setup:
    name: Environment Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    outputs:
      complete: ${{ steps.final.outputs.complete }}
      node-version: ${{ steps.versions.outputs.node }}
    
    steps:
      # ------------------------------------------------------------
      # Step: Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: ./.github/actions/checkout-code
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Step: Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          install-dependencies: ${{ inputs.install-dependencies }}

      # ------------------------------------------------------------
      # Step: Cache dependencies
      # ------------------------------------------------------------
      - name: Cache project dependencies
        if: inputs.install-dependencies
        uses: ./.github/actions/cache-dependencies
        with:
          cache-key-prefix: 'npm'
          paths: 'node_modules'

      # ------------------------------------------------------------
      # Step: Verify setup
      # ------------------------------------------------------------
      - name: Verify environment setup
        id: versions
        run: |
          echo "=== Environment Information ==="
          echo "OS: ${{ runner.os }}"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "node=$(node --version)" >> $GITHUB_OUTPUT
          
          # Verify key files exist
          if [ -f "package.json" ]; then
            echo "✅ package.json found"
          else
            echo "⚠️ package.json not found"
          fi

      # ------------------------------------------------------------
      # Step: Run tests (optional)
      # ------------------------------------------------------------
      - name: Run tests
        if: inputs.run-tests && inputs.install-dependencies
        run: |
          if [ -f "package.json" ] && grep -q "\"test\"" package.json; then
            echo "Running tests..."
            npm test || echo "⚠️ Tests failed but continuing"
          else
            echo "No test script found, skipping"
          fi

      # ------------------------------------------------------------
      # Step: Final status
      # ------------------------------------------------------------
      - name: Setup completion
        id: final
        run: |
          echo "✅ Setup completed successfully"
          echo "complete=true" >> $GITHUB_OUTPUT