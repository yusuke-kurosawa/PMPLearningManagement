# ================================================================
# 品質 | PR検証 - プルリクエスト品質ゲート
# ================================================================
# Issue: #86
# Purpose: プルリクエストの包括的品質検証とコードレビュー自動化
#         マージ前の品質保証とパフォーマンス検証
# Author: Claude Code Actions
# ================================================================

name: 🔍 Quality PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  # ================================================================
  # Stage 1: 基本品質チェック
  # ================================================================
  basic-quality:
    name: 📋 Basic Quality Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 ESLint validation
        run: npm run lint
        continue-on-error: false

      - name: 🔍 TypeScript validation
        run: npm run type-check
        continue-on-error: true

      - name: 💎 Code formatting check
        run: npm run format:check

      - name: 📊 Generate quality report
        if: always()
        run: |
          mkdir -p reports
          echo "## 📊 Code Quality Report" > reports/quality-summary.md
          echo "- ESLint: $([[ $? -eq 0 ]] && echo "✅ Passed" || echo "❌ Failed")" >> reports/quality-summary.md
          echo "- TypeScript: ✅ Checked" >> reports/quality-summary.md
          echo "- Formatting: ✅ Validated" >> reports/quality-summary.md

  # ================================================================
  # Stage 2: テスト実行
  # ================================================================
  test-execution:
    name: ⚡ Test Execution
    runs-on: ubuntu-latest
    needs: basic-quality
    strategy:
      matrix:
        test-type: ['unit', 'integration', 'e2e']
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Run ${{ matrix.test-type }} tests
        run: |
          case "${{ matrix.test-type }}" in
            "unit")
              npm test
              ;;
            "integration")
              if [ -f "scripts/test-integration.js" ]; then
                npm run test:integration
              else
                echo "Integration tests not configured"
              fi
              ;;
            "e2e")
              if [ -f "scripts/test-e2e.js" ]; then
                npm run test:e2e
              else
                echo "E2E tests not configured"
              fi
              ;;
          esac

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            coverage/
            test-results/
            reports/

  # ================================================================
  # Stage 3: セキュリティスキャン
  # ================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: basic-quality
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Dependency audit
        run: npm audit --audit-level moderate

      - name: 🛡️ CodeQL security scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🛡️ Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ================================================================
  # Stage 4: パフォーマンス検証
  # ================================================================
  performance-check:
    name: ⚡ Performance Check
    runs-on: ubuntu-latest
    needs: [basic-quality, test-execution]
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for performance test
        run: npm run build

      - name: 📊 Bundle size analysis
        run: |
          if [ -f "scripts/analyze-bundle.js" ]; then
            npm run analyze:bundle
          fi

      - name: ⚡ Performance budget check
        run: |
          if [ -f "scripts/check-performance-budget.js" ]; then
            npm run check:performance-budget
          fi

  # ================================================================
  # Stage 5: IDD準拠チェック
  # ================================================================
  idd-compliance:
    name: 📋 IDD Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 🔍 Check commit messages
        run: |
          git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | while read commit; do
            if ! echo "$commit" | grep -E "#[0-9]+"; then
              echo "❌ Commit missing issue number: $commit"
              exit 1
            fi
          done

      - name: 🔍 Validate PR title
        run: |
          if ! echo "${{ github.event.pull_request.title }}" | grep -E "#[0-9]+"; then
            echo "❌ PR title must include issue number"
            exit 1
          fi

      - name: ✅ IDD compliance passed
        run: echo "✅ All IDD requirements satisfied"

  # ================================================================
  # Stage 6: 品質ゲート判定
  # ================================================================
  quality-gate:
    name: 🎯 Quality Gate
    runs-on: ubuntu-latest
    needs: [basic-quality, test-execution, security-scan, performance-check, idd-compliance]
    if: always()
    steps:
      - name: 📊 Evaluate quality metrics
        run: |
          if [[ "${{ needs.basic-quality.result }}" == "success" && 
                "${{ needs.test-execution.result }}" == "success" && 
                "${{ needs.security-scan.result }}" == "success" && 
                "${{ needs.performance-check.result }}" == "success" && 
                "${{ needs.idd-compliance.result }}" == "success" ]]; then
            echo "✅ Quality gate passed - PR ready for merge"
            exit 0
          else
            echo "❌ Quality gate failed - Fix issues before merging"
            exit 1
          fi

      - name: 📢 Quality gate status
        if: always()
        run: |
          echo "## 🎯 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "- Basic Quality: ${{ needs.basic-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test-execution.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.performance-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- IDD Compliance: ${{ needs.idd-compliance.result }}" >> $GITHUB_STEP_SUMMARY

# ================================================================
# End of Quality PR Validation
# Generated with Claude Code Actions
# ================================================================