# ====================================================================
# 🚀 [CD] Continuous Deployment / 継続的デプロイメント
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - workflow_run
#   - リリース作成時
#   - 手動実行
#
# 主な処理:
#   1. 🚀 デプロイ: 🚪 [Gate] Deployment Readiness
#   2. 🏗️ ビルド: 🏗️ [Build] Application Build
#   3. 🚀 デプロイ: 🚀 [Deploy] ${{ needs.deployment-gate.outputs.deploy_environment }}
#   4. 🧪 テスト: 🧪 [Test] Post-Deployment Validation
#   5. 🚀 デプロイ: 📢 [Notify] Deployment Results
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F680 [CD] Continuous Deployment / 継続的デプロイメント"
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  issues: write
'on':
  workflow_run:
    workflows:
      - "\U0001F504 [CI] Continuous Integration / 継続的インテグレーション"
    types:
      - completed
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment / デプロイ環境
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
          - preview
      force_deploy:
        description: Force deployment / 強制デプロイ
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip deployment tests / デプロイテストスキップ
        required: false
        default: false
        type: boolean
env:
  STAGING_URL: 'https://yusuke-kurosawa.github.io/PMPLearningManagement/staging'
  PRODUCTION_URL: 'https://yusuke-kurosawa.github.io/PMPLearningManagement/'
  DEPLOY_TIMEOUT: 600
  HEALTH_CHECK_RETRIES: 10
  HEALTH_CHECK_INTERVAL: 30
jobs:
  deployment-gate:
    name: "\U0001F680 デプロイ: \U0001F6AA [Gate] Deployment Readiness"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_environment: '${{ steps.determine-env.outputs.environment }}'
      deploy_ready: '${{ steps.gate-check.outputs.ready }}'
      ci_status: '${{ steps.check-ci.outputs.status }}'
      quality_score: '${{ steps.quality-assessment.outputs.score }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: '${{ github.token }}'
      - name: "\U0001F50D Check CI Status"
        id: check-ci
        uses: actions/github-script@v7
        with:
          github-token: '${{ github.token }}'
          script: |
            // CI実行結果の確認
            const { owner, repo } = context.repo;
            const sha = context.sha;

            console.log(`Checking CI status for commit: ${sha}`);

            // 最新のCI実行結果を取得
            const checkRuns = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              status: 'completed'
            });

            const ciRuns = checkRuns.data.check_runs.filter(run => 
              run.name.includes('CI') || run.name.includes('Continuous Integration')
            );

            let ciStatus = 'unknown';
            let successfulRuns = 0;
            let totalRuns = ciRuns.length;

            for (const run of ciRuns) {
              console.log(`CI Run: ${run.name} - ${run.conclusion}`);
              if (run.conclusion === 'success') {
                successfulRuns++;
              }
            }

            if (totalRuns === 0) {
              ciStatus = 'no-ci-runs';
            } else if (successfulRuns === totalRuns) {
              ciStatus = 'success';
            } else {
              ciStatus = 'failure';
            }

            console.log(`CI Status: ${ciStatus} (${successfulRuns}/${totalRuns})`);
            core.setOutput('status', ciStatus);
            core.setOutput('successful_runs', successfulRuns);
            core.setOutput('total_runs', totalRuns);
      - name: "\U0001F3AF Determine Deployment Environment"
        id: determine-env
        run: "echo \"\U0001F3AF Determining deployment environment...\"\n\n# 環境決定ロジック\nif [[ \"${{ github.event_name }}\" == \"workflow_dispatch\" ]]; then\n  environment=\"${{ github.event.inputs.environment }}\"\n  echo \"\U0001F4CB Manual deployment to: $environment\"\nelif [[ \"${{ github.event_name }}\" == \"release\" ]]; then\n  environment=\"production\"\n  echo \"\U0001F4E6 Release deployment to: $environment\"\nelif [[ \"${{ github.ref }}\" == \"refs/heads/main\" ]]; then\n  environment=\"production\"\n  echo \"\U0001F3AF Main branch deployment to: $environment\"\nelif [[ \"${{ github.ref }}\" == \"refs/heads/develop\" ]]; then\n  environment=\"staging\"\n  echo \"\U0001F9EA Develop branch deployment to: $environment\"\nelse\n  environment=\"preview\"\n  echo \"\U0001F440 Feature branch deployment to: $environment\"\nfi\n\necho \"environment=$environment\" >> $GITHUB_OUTPUT\necho \"\U0001F3AF Target environment: $environment\"\n"
      - name: "\U0001F4CA Quality Assessment"
        id: quality-assessment
        run: "echo \"\U0001F4CA Assessing deployment quality...\"\n\nquality_score=100\nquality_issues=()\n\n# CI結果による評価\nci_status=\"${{ steps.check-ci.outputs.status }}\"\ncase \"$ci_status\" in\n  \"success\")\n    echo \"✅ CI checks passed\"\n    ;;\n  \"failure\")\n    echo \"❌ CI checks failed\"\n    quality_score=$((quality_score - 30))\n    quality_issues+=(\"ci-failed\")\n    ;;\n  \"no-ci-runs\")\n    echo \"⚠️ No CI runs found\"\n    quality_score=$((quality_score - 20))\n    quality_issues+=(\"no-ci\")\n    ;;\nesac\n\n# ブランチ保護ルール確認\nif [[ \"${{ github.ref }}\" == \"refs/heads/main\" ]] && [[ \"${{ steps.check-ci.outputs.status }}\" != \"success\" ]]; then\n  echo \"❌ Main branch deployment without successful CI\"\n  quality_score=$((quality_score - 40))\n  quality_issues+=(\"unsafe-main-deploy\")\nfi\n\n# 強制デプロイチェック\nif [[ \"${{ github.event.inputs.force_deploy }}\" == \"true\" ]]; then\n  echo \"⚠️ Force deployment requested\"\n  quality_score=$((quality_score - 10))\n  quality_issues+=(\"force-deploy\")\nfi\n\necho \"\U0001F4CA Quality Score: ${quality_score}/100\"\necho \"score=$quality_score\" >> $GITHUB_OUTPUT\necho \"issues=${quality_issues[*]}\" >> $GITHUB_OUTPUT\n"
      - name: "\U0001F6AA Deployment Gate Decision"
        id: gate-check
        run: "echo \"\U0001F6AA Making deployment gate decision...\"\n\nquality_score=\"${{ steps.quality-assessment.outputs.score }}\"\nenvironment=\"${{ steps.determine-env.outputs.environment }}\"\nforce_deploy=\"${{ github.event.inputs.force_deploy }}\"\n\n# 環境別の品質閾値\ncase \"$environment\" in\n  \"production\")\n    required_score=85\n    echo \"\U0001F3AF Production deployment - High quality required (${required_score}+)\"\n    ;;\n  \"staging\")\n    required_score=70\n    echo \"\U0001F9EA Staging deployment - Medium quality required (${required_score}+)\"\n    ;;\n  \"preview\")\n    required_score=50\n    echo \"\U0001F440 Preview deployment - Basic quality required (${required_score}+)\"\n    ;;\nesac\n\n# ゲート判定\ndeploy_ready=\"false\"\n\nif [[ $quality_score -ge $required_score ]]; then\n  echo \"✅ Quality gate passed: ${quality_score} >= ${required_score}\"\n  deploy_ready=\"true\"\nelif [[ \"$force_deploy\" == \"true\" ]]; then\n  echo \"⚠️ Quality gate bypassed by force deployment\"\n  deploy_ready=\"true\"\nelse\n  echo \"❌ Quality gate failed: ${quality_score} < ${required_score}\"\n  deploy_ready=\"false\"\nfi\n\necho \"ready=$deploy_ready\" >> $GITHUB_OUTPUT\necho \"required_score=$required_score\" >> $GITHUB_OUTPUT\n\nif [[ \"$deploy_ready\" == \"false\" ]]; then\n  echo \"\U0001F6AB Deployment blocked by quality gate\"\n  exit 1\nelse\n  echo \"\U0001F680 Deployment approved\"\nfi\n"
  build-for-deployment:
    name: "\U0001F3D7️ ビルド: \U0001F3D7️ [Build] Application Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deployment-gate
    if: needs.deployment-gate.outputs.deploy_ready == 'true'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: "\U0001F4E6 Install Dependencies"
        run: "echo \"\U0001F4E6 Installing dependencies for deployment build...\"\nnpm ci --only=production\n"
      - name: "\U0001F3D7️ Environment-specific Build"
        run: "echo \"\U0001F3D7️ Building for environment: ${{ needs.deployment-gate.outputs.deploy_environment }}\"\n\n# 環境変数設定\nenvironment=\"${{ needs.deployment-gate.outputs.deploy_environment }}\"\n\ncase \"$environment\" in\n  \"production\")\n    echo \"\U0001F3AF Production build configuration\"\n    export NODE_ENV=production\n    export VITE_ENV=production\n    export VITE_BASE_URL=\"${{ env.PRODUCTION_URL }}\"\n    ;;\n  \"staging\")\n    echo \"\U0001F9EA Staging build configuration\"\n    export NODE_ENV=production\n    export VITE_ENV=staging\n    export VITE_BASE_URL=\"${{ env.STAGING_URL }}\"\n    ;;\n  \"preview\")\n    echo \"\U0001F440 Preview build configuration\"\n    export NODE_ENV=production\n    export VITE_ENV=preview\n    export VITE_BASE_URL=\"https://yusuke-kurosawa.github.io/PMPLearningManagement/preview\"\n    ;;\nesac\n\n# 最適化ビルド実行\nnpm run build\n\n# ビルド結果の検証\nif [[ -d \"dist\" ]]; then\n  echo \"✅ Build successful\"\n  echo \"\U0001F4CA Build size analysis:\"\n  du -sh dist/\n  ls -la dist/\nelse\n  echo \"❌ Build failed - dist directory not found\"\n  exit 1\nfi\n"
        id: build
      - name: "\U0001F4E6 Prepare Deployment Artifacts"
        run: "echo \"\U0001F4E6 Preparing deployment artifacts...\"\n\n# デプロイメント情報ファイル作成\ncat > dist/deployment-info.json << EOF\n{\n  \"environment\": \"${{ needs.deployment-gate.outputs.deploy_environment }}\",\n  \"commit_sha\": \"${{ github.sha }}\",\n  \"build_timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"branch\": \"${{ github.ref_name }}\",\n  \"actor\": \"${{ github.actor }}\",\n  \"workflow_run\": \"${{ github.run_id }}\"\n}\nEOF\n\n# ヘルスチェックエンドポイント\ncat > dist/health.json << EOF\n{\n  \"status\": \"healthy\",\n  \"version\": \"${{ github.sha }}\",\n  \"environment\": \"${{ needs.deployment-gate.outputs.deploy_environment }}\",\n  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n}\nEOF\n\necho \"✅ Deployment artifacts prepared\"\n"
      - name: "\U0001F4E4 Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: 'deployment-build-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}'
          path: dist/
          retention-days: 30
  deploy-to-environment:
    name: "\U0001F680 デプロイ: \U0001F680 [Deploy] ${{ needs.deployment-gate.outputs.deploy_environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - deployment-gate
      - build-for-deployment
    environment: '${{ needs.deployment-gate.outputs.deploy_environment }}'
    steps:
      - name: "\U0001F4E5 Download Build Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: 'deployment-build-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}'
          path: dist/
      - name: "\U0001F4C4 Setup GitHub Pages"
        if: needs.deployment-gate.outputs.deploy_environment == 'production'
        uses: actions/configure-pages@v4
      - name: "\U0001F680 Deploy to GitHub Pages"
        if: needs.deployment-gate.outputs.deploy_environment == 'production'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'deployment-build-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}'
          preview: false
        id: pages-deployment
      - name: "\U0001F9EA Deploy to ${{ needs.deployment-gate.outputs.deploy_environment }}"
        if: needs.deployment-gate.outputs.deploy_environment != 'production'
        run: "echo \"\U0001F9EA Deploying to ${{ needs.deployment-gate.outputs.deploy_environment }} environment...\"\n\n# 環境別のデプロイ処理（GitHub Pagesの場合はシミュレーション）\nenvironment=\"${{ needs.deployment-gate.outputs.deploy_environment }}\"\n\ncase \"$environment\" in\n  \"staging\")\n    echo \"\U0001F9EA Staging deployment simulation\"\n    # 実際のstagingデプロイロジック\n    echo \"Would deploy to: ${{ env.STAGING_URL }}\"\n    ;;\n  \"preview\")\n    echo \"\U0001F440 Preview deployment simulation\"\n    # 実際のpreviewデプロイロジック\n    echo \"Would deploy to preview environment\"\n    ;;\nesac\n\n# デプロイ結果のシミュレーション\necho \"✅ Deployment to $environment completed successfully\"\necho \"deployment_url=${{ env.PRODUCTION_URL }}\" >> $GITHUB_OUTPUT\n"
        id: alt-deployment
  post-deployment-tests:
    name: "\U0001F9EA テスト: \U0001F9EA [Test] Post-Deployment Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deployment-gate
      - deploy-to-environment
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: "\U0001F3E5 Health Check"
        run: "echo \"\U0001F3E5 Performing post-deployment health check...\"\n\n# デプロイURL決定\nenvironment=\"${{ needs.deployment-gate.outputs.deploy_environment }}\"\ncase \"$environment\" in\n  \"production\")\n    target_url=\"${{ env.PRODUCTION_URL }}\"\n    ;;\n  \"staging\")\n    target_url=\"${{ env.STAGING_URL }}\"\n    ;;\n  *)\n    target_url=\"${{ env.PRODUCTION_URL }}\"\n    ;;\nesac\n\necho \"\U0001F3AF Testing URL: $target_url\"\n\n# ヘルスチェック実行\nretry_count=0\nmax_retries=${{ env.HEALTH_CHECK_RETRIES }}\n\nwhile [[ $retry_count -lt $max_retries ]]; do\n  echo \"\U0001F50D Health check attempt $((retry_count + 1))/$max_retries...\"\n  \n  if curl -f -s -o /dev/null -w \"%{http_code}\" \"$target_url\" | grep -q \"200\"; then\n    echo \"✅ Health check passed\"\n    health_status=\"healthy\"\n    break\n  else\n    echo \"⚠️ Health check failed, retrying in ${{ env.HEALTH_CHECK_INTERVAL }}s...\"\n    sleep ${{ env.HEALTH_CHECK_INTERVAL }}\n    retry_count=$((retry_count + 1))\n  fi\ndone\n\nif [[ $retry_count -eq $max_retries ]]; then\n  echo \"❌ Health check failed after $max_retries attempts\"\n  health_status=\"unhealthy\"\n  exit 1\nfi\n\necho \"health_status=$health_status\" >> $GITHUB_OUTPUT\n"
        id: health-check
      - name: "\U0001F4A8 Smoke Tests"
        run: "echo \"\U0001F4A8 Running smoke tests...\"\n\ntarget_url=\"${{ env.PRODUCTION_URL }}\"\n\n# 基本機能テスト\necho \"\U0001F9EA Testing basic functionality...\"\n\n# HTMLコンテンツ確認\nif curl -s \"$target_url\" | grep -q \"<title>\"; then\n  echo \"✅ HTML content loaded\"\nelse\n  echo \"❌ HTML content not found\"\n  exit 1\nfi\n\n# JavaScript実行確認（基本チェック）\nif curl -s \"$target_url\" | grep -q \"script\"; then\n  echo \"✅ JavaScript files referenced\"\nelse\n  echo \"⚠️ No JavaScript references found\"\nfi\n\n# CSS実行確認\nif curl -s \"$target_url\" | grep -q \"stylesheet\"; then\n  echo \"✅ CSS files referenced\"\nelse\n  echo \"⚠️ No CSS references found\"\nfi\n\necho \"✅ Smoke tests completed\"\n"
        id: smoke-tests
      - name: ⚡ Performance Check
        run: "echo \"⚡ Running basic performance check...\"\n\ntarget_url=\"${{ env.PRODUCTION_URL }}\"\n\n# 応答時間測定\nresponse_time=$(curl -o /dev/null -s -w \"%{time_total}\" \"$target_url\")\nresponse_time_ms=$(echo \"$response_time * 1000\" | bc -l | cut -d. -f1)\n\necho \"\U0001F4CA Response time: ${response_time_ms}ms\"\n\n# パフォーマンス閾値チェック\nif [[ $response_time_ms -lt 3000 ]]; then\n  echo \"✅ Performance within acceptable range\"\n  performance_status=\"good\"\nelif [[ $response_time_ms -lt 5000 ]]; then\n  echo \"⚠️ Performance needs improvement\"\n  performance_status=\"warning\"\nelse\n  echo \"❌ Performance below acceptable threshold\"\n  performance_status=\"poor\"\nfi\n\necho \"performance_status=$performance_status\" >> $GITHUB_OUTPUT\necho \"response_time_ms=$response_time_ms\" >> $GITHUB_OUTPUT\n"
        id: performance-check
  deployment-notification:
    name: "\U0001F680 デプロイ: \U0001F4E2 [Notify] Deployment Results"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - deployment-gate
      - build-for-deployment
      - deploy-to-environment
      - post-deployment-tests
    if: always()
    steps:
      - name: "\U0001F4CB Generate Deployment Report"
        run: "echo \"\U0001F4CB Generating deployment report...\"\n\n# 全体的な成功/失敗判定\noverall_status=\"success\"\nif [[ \"${{ needs.deploy-to-environment.result }}\" != \"success\" ]]; then\n  overall_status=\"failure\"\nelif [[ \"${{ needs.post-deployment-tests.result }}\" == \"failure\" ]]; then\n  overall_status=\"warning\"\nfi\n\ncat > deployment-report.md << EOF\n# \U0001F680 Deployment Report\n\n## \U0001F4CA Deployment Summary / デプロイ概要\n\n- **Environment**: ${{ needs.deployment-gate.outputs.deploy_environment }}\n- **Status**: $([ \"$overall_status\" == \"success\" ] && echo \"✅ SUCCESS\" || [ \"$overall_status\" == \"warning\" ] && echo \"⚠️ WARNING\" || echo \"❌ FAILURE\")\n- **Deployment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n- **Branch**: ${{ github.ref_name }}\n- **Commit**: ${{ github.sha }}\n- **Actor**: ${{ github.actor }}\n\n## \U0001F3AF Job Results / ジョブ結果\n\n| Stage | Status | Details |\n|-------|--------|---------|\n| **Quality Gate** | ${{ needs.deployment-gate.result }} | Score: ${{ needs.deployment-gate.outputs.quality_score }}/100 |\n| **Build** | ${{ needs.build-for-deployment.result }} | Application built for ${{ needs.deployment-gate.outputs.deploy_environment }} |\n| **Deployment** | ${{ needs.deploy-to-environment.result }} | Deployed to ${{ needs.deployment-gate.outputs.deploy_environment }} |\n| **Post-Deploy Tests** | ${{ needs.post-deployment-tests.result }} | Health & smoke tests |\n\n## \U0001F517 Access Information / アクセス情報\n\nEOF\n\n# 環境別のアクセス情報\nenvironment=\"${{ needs.deployment-gate.outputs.deploy_environment }}\"\ncase \"$environment\" in\n  \"production\")\n    echo \"- **Production URL**: ${{ env.PRODUCTION_URL }}\" >> deployment-report.md\n    ;;\n  \"staging\")\n    echo \"- **Staging URL**: ${{ env.STAGING_URL }}\" >> deployment-report.md\n    ;;\n  *)\n    echo \"- **Preview URL**: Available in environment logs\" >> deployment-report.md\n    ;;\nesac\n\ncat >> deployment-report.md << EOF\n\n## \U0001F4C8 Performance Metrics / パフォーマンス指標\n\nEOF\n\nif [[ \"${{ needs.post-deployment-tests.result }}\" == \"success\" ]]; then\n  cat >> deployment-report.md << EOF\n- **Health Status**: ${{ needs.post-deployment-tests.outputs.health_status || 'N/A' }}\n- **Response Time**: ${{ needs.post-deployment-tests.outputs.response_time_ms || 'N/A' }}ms\n- **Performance Status**: ${{ needs.post-deployment-tests.outputs.performance_status || 'N/A' }}\nEOF\nelse\n  echo \"- **Post-deployment tests**: Skipped or failed\" >> deployment-report.md\nfi\n\ncat >> deployment-report.md << EOF\n\n## \U0001F3AF Next Steps / 次のステップ\n\nEOF\n\nif [[ \"$overall_status\" == \"success\" ]]; then\n  cat >> deployment-report.md << EOF\n✅ **Deployment successful** - All systems operational\n\n- Monitor application performance\n- Verify user functionality\n- Check error logs periodically\nEOF\nelif [[ \"$overall_status\" == \"warning\" ]]; then\n  cat >> deployment-report.md << EOF\n⚠️ **Deployment completed with warnings** - Review required\n\n- Check post-deployment test results\n- Monitor application behavior\n- Consider rollback if issues persist\nEOF\nelse\n  cat >> deployment-report.md << EOF\n❌ **Deployment failed** - Immediate action required\n\n- Review deployment logs\n- Check application configuration\n- Prepare rollback plan\n- Notify stakeholders\nEOF\nfi\n\necho \"\" >> deployment-report.md\necho \"---\" >> deployment-report.md\necho \"*Generated by Continuous Deployment Pipeline at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*\" >> deployment-report.md\n"
      - name: "\U0001F6A8 Create Deployment Issue"
        if: needs.deploy-to-environment.result == 'failure' || (needs.post-deployment-tests.result == 'failure' && github.event.inputs.skip_tests != 'true')
        uses: actions/github-script@v7
        with:
          github-token: '${{ github.token }}'
          script: "const environment = '${{ needs.deployment-gate.outputs.deploy_environment }}';\nconst deployResult = '${{ needs.deploy-to-environment.result }}';\nconst testResult = '${{ needs.post-deployment-tests.result }}';\n\nlet priority = 'high';\nif (environment === 'production') {\n  priority = 'critical';\n}\n\nawait github.rest.issues.create({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  title: `\U0001F6A8 Deployment Failure - ${environment.toUpperCase()} Environment`,\n  body: `\n## \U0001F6A8 Deployment Failure Alert\n\n**Environment**: ${environment}\n**Priority**: ${priority.toUpperCase()}\n**Failure Time**: ${new Date().toISOString()}\n**Commit**: ${context.sha}\n**Actor**: ${context.actor}\n\n### \U0001F4CA Failure Details\n- **Deployment Job**: ${deployResult}\n- **Post-Deploy Tests**: ${testResult}\n- **Workflow Run**: ${context.runId}\n\n### \U0001F50D Investigation Steps\n1. Check deployment logs in workflow run\n2. Verify application configuration\n3. Test deployment process in staging\n4. Review recent code changes\n5. Check external dependencies\n\n### \U0001F3AF Recovery Actions\n1. **Immediate**: Assess impact and communicate to stakeholders\n2. **Short-term**: Implement hotfix or rollback as needed\n3. **Long-term**: Update deployment process to prevent recurrence\n\n**This issue was automatically created by the CD pipeline.**\n  `,\n  labels: ['deployment', 'failure', priority, 'auto-generated']\n});\n"
      - name: "\U0001F4E4 Upload Deployment Report"
        uses: actions/upload-artifact@v4
        with:
          name: 'deployment-report-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}'
          path: deployment-report.md
          retention-days: 90
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
