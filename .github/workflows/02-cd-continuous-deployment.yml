name: 🚀 [CD] Continuous Deployment / 継続的デプロイメント
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  issues: write
"on":
  workflow_run:
    workflows:
      - 🔄 [CI] Continuous Integration / 継続的インテグレーション
    types:
      - completed
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment / デプロイ環境
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
          - preview
      force_deploy:
        description: Force deployment / 強制デプロイ
        required: false
        default: false
        type: boolean
      skip_tests:
        description: Skip deployment tests / デプロイテストスキップ
        required: false
        default: false
        type: boolean
env:
  STAGING_URL: https://yusuke-kurosawa.github.io/PMPLearningManagement/staging
  PRODUCTION_URL: https://yusuke-kurosawa.github.io/PMPLearningManagement/
  DEPLOY_TIMEOUT: 600
  HEALTH_CHECK_RETRIES: 10
  HEALTH_CHECK_INTERVAL: 30
jobs:
  deployment-gate:
    name: "🔧 デプロイ: deployment-gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_environment: ${{ steps.determine-env.outputs.environment }}
      deploy_ready: ${{ steps.gate-check.outputs.ready }}
      ci_status: ${{ steps.check-ci.outputs.status }}
      quality_score: ${{ steps.quality-assessment.outputs.score }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: 🔍 Check CI Status
        id: check-ci
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // CI実行結果の確認
            const { owner, repo } = context.repo;
            const sha = context.sha;

            console.log(`Checking CI status for commit: ${sha}`);

            // 最新のCI実行結果を取得
            const checkRuns = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              status: 'completed'
            });

            const ciRuns = checkRuns.data.check_runs.filter(run => 
              run.name.includes('CI') || run.name.includes('Continuous Integration')
            );

            let ciStatus = 'unknown';
            let successfulRuns = 0;
            let totalRuns = ciRuns.length;

            for (const run of ciRuns) {
              console.log(`CI Run: ${run.name} - ${run.conclusion}`);
              if (run.conclusion === 'success') {
                successfulRuns++;
              }
            }

            if (totalRuns === 0) {
              ciStatus = 'no-ci-runs';
            } else if (successfulRuns === totalRuns) {
              ciStatus = 'success';
            } else {
              ciStatus = 'failure';
            }

            console.log(`CI Status: ${ciStatus} (${successfulRuns}/${totalRuns})`);
            core.setOutput('status', ciStatus);
            core.setOutput('successful_runs', successfulRuns);
            core.setOutput('total_runs', totalRuns);
      - name: 🎯 Determine Deployment Environment
        id: determine-env
        run: |
          echo "🎯 Determining deployment environment..."

          # 環境決定ロジック
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ github.event.inputs.environment }}"
            echo "📋 Manual deployment to: $environment"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            environment="production"
            echo "📦 Release deployment to: $environment"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            environment="production"
            echo "🎯 Main branch deployment to: $environment"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            environment="staging"
            echo "🧪 Develop branch deployment to: $environment"
          else
            environment="preview"
            echo "👀 Feature branch deployment to: $environment"
          fi

          echo "environment=$environment" >> $GITHUB_OUTPUT
          echo "🎯 Target environment: $environment"
      - name: 📊 Quality Assessment
        id: quality-assessment
        run: >
          echo "📊 Assessing deployment quality..."


          quality_score=100

          quality_issues=()


          # CI結果による評価

          ci_status="${{ steps.check-ci.outputs.status }}"

          case "$ci_status" in
            "success")
              echo "✅ CI checks passed"
              ;;
            "failure")
              echo "❌ CI checks failed"
              quality_score=$((quality_score - 30))
              quality_issues+=("ci-failed")
              ;;
            "no-ci-runs")
              echo "⚠️ No CI runs found"
              quality_score=$((quality_score - 20))
              quality_issues+=("no-ci")
              ;;
          esac


          # ブランチ保護ルール確認

          if [[ "${{ github.ref }}" == "refs/heads/main" ]] && [[ "${{ steps.check-ci.outputs.status }}" != "success"
          ]]; then
            echo "❌ Main branch deployment without successful CI"
            quality_score=$((quality_score - 40))
            quality_issues+=("unsafe-main-deploy")
          fi


          # 強制デプロイチェック

          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "⚠️ Force deployment requested"
            quality_score=$((quality_score - 10))
            quality_issues+=("force-deploy")
          fi


          echo "📊 Quality Score: ${quality_score}/100"

          echo "score=$quality_score" >> $GITHUB_OUTPUT

          echo "issues=${quality_issues[*]}" >> $GITHUB_OUTPUT
      - name: 🚪 Deployment Gate Decision
        id: gate-check
        run: |
          echo "🚪 Making deployment gate decision..."

          quality_score="${{ steps.quality-assessment.outputs.score }}"
          environment="${{ steps.determine-env.outputs.environment }}"
          force_deploy="${{ github.event.inputs.force_deploy }}"

          # 環境別の品質閾値
          case "$environment" in
            "production")
              required_score=85
              echo "🎯 Production deployment - High quality required (${required_score}+)"
              ;;
            "staging")
              required_score=70
              echo "🧪 Staging deployment - Medium quality required (${required_score}+)"
              ;;
            "preview")
              required_score=50
              echo "👀 Preview deployment - Basic quality required (${required_score}+)"
              ;;
          esac

          # ゲート判定
          deploy_ready="false"

          if [[ $quality_score -ge $required_score ]]; then
            echo "✅ Quality gate passed: ${quality_score} >= ${required_score}"
            deploy_ready="true"
          elif [[ "$force_deploy" == "true" ]]; then
            echo "⚠️ Quality gate bypassed by force deployment"
            deploy_ready="true"
          else
            echo "❌ Quality gate failed: ${quality_score} < ${required_score}"
            deploy_ready="false"
          fi

          echo "ready=$deploy_ready" >> $GITHUB_OUTPUT
          echo "required_score=$required_score" >> $GITHUB_OUTPUT

          if [[ "$deploy_ready" == "false" ]]; then
            echo "🚫 Deployment blocked by quality gate"
            exit 1
          else
            echo "🚀 Deployment approved"
          fi
  build-for-deployment:
    name: "🔧 ビルド: build-for-deployment"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deployment-gate
    if: needs.deployment-gate.outputs.deploy_ready == 'true'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - name: 📦 Install Dependencies
        run: |
          echo "📦 Installing dependencies for deployment build..."
          npm ci --only=production
      - name: 🏗️ Environment-specific Build
        run: |
          echo "🏗️ Building for environment: ${{ needs.deployment-gate.outputs.deploy_environment }}"

          # 環境変数設定
          environment="${{ needs.deployment-gate.outputs.deploy_environment }}"

          case "$environment" in
            "production")
              echo "🎯 Production build configuration"
              export NODE_ENV=production
              export VITE_ENV=production
              export VITE_BASE_URL="${{ env.PRODUCTION_URL }}"
              ;;
            "staging")
              echo "🧪 Staging build configuration"
              export NODE_ENV=production
              export VITE_ENV=staging
              export VITE_BASE_URL="${{ env.STAGING_URL }}"
              ;;
            "preview")
              echo "👀 Preview build configuration"
              export NODE_ENV=production
              export VITE_ENV=preview
              export VITE_BASE_URL="https://yusuke-kurosawa.github.io/PMPLearningManagement/preview"
              ;;
          esac

          # 最適化ビルド実行
          npm run build

          # ビルド結果の検証
          if [[ -d "dist" ]]; then
            echo "✅ Build successful"
            echo "📊 Build size analysis:"
            du -sh dist/
            ls -la dist/
          else
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi
        id: build
      - name: 📦 Prepare Deployment Artifacts
        run: |
          echo "📦 Preparing deployment artifacts..."

          # デプロイメント情報ファイル作成
          cat > dist/deployment-info.json << EOF
          {
            "environment": "${{ needs.deployment-gate.outputs.deploy_environment }}",
            "commit_sha": "${{ github.sha }}",
            "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF

          # ヘルスチェックエンドポイント
          cat > dist/health.json << EOF
          {
            "status": "healthy",
            "version": "${{ github.sha }}",
            "environment": "${{ needs.deployment-gate.outputs.deploy_environment }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "✅ Deployment artifacts prepared"
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-build-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}
          path: dist/
          retention-days: 30
  deploy-to-environment:
    name: "🔧 デプロイ: deploy-to-environment"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - deployment-gate
      - build-for-deployment
    environment: ${{ needs.deployment-gate.outputs.deploy_environment }}
    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-build-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}
          path: dist/
      - name: 📄 Setup GitHub Pages
        if: needs.deployment-gate.outputs.deploy_environment == 'production'
        uses: actions/configure-pages@v4
      - name: 🚀 Deploy to GitHub Pages
        if: needs.deployment-gate.outputs.deploy_environment == 'production'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: deployment-build-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}
          preview: false
        id: pages-deployment
      - name: 🧪 Deploy to ${{ needs.deployment-gate.outputs.deploy_environment }}
        if: needs.deployment-gate.outputs.deploy_environment != 'production'
        run: |
          echo "🧪 Deploying to ${{ needs.deployment-gate.outputs.deploy_environment }} environment..."

          # 環境別のデプロイ処理（GitHub Pagesの場合はシミュレーション）
          environment="${{ needs.deployment-gate.outputs.deploy_environment }}"

          case "$environment" in
            "staging")
              echo "🧪 Staging deployment simulation"
              # 実際のstagingデプロイロジック
              echo "Would deploy to: ${{ env.STAGING_URL }}"
              ;;
            "preview")
              echo "👀 Preview deployment simulation"
              # 実際のpreviewデプロイロジック
              echo "Would deploy to preview environment"
              ;;
          esac

          # デプロイ結果のシミュレーション
          echo "✅ Deployment to $environment completed successfully"
          echo "deployment_url=${{ env.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
        id: alt-deployment
  post-deployment-tests:
    name: "🔧 テスト: post-deployment-tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deployment-gate
      - deploy-to-environment
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: 🏥 Health Check
        run: |
          echo "🏥 Performing post-deployment health check..."

          # デプロイURL決定
          environment="${{ needs.deployment-gate.outputs.deploy_environment }}"
          case "$environment" in
            "production")
              target_url="${{ env.PRODUCTION_URL }}"
              ;;
            "staging")
              target_url="${{ env.STAGING_URL }}"
              ;;
            *)
              target_url="${{ env.PRODUCTION_URL }}"
              ;;
          esac

          echo "🎯 Testing URL: $target_url"

          # ヘルスチェック実行
          retry_count=0
          max_retries=${{ env.HEALTH_CHECK_RETRIES }}

          while [[ $retry_count -lt $max_retries ]]; do
            echo "🔍 Health check attempt $((retry_count + 1))/$max_retries..."
            
            if curl -f -s -o /dev/null -w "%{http_code}" "$target_url" | grep -q "200"; then
              echo "✅ Health check passed"
              health_status="healthy"
              break
            else
              echo "⚠️ Health check failed, retrying in ${{ env.HEALTH_CHECK_INTERVAL }}s..."
              sleep ${{ env.HEALTH_CHECK_INTERVAL }}
              retry_count=$((retry_count + 1))
            fi
          done

          if [[ $retry_count -eq $max_retries ]]; then
            echo "❌ Health check failed after $max_retries attempts"
            health_status="unhealthy"
            exit 1
          fi

          echo "health_status=$health_status" >> $GITHUB_OUTPUT
        id: health-check
      - name: 💨 Smoke Tests
        run: |
          echo "💨 Running smoke tests..."

          target_url="${{ env.PRODUCTION_URL }}"

          # 基本機能テスト
          echo "🧪 Testing basic functionality..."

          # HTMLコンテンツ確認
          if curl -s "$target_url" | grep -q "<title>"; then
            echo "✅ HTML content loaded"
          else
            echo "❌ HTML content not found"
            exit 1
          fi

          # JavaScript実行確認（基本チェック）
          if curl -s "$target_url" | grep -q "script"; then
            echo "✅ JavaScript files referenced"
          else
            echo "⚠️ No JavaScript references found"
          fi

          # CSS実行確認
          if curl -s "$target_url" | grep -q "stylesheet"; then
            echo "✅ CSS files referenced"
          else
            echo "⚠️ No CSS references found"
          fi

          echo "✅ Smoke tests completed"
        id: smoke-tests
      - name: ⚡ Performance Check
        run: |
          echo "⚡ Running basic performance check..."

          target_url="${{ env.PRODUCTION_URL }}"

          # 応答時間測定
          response_time=$(curl -o /dev/null -s -w "%{time_total}" "$target_url")
          response_time_ms=$(echo "$response_time * 1000" | bc -l | cut -d. -f1)

          echo "📊 Response time: ${response_time_ms}ms"

          # パフォーマンス閾値チェック
          if [[ $response_time_ms -lt 3000 ]]; then
            echo "✅ Performance within acceptable range"
            performance_status="good"
          elif [[ $response_time_ms -lt 5000 ]]; then
            echo "⚠️ Performance needs improvement"
            performance_status="warning"
          else
            echo "❌ Performance below acceptable threshold"
            performance_status="poor"
          fi

          echo "performance_status=$performance_status" >> $GITHUB_OUTPUT
          echo "response_time_ms=$response_time_ms" >> $GITHUB_OUTPUT
        id: performance-check
  deployment-notification:
    name: "🔧 デプロイ: deployment-notification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - deployment-gate
      - build-for-deployment
      - deploy-to-environment
      - post-deployment-tests
    if: always()
    steps:
      - name: 📋 Generate Deployment Report
        run: >
          echo "📋 Generating deployment report..."


          # 全体的な成功/失敗判定

          overall_status="success"

          if [[ "${{ needs.deploy-to-environment.result }}" != "success" ]]; then
            overall_status="failure"
          elif [[ "${{ needs.post-deployment-tests.result }}" == "failure" ]]; then
            overall_status="warning"
          fi


          cat > deployment-report.md << EOF

          # 🚀 Deployment Report


          ## 📊 Deployment Summary / デプロイ概要


          - **Environment**: ${{ needs.deployment-gate.outputs.deploy_environment }}

          - **Status**: $([ "$overall_status" == "success" ] && echo "✅ SUCCESS" || [ "$overall_status" == "warning" ]
          && echo "⚠️ WARNING" || echo "❌ FAILURE")

          - **Deployment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          - **Branch**: ${{ github.ref_name }}

          - **Commit**: ${{ github.sha }}

          - **Actor**: ${{ github.actor }}


          ## 🎯 Job Results / ジョブ結果


          | Stage | Status | Details |

          |-------|--------|---------|

          | **Quality Gate** | ${{ needs.deployment-gate.result }} | Score: ${{
          needs.deployment-gate.outputs.quality_score }}/100 |

          | **Build** | ${{ needs.build-for-deployment.result }} | Application built for ${{
          needs.deployment-gate.outputs.deploy_environment }} |

          | **Deployment** | ${{ needs.deploy-to-environment.result }} | Deployed to ${{
          needs.deployment-gate.outputs.deploy_environment }} |

          | **Post-Deploy Tests** | ${{ needs.post-deployment-tests.result }} | Health & smoke tests |


          ## 🔗 Access Information / アクセス情報


          EOF


          # 環境別のアクセス情報

          environment="${{ needs.deployment-gate.outputs.deploy_environment }}"

          case "$environment" in
            "production")
              echo "- **Production URL**: ${{ env.PRODUCTION_URL }}" >> deployment-report.md
              ;;
            "staging")
              echo "- **Staging URL**: ${{ env.STAGING_URL }}" >> deployment-report.md
              ;;
            *)
              echo "- **Preview URL**: Available in environment logs" >> deployment-report.md
              ;;
          esac


          cat >> deployment-report.md << EOF


          ## 📈 Performance Metrics / パフォーマンス指標


          EOF


          if [[ "${{ needs.post-deployment-tests.result }}" == "success" ]]; then
            cat >> deployment-report.md << EOF
          - **Health Status**: ${{ needs.post-deployment-tests.outputs.health_status || 'N/A' }}

          - **Response Time**: ${{ needs.post-deployment-tests.outputs.response_time_ms || 'N/A' }}ms

          - **Performance Status**: ${{ needs.post-deployment-tests.outputs.performance_status || 'N/A' }}

          EOF

          else
            echo "- **Post-deployment tests**: Skipped or failed" >> deployment-report.md
          fi


          cat >> deployment-report.md << EOF


          ## 🎯 Next Steps / 次のステップ


          EOF


          if [[ "$overall_status" == "success" ]]; then
            cat >> deployment-report.md << EOF
          ✅ **Deployment successful** - All systems operational


          - Monitor application performance

          - Verify user functionality

          - Check error logs periodically

          EOF

          elif [[ "$overall_status" == "warning" ]]; then
            cat >> deployment-report.md << EOF
          ⚠️ **Deployment completed with warnings** - Review required


          - Check post-deployment test results

          - Monitor application behavior

          - Consider rollback if issues persist

          EOF

          else
            cat >> deployment-report.md << EOF
          ❌ **Deployment failed** - Immediate action required


          - Review deployment logs

          - Check application configuration

          - Prepare rollback plan

          - Notify stakeholders

          EOF

          fi


          echo "" >> deployment-report.md

          echo "---" >> deployment-report.md

          echo "*Generated by Continuous Deployment Pipeline at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >>
          deployment-report.md
      - name: 🚨 Create Deployment Issue
        if: >-
          needs.deploy-to-environment.result == 'failure' || (needs.post-deployment-tests.result == 'failure' &&
          github.event.inputs.skip_tests != 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const environment = '${{ needs.deployment-gate.outputs.deploy_environment }}';
            const deployResult = '${{ needs.deploy-to-environment.result }}';
            const testResult = '${{ needs.post-deployment-tests.result }}';

            let priority = 'high';
            if (environment === 'production') {
              priority = 'critical';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deployment Failure - ${environment.toUpperCase()} Environment`,
              body: `
            ## 🚨 Deployment Failure Alert

            **Environment**: ${environment}
            **Priority**: ${priority.toUpperCase()}
            **Failure Time**: ${new Date().toISOString()}
            **Commit**: ${context.sha}
            **Actor**: ${context.actor}

            ### 📊 Failure Details
            - **Deployment Job**: ${deployResult}
            - **Post-Deploy Tests**: ${testResult}
            - **Workflow Run**: ${context.runId}

            ### 🔍 Investigation Steps
            1. Check deployment logs in workflow run
            2. Verify application configuration
            3. Test deployment process in staging
            4. Review recent code changes
            5. Check external dependencies

            ### 🎯 Recovery Actions
            1. **Immediate**: Assess impact and communicate to stakeholders
            2. **Short-term**: Implement hotfix or rollback as needed
            3. **Long-term**: Update deployment process to prevent recurrence

            **This issue was automatically created by the CD pipeline.**
              `,
              labels: ['deployment', 'failure', priority, 'auto-generated']
            });
      - name: 📤 Upload Deployment Report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ needs.deployment-gate.outputs.deploy_environment }}-${{ github.run_id }}
          path: deployment-report.md
          retention-days: 90
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
