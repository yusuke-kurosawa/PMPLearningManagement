      - name: AI Impact Analysis
        run: |
          echo "🧠 Performing AI-powered chaos impact analysis..."
          
          python3 << 'EOF'
import json
import glob
import statistics
from datetime import datetime

# Load all chaos results
chaos_results = []
for file in glob.glob('chaos-results/chaos-result-*.json'):
    with open(file, 'r') as f:
        chaos_results.append(json.load(f))

print(f"📊 Analyzing {len(chaos_results)} chaos experiments...")

# AI-powered analysis
def calculate_system_resilience(results):
    resilience_scores = [r['resilience_score'] for r in results]
    recovery_times = [r['recovery_time'] for r in results]
    
    avg_resilience = statistics.mean(resilience_scores)
    avg_recovery = statistics.mean(recovery_times)
    
    # AI scoring algorithm
    overall_score = (avg_resilience * 0.7) + ((100 - avg_recovery) * 0.3)
    
    return {
        "overall_resilience_score": round(overall_score, 2),
        "average_recovery_time": round(avg_recovery, 1),
        "resilience_consistency": round(statistics.stdev(resilience_scores), 2)
    }

# Generate comprehensive analysis
analysis = {
    "analysis_timestamp": datetime.now().isoformat(),
    "chaos_experiments_count": len(chaos_results),
    "system_resilience": calculate_system_resilience(chaos_results),
    "scenario_breakdown": {},
    "ai_recommendations": []
}

# Analyze each scenario
for result in chaos_results:
    scenario = result['scenario']
    analysis["scenario_breakdown"][scenario] = {
        "resilience_score": result['resilience_score'],
        "recovery_time": result['recovery_time'],
        "final_availability": result['final_metrics']['availability']
    }

# AI-generated recommendations
if analysis["system_resilience"]["overall_resilience_score"] > 90:
    analysis["ai_recommendations"].append("🏆 Excellent resilience! Consider expanding chaos testing scope")
elif analysis["system_resilience"]["overall_resilience_score"] > 80:
    analysis["ai_recommendations"].extend([
        "🔧 Good resilience with room for improvement",
        "📈 Focus on reducing recovery times",
        "🔄 Implement automated failover mechanisms"
    ])
else:
    analysis["ai_recommendations"].extend([
        "⚠️ Critical resilience gaps detected",
        "🚨 Immediate action required for system stability",
        "🛠️ Implement comprehensive monitoring and alerting"
    ])

print("🎯 AI Chaos Analysis Results:")
print(json.dumps(analysis, indent=2))

with open('chaos-analysis-report.json', 'w') as f:
    json.dump(analysis, f, indent=2)
EOF
          
