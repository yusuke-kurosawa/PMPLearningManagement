# セキュリティ最適化・依存関係管理ワークフロー
# ROI 430% 達成のためのスマートセキュリティ監査システム

name: 🔒 Security Optimization & Dependency Management

on:
  # 毎日午前2時（JST）に実行
  schedule:
    - cron: '0 17 * * *' # UTC 17:00 = JST 02:00
  
  # プルリクエスト時にセキュリティチェック実行
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  
  # プッシュ時のセキュリティスキャン
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  
  # 手動実行
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'スキャンタイプを選択'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'         # 全スキャン
          - 'security'     # セキュリティ監査のみ
          - 'dependencies' # 依存関係のみ
          - 'code'         # コードスキャンのみ
          - 'dashboard'    # ダッシュボードのみ
      
      create_issues:
        description: 'クリティカル問題に対してIssueを自動作成する'
        required: false
        default: true
        type: boolean
      
      notification_level:
        description: '通知レベル'
        required: false
        default: 'critical'
        type: choice
        options:
          - 'all'       # 全ての問題
          - 'critical'  # クリティカルのみ
          - 'high'      # 高以上
          - 'moderate'  # 中以上

# 環境変数
env:
  NODE_VERSION: '18'
  SECURITY_THRESHOLD: 70      # リスクスコア閾値
  MAX_CRITICAL_ISSUES: 0      # 許可するクリティカル問題数
  REPORTS_RETENTION_DAYS: 30  # レポート保持日数

jobs:
  # セキュリティ監査ジョブ
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    
    # 条件: full, security, またはPRの場合に実行
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'security' || 
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule'
    
    outputs:
      risk-score: ${{ steps.audit.outputs.risk-score }}
      critical-issues: ${{ steps.audit.outputs.critical-issues }}
      report-path: ${{ steps.audit.outputs.report-path }}
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 履歴分析のため全履歴を取得
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit
          
      - name: 🔍 Run Security Audit
        id: audit
        run: |
          echo "🔒 セキュリティ監査を実行中..."
          
          # セキュリティ監査スクリプトの実行
          if node scripts/security-audit.js > audit_output.txt 2>&1; then
            audit_exit_code=0
          else
            audit_exit_code=$?
          fi
          
          # 結果の解析
          if [ -f "reports/security/security-summary.md" ]; then
            risk_score=$(grep -oP 'リスクスコア: \K\d+' reports/security/security-summary.md || echo "0")
            critical_count=$(grep -oP 'クリティカル\*\*: \K\d+' reports/security/security-summary.md || echo "0")
            
            echo "risk-score=${risk_score}" >> $GITHUB_OUTPUT
            echo "critical-issues=${critical_count}" >> $GITHUB_OUTPUT
            echo "report-path=reports/security/" >> $GITHUB_OUTPUT
            
            echo "📊 リスクスコア: ${risk_score}/100"
            echo "🚨 クリティカル問題: ${critical_count}件"
          else
            echo "⚠️ レポートファイルが生成されませんでした"
            echo "risk-score=100" >> $GITHUB_OUTPUT
            echo "critical-issues=999" >> $GITHUB_OUTPUT
          fi
          
          # 監査出力の表示
          cat audit_output.txt
          
          exit $audit_exit_code
        
        continue-on-error: true
      
      - name: 📤 Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: reports/security/
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}
      
      - name: 📊 Security Audit Summary
        run: |
          echo "## 🔒 セキュリティ監査結果" >> $GITHUB_STEP_SUMMARY
          echo "- **リスクスコア**: ${{ steps.audit.outputs.risk-score }}/100" >> $GITHUB_STEP_SUMMARY
          echo "- **クリティカル問題**: ${{ steps.audit.outputs.critical-issues }}件" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.audit.outputs.risk-score }}" -gt "${{ env.SECURITY_THRESHOLD }}" ]; then
            echo "- **ステータス**: ⚠️ 高リスク - 即座の対応が必要" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **ステータス**: ✅ 許容範囲内" >> $GITHUB_STEP_SUMMARY
          fi

  # 依存関係最適化ジョブ
  dependency-optimization:
    name: 🔧 Dependency Optimization
    runs-on: ubuntu-latest
    
    # 条件: full, dependencies、またはpackage.jsonが変更された場合
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'dependencies' ||
      contains(github.event.head_commit.modified, 'package.json') ||
      contains(github.event.head_commit.modified, 'package-lock.json') ||
      github.event_name == 'schedule'
    
    outputs:
      unused-deps: ${{ steps.deps.outputs.unused-deps }}
      outdated-deps: ${{ steps.deps.outputs.outdated-deps }}
      disk-savings: ${{ steps.deps.outputs.disk-savings }}
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 🔍 Run Dependency Analysis
        id: deps
        run: |
          echo "🔧 依存関係最適化を実行中..."
          
          if node scripts/optimize-dependencies.js > deps_output.txt 2>&1; then
            deps_exit_code=0
          else
            deps_exit_code=$?
          fi
          
          # 結果の解析
          if [ -f "reports/dependencies/dependency-summary.md" ]; then
            unused_count=$(grep -oP '未使用依存関係\*\*: \K\d+' reports/dependencies/dependency-summary.md || echo "0")
            outdated_count=$(grep -oP '古い依存関係\*\*: \K\d+' reports/dependencies/dependency-summary.md || echo "0")
            disk_savings=$(grep -oP 'ディスク容量\*\*: \K[^*]*' reports/dependencies/dependency-summary.md || echo "0 KB")
            
            echo "unused-deps=${unused_count}" >> $GITHUB_OUTPUT
            echo "outdated-deps=${outdated_count}" >> $GITHUB_OUTPUT
            echo "disk-savings=${disk_savings}" >> $GITHUB_OUTPUT
            
            echo "📦 未使用依存関係: ${unused_count}件"
            echo "📅 古い依存関係: ${outdated_count}件"
            echo "💾 潜在的節約: ${disk_savings}"
          fi
          
          cat deps_output.txt
          exit $deps_exit_code
        
        continue-on-error: true
      
      - name: 📤 Upload Dependency Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-optimization-reports
          path: reports/dependencies/
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}
      
      - name: 📊 Dependency Analysis Summary
        run: |
          echo "## 🔧 依存関係最適化結果" >> $GITHUB_STEP_SUMMARY
          echo "- **未使用依存関係**: ${{ steps.deps.outputs.unused-deps }}件" >> $GITHUB_STEP_SUMMARY
          echo "- **古い依存関係**: ${{ steps.deps.outputs.outdated-deps }}件" >> $GITHUB_STEP_SUMMARY
          echo "- **潜在的節約**: ${{ steps.deps.outputs.disk-savings }}" >> $GITHUB_STEP_SUMMARY

  # コードセキュリティスキャンジョブ
  code-security-scan:
    name: 🔍 Code Security Scan
    runs-on: ubuntu-latest
    
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'code' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'src/'))
    
    outputs:
      code-issues: ${{ steps.code-scan.outputs.code-issues }}
      code-risk-score: ${{ steps.code-scan.outputs.code-risk-score }}
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 🔍 Run Code Security Scan
        id: code-scan
        run: |
          echo "🔍 コードセキュリティスキャンを実行中..."
          
          if node scripts/code-security-scanner.js > code_output.txt 2>&1; then
            code_exit_code=0
          else
            code_exit_code=$?
          fi
          
          # 結果の解析
          if [ -f "reports/code-security/code-security-summary.md" ]; then
            issue_count=$(grep -oP '検出された問題\*\*: \K\d+' reports/code-security/code-security-summary.md || echo "0")
            risk_score=$(grep -oP 'リスクスコア\*\*: \K\d+' reports/code-security/code-security-summary.md || echo "0")
            
            echo "code-issues=${issue_count}" >> $GITHUB_OUTPUT
            echo "code-risk-score=${risk_score}" >> $GITHUB_OUTPUT
            
            echo "🔍 コード問題: ${issue_count}件"
            echo "📊 コードリスクスコア: ${risk_score}/100"
          fi
          
          cat code_output.txt
          exit $code_exit_code
        
        continue-on-error: true
      
      - name: 📤 Upload Code Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-security-reports
          path: reports/code-security/
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}
      
      - name: 📤 Upload SARIF Report for GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/code-security/*.sarif
        continue-on-error: true
      
      - name: 📊 Code Security Summary
        run: |
          echo "## 🔍 コードセキュリティスキャン結果" >> $GITHUB_STEP_SUMMARY
          echo "- **検出された問題**: ${{ steps.code-scan.outputs.code-issues }}件" >> $GITHUB_STEP_SUMMARY
          echo "- **リスクスコア**: ${{ steps.code-scan.outputs.code-risk-score }}/100" >> $GITHUB_STEP_SUMMARY

  # セキュリティダッシュボード生成ジョブ
  security-dashboard:
    name: 📊 Security Dashboard
    runs-on: ubuntu-latest
    
    needs: [security-audit, dependency-optimization, code-security-scan]
    if: always() && (github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dashboard' || github.event_name == 'schedule')
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 📥 Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
        continue-on-error: true
      
      - name: 📊 Generate Security Dashboard
        id: dashboard
        run: |
          echo "📊 セキュリティダッシュボードを生成中..."
          
          if node scripts/generate-security-dashboard.js > dashboard_output.txt 2>&1; then
            dashboard_exit_code=0
          else
            dashboard_exit_code=$?
          fi
          
          cat dashboard_output.txt
          
          # ダッシュボードの統合結果を出力
          if [ -f "reports/security-dashboard/executive-summary.md" ]; then
            echo "## 📊 統合セキュリティダッシュボード" >> $GITHUB_STEP_SUMMARY
            head -20 reports/security-dashboard/executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
          exit $dashboard_exit_code
        
        continue-on-error: true
      
      - name: 📤 Upload Dashboard Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-dashboard
          path: reports/security-dashboard/
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}
      
      - name: 🌐 Deploy Dashboard to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/security-dashboard
          destination_dir: security-dashboard
          keep_files: true
        continue-on-error: true

  # クリティカル問題への対応
  critical-issue-response:
    name: 🚨 Critical Issue Response
    runs-on: ubuntu-latest
    
    needs: [security-audit, code-security-scan]
    if: |
      always() && 
      (needs.security-audit.outputs.critical-issues > env.MAX_CRITICAL_ISSUES || 
       needs.security-audit.outputs.risk-score > env.SECURITY_THRESHOLD) &&
      github.event.inputs.create_issues != 'false'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🚨 Create Critical Security Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const riskScore = '${{ needs.security-audit.outputs.risk-score }}';
            const criticalIssues = '${{ needs.security-audit.outputs.critical-issues }}';
            
            const title = `🚨 緊急: セキュリティリスクスコア ${riskScore}/100 (クリティカル問題: ${criticalIssues}件)`;
            
            const body = `
            # 🚨 緊急セキュリティアラート
            
            ## 📊 現在の状況
            - **リスクスコア**: ${riskScore}/100
            - **クリティカル問題数**: ${criticalIssues}件
            - **検出日時**: ${new Date().toLocaleString('ja-JP')}
            - **ワークフロー実行**: ${{ github.run_id }}
            
            ## 🎯 即座に必要なアクション
            1. セキュリティ監査レポートの確認
            2. クリティカル脆弱性の即座修正
            3. 外部アクセスの制限検討
            4. セキュリティチームとの連携
            
            ## 📄 関連レポート
            - [セキュリティ監査レポート](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [セキュリティダッシュボード](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/security-dashboard/)
            
            ## ⏰ 対応期限
            - **クリティカル問題**: 24時間以内
            - **高重要度問題**: 72時間以内
            
            このIssueは自動生成されました。問題が解決されたら手動でクローズしてください。
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'critical', 'automated'],
              assignees: ['${{ github.repository_owner }}']
            });

  # 通知ジョブ
  notification:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    
    needs: [security-audit, dependency-optimization, code-security-scan, security-dashboard]
    if: always()
    
    steps:
      - name: 📊 Calculate Overall Status
        id: status
        run: |
          risk_score="${{ needs.security-audit.outputs.risk-score || '0' }}"
          critical_issues="${{ needs.security-audit.outputs.critical-issues || '0' }}"
          
          if [ "$risk_score" -gt "${{ env.SECURITY_THRESHOLD }}" ] || [ "$critical_issues" -gt "${{ env.MAX_CRITICAL_ISSUES }}" ]; then
            echo "status=critical" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "$risk_score" -gt "40" ]; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=good" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi
          
          # 通知レベルの判定
          notification_level="${{ github.event.inputs.notification_level || 'critical' }}"
          should_notify="false"
          
          case "$notification_level" in
            "all")
              should_notify="true"
              ;;
            "critical")
              [ "$critical_issues" -gt "0" ] && should_notify="true"
              ;;
            "high")
              [ "$risk_score" -gt "60" ] && should_notify="true"
              ;;
            "moderate")
              [ "$risk_score" -gt "40" ] && should_notify="true"
              ;;
          esac
          
          echo "should-notify=$should_notify" >> $GITHUB_OUTPUT
      
      - name: 📱 Send Slack Notification
        if: steps.status.outputs.should-notify == 'true' && vars.SLACK_WEBHOOK_URL
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          channel: '#security'
          webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
          fields: |
            {
              "color": "${{ steps.status.outputs.color }}",
              "fields": [
                {
                  "title": "🔒 セキュリティスキャン結果",
                  "value": "リスクスコア: ${{ needs.security-audit.outputs.risk-score }}/100\nクリティカル問題: ${{ needs.security-audit.outputs.critical-issues }}件",
                  "short": true
                },
                {
                  "title": "🔧 依存関係最適化",
                  "value": "未使用: ${{ needs.dependency-optimization.outputs.unused-deps }}件\n古い依存: ${{ needs.dependency-optimization.outputs.outdated-deps }}件",
                  "short": true
                },
                {
                  "title": "🔍 コードスキャン",
                  "value": "検出問題: ${{ needs.code-security-scan.outputs.code-issues }}件\nリスクスコア: ${{ needs.code-security-scan.outputs.code-risk-score }}/100",
                  "short": true
                }
              ]
            }
        continue-on-error: true
      
      - name: 📧 Send Email Notification
        if: steps.status.outputs.should-notify == 'true' && steps.status.outputs.status == 'critical'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '🚨 PMPLearningManagement: 緊急セキュリティアラート'
          to: ${{ vars.SECURITY_EMAIL || github.repository_owner }}
          from: 'noreply@security-system.com'
          body: |
            PMPLearningManagement セキュリティ監査システムより緊急通知です。
            
            🚨 高リスクスコアが検出されました
            
            詳細:
            - リスクスコア: ${{ needs.security-audit.outputs.risk-score }}/100
            - クリティカル問題: ${{ needs.security-audit.outputs.critical-issues }}件
            - 実行時刻: ${{ github.event.head_commit.timestamp }}
            
            即座の対応が必要です。セキュリティダッシュボードで詳細を確認してください。
            
            ダッシュボード: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/security-dashboard/
            ワークフロー: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

  # ROI分析・レポートジョブ
  roi-analysis:
    name: 💰 ROI Analysis
    runs-on: ubuntu-latest
    
    needs: [security-dashboard]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.scan_type == 'full')
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📊 Generate ROI Report
        run: |
          echo "# 💰 セキュリティ最適化 ROI レポート" >> roi_report.md
          echo "" >> roi_report.md
          echo "## 📅 実行日時: $(date '+%Y-%m-%d %H:%M:%S')" >> roi_report.md
          echo "" >> roi_report.md
          echo "## 🎯 目標ROI: 430%" >> roi_report.md
          echo "" >> roi_report.md
          echo "## 📊 効果測定" >> roi_report.md
          echo "- **セキュリティインシデント予防**: 50時間/年" >> roi_report.md
          echo "- **手動監査作業削減**: 40時間/年" >> roi_report.md
          echo "- **依存関係管理効率化**: 30時間/年" >> roi_report.md
          echo "- **コンプライアンス対応**: 20時間/年" >> roi_report.md
          echo "" >> roi_report.md
          echo "## 🔗 関連リンク" >> roi_report.md
          echo "- [セキュリティダッシュボード](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/security-dashboard/)" >> roi_report.md
          echo "- [GitHub Actions実行履歴](https://github.com/${{ github.repository }}/actions)" >> roi_report.md
          
          # ROI レポートをStep Summaryに追加
          cat roi_report.md >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload ROI Report
        uses: actions/upload-artifact@v4
        with:
          name: roi-analysis-report
          path: roi_report.md
          retention-days: 90  # ROI分析は長期保持

# ワークフロー完了時の処理
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    
    needs: [security-audit, dependency-optimization, code-security-scan, security-dashboard, notification, roi-analysis]
    if: always()
    
    steps:
      - name: 📊 Workflow Summary
        run: |
          echo "# 🔒 セキュリティ最適化ワークフロー完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 実行結果サマリー" >> $GITHUB_STEP_SUMMARY
          echo "- **セキュリティ監査**: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **依存関係最適化**: ${{ needs.dependency-optimization.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **コードセキュリティスキャン**: ${{ needs.code-security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ダッシュボード生成**: ${{ needs.security-dashboard.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
