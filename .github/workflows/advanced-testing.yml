name: Advanced Testing Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - visual-regression
          - accessibility
          - cross-browser
          - performance

permissions:
  contents: read
  pages: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_type || 'all' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Setup and Build
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    outputs:
      should-run-visual: ${{ steps.determine.outputs.should-run-visual }}
      should-run-a11y: ${{ steps.determine.outputs.should-run-a11y }}
      should-run-cross-browser: ${{ steps.determine.outputs.should-run-cross-browser }}
      should-run-performance: ${{ steps.determine.outputs.should-run-performance }}
      
    steps:
      - name: Determine test scope
        id: determine
        run: |
          TEST_TYPE="${{ inputs.test_type || 'all' }}"
          IS_SCHEDULED="${{ github.event_name == 'schedule' }}"
          IS_MAIN="${{ github.ref == 'refs/heads/main' }}"
          
          # Default values
          VISUAL="false"
          A11Y="false"
          CROSS_BROWSER="false"
          PERFORMANCE="false"
          
          if [ "$TEST_TYPE" = "all" ] || [ "$IS_SCHEDULED" = "true" ]; then
            VISUAL="true"
            A11Y="true"
            CROSS_BROWSER="true"
            PERFORMANCE="true"
          else
            case "$TEST_TYPE" in
              "visual-regression") VISUAL="true" ;;
              "accessibility") A11Y="true" ;;
              "cross-browser") CROSS_BROWSER="true" ;;
              "performance") PERFORMANCE="true" ;;
            esac
          fi
          
          # Skip expensive tests on PR unless explicitly requested
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$TEST_TYPE" = "all" ]; then
            CROSS_BROWSER="false"
            PERFORMANCE="false"
          fi
          
          echo "should-run-visual=$VISUAL" >> $GITHUB_OUTPUT
          echo "should-run-a11y=$A11Y" >> $GITHUB_OUTPUT
          echo "should-run-cross-browser=$CROSS_BROWSER" >> $GITHUB_OUTPUT
          echo "should-run-performance=$PERFORMANCE" >> $GITHUB_OUTPUT
          
          echo "🧪 Test Configuration:"
          echo "  Visual Regression: $VISUAL"
          echo "  Accessibility: $A11Y"
          echo "  Cross Browser: $CROSS_BROWSER"
          echo "  Performance: $PERFORMANCE"

  # Build Application for Testing
  build-for-testing:
    name: Build for Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_APP_ENVIRONMENT: testing
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: dist/
          retention-days: 1

  # Visual Regression Testing
  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [setup, build-for-testing]
    if: needs.setup.outputs.should-run-visual == 'true'
    
    strategy:
      matrix:
        viewport: [
          { width: 1920, height: 1080, name: 'desktop' },
          { width: 1366, height: 768, name: 'laptop' },
          { width: 768, height: 1024, name: 'tablet' },
          { width: 375, height: 667, name: 'mobile' }
        ]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: test-build
          path: dist/
          
      - name: Install Playwright browsers
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium
          
      - name: Start test server
        run: |
          npm run preview &
          sleep 10
          curl -f http://localhost:4173 || (echo "Server failed to start" && exit 1)
        
      - name: Run visual regression tests
        run: |
          cat > playwright-visual.config.ts << 'EOF'
          import { defineConfig } from '@playwright/test';
          
          export default defineConfig({
            testDir: './tests/visual',
            timeout: 30 * 1000,
            expect: {
              toHaveScreenshot: { threshold: 0.2, mode: 'pixel' },
            },
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: 1,
            reporter: [
              ['html', { outputFolder: 'playwright-visual-report' }],
              ['json', { outputFile: 'visual-results.json' }]
            ],
            use: {
              baseURL: 'http://localhost:4173',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'retain-on-failure',
              viewport: { width: ${{ matrix.viewport.width }}, height: ${{ matrix.viewport.height }} },
            },
            projects: [
              {
                name: 'visual-${{ matrix.viewport.name }}',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
          });
          EOF
          
          # Create visual test directory if it doesn't exist
          mkdir -p tests/visual
          
          cat > tests/visual/pages.spec.ts << 'EOF'
          import { test, expect } from '@playwright/test';
          
          const pages = [
            { path: '/', name: 'home' },
            { path: '/#/matrix', name: 'pmbok-matrix' },
            { path: '/#/network', name: 'network-diagram' },
            { path: '/#/visualizations', name: 'visualizations' },
            { path: '/#/glossary', name: 'glossary' },
            { path: '/#/progress', name: 'progress' },
            { path: '/#/flashcards', name: 'flashcards' },
          ];
          
          for (const page of pages) {
            test(`Visual regression: ${page.name} - ${{ matrix.viewport.name }}`, async ({ page: pw }) => {
              await pw.goto(page.path);
              
              // Wait for page to load
              await pw.waitForLoadState('networkidle');
              
              // Wait for any animations to complete
              await pw.waitForTimeout(2000);
              
              // Hide any dynamic elements that might cause flaky tests
              await pw.addStyleTag({
                content: `
                  .animate-spin { animation: none !important; }
                  .transition-all { transition: none !important; }
                  .duration-300 { transition-duration: 0s !important; }
                `
              });
              
              // Take screenshot
              await expect(pw).toHaveScreenshot(`${page.name}-${{ matrix.viewport.name }}.png`, {
                fullPage: true,
                animations: 'disabled'
              });
            });
          }
          EOF
          
          npx playwright test --config=playwright-visual.config.ts
          
      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ matrix.viewport.name }}
          path: |
            playwright-visual-report/
            visual-results.json
            test-results/
          retention-days: 7

  # Accessibility Testing
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [setup, build-for-testing]
    if: needs.setup.outputs.should-run-a11y == 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @axe-core/cli lighthouse pa11y
          
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: test-build
          path: dist/
          
      - name: Install Playwright browsers
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium
          
      - name: Start test server
        run: |
          npm run preview &
          sleep 10
          curl -f http://localhost:4173 || (echo "Server failed to start" && exit 1)
          
      - name: Run Axe accessibility tests
        run: |
          mkdir -p accessibility-reports
          
          # Test key pages with axe-core
          PAGES=(
            "http://localhost:4173"
            "http://localhost:4173/#/matrix"
            "http://localhost:4173/#/network"
            "http://localhost:4173/#/visualizations"
            "http://localhost:4173/#/glossary"
            "http://localhost:4173/#/progress"
            "http://localhost:4173/#/flashcards"
          )
          
          for url in "${PAGES[@]}"; do
            PAGE_NAME=$(echo $url | sed 's/.*#\///g' | sed 's/.*4173\///g' | sed 's/^$/home/g')
            echo "Testing accessibility for: $PAGE_NAME"
            
            axe "$url" \
              --exit \
              --timeout 10000 \
              --save "accessibility-reports/axe-${PAGE_NAME}.json" \
              --reporter json || echo "Axe found issues in $PAGE_NAME"
          done
          
      - name: Run Pa11y accessibility tests
        run: |
          # Pa11y tests with different standards
          PAGES=(
            "http://localhost:4173"
            "http://localhost:4173/#/matrix"
            "http://localhost:4173/#/network"
          )
          
          for url in "${PAGES[@]}"; do
            PAGE_NAME=$(echo $url | sed 's/.*#\///g' | sed 's/.*4173\///g' | sed 's/^$/home/g')
            echo "Running Pa11y for: $PAGE_NAME"
            
            pa11y "$url" \
              --standard WCAG2AA \
              --timeout 10000 \
              --reporter json > "accessibility-reports/pa11y-${PAGE_NAME}.json" || echo "Pa11y found issues in $PAGE_NAME"
          done
          
      - name: Run Playwright accessibility tests
        run: |
          cat > playwright-a11y.config.ts << 'EOF'
          import { defineConfig } from '@playwright/test';
          
          export default defineConfig({
            testDir: './tests/accessibility',
            timeout: 30 * 1000,
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 1 : 0,
            workers: 1,
            reporter: [
              ['html', { outputFolder: 'playwright-a11y-report' }],
              ['json', { outputFile: 'a11y-results.json' }]
            ],
            use: {
              baseURL: 'http://localhost:4173',
              trace: 'retain-on-failure',
            },
          });
          EOF
          
          mkdir -p tests/accessibility
          
          cat > tests/accessibility/axe.spec.ts << 'EOF'
          import { test, expect } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          
          const pages = [
            { path: '/', name: 'home' },
            { path: '/#/matrix', name: 'pmbok-matrix' },
            { path: '/#/network', name: 'network-diagram' },
            { path: '/#/glossary', name: 'glossary' },
          ];
          
          for (const page of pages) {
            test(`Accessibility: ${page.name}`, async ({ page: pw }) => {
              await pw.goto(page.path);
              await pw.waitForLoadState('networkidle');
              
              const accessibilityScanResults = await new AxeBuilder({ page: pw })
                .withTags(['wcag2a', 'wcag2aa', 'wcag21aa'])
                .analyze();
              
              expect(accessibilityScanResults.violations).toEqual([]);
            });
          }
          EOF
          
          # Install axe-core for playwright
          npm install --save-dev @axe-core/playwright
          
          npx playwright test --config=playwright-a11y.config.ts
          
      - name: Generate accessibility report
        if: always()
        run: |
          cat > accessibility-reports/summary.json << 'EOF'
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "reports": {
              "axe": "Generated",
              "pa11y": "Generated",
              "playwright": "Generated"
            }
          }
          EOF
          
      - name: Upload accessibility test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: |
            accessibility-reports/
            playwright-a11y-report/
            a11y-results.json
          retention-days: 30

  # Cross-Browser Testing
  cross-browser-tests:
    name: Cross-Browser Tests
    runs-on: ${{ matrix.os }}
    needs: [setup, build-for-testing]
    if: needs.setup.outputs.should-run-cross-browser == 'true'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        exclude:
          # Skip webkit on Linux (not supported)
          - os: ubuntu-latest
            browser: webkit
          # Skip webkit on Windows (flaky)
          - os: windows-latest
            browser: webkit
            
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: test-build
          path: dist/
          
      - name: Install Playwright browsers
        run: |
          npx playwright install ${{ matrix.browser }}
          npx playwright install-deps ${{ matrix.browser }}
          
      - name: Run cross-browser tests
        run: |
          cat > playwright-cross-browser.config.ts << 'EOF'
          import { defineConfig, devices } from '@playwright/test';
          
          export default defineConfig({
            testDir: './e2e',
            timeout: 45 * 1000,
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: [
              ['html', { outputFolder: 'playwright-cross-browser-report' }],
              ['json', { outputFile: 'cross-browser-results.json' }]
            ],
            use: {
              baseURL: 'http://localhost:4173',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'retain-on-failure',
            },
            projects: [
              {
                name: '${{ matrix.browser }}-${{ matrix.os }}',
                use: { 
                  ...devices[
                    '${{ matrix.browser }}' === 'chromium' ? 'Desktop Chrome' :
                    '${{ matrix.browser }}' === 'firefox' ? 'Desktop Firefox' :
                    'Desktop Safari'
                  ] 
                },
              },
            ],
            webServer: {
              command: 'npm run preview',
              port: 4173,
              timeout: 120 * 1000,
              reuseExistingServer: !process.env.CI,
            },
          });
          EOF
          
          npx playwright test --config=playwright-cross-browser.config.ts --project="${{ matrix.browser }}-${{ matrix.os }}"
          
      - name: Upload cross-browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-results-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            playwright-cross-browser-report/
            cross-browser-results.json
            test-results/
          retention-days: 7

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [setup, build-for-testing]
    if: needs.setup.outputs.should-run-performance == 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g lighthouse @lhci/cli
          
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: test-build
          path: dist/
          
      - name: Start test server
        run: |
          npm run preview &
          sleep 10
          curl -f http://localhost:4173 || (echo "Server failed to start" && exit 1)
          
      - name: Run Lighthouse CI
        run: |
          lhci autorun --config=.lighthouserc.json || echo "Lighthouse CI completed with issues"
          
      - name: Run custom performance tests
        run: |
          mkdir -p performance-reports
          
          # Test key pages with lighthouse
          PAGES=(
            "http://localhost:4173"
            "http://localhost:4173/#/matrix"
            "http://localhost:4173/#/network"
          )
          
          for url in "${PAGES[@]}"; do
            PAGE_NAME=$(echo $url | sed 's/.*#\///g' | sed 's/.*4173\///g' | sed 's/^$/home/g')
            echo "Running Lighthouse for: $PAGE_NAME"
            
            lighthouse "$url" \
              --output=json \
              --output-path="performance-reports/lighthouse-${PAGE_NAME}.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --throttling-method=simulate \
              --throttling.cpuSlowdownMultiplier=4 \
              --throttling.rttMs=150 \
              --throttling.throughputKbps=1638.4 || echo "Lighthouse completed with issues for $PAGE_NAME"
          done
          
      - name: Bundle size analysis
        run: |
          # Analyze bundle size
          npm run performance:budget || echo "Bundle analysis completed"
          
          # Generate size report
          cat > performance-reports/bundle-analysis.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "totalSize": "$(du -sh dist/ | cut -f1)",
            "files": $(find dist/ -type f -name "*.js" -o -name "*.css" | xargs ls -la | awk '{print $5}' | jq -s 'add // 0')
          }
          EOF
          
      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            performance-reports/
            .lighthouseci/
          retention-days: 30

  # Consolidate Results
  consolidate-results:
    name: Consolidate Test Results
    runs-on: ubuntu-latest
    needs: [visual-regression-tests, accessibility-tests, cross-browser-tests, performance-tests]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/
          
      - name: Generate comprehensive report
        run: |
          mkdir -p consolidated-report
          
          cat > consolidated-report/test-summary.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflow_run_id": "${{ github.run_id }}",
            "results": {
              "visual_regression": "${{ needs.visual-regression-tests.result }}",
              "accessibility": "${{ needs.accessibility-tests.result }}",
              "cross_browser": "${{ needs.cross-browser-tests.result }}",
              "performance": "${{ needs.performance-tests.result }}"
            },
            "artifacts": $(find test-results/ -name "*.json" | wc -l)
          }
          EOF
          
          echo "📊 Advanced Testing Summary:"
          cat consolidated-report/test-summary.json | jq .
          
      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-test-report
          path: consolidated-report/
          retention-days: 90

  # Comment on PR with results
  comment-results:
    name: Comment Test Results
    runs-on: ubuntu-latest
    needs: [consolidate-results, visual-regression-tests, accessibility-tests, cross-browser-tests, performance-tests]
    if: github.event_name == 'pull_request' && always()
    
    steps:
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              visual: '${{ needs.visual-regression-tests.result }}',
              accessibility: '${{ needs.accessibility-tests.result }}',
              crossBrowser: '${{ needs.cross-browser-tests.result }}',
              performance: '${{ needs.performance-tests.result }}'
            };
            
            const getEmoji = (result) => {
              switch(result) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'skipped': return '⏭️';
                default: return '⏳';
              }
            };
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🧪 Advanced Testing Results')
            );
            
            const body = `🧪 **Advanced Testing Results**
            
            ## Test Suite Status
            ${Object.entries(results).map(([test, result]) => {
              if (result === 'skipped') return null;
              const name = test.charAt(0).toUpperCase() + test.slice(1).replace(/([A-Z])/g, ' $1');
              return `- ${getEmoji(result)} **${name}**: ${result}`;
            }).filter(Boolean).join('\n')}
            
            ## Artifacts Available
            - Visual regression screenshots
            - Accessibility audit reports  
            - Cross-browser compatibility results
            - Performance analysis
            
            [📊 View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            _Advanced testing completed at ${new Date().toISOString()}_`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }