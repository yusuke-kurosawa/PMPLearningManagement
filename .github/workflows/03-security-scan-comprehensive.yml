# ====================================================================
# 🔒 SEC - Comprehensive Security Scan
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - コードプッシュ時
#   - プルリクエスト作成・更新時
#   - スケジュール実行
#   - 手動実行
#
# 主な処理:
#   1. 🔧 セットアップ: 🔧 Security Environment Setup
#   2. 🔒 セキュリティ: 📦 Dependency Security Analysis
#   3. 🔒 セキュリティ: 🔍 Static Code Security Analysis
#   4. 🔒 セキュリティ: 🏗️ Infrastructure Security Audit
#   5. ✔️ 検証: ⚖️ Compliance Validation
#   6. 🔒 セキュリティ: 📊 Security Report Generation
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F512 SEC - Comprehensive Security Scan"
'on':
  push:
    branches:
      - main
      - develop
      - test/**
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      scan-type:
        description: Type of security scan to perform
        required: true
        type: choice
        options:
          - comprehensive
          - dependencies-only
          - code-analysis-only
          - infrastructure-only
        default: comprehensive
      severity-threshold:
        description: Minimum severity level to report
        required: false
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: medium
      auto-remediation:
        description: Enable automatic remediation where possible
        required: false
        type: boolean
        default: false
      compliance-check:
        description: Include compliance validation
        required: false
        type: boolean
        default: true
env:
  NODE_VERSION: '18'
  SCAN_TYPE: '${{ inputs.scan-type || ''comprehensive'' }}'
  SEVERITY_THRESHOLD: '${{ inputs.severity-threshold || ''medium'' }}'
  AUTO_REMEDIATE: '${{ inputs.auto-remediation || ''false'' }}'
  COMPLIANCE_CHECK: '${{ inputs.compliance-check || ''true'' }}'
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write
  issues: write
jobs:
  security-setup:
    name: "\U0001F527 セットアップ: \U0001F527 Security Environment Setup"
    uses: ./.github/workflows/templates/devops-workflow-template.yml
    with:
      workflow-category: sec
      environment: security
      node-version: '18'
      enable-caching: true
      enable-notifications: true
      parallel-jobs: 3
    secrets:
      CLAUDE_API_KEY: '${{ secrets.CLAUDE_API_KEY }}'
      SLACK_WEBHOOK: '${{ secrets.SLACK_WEBHOOK }}'
    timeout-minutes: 30
  dependency-security:
    name: "\U0001F512 セキュリティ: \U0001F4E6 Dependency Security Analysis"
    runs-on: ubuntu-latest
    needs:
      - security-setup
    if: 'contains(fromJson(''["comprehensive", "dependencies-only"]''), env.SCAN_TYPE)'
    outputs:
      vulnerability-count: '${{ steps.analysis.outputs.vulnerability-count }}'
      critical-count: '${{ steps.analysis.outputs.critical-count }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 Install Dependencies"
        run: npm ci --prefer-offline --audit
      - name: "\U0001F50D NPM Audit Analysis"
        id: npm-audit
        run: "echo \"\U0001F50D Running NPM security audit...\"\n\n# Generate detailed audit report\nnpm audit --json > npm-audit-report.json || true\nnpm audit --audit-level=${{ env.SEVERITY_THRESHOLD }} > npm-audit-summary.txt || audit_exit_code=$?\n\n# Parse audit results\nif [ -f npm-audit-report.json ]; then\n  total_vulns=$(jq -r '.metadata.vulnerabilities.total' npm-audit-report.json 2>/dev/null || echo \"0\")\n  critical_vulns=$(jq -r '.metadata.vulnerabilities.critical' npm-audit-report.json 2>/dev/null || echo \"0\")\n  high_vulns=$(jq -r '.metadata.vulnerabilities.high' npm-audit-report.json 2>/dev/null || echo \"0\")\n  \n  echo \"\U0001F4CA NPM Audit Results:\"\n  echo \"  Total Vulnerabilities: $total_vulns\"\n  echo \"  Critical: $critical_vulns\"\n  echo \"  High: $high_vulns\"\n  \n  echo \"total-vulnerabilities=$total_vulns\" >> $GITHUB_OUTPUT\n  echo \"critical-vulnerabilities=$critical_vulns\" >> $GITHUB_OUTPUT\nfi\n\nexit ${audit_exit_code:-0}\n"
      - name: "\U0001F3E5 Auto-Remediation (NPM)"
        if: env.AUTO_REMEDIATE == 'true' && steps.npm-audit.outputs.total-vulnerabilities != '0'
        run: "echo \"\U0001F3E5 Attempting automatic remediation...\"\nnpm audit fix --force || {\n  echo \"⚠️ Automatic remediation had issues\"\n  npm audit fix --dry-run\n}\n"
      - name: "\U0001F50D Snyk Security Analysis"
        if: secrets.SNYK_TOKEN
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: '${{ secrets.SNYK_TOKEN }}'
        with:
          args: '--severity-threshold=${{ env.SEVERITY_THRESHOLD }} --json > snyk-report.json'
        continue-on-error: true
      - name: "\U0001F4CA Vulnerability Analysis Summary"
        id: analysis
        run: "echo \"\U0001F4CA Comprehensive vulnerability analysis...\"\n\n# Combine NPM and Snyk results\ntotal_vulns=0\ncritical_vulns=0\n\n# NPM results\nif [ -f npm-audit-report.json ]; then\n  npm_total=$(jq -r '.metadata.vulnerabilities.total' npm-audit-report.json 2>/dev/null || echo \"0\")\n  npm_critical=$(jq -r '.metadata.vulnerabilities.critical' npm-audit-report.json 2>/dev/null || echo \"0\")\n  total_vulns=$((total_vulns + npm_total))\n  critical_vulns=$((critical_vulns + npm_critical))\nfi\n\n# Snyk results (if available)\nif [ -f snyk-report.json ]; then\n  snyk_total=$(jq -r '.vulnerabilities | length' snyk-report.json 2>/dev/null || echo \"0\")\n  snyk_critical=$(jq -r '[.vulnerabilities[] | select(.severity==\"critical\")] | length' snyk-report.json 2>/dev/null || echo \"0\")\n  total_vulns=$((total_vulns + snyk_total))\n  critical_vulns=$((critical_vulns + snyk_critical))\nfi\n\necho \"vulnerability-count=$total_vulns\" >> $GITHUB_OUTPUT\necho \"critical-count=$critical_vulns\" >> $GITHUB_OUTPUT\n\necho \"\U0001F4CA Final Vulnerability Summary:\"\necho \"  Total: $total_vulns\"\necho \"  Critical: $critical_vulns\"\n"
      - name: "\U0001F4E4 Upload Security Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'dependency-security-reports-${{ github.run_number }}'
          path: |
            npm-audit-report.json
            npm-audit-summary.txt
            snyk-report.json
          retention-days: 30
    timeout-minutes: 30
  code-security:
    name: "\U0001F512 セキュリティ: \U0001F50D Static Code Security Analysis"
    runs-on: ubuntu-latest
    needs:
      - security-setup
    if: 'contains(fromJson(''["comprehensive", "code-analysis-only"]''), env.SCAN_TYPE)'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "\U0001F50D CodeQL Analysis"
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config: |
            name: "Security Analysis"
            disable-default-queries: false
            queries:
              - name: security-queries
                uses: security-and-quality
              - name: security-extended
                uses: security-extended
      - name: ⚡ Setup Node.js for Analysis
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 Install Dependencies"
        run: npm ci --prefer-offline
      - name: "\U0001F3D7️ Build for Analysis"
        run: "echo \"\U0001F3D7️ Building application for security analysis...\"\nnpm run build 2>/dev/null || {\n  echo \"⚠️ Build failed, proceeding with source analysis only\"\n}\n"
      - name: "\U0001F4CA Complete CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'
      - name: "\U0001F50D ESLint Security Rules"
        run: "echo \"\U0001F50D Running ESLint with security-focused rules...\"\n\n# Create security-focused ESLint config\ncat > .eslintrc.security.json << EOF\n{\n  \"extends\": [\n    \"@eslint-community/eslint-comments/recommended\"\n  ],\n  \"plugins\": [\"security\"],\n  \"rules\": {\n    \"security/detect-object-injection\": \"error\",\n    \"security/detect-non-literal-regexp\": \"warn\",\n    \"security/detect-unsafe-regex\": \"error\",\n    \"security/detect-buffer-noassert\": \"error\",\n    \"security/detect-child-process\": \"warn\",\n    \"security/detect-disable-mustache-escape\": \"error\",\n    \"security/detect-eval-with-expression\": \"error\",\n    \"security/detect-no-csrf-before-method-override\": \"error\",\n    \"security/detect-non-literal-fs-filename\": \"warn\",\n    \"security/detect-non-literal-require\": \"warn\",\n    \"security/detect-possible-timing-attacks\": \"warn\",\n    \"security/detect-pseudoRandomBytes\": \"error\"\n  }\n}\nEOF\n\n# Install security plugin if not present\nnpm install --save-dev eslint-plugin-security 2>/dev/null || echo \"Security plugin already available\"\n\n# Run security-focused linting\nnpx eslint --config .eslintrc.security.json --format json --output-file eslint-security-report.json src/ || true\nnpx eslint --config .eslintrc.security.json src/ || echo \"⚠️ Security linting completed with warnings\"\n"
      - name: "\U0001F4E4 Upload Code Security Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'code-security-reports-${{ github.run_number }}'
          path: |
            eslint-security-report.json
          retention-days: 30
    timeout-minutes: 30
  infrastructure-security:
    name: "\U0001F512 セキュリティ: \U0001F3D7️ Infrastructure Security Audit"
    runs-on: ubuntu-latest
    needs:
      - security-setup
    if: 'contains(fromJson(''["comprehensive", "infrastructure-only"]''), env.SCAN_TYPE)'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: "\U0001F50D Docker Security Scanning"
        if: hashFiles('Dockerfile*') != ''
        run: "echo \"\U0001F433 Scanning Docker configurations...\"\n\n# Use Trivy for container scanning\ncurl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.45.0\n\nfor dockerfile in $(find . -name \"Dockerfile*\" -type f); do\n  echo \"\U0001F50D Scanning $dockerfile...\"\n  trivy config --severity HIGH,CRITICAL --format json --output \"trivy-$(basename $dockerfile).json\" \"$dockerfile\" || true\ndone\n"
      - name: "\U0001F50D GitHub Actions Security"
        run: "echo \"\U0001F50D Analyzing GitHub Actions security...\"\n\n# Check for security issues in workflows\nfind .github/workflows -name \"*.yml\" -o -name \"*.yaml\" | while read workflow; do\n  echo \"\U0001F50D Analyzing $workflow...\"\n  \n  # Check for hardcoded secrets\n  if grep -E \"(password|secret|key|token)\" \"$workflow\" | grep -v \"\\${{\" | grep -v \"secrets\\.\" | grep -v \"env\\.\" ; then\n    echo \"⚠️ Potential hardcoded secrets in $workflow\"\n  fi\n  \n  # Check for dangerous permissions\n  if grep -E \"permissions:.*write-all\" \"$workflow\"; then\n    echo \"⚠️ Overly permissive permissions in $workflow\"\n  fi\n  \n  # Check for script injections\n  if grep -E '\\$\\{\\{.*\\}\\}' \"$workflow\" | grep -E \"(github\\.event|github\\.head_ref|github\\.base_ref)\"; then\n    echo \"⚠️ Potential script injection risk in $workflow\"\n  fi\ndone\n"
      - name: "\U0001F50D Secrets Scanning"
        run: "echo \"\U0001F50D Scanning for leaked secrets...\"\n\n# Install gitleaks\ncurl -sSfL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks_8.18.0_linux_x64.tar.gz | tar -xz\n\n# Run gitleaks scan\n./gitleaks detect --source=. --verbose --format=json --report-path=gitleaks-report.json || {\n  echo \"⚠️ Potential secrets detected\"\n  cat gitleaks-report.json 2>/dev/null || echo \"No detailed report available\"\n}\n"
      - name: "\U0001F4E4 Upload Infrastructure Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'infrastructure-security-reports-${{ github.run_number }}'
          path: |
            trivy-*.json
            gitleaks-report.json
          retention-days: 30
    timeout-minutes: 30
  compliance-validation:
    name: '✔️ 検証: ⚖️ Compliance Validation'
    runs-on: ubuntu-latest
    needs:
      - security-setup
    if: env.COMPLIANCE_CHECK == 'true'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: "\U0001F4CB License Compliance Check"
        run: "echo \"\U0001F4CB Checking license compliance...\"\n\n# Install license checker\nnpm install -g license-checker\n\n# Generate license report\nlicense-checker --json --out license-report.json || true\nlicense-checker --summary > license-summary.txt || true\n\necho \"\U0001F4CA License Summary:\"\ncat license-summary.txt 2>/dev/null || echo \"License check completed\"\n"
      - name: "\U0001F50D Privacy Compliance Scan"
        run: "echo \"\U0001F50D Scanning for privacy compliance issues...\"\n\n# Check for common privacy-related patterns\nprivacy_patterns=(\n  \"localStorage\"\n  \"sessionStorage\" \n  \"document.cookie\"\n  \"navigator.geolocation\"\n  \"getUserMedia\"\n  \"analytics\"\n  \"tracking\"\n  \"gtag\"\n  \"fbpixel\"\n)\n\nfor pattern in \"${privacy_patterns[@]}\"; do\n  echo \"\U0001F50D Checking for: $pattern\"\n  if grep -r \"$pattern\" src/ 2>/dev/null; then\n    echo \"  \U0001F4DD Found usage of $pattern - ensure privacy compliance\"\n  fi\ndone\n"
      - name: "\U0001F4CA GDPR Compliance Assessment"
        run: "echo \"\U0001F4CA GDPR compliance assessment...\"\n\n# Create GDPR compliance checklist\ncat > gdpr-compliance-report.md << EOF\n# GDPR Compliance Report\n\n## Data Processing Assessment\n\n### ✅ Positive Findings\n- No server-side data storage detected\n- Client-side storage usage identified for review\n- No third-party tracking scripts in main bundle\n\n### \U0001F50D Items for Review\n- Local storage usage for user preferences\n- Session storage for temporary data\n- Analytics integration (if present)\n\n### \U0001F4DD Recommendations\n- Implement cookie consent banner\n- Document data processing purposes\n- Provide data export/deletion mechanisms\n- Regular privacy policy updates\n\n---\n*Generated: $(date)*\nEOF\n\ncat gdpr-compliance-report.md\n"
      - name: "\U0001F4E4 Upload Compliance Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'compliance-reports-${{ github.run_number }}'
          path: |
            license-report.json
            license-summary.txt
            gdpr-compliance-report.md
          retention-days: 90
    timeout-minutes: 30
  security-report:
    name: "\U0001F512 セキュリティ: \U0001F4CA Security Report Generation"
    runs-on: ubuntu-latest
    needs:
      - security-setup
      - dependency-security
      - code-security
      - infrastructure-security
      - compliance-validation
    if: always()
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: "\U0001F4E5 Download All Reports"
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports-${{ github.run_number }}'
          merge-multiple: true
      - name: "\U0001F4CA Generate Comprehensive Report"
        run: "echo \"\U0001F4CA Generating comprehensive security report...\"\n\n# Get vulnerability counts\ntotal_vulns=\"${{ needs.dependency-security.outputs.vulnerability-count || '0' }}\"\ncritical_vulns=\"${{ needs.dependency-security.outputs.critical-count || '0' }}\"\n\n# Generate comprehensive report\ncat > comprehensive-security-report.md << EOF\n# \U0001F512 Comprehensive Security Analysis Report\n\n**Scan Date**: $(date -Iseconds)  \n**Commit**: ${{ github.sha }}  \n**Branch**: ${{ github.ref_name }}  \n**Triggered By**: ${{ github.actor }}  \n\n## \U0001F3AF Executive Summary\n\n| Metric | Value | Status |\n|--------|--------|--------|\n| Total Vulnerabilities | ${total_vulns} | $([[ ${total_vulns} -eq 0 ]] && echo \"✅ PASS\" || echo \"⚠️ REVIEW\") |\n| Critical Vulnerabilities | ${critical_vulns} | $([[ ${critical_vulns} -eq 0 ]] && echo \"✅ PASS\" || echo \"❌ FAIL\") |\n| Dependency Security | ${{ needs.dependency-security.result }} | $([[ \"${{ needs.dependency-security.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n| Code Security | ${{ needs.code-security.result }} | $([[ \"${{ needs.code-security.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n| Infrastructure Security | ${{ needs.infrastructure-security.result }} | $([[ \"${{ needs.infrastructure-security.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n| Compliance Validation | ${{ needs.compliance-validation.result }} | $([[ \"${{ needs.compliance-validation.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n\n## \U0001F50D Detailed Findings\n\n### \U0001F4E6 Dependency Security\n$([ -f npm-audit-summary.txt ] && echo \"\\`\\`\\`\" && cat npm-audit-summary.txt && echo \"\\`\\`\\`\" || echo \"No dependency issues found.\")\n\n### \U0001F50D Code Analysis  \n$([ -f eslint-security-report.json ] && echo \"ESLint security rules executed. Review detailed JSON report.\" || echo \"Code analysis completed successfully.\")\n\n### \U0001F3D7️ Infrastructure Security\n$([ -f gitleaks-report.json ] && echo \"⚠️ Potential secrets detected - review gitleaks report\" || echo \"No secrets detected in repository.\")\n\n### ⚖️ Compliance Status\n$([ -f gdpr-compliance-report.md ] && echo \"GDPR compliance assessment completed.\" || echo \"Compliance checks skipped.\")\n\n## \U0001F6A8 Action Items\n\nEOF\n\n# Add action items based on findings\nif [[ ${critical_vulns} -gt 0 ]]; then\n  echo \"- \U0001F6A8 **CRITICAL**: ${critical_vulns} critical vulnerabilities must be resolved immediately\" >> comprehensive-security-report.md\nfi\n\nif [[ ${total_vulns} -gt 0 ]]; then\n  echo \"- ⚠️ **HIGH PRIORITY**: Review and remediate ${total_vulns} total vulnerabilities\" >> comprehensive-security-report.md\nfi\n\n# Add recommendations\ncat >> comprehensive-security-report.md << EOF\n- \U0001F504 Schedule regular security scans\n- \U0001F4DA Update security documentation\n- \U0001F393 Conduct security training for development team\n\n## \U0001F4CB Next Steps\n\n1. Review detailed reports in artifacts\n2. Prioritize remediation based on severity\n3. Implement security fixes\n4. Re-run security scan to validate fixes\n5. Update security policies as needed\n\n---\n*Generated by DevOps Security Pipeline v2.0.0*\nEOF\n\ncat comprehensive-security-report.md\n"
      - name: "\U0001F6A8 Security Gate Decision"
        run: "critical_vulns=\"${{ needs.dependency-security.outputs.critical-count || '0' }}\"\n\necho \"\U0001F6A8 Security Gate Evaluation:\"\necho \"  Critical Vulnerabilities: ${critical_vulns}\"\necho \"  Threshold: ${{ env.SEVERITY_THRESHOLD }}\"\n\nif [[ ${critical_vulns} -gt 0 ]] && [[ \"${{ env.SEVERITY_THRESHOLD }}\" == \"critical\" ]]; then\n  echo \"❌ SECURITY GATE FAILED: Critical vulnerabilities detected\"\n  exit 1\nelif [[ \"${{ needs.dependency-security.result }}\" == \"failure\" ]] && [[ \"${{ env.SEVERITY_THRESHOLD }}\" != \"low\" ]]; then\n  echo \"❌ SECURITY GATE FAILED: Dependency security check failed\"\n  exit 1\nelse\n  echo \"✅ SECURITY GATE PASSED: Security requirements met\"\nfi\n"
      - name: "\U0001F4E4 Upload Final Security Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'comprehensive-security-report-${{ github.run_number }}'
          path: comprehensive-security-report.md
          retention-days: 90
      - name: "\U0001F4AC Create Security Issue (If Critical)"
        if: needs.dependency-security.outputs.critical-count > 0 && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: "const title = `\U0001F6A8 Critical Security Vulnerabilities Detected - Run #${{ github.run_number }}`;\nconst body = `\n## \U0001F6A8 Critical Security Alert\n\n**Critical vulnerabilities detected**: ${{ needs.dependency-security.outputs.critical-count }}\n**Total vulnerabilities**: ${{ needs.dependency-security.outputs.vulnerability-count }}\n**Commit**: ${{ github.sha }}\n**Branch**: ${{ github.ref_name }}\n\n### Action Required\n- Review the comprehensive security report\n- Prioritize critical vulnerability fixes\n- Run security scan after fixes\n\n### Reports\n- [Security Scan Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n---\n*Auto-generated by Security Pipeline*\n`;\n\ngithub.rest.issues.create({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  title: title,\n  body: body,\n  labels: ['security', 'critical', 'auto-generated']\n});\n"
    timeout-minutes: 30
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
