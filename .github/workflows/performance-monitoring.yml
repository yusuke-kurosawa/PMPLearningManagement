# ====================================================================
# パフォーマンス監視パイプライン
# ====================================================================
# 目的: モバイルファーストPWAアプリケーションのパフォーマンスを
#      継続的に監視し、パフォーマンス劣化を早期に検出する
# 
# 実行タイミング:
#   - main/developブランチへのプッシュ時
#   - mainブランチへのプルリクエスト時
#   - 6時間ごとの定期実行（パフォーマンス監視）
#   - 手動実行（workflow_dispatch）
#
# 主な処理:
#   1. バンドルサイズ分析
#   2. Lighthouseスコア測定（モバイル/デスクトップ）
#   3. Core Web Vitalsの計測
#   4. PWA要件の検証
#   5. パフォーマンスレポートの生成
# ====================================================================

name: 📊 パフォーマンス継続監視

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run performance tests every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      mobile_focus:
        description: 'Focus on mobile performance'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  pages: read

env:
  NODE_VERSION: '18'

jobs:
  # Lighthouse Performance Audit
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - url: "https://yusuke-kurosawa.github.io/PMPLearningManagement/"
            name: "home"
            device: "mobile"
          - url: "https://yusuke-kurosawa.github.io/PMPLearningManagement/#/matrix"
            name: "matrix"
            device: "mobile"
          - url: "https://yusuke-kurosawa.github.io/PMPLearningManagement/#/flashcards"
            name: "flashcards"
            device: "mobile"
          - url: "https://yusuke-kurosawa.github.io/PMPLearningManagement/#/mock-exam"
            name: "exam"
            device: "mobile"
          - url: "https://yusuke-kurosawa.github.io/PMPLearningManagement/"
            name: "home"
            device: "desktop"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Serve application locally
        run: |
          npm install -g serve
          serve -s dist -p 3000 &
          sleep 10
        if: github.event_name == 'pull_request'
        
      - name: Run Mobile-Optimized Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ matrix.url }}
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_DEVICE: ${{ matrix.device }}
          LHCI_THROTTLING: ${{ matrix.device == 'mobile' && 'mobile3G' || 'desktop' }}
          
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ matrix.name }}-${{ matrix.device }}-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30

      - name: Extract Core Web Vitals
        if: always()
        run: |
          echo "📊 Core Web Vitals - ${{ matrix.name }} (${{ matrix.device }})" > cwv-${{ matrix.name }}-${{ matrix.device }}.md
          echo "URL: ${{ matrix.url }}" >> cwv-${{ matrix.name }}-${{ matrix.device }}.md
          echo "Device: ${{ matrix.device }}" >> cwv-${{ matrix.name }}-${{ matrix.device }}.md
          echo "" >> cwv-${{ matrix.name }}-${{ matrix.device }}.md
          
          # Extract metrics from lighthouse results if available
          if [ -d ".lighthouseci" ]; then
            find .lighthouseci -name "*.json" -exec jq -r '.audits | {fcp: .["first-contentful-paint"].displayValue, lcp: .["largest-contentful-paint"].displayValue, cls: .["cumulative-layout-shift"].displayValue, tbt: .["total-blocking-time"].displayValue}' {} \; | head -1 >> cwv-${{ matrix.name }}-${{ matrix.device }}.md 2>/dev/null || echo "Metrics extraction failed" >> cwv-${{ matrix.name }}-${{ matrix.device }}.md
          fi

      - name: Upload Core Web Vitals Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwv-report-${{ matrix.name }}-${{ matrix.device }}
          path: cwv-${{ matrix.name }}-${{ matrix.device }}.md
          retention-days: 30

  # Bundle Size Analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build with bundle analysis
        run: npm run analyze
        
      - name: Check bundle size
        run: npm run performance:budget
        
      - name: Bundle size report
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Check if bundlesize report exists
            let bundleReport = '';
            try {
              const distPath = path.join(process.cwd(), 'dist');
              const assets = fs.readdirSync(path.join(distPath, 'assets'));
              
              const jsFiles = assets.filter(f => f.endsWith('.js'));
              const cssFiles = assets.filter(f => f.endsWith('.css'));
              
              bundleReport = `## 📦 Bundle Size Report\n\n`;
              bundleReport += `### JavaScript Files:\n`;
              jsFiles.forEach(file => {
                const stats = fs.statSync(path.join(distPath, 'assets', file));
                const sizeKB = (stats.size / 1024).toFixed(2);
                bundleReport += `- ${file}: ${sizeKB} KB\n`;
              });
              
              bundleReport += `\n### CSS Files:\n`;
              cssFiles.forEach(file => {
                const stats = fs.statSync(path.join(distPath, 'assets', file));
                const sizeKB = (stats.size / 1024).toFixed(2);
                bundleReport += `- ${file}: ${sizeKB} KB\n`;
              });
              
            } catch (error) {
              bundleReport = '❌ Bundle analysis failed: ' + error.message;
            }
            
            // Post comment on PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📦 Bundle Size Report')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: bundleReport
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: bundleReport
              });
            }

  # Core Web Vitals Testing
  web-vitals:
    name: Core Web Vitals Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        
      - name: Run Core Web Vitals test
        run: |
          cat << 'EOF' > web-vitals-test.js
          const { chromium } = require('playwright');
          
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            
            // Navigate to the page
            const url = process.env.TEST_URL || 'https://yusuke-kurosawa.github.io/PMPLearningManagement/';
            await page.goto(url);
            
            // Wait for page to be fully loaded
            await page.waitForLoadState('networkidle');
            
            // Measure Core Web Vitals
            const vitals = await page.evaluate(() => {
              return new Promise((resolve) => {
                const vitals = {};
                
                // LCP (Largest Contentful Paint)
                new PerformanceObserver((list) => {
                  const entries = list.getEntries();
                  if (entries.length > 0) {
                    vitals.lcp = entries[entries.length - 1].startTime;
                  }
                }).observe({ entryTypes: ['largest-contentful-paint'] });
                
                // FID (First Input Delay) - simulated
                vitals.fid = 0; // Would need real user interaction
                
                // CLS (Cumulative Layout Shift)
                let cls = 0;
                new PerformanceObserver((list) => {
                  list.getEntries().forEach((entry) => {
                    if (!entry.hadRecentInput) {
                      cls += entry.value;
                    }
                  });
                  vitals.cls = cls;
                }).observe({ entryTypes: ['layout-shift'] });
                
                setTimeout(() => resolve(vitals), 3000);
              });
            });
            
            console.log('Core Web Vitals Results:');
            console.log(`LCP: ${vitals.lcp?.toFixed(2) || 'N/A'} ms`);
            console.log(`CLS: ${vitals.cls?.toFixed(3) || 'N/A'}`);
            console.log(`FID: Simulated - 0 ms`);
            
            await browser.close();
          })();
          EOF
          
          node web-vitals-test.js
        
      - name: Performance regression test
        run: |
          echo "Running performance regression tests..."
          # This could be expanded with specific performance benchmarks
          npm run build
          
          # Check if build size exceeds thresholds
          DIST_SIZE=$(du -s dist/ | cut -f1)
          echo "Build size: ${DIST_SIZE} KB"
          
          # Set threshold (adjust as needed)
          MAX_SIZE=5000  # 5MB in KB
          
          if [ $DIST_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Build size exceeds threshold: ${DIST_SIZE} KB > ${MAX_SIZE} KB"
            exit 1
          else
            echo "✅ Build size within acceptable range: ${DIST_SIZE} KB"
          fi

  # Performance Monitoring Summary
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, bundle-analysis, web-vitals]
    if: always()
    
    steps:
      - name: Create Performance Report
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const lighthouseStatus = '${{ needs.lighthouse-audit.result }}';
            const bundleStatus = '${{ needs.bundle-analysis.result }}';
            const webVitalsStatus = '${{ needs.web-vitals.result }}';
            
            const getStatusEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                default: return '⏳';
              }
            };
            
            const report = `## 🚀 Performance Report
            
            ### Test Results:
            ${getStatusEmoji(lighthouseStatus)} **Lighthouse Audit**: ${lighthouseStatus}
            ${getStatusEmoji(bundleStatus)} **Bundle Analysis**: ${bundleStatus}  
            ${getStatusEmoji(webVitalsStatus)} **Core Web Vitals**: ${webVitalsStatus}
            
            ### Key Metrics:
            - **Performance Score**: See Lighthouse report for details
            - **Bundle Size**: Check bundle analysis report
            - **Core Web Vitals**: LCP, CLS, and FID measurements
            
            ### Recommendations:
            ${lighthouseStatus === 'failure' ? '⚠️ Lighthouse audit failed - check performance scores\n' : ''}
            ${bundleStatus === 'failure' ? '⚠️ Bundle size exceeds limits - consider code splitting\n' : ''}
            ${webVitalsStatus === 'failure' ? '⚠️ Core Web Vitals need improvement\n' : ''}
            
            _For detailed reports, check the workflow artifacts._`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

  # Scheduled Performance Alert
  performance-alert:
    name: Performance Alert
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, bundle-analysis, web-vitals]
    if: github.event_name == 'schedule' && (needs.lighthouse-audit.result == 'failure' || needs.bundle-analysis.result == 'failure' || needs.web-vitals.result == 'failure')
    
    steps:
      - name: Create Performance Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Performance Alert - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Performance Degradation Detected
            
            Our scheduled performance monitoring has detected issues:
            
            - **Lighthouse Audit**: ${{ needs.lighthouse-audit.result }}
            - **Bundle Analysis**: ${{ needs.bundle-analysis.result }}
            - **Core Web Vitals**: ${{ needs.web-vitals.result }}
            
            ### Action Required:
            1. Review the failed performance tests
            2. Identify performance regressions
            3. Optimize affected areas
            4. Re-run performance tests
            
            **Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            /label performance 🚨 high-priority`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', '🚨 high-priority']
            });