# ================================================================
# Workflow: セキュリティ包括スキャン
# Category: Security (セキュリティ)
# Purpose: 依存関係、コード、設定の包括的セキュリティチェック
# Trigger: PRマージ、定期実行、セキュリティアラート
# Dependencies: Security Tools、SARIF Upload、CodeQL
# Author: Claude Code DevOps Team
# Version: 1.0.0
# Last Modified: 2025-08-12
# Issue: #79
# ================================================================

name: 🔒 セキュリティ包括スキャン

# ------------------------------------------------------------
# トリガー設定
# セキュリティは継続的な監視が重要
# ------------------------------------------------------------
on:
  # メインブランチへのプッシュ時（本番前チェック）
  push:
    branches: [main, develop]
    # ドキュメントのみの変更は除外
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows-backup/**'
  
  # プルリクエスト時（事前チェック）
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  
  # 定期実行（セキュリティ監査）
  schedule:
    # 毎日午前3時（JST 12:00 UTC）に実行
    - cron: '0 3 * * *'
  
  # 手動実行（緊急セキュリティチェック）
  workflow_dispatch:
    inputs:
      scan_level:
        description: 'スキャンレベル'
        type: choice
        options:
          - standard
          - comprehensive
          - critical-only
        default: 'standard'
      create_issue:
        description: '脆弱性発見時にIssue作成'
        type: boolean
        default: true

# ------------------------------------------------------------
# 権限設定（セキュリティツールに必要な権限）
# ------------------------------------------------------------
permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

# ------------------------------------------------------------
# 環境変数
# ------------------------------------------------------------
env:
  NODE_VERSION: '18'
  SCAN_LEVEL: ${{ github.event.inputs.scan_level || 'standard' }}

# ------------------------------------------------------------
# ジョブ定義
# ------------------------------------------------------------
jobs:
  # ============================================================
  # ジョブ1: 依存関係セキュリティスキャン
  # ============================================================
  dependency-security-scan:
    name: 📦 依存関係セキュリティスキャン
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    outputs:
      vulnerabilities-found: ${{ steps.audit.outputs.vulnerabilities-found }}
      critical-count: ${{ steps.audit.outputs.critical-count }}
      high-count: ${{ steps.audit.outputs.high-count }}
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: 基本セットアップ
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🔧 Node.js環境セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      # ----------------------------------------------------------
      # ステップ2: NPM Audit実行
      # ----------------------------------------------------------
      - name: 🛡️ NPM依存関係監査
        id: audit
        run: |
          echo "🛡️ NPM依存関係セキュリティ監査実行中..."
          
          # npm auditの結果をJSONで取得
          if npm audit --json > audit-results.json 2>/dev/null; then
            echo "✅ 脆弱性は検出されませんでした"
            echo "vulnerabilities-found=false" >> $GITHUB_OUTPUT
            echo "critical-count=0" >> $GITHUB_OUTPUT
            echo "high-count=0" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 脆弱性が検出されました"
            
            # 脆弱性の件数を抽出
            CRITICAL_COUNT=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
            HIGH_COUNT=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
            MODERATE_COUNT=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
            LOW_COUNT=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)
            
            echo "🚨 Critical: $CRITICAL_COUNT"
            echo "⚠️ High: $HIGH_COUNT"  
            echo "📋 Moderate: $MODERATE_COUNT"
            echo "ℹ️ Low: $LOW_COUNT"
            
            echo "vulnerabilities-found=true" >> $GITHUB_OUTPUT
            echo "critical-count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
            echo "high-count=$HIGH_COUNT" >> $GITHUB_OUTPUT
            
            # Criticalまたは多数のHighがある場合は失敗とする
            if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 5 ]; then
              echo "❌ 重大な脆弱性が検出されました"
              exit 1
            fi
          fi
      
      # ----------------------------------------------------------
      # ステップ3: 監査結果アーティファクト保存
      # ----------------------------------------------------------
      - name: 📄 監査結果保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

  # ============================================================
  # ジョブ2: CodeQLセキュリティ分析
  # ============================================================
  codeql-security-analysis:
    name: 🔍 CodeQLセキュリティ分析
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      matrix:
        language: ['javascript']
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: 基本セットアップ
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # ----------------------------------------------------------
      # ステップ2: CodeQL初期化
      # ----------------------------------------------------------
      - name: 🔍 CodeQL分析初期化
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # JavaScriptプロジェクト用の設定
          config-file: ./.github/codeql/codeql-config.yml
          queries: |
            security-and-quality
            security-extended
      
      # ----------------------------------------------------------
      # ステップ3: 自動ビルド（JavaScript）
      # ----------------------------------------------------------
      - name: 🏗️ 自動ビルド
        uses: github/codeql-action/autobuild@v3
      
      # ----------------------------------------------------------
      # ステップ4: CodeQL分析実行
      # ----------------------------------------------------------
      - name: 🔬 CodeQL分析実行
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          # SARIF結果をGitHub Security tabにアップロード
          upload: true

  # ============================================================
  # ジョブ3: シークレットスキャン
  # ============================================================
  secret-scan:
    name: 🔐 シークレットスキャン
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: リポジトリチェックアウト
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          # 履歴全体をスキャンするため全履歴取得
          fetch-depth: 0
      
      # ----------------------------------------------------------
      # ステップ2: GitLeaks シークレットスキャン
      # ----------------------------------------------------------
      - name: 🔍 GitLeaks シークレットスキャン
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
        with:
          config-path: .gitleaks.toml
      
      # ----------------------------------------------------------
      # ステップ3: カスタムシークレットパターンチェック
      # ----------------------------------------------------------
      - name: 🔎 カスタムシークレットパターンチェック
        run: |
          echo "🔎 カスタムシークレットパターンチェック実行中..."
          
          # 危険なパターンをチェック
          SECRETS_FOUND=false
          
          # API キーパターン
          if grep -r "api[_-]key\s*=\s*['\"][a-zA-Z0-9]{20,}['\"]" . --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules; then
            echo "⚠️ API キーらしきパターンが検出されました"
            SECRETS_FOUND=true
          fi
          
          # JWT トークンパターン  
          if grep -r "eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*" . --include="*.js" --include="*.jsx" --exclude-dir=node_modules; then
            echo "⚠️ JWT トークンらしきパターンが検出されました"
            SECRETS_FOUND=true
          fi
          
          # パスワードハードコード
          if grep -r "password\s*=\s*['\"][^'\"]{8,}['\"]" . --include="*.js" --include="*.jsx" --exclude-dir=node_modules; then
            echo "⚠️ ハードコードされたパスワードが検出されました"
            SECRETS_FOUND=true
          fi
          
          if [ "$SECRETS_FOUND" = true ]; then
            echo "❌ シークレット情報が検出されました。確認して削除してください。"
            exit 1
          else
            echo "✅ 明らかなシークレット情報は検出されませんでした"
          fi

  # ============================================================
  # ジョブ4: 設定セキュリティチェック
  # ============================================================
  configuration-security-check:
    name: ⚙️ 設定セキュリティチェック
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: リポジトリチェックアウト
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # ----------------------------------------------------------
      # ステップ2: ワークフローセキュリティチェック
      # ----------------------------------------------------------
      - name: 🔧 ワークフローセキュリティチェック
        run: |
          echo "🔧 GitHub Actionsワークフローセキュリティチェック中..."
          
          SECURITY_ISSUES=false
          
          # 危険な権限設定をチェック
          if find .github/workflows -name "*.yml" -exec grep -l "permissions:.*write-all" {} \; | head -1; then
            echo "⚠️ 過度な権限設定が検出されました"
            SECURITY_ISSUES=true
          fi
          
          # シークレットの直接参照をチェック
          if find .github/workflows -name "*.yml" -exec grep -l "\${{ secrets\." {} \; | xargs grep -n "echo.*secrets\." || true; then
            echo "⚠️ シークレットがログに出力される可能性があります"
            SECURITY_ISSUES=true
          fi
          
          # 外部アクションのピン留めチェック
          if find .github/workflows -name "*.yml" -exec grep -l "uses:.*@main\|uses:.*@master" {} \; | head -1; then
            echo "⚠️ 外部アクションがブランチ指定されています。バージョンピン留めを推奨します"
            SECURITY_ISSUES=true
          fi
          
          if [ "$SECURITY_ISSUES" = false ]; then
            echo "✅ ワークフロー設定に明らかなセキュリティ問題は検出されませんでした"
          fi
      
      # ----------------------------------------------------------
      # ステップ3: 環境設定セキュリティチェック
      # ----------------------------------------------------------
      - name: 🌐 環境設定セキュリティチェック
        run: |
          echo "🌐 環境設定セキュリティチェック中..."
          
          # .envファイルの確認
          if [ -f ".env" ]; then
            echo "⚠️ .envファイルが存在します。.gitignoreで除外されていることを確認してください"
            if ! grep -q "\.env" .gitignore; then
              echo "❌ .envファイルが.gitignoreに登録されていません"
              exit 1
            fi
          fi
          
          # package.jsonのスクリプトセキュリティチェック
          if [ -f "package.json" ]; then
            if grep -q '"postinstall"' package.json; then
              echo "⚠️ postinstallスクリプトが設定されています。悪意のあるコードの実行に注意してください"
            fi
          fi
          
          echo "✅ 環境設定チェック完了"

  # ============================================================
  # ジョブ5: セキュリティレポート生成
  # ============================================================
  security-report:
    name: 📊 セキュリティレポート生成
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [dependency-security-scan, codeql-security-analysis, secret-scan, configuration-security-check]
    if: always()
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: セキュリティ結果集計
      # ----------------------------------------------------------
      - name: 📊 セキュリティ結果集計
        id: security-summary
        run: |
          echo "📊 セキュリティスキャン結果集計中..."
          
          # 各ジョブの結果を確認
          DEPENDENCY_RESULT="${{ needs.dependency-security-scan.result }}"
          CODEQL_RESULT="${{ needs.codeql-security-analysis.result }}"
          SECRET_RESULT="${{ needs.secret-scan.result }}"
          CONFIG_RESULT="${{ needs.configuration-security-check.result }}"
          
          VULNERABILITIES_FOUND="${{ needs.dependency-security-scan.outputs.vulnerabilities-found }}"
          CRITICAL_COUNT="${{ needs.dependency-security-scan.outputs.critical-count }}"
          HIGH_COUNT="${{ needs.dependency-security-scan.outputs.high-count }}"
          
          echo "依存関係スキャン: $DEPENDENCY_RESULT"
          echo "CodeQL分析: $CODEQL_RESULT"
          echo "シークレットスキャン: $SECRET_RESULT"
          echo "設定チェック: $CONFIG_RESULT"
          
          # 総合セキュリティ評価
          OVERALL_STATUS="success"
          if [[ "$DEPENDENCY_RESULT" != "success" || "$SECRET_RESULT" != "success" || "$CONFIG_RESULT" != "success" ]]; then
            OVERALL_STATUS="failure"
          fi
          
          echo "overall-status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
          echo "vulnerabilities-found=$VULNERABILITIES_FOUND" >> $GITHUB_OUTPUT
          
          echo "📋 セキュリティスキャン完了: $OVERALL_STATUS"
      
      # ----------------------------------------------------------
      # ステップ2: セキュリティIssue作成（脆弱性発見時）
      # ----------------------------------------------------------
      - name: 🚨 セキュリティIssue作成
        if: |
          steps.security-summary.outputs.overall-status == 'failure' &&
          (github.event.inputs.create_issue == 'true' || github.event.inputs.create_issue == '')
        uses: actions/github-script@v7
        with:
          script: |
            const vulnerabilitiesFound = '${{ steps.security-summary.outputs.vulnerabilities-found }}';
            const criticalCount = '${{ needs.dependency-security-scan.outputs.critical-count }}';
            const highCount = '${{ needs.dependency-security-scan.outputs.high-count }}';
            
            const title = `🔒 セキュリティ脆弱性検出 - 緊急対応が必要`;
            const body = `## 🚨 セキュリティアラート
            
            自動セキュリティスキャンで脆弱性が検出されました。
            
            ### 📊 検出内容
            - **実行日時**: ${new Date().toLocaleString('ja-JP')}
            - **Critical脆弱性**: ${criticalCount}件
            - **High脆弱性**: ${highCount}件
            
            ### 🔍 スキャン結果
            | チェック項目 | 結果 |
            |-------------|------|
            | 📦 依存関係 | ${{ needs.dependency-security-scan.result == 'success' ? '✅ 正常' : '❌ 脆弱性検出' }} |
            | 🔍 CodeQL | ${{ needs.codeql-security-analysis.result == 'success' ? '✅ 正常' : '⚠️ 要確認' }} |
            | 🔐 シークレット | ${{ needs.secret-scan.result == 'success' ? '✅ 正常' : '❌ 検出' }} |
            | ⚙️ 設定 | ${{ needs.configuration-security-check.result == 'success' ? '✅ 正常' : '❌ 問題あり' }} |
            
            ### 🚀 対応アクション
            1. **即座に実施**:
               - 依存関係の更新: \`npm audit fix\`
               - 検出されたシークレットの削除
               - 設定の見直し
            
            2. **追加調査**:
               - GitHub Security タブで詳細確認
               - CodeQL結果の精査
               - 影響範囲の評価
            
            3. **予防策**:
               - 定期的なセキュリティ更新
               - pre-commitフックの強化
               - セキュリティトレーニング
            
            ### 🔗 関連リソース
            - [GitHub Security タブ](${context.payload.repository.html_url}/security)
            - [依存関係グラフ](${context.payload.repository.html_url}/network/dependencies)
            - [ワークフロー実行結果](${context.payload.repository.html_url}/actions/runs/${context.runId})
            
            ---
            🤖 自動生成アラート | Issue #79 | 緊急度: 🔴 高`;
            
            // セキュリティIssue作成
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'priority/critical', 'bug']
            });
            
            console.log(`🚨 セキュリティIssue作成完了: #${issue.data.number}`);
      
      # ----------------------------------------------------------
      # ステップ3: PRセキュリティコメント（PR時のみ）
      # ----------------------------------------------------------
      - name: 📝 PRセキュリティレポート
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const overallStatus = '${{ steps.security-summary.outputs.overall-status }}';
            const status = overallStatus === 'success' ? '✅ PASSED' : '❌ FAILED';
            
            const comment = `## 🔒 セキュリティスキャン結果 ${status}
            
            | チェック項目 | 結果 | 詳細 |
            |-------------|------|------|
            | 📦 依存関係 | ${{ needs.dependency-security-scan.result == 'success' ? '✅ 正常' : '❌ 脆弱性' }} | Critical: ${{ needs.dependency-security-scan.outputs.critical-count }}, High: ${{ needs.dependency-security-scan.outputs.high-count }} |
            | 🔍 CodeQL | ${{ needs.codeql-security-analysis.result == 'success' ? '✅ 正常' : '⚠️ 要確認' }} | セキュリティタブで詳細確認 |
            | 🔐 シークレット | ${{ needs.secret-scan.result == 'success' ? '✅ 正常' : '❌ 検出' }} | 検出されたシークレットを削除 |
            | ⚙️ 設定 | ${{ needs.configuration-security-check.result == 'success' ? '✅ 正常' : '❌ 問題' }} | ワークフロー・環境設定確認 |
            
            ${overallStatus === 'success' ? 
              '🎉 セキュリティチェックに合格しました！安全にマージできます。' : 
              '🚨 セキュリティ問題が検出されました。修正後に再実行してください。'
            }
            
            ---
            🤖 自動セキュリティレポート | Issue #79`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

# ------------------------------------------------------------
# セキュリティスキャン完了
# プロジェクトの安全性確保と継続的監視の実現
# ------------------------------------------------------------