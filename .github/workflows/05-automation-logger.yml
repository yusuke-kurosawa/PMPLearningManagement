# ====================================================================
# 🤖 自動化・AI - Claude Code Interaction Logger
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - 手動実行
#
# 主な処理:
#   1. 📌 処理: create-issue
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F916 自動化・AI - Claude Code Interaction Logger"
'on':
  workflow_dispatch:
    inputs:
      interaction_type:
        description: Type of Claude interaction
        required: true
        default: Feature Implementation
        type: choice
        options:
          - Feature Implementation
          - Bug Fix
          - Refactoring
          - Architecture Decision
          - Performance Optimization
          - Documentation Update
          - Testing
          - Configuration Change
          - Discussion/Analysis
      priority:
        description: Priority level
        required: true
        default: Medium
        type: choice
        options:
          - Critical
          - High
          - Medium
          - Low
          - Info
      title:
        description: Brief title for the interaction
        required: true
        type: string
      user_request:
        description: User request/instruction
        required: true
        type: string
      claude_analysis:
        description: Claude analysis summary
        required: true
        type: string
      implementation:
        description: Implementation details
        required: true
        type: string
jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          script: "const timestamp = new Date().toISOString();\nconst sessionId = `claude-${timestamp.replace(/[:.]/g, '-')}`;\n\nconst issueBody = `## \U0001F916 Claude Code Interaction Log\n\n**Session ID:** ${sessionId}\n**Timestamp:** ${timestamp}\n**Model:** claude-opus-4-1-20250805\n\n### \U0001F4DD User Request/Instruction\n${context.payload.inputs.user_request}\n\n### \U0001F9E0 Claude's Analysis\n${context.payload.inputs.claude_analysis}\n\n### ⚙️ Implementation Details\n${context.payload.inputs.implementation}\n\n### \U0001F4CA Metadata\n- **Type:** ${context.payload.inputs.interaction_type}\n- **Priority:** ${context.payload.inputs.priority}\n- **Workflow Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n---\n*This issue was automatically generated by the Claude Code Interaction Logger*`;\n\nconst labels = [\n  'claude-code',\n  'automated',\n  `type:${context.payload.inputs.interaction_type.toLowerCase().replace(' ', '-')}`,\n  `priority:${context.payload.inputs.priority.toLowerCase()}`\n];\n\nconst response = await github.rest.issues.create({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  title: `[Claude-Log] ${context.payload.inputs.title}`,\n  body: issueBody,\n  labels: labels\n});\n\nconsole.log(`Created issue #${response.data.number}: ${response.data.html_url}`);\n\nreturn response.data.number;\n"
    timeout-minutes: 30
    name: "\U0001F4CC 処理: create-issue"
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
