# ====================================================================
# 📊 監視・統合 - ⚡ PERF   Comprehensive Performance Monitoring
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - コードプッシュ時
#   - プルリクエスト作成・更新時
#   - スケジュール実行
#   - 手動実行
#
# 主な処理:
#   1. 🔧 セットアップ: 🔧 Performance Monitoring Setup
#   2. 🔍 分析: 📦 Bundle Analysis & Optimization
#   3. 🧪 テスト: 🏮 Lighthouse Performance Testing
#   4. 📊 監視: 👥 Real User Monitoring Simulation
#   5. ⚡ パフォーマンス: 📊 Performance Report Integration
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F4CA 監視・統合 - ⚡ PERF   Comprehensive Performance Monitoring"
'on':
  push:
    branches:
      - main
      - develop
    paths:
      - src/**
      - public/**
      - package.json
      - vite.config.js
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: 0 */6 * * *
  workflow_dispatch:
    inputs:
      monitoring-type:
        description: Type of performance monitoring
        required: true
        type: choice
        options:
          - comprehensive
          - lighthouse-only
          - bundle-analysis-only
          - real-user-monitoring
        default: comprehensive
      performance-budget:
        description: Performance budget enforcement level
        required: false
        type: choice
        options:
          - strict
          - moderate
          - lenient
        default: moderate
      optimization-level:
        description: Automatic optimization level
        required: false
        type: choice
        options:
          - aggressive
          - balanced
          - conservative
        default: balanced
      devices:
        description: Device types to test
        required: false
        type: string
        default: 'desktop,mobile,tablet'
env:
  NODE_VERSION: '18'
  MONITORING_TYPE: '${{ inputs.monitoring-type || ''comprehensive'' }}'
  BUDGET_LEVEL: '${{ inputs.performance-budget || ''moderate'' }}'
  OPTIMIZATION: '${{ inputs.optimization-level || ''balanced'' }}'
  DEVICES: '${{ inputs.devices || ''desktop,mobile,tablet'' }}'
  LIGHTHOUSE_CI: true
  CHROME_PATH: /usr/bin/google-chrome
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  pages: read
jobs:
  performance-setup:
    name: "\U0001F527 セットアップ: \U0001F527 Performance Monitoring Setup"
    uses: ./.github/workflows/templates/devops-workflow-template.yml
    with:
      workflow-category: perf
      environment: performance
      node-version: '18'
      enable-caching: true
      enable-notifications: true
      parallel-jobs: 4
    secrets:
      CLAUDE_API_KEY: '${{ secrets.CLAUDE_API_KEY }}'
    timeout-minutes: 30
  bundle-analysis:
    name: "\U0001F50D 分析: \U0001F4E6 Bundle Analysis & Optimization"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
    if: 'contains(fromJson(''["comprehensive", "bundle-analysis-only"]''), env.MONITORING_TYPE)'
    outputs:
      bundle-size: '${{ steps.analysis.outputs.bundle-size }}'
      optimization-savings: '${{ steps.optimization.outputs.savings }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 Install Dependencies"
        run: npm ci --prefer-offline
      - name: "\U0001F3D7️ Production Build"
        env:
          NODE_ENV: production
        run: "echo \"\U0001F3D7️ Building for bundle analysis...\"\nnpm run build -- --mode production\n\necho \"✅ Build completed for analysis\"\nls -la dist/\n"
      - name: "\U0001F4CA Bundle Analysis with webpack-bundle-analyzer"
        run: "echo \"\U0001F4CA Analyzing bundle composition...\"\n\n# Install bundle analyzer\nnpm install --save-dev webpack-bundle-analyzer@latest\n\n# Generate bundle analysis report\nnpx vite-bundle-analyzer dist --format json > bundle-analysis.json\n\n# Create human-readable summary\ncat > bundle-summary.md << EOF\n# \U0001F4E6 Bundle Analysis Report\n\n## Bundle Composition\n\n\\`\\`\\`\n$(ls -lah dist/assets/ | grep -E '\\.(js|css)$' | head -10)\n\\`\\`\\`\n\n## Top Dependencies by Size\n$(npm ls --depth=0 --parseable | head -10)\n\nEOF\n"
      - name: "\U0001F50D Bundle Size Analysis"
        id: analysis
        run: "echo \"\U0001F50D Analyzing bundle sizes...\"\n\n# Calculate total bundle size\nif [ -d dist/assets ]; then\n  total_js=$(find dist/assets -name \"*.js\" -type f -exec stat -c%s {} + | awk '{sum+=$1} END {print sum}')\n  total_css=$(find dist/assets -name \"*.css\" -type f -exec stat -c%s {} + | awk '{sum+=$1} END {print sum}')\n  total_size=$((total_js + total_css))\n  \n  # Convert to human readable\n  total_mb=$(echo \"scale=2; $total_size / 1024 / 1024\" | bc)\n  js_mb=$(echo \"scale=2; $total_js / 1024 / 1024\" | bc)\n  css_mb=$(echo \"scale=2; $total_css / 1024 / 1024\" | bc)\n  \n  echo \"\U0001F4CA Bundle Analysis Results:\"\n  echo \"  Total Size: ${total_mb}MB\"\n  echo \"  JavaScript: ${js_mb}MB\"\n  echo \"  CSS: ${css_mb}MB\"\n  \n  echo \"bundle-size=${total_mb}MB\" >> $GITHUB_OUTPUT\n  \n  # Performance budget check\n  budget_threshold=$(case \"${{ env.BUDGET_LEVEL }}\" in\n    \"strict\") echo \"1.0\" ;;\n    \"moderate\") echo \"2.0\" ;;\n    \"lenient\") echo \"3.0\" ;;\n  esac)\n  \n  if (( $(echo \"$total_mb > $budget_threshold\" | bc -l) )); then\n    echo \"⚠️ Bundle size exceeds ${{ env.BUDGET_LEVEL }} budget: ${total_mb}MB > ${budget_threshold}MB\"\n    echo \"budget-exceeded=true\" >> $GITHUB_OUTPUT\n  else\n    echo \"✅ Bundle size within budget: ${total_mb}MB ≤ ${budget_threshold}MB\"\n    echo \"budget-exceeded=false\" >> $GITHUB_OUTPUT\n  fi\nfi\n"
      - name: "\U0001F680 Bundle Optimization Suggestions"
        id: optimization
        run: "echo \"\U0001F680 Generating optimization suggestions...\"\n\n# Tree-shaking analysis\necho \"\U0001F4CA Tree-shaking opportunities:\"\n\n# Check for unused dependencies\nnpx depcheck --json > dependency-check.json 2>/dev/null || echo '{}' > dependency-check.json\n\nunused_deps=$(jq -r '.dependencies[]' dependency-check.json 2>/dev/null | wc -l || echo \"0\")\nmissing_deps=$(jq -r '.missing | keys[]' dependency-check.json 2>/dev/null | wc -l || echo \"0\")\n\necho \"  Potentially unused dependencies: $unused_deps\"\necho \"  Missing dependencies: $missing_deps\"\n\n# Generate optimization report\ncat > optimization-recommendations.md << EOF\n# \U0001F680 Bundle Optimization Recommendations\n\n## Current Status\n- Bundle Size: ${{ steps.analysis.outputs.bundle-size }}\n- Budget Status: $([ \"${{ steps.analysis.outputs.budget-exceeded }}\" == \"true\" ] && echo \"❌ EXCEEDED\" || echo \"✅ WITHIN BUDGET\")\n\n## Optimization Opportunities\n\n### 1. Dependency Optimization\n- Unused dependencies detected: $unused_deps\n- Consider removing unused packages\n\n### 2. Code Splitting Opportunities\n- Implement route-based splitting\n- Lazy load non-critical components\n\n### 3. Asset Optimization\n- Enable Gzip/Brotli compression\n- Optimize image formats (WebP, AVIF)\n- Tree-shake unused CSS\n\n### 4. Dynamic Imports\n\\`\\`\\`javascript\n// Example: Lazy load heavy components\nconst HeavyComponent = lazy(() => import('./HeavyComponent'));\n\\`\\`\\`\n\n## Estimated Savings\n- Dependency cleanup: ~200-500KB\n- Code splitting: ~300-800KB\n- Asset optimization: ~100-300KB\n\nEOF\n\necho \"savings=500KB-1.6MB\" >> $GITHUB_OUTPUT\ncat optimization-recommendations.md\n"
      - name: "\U0001F4E4 Upload Bundle Analysis Reports"
        uses: actions/upload-artifact@v4
        with:
          name: 'bundle-analysis-reports-${{ github.run_number }}'
          path: |
            bundle-analysis.json
            bundle-summary.md
            dependency-check.json
            optimization-recommendations.md
          retention-days: 30
    timeout-minutes: 30
  lighthouse-testing:
    name: "\U0001F9EA テスト: \U0001F3EE Lighthouse Performance Testing"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
    if: 'contains(fromJson(''["comprehensive", "lighthouse-only"]''), env.MONITORING_TYPE)'
    strategy:
      matrix:
        device:
          - desktop
          - mobile
        include:
          - device: desktop
            preset: desktop
            viewport: 1920x1080
          - device: mobile
            preset: mobile
            viewport: 375x667
    outputs:
      performance-score-desktop: '${{ steps.lighthouse-desktop.outputs.performance-score }}'
      performance-score-mobile: '${{ steps.lighthouse-mobile.outputs.performance-score }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 Install Dependencies"
        run: npm ci --prefer-offline
      - name: "\U0001F3D7️ Build for Lighthouse"
        run: "echo \"\U0001F3D7️ Building optimized version for Lighthouse testing...\"\nnpm run build\n\n# Start local server for testing\nnpx serve -s dist -p 3000 &\nSERVER_PID=$!\necho \"SERVER_PID=$SERVER_PID\" >> $GITHUB_ENV\n\n# Wait for server to start\nsleep 5\ncurl -f http://localhost:3000 || {\n  echo \"❌ Local server failed to start\"\n  exit 1\n}\n"
      - name: "\U0001F3EE Install Lighthouse CI"
        run: |
          npm install -g @lhci/cli@latest
          google-chrome --version
      - name: "\U0001F3EE Run Lighthouse Analysis (${{ matrix.device }})"
        id: 'lighthouse-${{ matrix.device }}'
        run: "echo \"\U0001F3EE Running Lighthouse analysis for ${{ matrix.device }}...\"\n\n# Create Lighthouse CI configuration\ncat > .lighthouserc.js << EOF\nmodule.exports = {\n  ci: {\n    collect: {\n      url: ['http://localhost:3000'],\n      numberOfRuns: 3,\n      settings: {\n        preset: '${{ matrix.preset }}',\n        chromeFlags: ['--no-sandbox', '--headless', '--disable-gpu'],\n        emulatedFormFactor: '${{ matrix.device }}',\n        throttling: {\n          rttMs: 40,\n          throughputKbps: 10240,\n          cpuSlowdownMultiplier: 1,\n          requestLatencyMs: 0,\n          downloadThroughputKbps: 0,\n          uploadThroughputKbps: 0\n        }\n      }\n    },\n    assert: {\n      assertions: {\n        'categories:performance': ['error', {minScore: 0.7}],\n        'categories:accessibility': ['error', {minScore: 0.9}],\n        'categories:best-practices': ['error', {minScore: 0.8}],\n        'categories:seo': ['error', {minScore: 0.8}],\n        'categories:pwa': ['warn', {minScore: 0.6}]\n      }\n    },\n    upload: {\n      target: 'filesystem',\n      outputDir: './lighthouse-results-${{ matrix.device }}'\n    }\n  }\n};\nEOF\n\n# Run Lighthouse CI\nlhci collect --config=.lighthouserc.js || echo \"Lighthouse collection completed with warnings\"\nlhci assert --config=.lighthouserc.js || lighthouse_exit_code=$?\n\n# Parse results\nif [ -d \"lighthouse-results-${{ matrix.device }}\" ]; then\n  latest_report=$(ls -t lighthouse-results-${{ matrix.device }}/*.json | head -1)\n  if [ -n \"$latest_report\" ]; then\n    perf_score=$(jq -r '.categories.performance.score * 100' \"$latest_report\" 2>/dev/null || echo \"0\")\n    accessibility_score=$(jq -r '.categories.accessibility.score * 100' \"$latest_report\" 2>/dev/null || echo \"0\")\n    best_practices_score=$(jq -r '.categories[\"best-practices\"].score * 100' \"$latest_report\" 2>/dev/null || echo \"0\")\n    seo_score=$(jq -r '.categories.seo.score * 100' \"$latest_report\" 2>/dev/null || echo \"0\")\n    \n    echo \"\U0001F4CA Lighthouse Results (${{ matrix.device }}):\"\n    echo \"  Performance: ${perf_score}/100\"\n    echo \"  Accessibility: ${accessibility_score}/100\"\n    echo \"  Best Practices: ${best_practices_score}/100\"\n    echo \"  SEO: ${seo_score}/100\"\n    \n    echo \"performance-score=${perf_score}\" >> $GITHUB_OUTPUT\n    echo \"accessibility-score=${accessibility_score}\" >> $GITHUB_OUTPUT\n    echo \"best-practices-score=${best_practices_score}\" >> $GITHUB_OUTPUT\n    echo \"seo-score=${seo_score}\" >> $GITHUB_OUTPUT\n  fi\nfi\n\nexit ${lighthouse_exit_code:-0}\n"
      - name: "\U0001F50D Performance Metrics Analysis"
        run: "echo \"\U0001F50D Analyzing performance metrics...\"\n\nif [ -d \"lighthouse-results-${{ matrix.device }}\" ]; then\n  latest_report=$(ls -t lighthouse-results-${{ matrix.device }}/*.json | head -1)\n  if [ -n \"$latest_report\" ]; then\n    # Extract detailed metrics\n    fcp=$(jq -r '.audits[\"first-contentful-paint\"].numericValue // 0' \"$latest_report\")\n    lcp=$(jq -r '.audits[\"largest-contentful-paint\"].numericValue // 0' \"$latest_report\")\n    cls=$(jq -r '.audits[\"cumulative-layout-shift\"].numericValue // 0' \"$latest_report\")\n    fid=$(jq -r '.audits[\"max-potential-fid\"].numericValue // 0' \"$latest_report\")\n    \n    echo \"\U0001F3AF Core Web Vitals (${{ matrix.device }}):\"\n    echo \"  First Contentful Paint: ${fcp}ms\"\n    echo \"  Largest Contentful Paint: ${lcp}ms\"\n    echo \"  Cumulative Layout Shift: ${cls}\"\n    echo \"  First Input Delay: ${fid}ms\"\n    \n    # Performance budget validation\n    case \"${{ env.BUDGET_LEVEL }}\" in\n      \"strict\")\n        fcp_threshold=1500\n        lcp_threshold=2500\n        ;;\n      \"moderate\")\n        fcp_threshold=2000\n        lcp_threshold=3000\n        ;;\n      \"lenient\")\n        fcp_threshold=3000\n        lcp_threshold=4000\n        ;;\n    esac\n    \n    if (( $(echo \"$fcp > $fcp_threshold\" | bc -l 2>/dev/null || echo \"0\") )); then\n      echo \"⚠️ FCP exceeds ${{ env.BUDGET_LEVEL }} budget: ${fcp}ms > ${fcp_threshold}ms\"\n    fi\n    \n    if (( $(echo \"$lcp > $lcp_threshold\" | bc -l 2>/dev/null || echo \"0\") )); then\n      echo \"⚠️ LCP exceeds ${{ env.BUDGET_LEVEL }} budget: ${lcp}ms > ${lcp_threshold}ms\"\n    fi\n  fi\nfi\n"
      - name: "\U0001F9F9 Cleanup Server"
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
      - name: "\U0001F4E4 Upload Lighthouse Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'lighthouse-reports-${{ matrix.device }}-${{ github.run_number }}'
          path: |
            lighthouse-results-${{ matrix.device }}/
            .lighthouserc.js
          retention-days: 30
    timeout-minutes: 30
  real-user-monitoring:
    name: "\U0001F4CA 監視: \U0001F465 Real User Monitoring Simulation"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
    if: 'contains(fromJson(''["comprehensive", "real-user-monitoring"]''), env.MONITORING_TYPE)'
    strategy:
      matrix:
        scenario:
          - fast-3g
          - slow-3g
          - offline
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - name: "\U0001F4E6 Install Dependencies"
        run: npm ci --prefer-offline
      - name: "\U0001F3D7️ Build Application"
        run: npm run build
      - name: "\U0001F4E1 Network Condition Testing (${{ matrix.scenario }})"
        run: "echo \"\U0001F4E1 Testing under ${{ matrix.scenario }} conditions...\"\n\n# Install Puppeteer for network simulation\nnpm install --save-dev puppeteer@latest\n\n# Create network testing script\ncat > network-test-${{ matrix.scenario }}.js << 'EOF'\nconst puppeteer = require('puppeteer');\nconst { performance } = require('perf_hooks');\n\n(async () => {\n  const browser = await puppeteer.launch({\n    headless: true,\n    args: ['--no-sandbox', '--disable-setuid-sandbox']\n  });\n  \n  const page = await browser.newPage();\n  \n  // Set network conditions\n  const conditions = {\n    'fast-3g': {\n      offline: false,\n      downloadThroughput: 1.5 * 1024 * 1024 / 8,\n      uploadThroughput: 750 * 1024 / 8,\n      latency: 150\n    },\n    'slow-3g': {\n      offline: false,\n      downloadThroughput: 500 * 1024 / 8,\n      uploadThroughput: 500 * 1024 / 8,\n      latency: 300\n    },\n    'offline': {\n      offline: true\n    }\n  };\n  \n  await page.emulateNetworkConditions(conditions['${{ matrix.scenario }}']);\n  \n  // Measure navigation timing\n  const startTime = performance.now();\n  \n  try {\n    // Serve static files and navigate\n    const response = await page.goto('file://' + process.cwd() + '/dist/index.html', {\n      waitUntil: 'networkidle2',\n      timeout: 30000\n    });\n    \n    const endTime = performance.now();\n    const loadTime = endTime - startTime;\n    \n    // Collect performance metrics\n    const metrics = await page.evaluate(() => {\n      const navigation = performance.getEntriesByType('navigation')[0];\n      return {\n        domContentLoaded: navigation.domContentLoadedEventEnd - navigation.navigationStart,\n        fullyLoaded: navigation.loadEventEnd - navigation.navigationStart,\n        firstPaint: performance.getEntriesByType('paint')[0]?.startTime || 0,\n        responseStatus: navigation.responseStatus\n      };\n    });\n    \n    console.log(`\U0001F4CA Network Performance (${{ matrix.scenario }}):`);\n    console.log(`  Total Load Time: ${loadTime.toFixed(2)}ms`);\n    console.log(`  DOM Content Loaded: ${metrics.domContentLoaded}ms`);\n    console.log(`  Fully Loaded: ${metrics.fullyLoaded}ms`);\n    console.log(`  First Paint: ${metrics.firstPaint}ms`);\n    \n    // Save results\n    const results = {\n      scenario: '${{ matrix.scenario }}',\n      loadTime: loadTime,\n      metrics: metrics,\n      timestamp: new Date().toISOString()\n    };\n    \n    require('fs').writeFileSync(\n      `rum-results-${{ matrix.scenario }}.json`,\n      JSON.stringify(results, null, 2)\n    );\n    \n  } catch (error) {\n    console.error(`❌ Error in ${{ matrix.scenario }} test:`, error.message);\n    \n    // Save error results\n    const errorResults = {\n      scenario: '${{ matrix.scenario }}',\n      error: error.message,\n      timestamp: new Date().toISOString()\n    };\n    \n    require('fs').writeFileSync(\n      `rum-error-${{ matrix.scenario }}.json`,\n      JSON.stringify(errorResults, null, 2)\n    );\n  }\n  \n  await browser.close();\n})();\nEOF\n\n# Run network test\nnode network-test-${{ matrix.scenario }}.js\n"
      - name: "\U0001F4E4 Upload RUM Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'rum-results-${{ matrix.scenario }}-${{ github.run_number }}'
          path: |
            rum-results-${{ matrix.scenario }}.json
            rum-error-${{ matrix.scenario }}.json
            network-test-${{ matrix.scenario }}.js
          retention-days: 30
    timeout-minutes: 30
  performance-report:
    name: "⚡ パフォーマンス: \U0001F4CA Performance Report Integration"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
      - bundle-analysis
      - lighthouse-testing
      - real-user-monitoring
    if: always()
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
      - name: "\U0001F4E5 Download All Performance Reports"
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports-${{ github.run_number }}'
          merge-multiple: true
      - name: "\U0001F4E5 Download RUM Results"
        uses: actions/download-artifact@v4
        with:
          pattern: 'rum-results-*-${{ github.run_number }}'
          merge-multiple: true
        continue-on-error: true
      - name: "\U0001F4CA Generate Comprehensive Performance Report"
        run: "echo \"\U0001F4CA Generating comprehensive performance report...\"\n\n# Collect performance metrics\nbundle_size=\"${{ needs.bundle-analysis.outputs.bundle-size || 'N/A' }}\"\ndesktop_perf=\"${{ needs.lighthouse-testing.outputs.performance-score-desktop || 'N/A' }}\"\nmobile_perf=\"${{ needs.lighthouse-testing.outputs.performance-score-mobile || 'N/A' }}\"\noptimization_savings=\"${{ needs.bundle-analysis.outputs.optimization-savings || 'N/A' }}\"\n\n# Create comprehensive report\ncat > comprehensive-performance-report.md << EOF\n# ⚡ Comprehensive Performance Analysis Report\n\n**Analysis Date**: $(date -Iseconds)  \n**Commit**: ${{ github.sha }}  \n**Branch**: ${{ github.ref_name }}  \n**Monitoring Type**: ${{ env.MONITORING_TYPE }}  \n**Performance Budget**: ${{ env.BUDGET_LEVEL }}  \n\n## \U0001F4CA Executive Summary\n\n| Metric | Value | Status |\n|--------|--------|--------|\n| Bundle Size | ${bundle_size} | $([ \"${{ needs.bundle-analysis.outputs.budget-exceeded }}\" == \"false\" ] && echo \"✅ PASS\" || echo \"⚠️ REVIEW\") |\n| Desktop Performance | ${desktop_perf}/100 | $([[ \"${desktop_perf}\" != \"N/A\" && $(echo \"${desktop_perf} >= 70\" | bc -l 2>/dev/null) == \"1\" ]] && echo \"✅\" || echo \"⚠️\") |\n| Mobile Performance | ${mobile_perf}/100 | $([[ \"${mobile_perf}\" != \"N/A\" && $(echo \"${mobile_perf} >= 70\" | bc -l 2>/dev/null) == \"1\" ]] && echo \"✅\" || echo \"⚠️\") |\n| Bundle Analysis | ${{ needs.bundle-analysis.result }} | $([[ \"${{ needs.bundle-analysis.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n| Lighthouse Testing | ${{ needs.lighthouse-testing.result }} | $([[ \"${{ needs.lighthouse-testing.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n| RUM Simulation | ${{ needs.real-user-monitoring.result }} | $([[ \"${{ needs.real-user-monitoring.result }}\" == \"success\" ]] && echo \"✅\" || echo \"❌\") |\n\n## \U0001F4E6 Bundle Analysis Results\n\nEOF\n\n# Add bundle analysis details\nif [ -f bundle-summary.md ]; then\n  cat bundle-summary.md >> comprehensive-performance-report.md\nelse\n  echo \"Bundle analysis data not available.\" >> comprehensive-performance-report.md\nfi\n\n# Add Lighthouse results\ncat >> comprehensive-performance-report.md << EOF\n\n## \U0001F3EE Lighthouse Performance Analysis\n\n### Desktop Results\n- Performance Score: ${desktop_perf}/100\n- Overall Status: $([[ \"${desktop_perf}\" != \"N/A\" && $(echo \"${desktop_perf} >= 70\" | bc -l 2>/dev/null) == \"1\" ]] && echo \"✅ GOOD\" || echo \"⚠️ NEEDS IMPROVEMENT\")\n\n### Mobile Results  \n- Performance Score: ${mobile_perf}/100\n- Overall Status: $([[ \"${mobile_perf}\" != \"N/A\" && $(echo \"${mobile_perf} >= 70\" | bc -l 2>/dev/null) == \"1\" ]] && echo \"✅ GOOD\" || echo \"⚠️ NEEDS IMPROVEMENT\")\n\nEOF\n\n# Add RUM results if available\nif ls rum-results-*.json 1>/dev/null 2>&1; then\n  echo \"## \U0001F465 Real User Monitoring Results\" >> comprehensive-performance-report.md\n  echo \"\" >> comprehensive-performance-report.md\n  for rum_file in rum-results-*.json; do\n    if [ -f \"$rum_file\" ]; then\n      scenario=$(jq -r '.scenario' \"$rum_file\")\n      load_time=$(jq -r '.loadTime // \"N/A\"' \"$rum_file\")\n      echo \"- **${scenario}**: ${load_time}ms\" >> comprehensive-performance-report.md\n    fi\n  done\n  echo \"\" >> comprehensive-performance-report.md\nfi\n\n# Add optimization recommendations\nif [ -f optimization-recommendations.md ]; then\n  echo \"## \U0001F680 Optimization Recommendations\" >> comprehensive-performance-report.md\n  tail -n +2 optimization-recommendations.md >> comprehensive-performance-report.md\nfi\n\n# Add action items and next steps\ncat >> comprehensive-performance-report.md << EOF\n\n## \U0001F3AF Action Items\n\n### High Priority\nEOF\n\nif [ \"${{ needs.bundle-analysis.outputs.budget-exceeded }}\" == \"true\" ]; then\n  echo \"- \U0001F6A8 **Bundle size exceeds budget** - implement code splitting and tree shaking\" >> comprehensive-performance-report.md\nfi\n\nif [[ \"${desktop_perf}\" != \"N/A\" && $(echo \"${desktop_perf} < 70\" | bc -l 2>/dev/null) == \"1\" ]]; then\n  echo \"- ⚠️ **Desktop performance below threshold** - optimize critical rendering path\" >> comprehensive-performance-report.md\nfi\n\nif [[ \"${mobile_perf}\" != \"N/A\" && $(echo \"${mobile_perf} < 70\" | bc -l 2>/dev/null) == \"1\" ]]; then\n  echo \"- ⚠️ **Mobile performance below threshold** - implement mobile-first optimizations\" >> comprehensive-performance-report.md\nfi\n\ncat >> comprehensive-performance-report.md << EOF\n\n### Medium Priority\n- \U0001F4CA Implement performance monitoring in production\n- \U0001F50D Set up Core Web Vitals tracking\n- \U0001F4F1 Optimize for mobile user experience\n\n### Low Priority  \n- \U0001F680 Explore advanced optimization techniques\n- \U0001F4C8 Implement performance analytics\n- \U0001F3A8 Optimize visual assets further\n\n## \U0001F4CB Next Steps\n\n1. Review detailed performance reports in artifacts\n2. Implement high-priority optimizations\n3. Re-run performance tests to validate improvements\n4. Set up continuous performance monitoring\n5. Update performance budgets based on results\n\n---\n*Generated by DevOps Performance Pipeline v2.0.0*\nEOF\n\ncat comprehensive-performance-report.md\n"
      - name: "\U0001F3AF Performance Gate Decision"
        run: "echo \"\U0001F3AF Performance Gate Evaluation...\"\n\nbundle_exceeded=\"${{ needs.bundle-analysis.outputs.budget-exceeded || 'false' }}\"\ndesktop_perf=\"${{ needs.lighthouse-testing.outputs.performance-score-desktop || '100' }}\"\nmobile_perf=\"${{ needs.lighthouse-testing.outputs.performance-score-mobile || '100' }}\"\n\necho \"\U0001F4CA Current Performance Metrics:\"\necho \"  Bundle Budget Exceeded: $bundle_exceeded\"\necho \"  Desktop Performance: $desktop_perf/100\"\necho \"  Mobile Performance: $mobile_perf/100\"\necho \"  Budget Level: ${{ env.BUDGET_LEVEL }}\"\n\ncase \"${{ env.BUDGET_LEVEL }}\" in\n  \"strict\")\n    if [[ \"$bundle_exceeded\" == \"true\" ]] || \n       [[ \"$desktop_perf\" != \"N/A\" && $(echo \"$desktop_perf < 85\" | bc -l 2>/dev/null) == \"1\" ]] ||\n       [[ \"$mobile_perf\" != \"N/A\" && $(echo \"$mobile_perf < 80\" | bc -l 2>/dev/null) == \"1\" ]]; then\n      echo \"❌ STRICT PERFORMANCE GATE FAILED\"\n      echo \"Performance requirements not met for strict budget\"\n      exit 1\n    fi\n    ;;\n  \"moderate\")\n    if [[ \"$desktop_perf\" != \"N/A\" && $(echo \"$desktop_perf < 70\" | bc -l 2>/dev/null) == \"1\" ]] ||\n       [[ \"$mobile_perf\" != \"N/A\" && $(echo \"$mobile_perf < 65\" | bc -l 2>/dev/null) == \"1\" ]]; then\n      echo \"❌ MODERATE PERFORMANCE GATE FAILED\"\n      echo \"Performance scores below acceptable thresholds\"\n      exit 1\n    fi\n    ;;\n  \"lenient\")\n    if [[ \"$desktop_perf\" != \"N/A\" && $(echo \"$desktop_perf < 50\" | bc -l 2>/dev/null) == \"1\" ]] ||\n       [[ \"$mobile_perf\" != \"N/A\" && $(echo \"$mobile_perf < 45\" | bc -l 2>/dev/null) == \"1\" ]]; then\n      echo \"❌ LENIENT PERFORMANCE GATE FAILED\"\n      echo \"Performance critically below minimum standards\"\n      exit 1\n    fi\n    ;;\nesac\n\necho \"✅ PERFORMANCE GATE PASSED\"\necho \"All performance requirements met for ${{ env.BUDGET_LEVEL }} budget level\"\n"
      - name: "\U0001F4E4 Upload Comprehensive Performance Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'comprehensive-performance-report-${{ github.run_number }}'
          path: comprehensive-performance-report.md
          retention-days: 90
      - name: "\U0001F4AC Create Performance Issue (If Critical)"
        if: needs.bundle-analysis.outputs.budget-exceeded == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚡ Performance Budget Exceeded - Run #${{ github.run_number }}`;
            const body = `
            ## ⚡ Performance Alert

            **Bundle size exceeds budget**: ${{ needs.bundle-analysis.outputs.bundle-size }}
            **Optimization potential**: ${{ needs.bundle-analysis.outputs.optimization-savings }}
            **Commit**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}

            ### Performance Scores
            - Desktop: ${{ needs.lighthouse-testing.outputs.performance-score-desktop || 'N/A' }}/100
            - Mobile: ${{ needs.lighthouse-testing.outputs.performance-score-mobile || 'N/A' }}/100

            ### Action Required
            - Review comprehensive performance report
            - Implement bundle optimization recommendations  
            - Re-run performance tests after fixes

            ### Reports
            - [Performance Monitoring Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---
            *Auto-generated by Performance Pipeline*
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', 'optimization', 'auto-generated']
            });
    timeout-minutes: 30
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
