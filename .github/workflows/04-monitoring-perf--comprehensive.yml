name: 📊 監視・統合 - ⚡ PERF   Comprehensive Performance Monitoring
"on":
  push:
    branches:
      - main
      - develop
    paths:
      - src/**
      - public/**
      - package.json
      - vite.config.js
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: 0 */6 * * *
  workflow_dispatch:
    inputs:
      monitoring-type:
        description: Type of performance monitoring
        required: true
        type: choice
        options:
          - comprehensive
          - lighthouse-only
          - bundle-analysis-only
          - real-user-monitoring
        default: comprehensive
      performance-budget:
        description: Performance budget enforcement level
        required: false
        type: choice
        options:
          - strict
          - moderate
          - lenient
        default: moderate
      optimization-level:
        description: Automatic optimization level
        required: false
        type: choice
        options:
          - aggressive
          - balanced
          - conservative
        default: balanced
      devices:
        description: Device types to test
        required: false
        type: string
        default: desktop,mobile,tablet
env:
  NODE_VERSION: "18"
  MONITORING_TYPE: ${{ inputs.monitoring-type || 'comprehensive' }}
  BUDGET_LEVEL: ${{ inputs.performance-budget || 'moderate' }}
  OPTIMIZATION: ${{ inputs.optimization-level || 'balanced' }}
  DEVICES: ${{ inputs.devices || 'desktop,mobile,tablet' }}
  LIGHTHOUSE_CI: true
  CHROME_PATH: /usr/bin/google-chrome
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  pages: read
jobs:
  performance-setup:
    name: "🔧 セットアップ: performance-setup"
    uses: ./.github/workflows/templates/devops-workflow-template.yml
    with:
      workflow-category: perf
      environment: performance
      node-version: "18"
      enable-caching: true
      enable-notifications: true
      parallel-jobs: 4
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
    timeout-minutes: 30
  bundle-analysis:
    name: "🔍 分析: 📦 Bundle Analysis & Optimization"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
    if: contains(fromJson('["comprehensive", "bundle-analysis-only"]'), env.MONITORING_TYPE)
    outputs:
      bundle-size: ${{ steps.analysis.outputs.bundle-size }}
      optimization-savings: ${{ steps.optimization.outputs.savings }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline
      - name: 🏗️ Production Build
        env:
          NODE_ENV: production
        run: |
          echo "🏗️ Building for bundle analysis..."
          npm run build -- --mode production

          echo "✅ Build completed for analysis"
          ls -la dist/
      - name: 📊 Bundle Analysis with webpack-bundle-analyzer
        run: |
          echo "📊 Analyzing bundle composition..."

          # Install bundle analyzer
          npm install --save-dev webpack-bundle-analyzer@^4.10.2

          # Generate bundle analysis report
          npx vite-bundle-analyzer dist --format json > bundle-analysis.json

          # Create human-readable summary
          cat > bundle-summary.md << EOF
          # 📦 Bundle Analysis Report

          ## Bundle Composition

          \`\`\`
          $(ls -lah dist/assets/ | grep -E '\.(js|css)$' | head -10)
          \`\`\`

          ## Top Dependencies by Size
          $(npm ls --depth=0 --parseable | head -10)

          EOF
      - name: 🔍 Bundle Size Analysis
        id: analysis
        run: |
          echo "🔍 Analyzing bundle sizes..."

          # Calculate total bundle size
          if [ -d dist/assets ]; then
            total_js=$(find dist/assets -name "*.js" -type f -exec stat -c%s {} + | awk '{sum+=$1} END {print sum}')
            total_css=$(find dist/assets -name "*.css" -type f -exec stat -c%s {} + | awk '{sum+=$1} END {print sum}')
            total_size=$((total_js + total_css))
            
            # Convert to human readable
            total_mb=$(echo "scale=2; $total_size / 1024 / 1024" | bc)
            js_mb=$(echo "scale=2; $total_js / 1024 / 1024" | bc)
            css_mb=$(echo "scale=2; $total_css / 1024 / 1024" | bc)
            
            echo "📊 Bundle Analysis Results:"
            echo "  Total Size: ${total_mb}MB"
            echo "  JavaScript: ${js_mb}MB"
            echo "  CSS: ${css_mb}MB"
            
            echo "bundle-size=${total_mb}MB" >> $GITHUB_OUTPUT
            
            # Performance budget check
            budget_threshold=$(case "${{ env.BUDGET_LEVEL }}" in
              "strict") echo "1.0" ;;
              "moderate") echo "2.0" ;;
              "lenient") echo "3.0" ;;
            esac)
            
            if (( $(echo "$total_mb > $budget_threshold" | bc -l) )); then
              echo "⚠️ Bundle size exceeds ${{ env.BUDGET_LEVEL }} budget: ${total_mb}MB > ${budget_threshold}MB"
              echo "budget-exceeded=true" >> $GITHUB_OUTPUT
            else
              echo "✅ Bundle size within budget: ${total_mb}MB ≤ ${budget_threshold}MB"
              echo "budget-exceeded=false" >> $GITHUB_OUTPUT
            fi
          fi
      - name: 🚀 Bundle Optimization Suggestions
        id: optimization
        run: >
          echo "🚀 Generating optimization suggestions..."


          # Tree-shaking analysis

          echo "📊 Tree-shaking opportunities:"


          # Check for unused dependencies

          npx depcheck --json > dependency-check.json 2>/dev/null || echo '{}' > dependency-check.json


          unused_deps=$(jq -r '.dependencies[]' dependency-check.json 2>/dev/null | wc -l || echo "0")

          missing_deps=$(jq -r '.missing | keys[]' dependency-check.json 2>/dev/null | wc -l || echo "0")


          echo "  Potentially unused dependencies: $unused_deps"

          echo "  Missing dependencies: $missing_deps"


          # Generate optimization report

          cat > optimization-recommendations.md << EOF

          # 🚀 Bundle Optimization Recommendations


          ## Current Status

          - Bundle Size: ${{ steps.analysis.outputs.bundle-size }}

          - Budget Status: $([ "${{ steps.analysis.outputs.budget-exceeded }}" == "true" ] && echo "❌ EXCEEDED" || echo
          "✅ WITHIN BUDGET")


          ## Optimization Opportunities


          ### 1. Dependency Optimization

          - Unused dependencies detected: $unused_deps

          - Consider removing unused packages


          ### 2. Code Splitting Opportunities

          - Implement route-based splitting

          - Lazy load non-critical components


          ### 3. Asset Optimization

          - Enable Gzip/Brotli compression

          - Optimize image formats (WebP, AVIF)

          - Tree-shake unused CSS


          ### 4. Dynamic Imports

          \`\`\`javascript

          // Example: Lazy load heavy components

          const HeavyComponent = lazy(() => import('./HeavyComponent'));

          \`\`\`


          ## Estimated Savings

          - Dependency cleanup: ~200-500KB

          - Code splitting: ~300-800KB

          - Asset optimization: ~100-300KB


          EOF


          echo "savings=500KB-1.6MB" >> $GITHUB_OUTPUT

          cat optimization-recommendations.md
      - name: 📤 Upload Bundle Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-reports-${{ github.run_number }}
          path: |
            bundle-analysis.json
            bundle-summary.md
            dependency-check.json
            optimization-recommendations.md
          retention-days: 30
    timeout-minutes: 30
  lighthouse-testing:
    name: "🔧 テスト: lighthouse-testing"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
    if: contains(fromJson('["comprehensive", "lighthouse-only"]'), env.MONITORING_TYPE)
    strategy:
      matrix:
        device:
          - desktop
          - mobile
        include:
          - device: desktop
            preset: desktop
            viewport: 1920x1080
          - device: mobile
            preset: mobile
            viewport: 375x667
    outputs:
      performance-score-desktop: ${{ steps.lighthouse-desktop.outputs.performance-score }}
      performance-score-mobile: ${{ steps.lighthouse-mobile.outputs.performance-score }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline
      - name: 🏗️ Build for Lighthouse
        run: |
          echo "🏗️ Building optimized version for Lighthouse testing..."
          npm run build

          # Start local server for testing
          npx serve -s dist -p 3000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to start
          sleep 5
          curl -f http://localhost:3000 || {
            echo "❌ Local server failed to start"
            exit 1
          }
      - name: 🏮 Install Lighthouse CI
        run: |
          npm install -g @lhci/cli@^0.14.0
          google-chrome --version
      - name: 🏮 Run Lighthouse Analysis (${{ matrix.device }})
        id: lighthouse-${{ matrix.device }}
        run: |
          echo "🏮 Running Lighthouse analysis for ${{ matrix.device }}..."

          # Create Lighthouse CI configuration
          cat > .lighthouserc.js << EOF
          module.exports = {
            ci: {
              collect: {
                url: ['http://localhost:3000'],
                numberOfRuns: 3,
                settings: {
                  preset: '${{ matrix.preset }}',
                  chromeFlags: ['--no-sandbox', '--headless', '--disable-gpu'],
                  emulatedFormFactor: '${{ matrix.device }}',
                  throttling: {
                    rttMs: 40,
                    throughputKbps: 10240,
                    cpuSlowdownMultiplier: 1,
                    requestLatencyMs: 0,
                    downloadThroughputKbps: 0,
                    uploadThroughputKbps: 0
                  }
                }
              },
              assert: {
                assertions: {
                  'categories:performance': ['error', {minScore: 0.7}],
                  'categories:accessibility': ['error', {minScore: 0.9}],
                  'categories:best-practices': ['error', {minScore: 0.8}],
                  'categories:seo': ['error', {minScore: 0.8}],
                  'categories:pwa': ['warn', {minScore: 0.6}]
                }
              },
              upload: {
                target: 'filesystem',
                outputDir: './lighthouse-results-${{ matrix.device }}'
              }
            }
          };
          EOF

          # Run Lighthouse CI
          lhci collect --config=.lighthouserc.js || echo "Lighthouse collection completed with warnings"
          lhci assert --config=.lighthouserc.js || lighthouse_exit_code=$?

          # Parse results
          if [ -d "lighthouse-results-${{ matrix.device }}" ]; then
            latest_report=$(ls -t lighthouse-results-${{ matrix.device }}/*.json | head -1)
            if [ -n "$latest_report" ]; then
              perf_score=$(jq -r '.categories.performance.score * 100' "$latest_report" 2>/dev/null || echo "0")
              accessibility_score=$(jq -r '.categories.accessibility.score * 100' "$latest_report" 2>/dev/null || echo "0")
              best_practices_score=$(jq -r '.categories["best-practices"].score * 100' "$latest_report" 2>/dev/null || echo "0")
              seo_score=$(jq -r '.categories.seo.score * 100' "$latest_report" 2>/dev/null || echo "0")
              
              echo "📊 Lighthouse Results (${{ matrix.device }}):"
              echo "  Performance: ${perf_score}/100"
              echo "  Accessibility: ${accessibility_score}/100"
              echo "  Best Practices: ${best_practices_score}/100"
              echo "  SEO: ${seo_score}/100"
              
              echo "performance-score=${perf_score}" >> $GITHUB_OUTPUT
              echo "accessibility-score=${accessibility_score}" >> $GITHUB_OUTPUT
              echo "best-practices-score=${best_practices_score}" >> $GITHUB_OUTPUT
              echo "seo-score=${seo_score}" >> $GITHUB_OUTPUT
            fi
          fi

          exit ${lighthouse_exit_code:-0}
      - name: 🔍 Performance Metrics Analysis
        run: |
          echo "🔍 Analyzing performance metrics..."

          if [ -d "lighthouse-results-${{ matrix.device }}" ]; then
            latest_report=$(ls -t lighthouse-results-${{ matrix.device }}/*.json | head -1)
            if [ -n "$latest_report" ]; then
              # Extract detailed metrics
              fcp=$(jq -r '.audits["first-contentful-paint"].numericValue // 0' "$latest_report")
              lcp=$(jq -r '.audits["largest-contentful-paint"].numericValue // 0' "$latest_report")
              cls=$(jq -r '.audits["cumulative-layout-shift"].numericValue // 0' "$latest_report")
              fid=$(jq -r '.audits["max-potential-fid"].numericValue // 0' "$latest_report")
              
              echo "🎯 Core Web Vitals (${{ matrix.device }}):"
              echo "  First Contentful Paint: ${fcp}ms"
              echo "  Largest Contentful Paint: ${lcp}ms"
              echo "  Cumulative Layout Shift: ${cls}"
              echo "  First Input Delay: ${fid}ms"
              
              # Performance budget validation
              case "${{ env.BUDGET_LEVEL }}" in
                "strict")
                  fcp_threshold=1500
                  lcp_threshold=2500
                  ;;
                "moderate")
                  fcp_threshold=2000
                  lcp_threshold=3000
                  ;;
                "lenient")
                  fcp_threshold=3000
                  lcp_threshold=4000
                  ;;
              esac
              
              if (( $(echo "$fcp > $fcp_threshold" | bc -l 2>/dev/null || echo "0") )); then
                echo "⚠️ FCP exceeds ${{ env.BUDGET_LEVEL }} budget: ${fcp}ms > ${fcp_threshold}ms"
              fi
              
              if (( $(echo "$lcp > $lcp_threshold" | bc -l 2>/dev/null || echo "0") )); then
                echo "⚠️ LCP exceeds ${{ env.BUDGET_LEVEL }} budget: ${lcp}ms > ${lcp_threshold}ms"
              fi
            fi
          fi
      - name: 🧹 Cleanup Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
      - name: 📤 Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.device }}-${{ github.run_number }}
          path: |
            lighthouse-results-${{ matrix.device }}/
            .lighthouserc.js
          retention-days: 30
    timeout-minutes: 30
  real-user-monitoring:
    name: "📊 監視: 👥 Real User Monitoring Simulation"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
    if: contains(fromJson('["comprehensive", "real-user-monitoring"]'), env.MONITORING_TYPE)
    strategy:
      matrix:
        scenario:
          - fast-3g
          - slow-3g
          - offline
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline
      - name: 🏗️ Build Application
        run: npm run build
      - name: 📡 Network Condition Testing (${{ matrix.scenario }})
        run: |
          echo "📡 Testing under ${{ matrix.scenario }} conditions..."

          # Install Puppeteer for network simulation
          npm install --save-dev puppeteer@^23.0.0

          # Create network testing script
          cat > network-test-${{ matrix.scenario }}.js << 'EOF'
          const puppeteer = require('puppeteer');
          const { performance } = require('perf_hooks');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            
            // Set network conditions
            const conditions = {
              'fast-3g': {
                offline: false,
                downloadThroughput: 1.5 * 1024 * 1024 / 8,
                uploadThroughput: 750 * 1024 / 8,
                latency: 150
              },
              'slow-3g': {
                offline: false,
                downloadThroughput: 500 * 1024 / 8,
                uploadThroughput: 500 * 1024 / 8,
                latency: 300
              },
              'offline': {
                offline: true
              }
            };
            
            await page.emulateNetworkConditions(conditions['${{ matrix.scenario }}']);
            
            // Measure navigation timing
            const startTime = performance.now();
            
            try {
              // Serve static files and navigate
              const response = await page.goto('file://' + process.cwd() + '/dist/index.html', {
                waitUntil: 'networkidle2',
                timeout: 30000
              });
              
              const endTime = performance.now();
              const loadTime = endTime - startTime;
              
              // Collect performance metrics
              const metrics = await page.evaluate(() => {
                const navigation = performance.getEntriesByType('navigation')[0];
                return {
                  domContentLoaded: navigation.domContentLoadedEventEnd - navigation.navigationStart,
                  fullyLoaded: navigation.loadEventEnd - navigation.navigationStart,
                  firstPaint: performance.getEntriesByType('paint')[0]?.startTime || 0,
                  responseStatus: navigation.responseStatus
                };
              });
              
              console.log(`📊 Network Performance (${{ matrix.scenario }}):`);
              console.log(`  Total Load Time: ${loadTime.toFixed(2)}ms`);
              console.log(`  DOM Content Loaded: ${metrics.domContentLoaded}ms`);
              console.log(`  Fully Loaded: ${metrics.fullyLoaded}ms`);
              console.log(`  First Paint: ${metrics.firstPaint}ms`);
              
              // Save results
              const results = {
                scenario: '${{ matrix.scenario }}',
                loadTime: loadTime,
                metrics: metrics,
                timestamp: new Date().toISOString()
              };
              
              require('fs').writeFileSync(
                `rum-results-${{ matrix.scenario }}.json`,
                JSON.stringify(results, null, 2)
              );
              
            } catch (error) {
              console.error(`❌ Error in ${{ matrix.scenario }} test:`, error.message);
              
              // Save error results
              const errorResults = {
                scenario: '${{ matrix.scenario }}',
                error: error.message,
                timestamp: new Date().toISOString()
              };
              
              require('fs').writeFileSync(
                `rum-error-${{ matrix.scenario }}.json`,
                JSON.stringify(errorResults, null, 2)
              );
            }
            
            await browser.close();
          })();
          EOF

          # Run network test
          node network-test-${{ matrix.scenario }}.js
      - name: 📤 Upload RUM Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rum-results-${{ matrix.scenario }}-${{ github.run_number }}
          path: |
            rum-results-${{ matrix.scenario }}.json
            rum-error-${{ matrix.scenario }}.json
            network-test-${{ matrix.scenario }}.js
          retention-days: 30
    timeout-minutes: 30
  performance-report:
    name: "🔧 レポート: performance-report"
    runs-on: ubuntu-latest
    needs:
      - performance-setup
      - bundle-analysis
      - lighthouse-testing
      - real-user-monitoring
    if: always()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: 📥 Download All Performance Reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-reports-${{ github.run_number }}"
          merge-multiple: true
      - name: 📥 Download RUM Results
        uses: actions/download-artifact@v4
        with:
          pattern: rum-results-*-${{ github.run_number }}
          merge-multiple: true
        continue-on-error: true
      - name: 📊 Generate Comprehensive Performance Report
        run: >
          echo "📊 Generating comprehensive performance report..."


          # Collect performance metrics

          bundle_size="${{ needs.bundle-analysis.outputs.bundle-size || 'N/A' }}"

          desktop_perf="${{ needs.lighthouse-testing.outputs.performance-score-desktop || 'N/A' }}"

          mobile_perf="${{ needs.lighthouse-testing.outputs.performance-score-mobile || 'N/A' }}"

          optimization_savings="${{ needs.bundle-analysis.outputs.optimization-savings || 'N/A' }}"


          # Create comprehensive report

          cat > comprehensive-performance-report.md << EOF

          # ⚡ Comprehensive Performance Analysis Report


          **Analysis Date**: $(date -Iseconds)  

          **Commit**: ${{ github.sha }}  

          **Branch**: ${{ github.ref_name }}  

          **Monitoring Type**: ${{ env.MONITORING_TYPE }}  

          **Performance Budget**: ${{ env.BUDGET_LEVEL }}  


          ## 📊 Executive Summary


          | Metric | Value | Status |

          |--------|--------|--------|

          | Bundle Size | ${bundle_size} | $([ "${{ needs.bundle-analysis.outputs.budget-exceeded }}" == "false" ] &&
          echo "✅ PASS" || echo "⚠️ REVIEW") |

          | Desktop Performance | ${desktop_perf}/100 | $([[ "${desktop_perf}" != "N/A" && $(echo "${desktop_perf} >=
          70" | bc -l 2>/dev/null) == "1" ]] && echo "✅" || echo "⚠️") |

          | Mobile Performance | ${mobile_perf}/100 | $([[ "${mobile_perf}" != "N/A" && $(echo "${mobile_perf} >= 70" |
          bc -l 2>/dev/null) == "1" ]] && echo "✅" || echo "⚠️") |

          | Bundle Analysis | ${{ needs.bundle-analysis.result }} | $([[ "${{ needs.bundle-analysis.result }}" ==
          "success" ]] && echo "✅" || echo "❌") |

          | Lighthouse Testing | ${{ needs.lighthouse-testing.result }} | $([[ "${{ needs.lighthouse-testing.result }}"
          == "success" ]] && echo "✅" || echo "❌") |

          | RUM Simulation | ${{ needs.real-user-monitoring.result }} | $([[ "${{ needs.real-user-monitoring.result }}"
          == "success" ]] && echo "✅" || echo "❌") |


          ## 📦 Bundle Analysis Results


          EOF


          # Add bundle analysis details

          if [ -f bundle-summary.md ]; then
            cat bundle-summary.md >> comprehensive-performance-report.md
          else
            echo "Bundle analysis data not available." >> comprehensive-performance-report.md
          fi


          # Add Lighthouse results

          cat >> comprehensive-performance-report.md << EOF


          ## 🏮 Lighthouse Performance Analysis


          ### Desktop Results

          - Performance Score: ${desktop_perf}/100

          - Overall Status: $([[ "${desktop_perf}" != "N/A" && $(echo "${desktop_perf} >= 70" | bc -l 2>/dev/null) ==
          "1" ]] && echo "✅ GOOD" || echo "⚠️ NEEDS IMPROVEMENT")


          ### Mobile Results  

          - Performance Score: ${mobile_perf}/100

          - Overall Status: $([[ "${mobile_perf}" != "N/A" && $(echo "${mobile_perf} >= 70" | bc -l 2>/dev/null) == "1"
          ]] && echo "✅ GOOD" || echo "⚠️ NEEDS IMPROVEMENT")


          EOF


          # Add RUM results if available

          if ls rum-results-*.json 1>/dev/null 2>&1; then
            echo "## 👥 Real User Monitoring Results" >> comprehensive-performance-report.md
            echo "" >> comprehensive-performance-report.md
            for rum_file in rum-results-*.json; do
              if [ -f "$rum_file" ]; then
                scenario=$(jq -r '.scenario' "$rum_file")
                load_time=$(jq -r '.loadTime // "N/A"' "$rum_file")
                echo "- **${scenario}**: ${load_time}ms" >> comprehensive-performance-report.md
              fi
            done
            echo "" >> comprehensive-performance-report.md
          fi


          # Add optimization recommendations

          if [ -f optimization-recommendations.md ]; then
            echo "## 🚀 Optimization Recommendations" >> comprehensive-performance-report.md
            tail -n +2 optimization-recommendations.md >> comprehensive-performance-report.md
          fi


          # Add action items and next steps

          cat >> comprehensive-performance-report.md << EOF


          ## 🎯 Action Items


          ### High Priority

          EOF


          if [ "${{ needs.bundle-analysis.outputs.budget-exceeded }}" == "true" ]; then
            echo "- 🚨 **Bundle size exceeds budget** - implement code splitting and tree shaking" >> comprehensive-performance-report.md
          fi


          if [[ "${desktop_perf}" != "N/A" && $(echo "${desktop_perf} < 70" | bc -l 2>/dev/null) == "1" ]]; then
            echo "- ⚠️ **Desktop performance below threshold** - optimize critical rendering path" >> comprehensive-performance-report.md
          fi


          if [[ "${mobile_perf}" != "N/A" && $(echo "${mobile_perf} < 70" | bc -l 2>/dev/null) == "1" ]]; then
            echo "- ⚠️ **Mobile performance below threshold** - implement mobile-first optimizations" >> comprehensive-performance-report.md
          fi


          cat >> comprehensive-performance-report.md << EOF


          ### Medium Priority

          - 📊 Implement performance monitoring in production

          - 🔍 Set up Core Web Vitals tracking

          - 📱 Optimize for mobile user experience


          ### Low Priority  

          - 🚀 Explore advanced optimization techniques

          - 📈 Implement performance analytics

          - 🎨 Optimize visual assets further


          ## 📋 Next Steps


          1. Review detailed performance reports in artifacts

          2. Implement high-priority optimizations

          3. Re-run performance tests to validate improvements

          4. Set up continuous performance monitoring

          5. Update performance budgets based on results


          ---

          *Generated by DevOps Performance Pipeline v2.0.0*

          EOF


          cat comprehensive-performance-report.md
      - name: 🎯 Performance Gate Decision
        run: |
          echo "🎯 Performance Gate Evaluation..."

          bundle_exceeded="${{ needs.bundle-analysis.outputs.budget-exceeded || 'false' }}"
          desktop_perf="${{ needs.lighthouse-testing.outputs.performance-score-desktop || '100' }}"
          mobile_perf="${{ needs.lighthouse-testing.outputs.performance-score-mobile || '100' }}"

          echo "📊 Current Performance Metrics:"
          echo "  Bundle Budget Exceeded: $bundle_exceeded"
          echo "  Desktop Performance: $desktop_perf/100"
          echo "  Mobile Performance: $mobile_perf/100"
          echo "  Budget Level: ${{ env.BUDGET_LEVEL }}"

          case "${{ env.BUDGET_LEVEL }}" in
            "strict")
              if [[ "$bundle_exceeded" == "true" ]] || 
                 [[ "$desktop_perf" != "N/A" && $(echo "$desktop_perf < 85" | bc -l 2>/dev/null) == "1" ]] ||
                 [[ "$mobile_perf" != "N/A" && $(echo "$mobile_perf < 80" | bc -l 2>/dev/null) == "1" ]]; then
                echo "❌ STRICT PERFORMANCE GATE FAILED"
                echo "Performance requirements not met for strict budget"
                exit 1
              fi
              ;;
            "moderate")
              if [[ "$desktop_perf" != "N/A" && $(echo "$desktop_perf < 70" | bc -l 2>/dev/null) == "1" ]] ||
                 [[ "$mobile_perf" != "N/A" && $(echo "$mobile_perf < 65" | bc -l 2>/dev/null) == "1" ]]; then
                echo "❌ MODERATE PERFORMANCE GATE FAILED"
                echo "Performance scores below acceptable thresholds"
                exit 1
              fi
              ;;
            "lenient")
              if [[ "$desktop_perf" != "N/A" && $(echo "$desktop_perf < 50" | bc -l 2>/dev/null) == "1" ]] ||
                 [[ "$mobile_perf" != "N/A" && $(echo "$mobile_perf < 45" | bc -l 2>/dev/null) == "1" ]]; then
                echo "❌ LENIENT PERFORMANCE GATE FAILED"
                echo "Performance critically below minimum standards"
                exit 1
              fi
              ;;
          esac

          echo "✅ PERFORMANCE GATE PASSED"
          echo "All performance requirements met for ${{ env.BUDGET_LEVEL }} budget level"
      - name: 📤 Upload Comprehensive Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-performance-report-${{ github.run_number }}
          path: comprehensive-performance-report.md
          retention-days: 90
      - name: 💬 Create Performance Issue (If Critical)
        if: needs.bundle-analysis.outputs.budget-exceeded == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: >
            const title = `⚡ Performance Budget Exceeded - Run #${{ github.run_number }}`;

            const body = `

            ## ⚡ Performance Alert


            **Bundle size exceeds budget**: ${{ needs.bundle-analysis.outputs.bundle-size }}

            **Optimization potential**: ${{ needs.bundle-analysis.outputs.optimization-savings }}

            **Commit**: ${{ github.sha }}

            **Branch**: ${{ github.ref_name }}


            ### Performance Scores

            - Desktop: ${{ needs.lighthouse-testing.outputs.performance-score-desktop || 'N/A' }}/100

            - Mobile: ${{ needs.lighthouse-testing.outputs.performance-score-mobile || 'N/A' }}/100


            ### Action Required

            - Review comprehensive performance report

            - Implement bundle optimization recommendations  

            - Re-run performance tests after fixes


            ### Reports

            - [Performance Monitoring Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }})


            ---

            *Auto-generated by Performance Pipeline*

            `;


            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', 'optimization', 'auto-generated']
            });
    timeout-minutes: 30
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
