name: 🧪 Quality - CI Tests
"on":
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      debug:
        description: デバッグモードを有効にする
        required: false
        default: "false"
        type: boolean
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: "🔧 テスト: test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔍 Run linter
        run: npm run lint
        continue-on-error: true
      - name: 🧪 Run unit tests
        run: npm run test:run
        env:
          NODE_ENV: test
      - name: 📊 Generate coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test
      - name: 📈 Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: 💾 Upload coverage artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: 📝 Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results.xml
          retention-days: 7
    timeout-minutes: 30
  e2e-tests:
    name: "🔧 テスト: e2e-tests"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps
      - name: 🏗️ Build application
        run: npm run build
      - name: 🎭 Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
      - name: 📸 Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
    timeout-minutes: 30
  build:
    name: "🔧 ビルド: build"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🏗️ Build production
        run: npm run build
        env:
          NODE_ENV: production
      - name: 📊 Check bundle size
        run: |
          echo "Bundle size report:"
          du -sh dist/
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7
    timeout-minutes: 30
  security:
    name: "🔧 セキュリティ: security"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔍 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: 🔒 Run security scan
        run: npx snyk test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    timeout-minutes: 30
  quality-gates:
    name: "✅ 品質: ✅ Quality Gates"
    runs-on: ubuntu-latest
    needs:
      - test
      - build
      - security
    if: always()
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 📊 Check test results
        run: |
          echo "Quality gates summary:"
          echo "- Unit tests: ${{ needs.test.result }}"
          echo "- Build: ${{ needs.build.result }}"
          echo "- Security: ${{ needs.security.result }}"

          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Quality gates failed"
            exit 1
          fi

          echo "✅ All quality gates passed"
      - name: 📝 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('CI Results')
            );

            const body = `## 🔬 CI Results

            | Check | Status |
            |-------|--------|
            | 🧪 Unit Tests | ${{ needs.test.result }} |
            | 🏗️ Build | ${{ needs.build.result }} |
            | 🔒 Security | ${{ needs.security.result }} |

            **Overall Status**: ${
              needs.test.result === 'success' && 
              needs.build.result === 'success' 
                ? '✅ Ready to merge' 
                : '❌ Checks failed'
            }

            _Last updated: ${new Date().toISOString()}_`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
    timeout-minutes: 30
