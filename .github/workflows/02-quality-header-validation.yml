# ====================================================================
# 📋 品質管理 - ヘッダーコメント検証
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - プルリクエスト作成・更新時
#   - コードプッシュ時
#   - 手動実行
#
# 主な処理:
#   1. ヘッダーコメント検証
#   2. 📌 処理: 自動修正提案
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F4CB 品質管理 - ヘッダーコメント検証"
'on':
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.{js,jsx,ts,tsx}'
      - .eslintrc.header.json
      - package.json
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.{js,jsx,ts,tsx}'
      - .eslintrc.header.json
  workflow_dispatch:
    inputs:
      full_scan:
        description: 全ファイルスキャンを実行
        required: false
        default: false
        type: boolean
concurrency:
  group: 'header-validation-${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  header-validation:
    name: ヘッダーコメント検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validation-status: '${{ steps.validation.outputs.status }}'
      error-count: '${{ steps.validation.outputs.error-count }}'
      file-count: '${{ steps.validation.outputs.file-count }}'
    steps:
      - name: "\U0001F4E5 リポジトリのチェックアウト"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "\U0001F527 Node.js環境のセットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: "\U0001F4E6 依存関係のインストール"
        run: |
          npm ci
          echo "✅ 依存関係のインストール完了"
      - name: "\U0001F50D ヘッダーコメント検証の実行"
        id: validation
        run: "echo \"\U0001F680 ヘッダーコメント検証を開始...\"\n\n# ESLintキャッシュディレクトリの作成\nmkdir -p .eslintcache\n\n# ヘッダー検証の実行（結果をファイルに保存）\nnpm run lint:header > header-validation-results.txt 2>&1 || true\n\n# 結果の解析\nif grep -q \"✖.*problems\" header-validation-results.txt; then\n  error_count=$(grep \"✖.*problems\" header-validation-results.txt | grep -o '[0-9]\\+ errors' | grep -o '[0-9]\\+' || echo \"0\")\n  total_problems=$(grep \"✖.*problems\" header-validation-results.txt | grep -o '[0-9]\\+ problems' | grep -o '[0-9]\\+' || echo \"0\")\n  \n  echo \"error-count=$error_count\" >> $GITHUB_OUTPUT\n  echo \"total-problems=$total_problems\" >> $GITHUB_OUTPUT\n  \n  if [ \"$error_count\" -gt 0 ]; then\n    echo \"status=failed\" >> $GITHUB_OUTPUT\n    echo \"❌ ヘッダーコメント検証に失敗しました（エラー: $error_count個）\"\n    exit 1\n  else\n    echo \"status=warning\" >> $GITHUB_OUTPUT\n    echo \"⚠️ 警告がありますが、ヘッダーコメント検証は合格です\"\n  fi\nelse\n  echo \"status=success\" >> $GITHUB_OUTPUT\n  echo \"✅ ヘッダーコメント検証に合格しました\"\nfi\n\n# ファイル数の取得\nfile_count=$(find src -name \"*.js\" -o -name \"*.jsx\" -o -name \"*.ts\" -o -name \"*.tsx\" | wc -l)\necho \"file-count=$file_count\" >> $GITHUB_OUTPUT\n"
      - name: "\U0001F4CA 開発者別統計レポート生成"
        if: always()
        run: "echo \"\U0001F4CA 開発者別ファイル統計を生成中...\"\n\ncat > header-stats.js << 'EOF'\nconst fs = require('fs');\nconst path = require('path');\n\n// ソースファイルの検索とヘッダー解析\nfunction analyzeHeaders() {\n  const stats = {\n    developer1: { auth: 0, rbac: 0 },\n    developer2: { realtime: 0 },\n    developer3: { payment: 0 },\n    developer6: { pwa: 0 },\n    developer8: { test: 0 },\n    general: { files: 0 },\n    missing: { files: 0 }\n  };\n  \n  function scanDirectory(dir) {\n    const files = fs.readdirSync(dir, { withFileTypes: true });\n    \n    files.forEach(file => {\n      if (file.isDirectory()) {\n        scanDirectory(path.join(dir, file.name));\n      } else if (file.name.match(/\\.(js|jsx|ts|tsx)$/)) {\n        const filepath = path.join(dir, file.name);\n        const content = fs.readFileSync(filepath, 'utf8');\n        \n        if (content.includes('Developer 1:')) {\n          stats.developer1.auth++;\n        } else if (content.includes('Developer 2:')) {\n          stats.developer2.realtime++;\n        } else if (content.includes('Developer 3:')) {\n          stats.developer3.payment++;\n        } else if (content.includes('Developer 6:')) {\n          stats.developer6.pwa++;\n        } else if (content.includes('Developer 8:')) {\n          stats.developer8.test++;\n        } else if (content.includes('/**')) {\n          stats.general.files++;\n        } else {\n          stats.missing.files++;\n        }\n      }\n    });\n  }\n  \n  scanDirectory('src');\n  return stats;\n}\n\nconst stats = analyzeHeaders();\nconsole.log('## \U0001F4CA 開発者別ファイル統計');\nconsole.log('');\nconsole.log('| 開発者 | 担当分野 | ファイル数 |');\nconsole.log('|--------|----------|-----------|');\nconsole.log(`| Developer 1 | 認証・RBAC | ${stats.developer1.auth + stats.developer1.rbac} |`);\nconsole.log(`| Developer 2 | リアルタイム通信 | ${stats.developer2.realtime} |`);\nconsole.log(`| Developer 3 | 決済システム | ${stats.developer3.payment} |`);\nconsole.log(`| Developer 6 | PWA・モバイル | ${stats.developer6.pwa} |`);\nconsole.log(`| Developer 8 | 品質保証・テスト | ${stats.developer8.test} |`);\nconsole.log(`| 一般 | その他 | ${stats.general.files} |`);\nconsole.log(`| ❌ 未設定 | ヘッダーなし | ${stats.missing.files} |`);\nconsole.log('');\n\n// メトリクス計算\nconst total = Object.values(stats).reduce((sum, cat) => {\n  return sum + Object.values(cat).reduce((s, n) => s + n, 0);\n}, 0);\n\nconst compliance = total > 0 ? ((total - stats.missing.files) / total * 100).toFixed(1) : 0;\n\nconsole.log('### \U0001F4C8 品質メトリクス');\nconsole.log('');\nconsole.log(`- **総ファイル数**: ${total}`);\nconsole.log(`- **ヘッダー準拠率**: ${compliance}%`);\nconsole.log(`- **未準拠ファイル**: ${stats.missing.files}`);\nconsole.log('');\n\nif (stats.missing.files > 0) {\n  console.log('### ⚠️ 改善が必要な項目');\n  console.log('');\n  console.log('- ヘッダーコメントが不足しているファイルがあります');\n  console.log('- `npm run lint:header:fix` で自動修正を試してください');\n}\nEOF\n\nnode header-stats.js > header-stats-report.md\ncat header-stats-report.md\n"
      - name: "\U0001F4AC PR コメント投稿"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: "const fs = require('fs');\n\n// 検証結果の読み込み\nlet validationResults = '';\ntry {\n  validationResults = fs.readFileSync('header-validation-results.txt', 'utf8');\n} catch (error) {\n  validationResults = 'ヘッダー検証結果が読み込めませんでした';\n}\n\n// 統計レポートの読み込み\nlet statsReport = '';\ntry {\n  statsReport = fs.readFileSync('header-stats-report.md', 'utf8');\n} catch (error) {\n  statsReport = '統計レポートが生成できませんでした';\n}\n\nconst status = '${{ steps.validation.outputs.status }}';\nconst errorCount = '${{ steps.validation.outputs.error-count }}' || '0';\nconst fileCount = '${{ steps.validation.outputs.file-count }}' || '0';\n\n// ステータス絵文字の決定\nconst statusEmoji = status === 'success' ? '✅' : status === 'warning' ? '⚠️' : '❌';\nconst statusText = status === 'success' ? '合格' : status === 'warning' ? '警告あり' : '不合格';\n\nconst commentBody = `\n## ${statusEmoji} ヘッダーコメント検証結果\n\n**ステータス**: ${statusText}  \n**対象ファイル数**: ${fileCount}  \n**エラー数**: ${errorCount}\n\n${statsReport}\n\n### \U0001F4DD 詳細結果\n\n<details>\n<summary>ESLint ヘッダー検証結果（クリックして展開）</summary>\n\n\\`\\`\\`\n${validationResults.slice(0, 3000)}${validationResults.length > 3000 ? '\\n... (結果が長いため省略)' : ''}\n\\`\\`\\`\n\n</details>\n\n### \U0001F6E0️ 修正方法\n\nヘッダーエラーがある場合：\n\\`\\`\\`bash\n# 自動修正の実行\nnpm run lint:header:fix\n\n# 手動確認\nnpm run lint:header\n\\`\\`\\`\n\n---\n*\U0001F916 このコメントは GitHub Actions により自動生成されました*\n`;\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: commentBody\n});\n"
      - name: "\U0001F4E4 検証結果のアップロード"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-validation-results
          path: |
            header-validation-results.txt
            header-stats-report.md
          retention-days: 30
  auto-fix-suggestion:
    name: "\U0001F4CC 処理: 自動修正提案"
    runs-on: ubuntu-latest
    needs: header-validation
    if: needs.header-validation.outputs.validation-status == 'failed' && github.event_name == 'pull_request'
    steps:
      - name: "\U0001F4A1 自動修正の提案"
        uses: actions/github-script@v7
        with:
          script: "const suggestionComment = `\n## \U0001F4A1 ヘッダーコメント自動修正の提案\n\nヘッダーコメント検証でエラーが検出されました。以下のコマンドで自動修正できます：\n\n### \U0001F527 修正手順\n\n1. **自動修正の実行**：\n   \\`\\`\\`bash\n   npm run lint:header:fix\n   \\`\\`\\`\n\n2. **結果の確認**：\n   \\`\\`\\`bash\n   npm run lint:header\n   \\`\\`\\`\n\n3. **コミット・プッシュ**：\n   \\`\\`\\`bash\n   git add -A\n   git commit -m \"fix: ヘッダーコメントの自動修正適用\"\n   git push\n   \\`\\`\\`\n\n### \U0001F4CB 開発者分野別テンプレート\n\n手動で修正する場合は、以下のテンプレートを参考にしてください：\n\n- **認証・RBAC**: \\`Developer 1: 包括的認可システム（RBAC）実装\\`\n- **リアルタイム通信**: \\`Developer 2: リアルタイム通信基盤\\`  \n- **決済システム**: \\`Developer 3: 決済・サブスクリプション管理\\`\n- **PWA・モバイル**: \\`Developer 6: PWA & Mobile Developer\\`\n- **品質保証**: \\`Developer 8: 品質保証エンジニア\\`\n\n詳細は \\`docs/HEADER_COMMENT_VALIDATION_IMPLEMENTATION_REPORT.md\\` を参照してください。\n`;\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: suggestionComment\n});\n"
    timeout-minutes: 30
