name: 🚀 CD - Production Deployment Pipeline
"on":
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - .github/ISSUE_TEMPLATE/**
      - docs/**
  workflow_dispatch:
    inputs:
      deployment-strategy:
        description: Deployment strategy
        required: true
        type: choice
        options:
          - standard
          - blue-green
          - canary
        default: standard
      performance-validation:
        description: Enable performance validation
        required: false
        type: boolean
        default: true
      pwa-optimization:
        description: Enable PWA optimization
        required: false
        type: boolean
        default: true
      skip-health-check:
        description: Skip post-deployment health check
        required: false
        type: boolean
        default: false
  schedule:
    - cron: 0 6 * * 1
env:
  NODE_VERSION: "18"
  DEPLOYMENT_STRATEGY: ${{ inputs.deployment-strategy || 'standard' }}
  PERFORMANCE_VALIDATION: ${{ inputs.performance-validation || 'true' }}
  PWA_OPTIMIZATION: ${{ inputs.pwa-optimization || 'true' }}
  SKIP_HEALTH_CHECK: ${{ inputs.skip-health-check || 'false' }}
  SITE_URL: https://yusuke-kurosawa.github.io/PMPLearningManagement/
  CACHE_VERSION: v2
  GENERATE_SOURCEMAP: false
  NODE_ENV: production
  SKIP_ENV_VALIDATION: true
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deployment-setup:
    name: "🔧 セットアップ: deployment-setup"
    uses: ./.github/workflows/templates/devops-workflow-template.yml
    with:
      workflow-category: cd
      environment: production
      node-version: "18"
      enable-caching: true
      enable-notifications: true
      parallel-jobs: 3
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    timeout-minutes: 30
  production-build:
    name: "🔧 ビルド: production-build"
    runs-on: ubuntu-latest
    needs:
      - deployment-setup
    timeout-minutes: 15
    outputs:
      build-size: ${{ steps.build-analysis.outputs.build-size }}
      bundle-hash: ${{ steps.build-analysis.outputs.bundle-hash }}
      pwa-ready: ${{ steps.pwa-validation.outputs.pwa-ready }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 📦 Install Dependencies
        run: |
          echo "📦 Installing production dependencies..."
          npm ci --prefer-offline
          echo "✅ Dependencies installed successfully"
      - name: 🔍 Pre-Build Quality Checks
        run: |
          echo "🔍 Running essential quality checks..."

          # ESLint check
          npm run lint || {
            echo "❌ ESLint failed - cannot proceed with deployment"
            exit 1
          }

          # TypeScript check (if available)
          if npm run typecheck 2>/dev/null; then
            echo "✅ TypeScript validation passed"
          else
            echo "ℹ️ TypeScript check not available, skipping"
          fi

          # Security audit
          npm audit --audit-level=high || {
            echo "⚠️ High-severity vulnerabilities detected"
            echo "Continuing with deployment but review required"
          }

          echo "✅ Pre-build quality checks completed"
      - name: 🏗️ Optimized Production Build
        run: |
          echo "🏗️ Building optimized production bundle..."

          # Set production environment variables
          export NODE_ENV=production
          export GENERATE_SOURCEMAP=false
          export SKIP_ENV_VALIDATION=true
          export VITE_BUILD_TIMESTAMP=$(date -Iseconds)
          export VITE_COMMIT_SHA=${{ github.sha }}
          export VITE_BUILD_NUMBER=${{ github.run_number }}

          # Run optimized build
          npm run build:optimized || npm run build

          echo "✅ Production build completed"
      - name: 📊 Build Analysis & Optimization
        id: build-analysis
        run: |
          echo "📊 Analyzing build output..."

          if [ ! -d "dist" ]; then
            echo "❌ Build output directory not found"
            exit 1
          fi

          # Calculate build metrics
          build_size=$(du -sh dist | cut -f1)
          total_files=$(find dist -type f | wc -l)

          # Generate bundle hash for cache busting
          bundle_hash=$(find dist -name "*.js" -exec cat {} \; | sha256sum | cut -d' ' -f1 | head -c 12)

          # Analyze bundle composition
          if [ -d "dist/assets" ]; then
            js_size=$(find dist/assets -name "*.js" -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "0")
            css_size=$(find dist/assets -name "*.css" -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "0")
            
            echo "📊 Build Metrics:"
            echo "  Total Size: $build_size"
            echo "  Files: $total_files"  
            echo "  JavaScript: $js_size"
            echo "  CSS: $css_size"
            echo "  Bundle Hash: $bundle_hash"
          fi

          # Output for next stages
          echo "build-size=$build_size" >> $GITHUB_OUTPUT
          echo "bundle-hash=$bundle_hash" >> $GITHUB_OUTPUT

          # Performance budget validation
          build_size_mb=$(du -sm dist | cut -f1)
          if [ "$build_size_mb" -gt 10 ]; then
            echo "⚠️ Build size exceeds 10MB ($build_size_mb MB)"
            echo "Consider implementing code splitting and optimization"
          else
            echo "✅ Build size within acceptable limits"
          fi
      - name: 📱 PWA Configuration Validation
        id: pwa-validation
        if: env.PWA_OPTIMIZATION == 'true'
        run: >
          echo "📱 Validating PWA configuration..."


          pwa_ready=true


          # Check PWA manifest

          if [ -f "dist/manifest.json" ]; then
            echo "✅ PWA manifest found"
            
            # Validate manifest content
            if jq -e '.name and .short_name and .start_url and .display' dist/manifest.json > /dev/null 2>&1; then
              echo "✅ PWA manifest is valid"
            else
              echo "⚠️ PWA manifest missing required fields"
              pwa_ready=false
            fi
          else
            echo "⚠️ PWA manifest not found"
            pwa_ready=false
          fi


          # Check service worker

          if [ -f "dist/sw.js" ] || find dist -name "*.js" -exec grep -l "serviceWorker" {} \; | head -1 > /dev/null;
          then
            echo "✅ Service worker configuration found"
          else
            echo "⚠️ Service worker not detected"
            pwa_ready=false
          fi


          # Check PWA icons

          if find dist -name "*.png" -o -name "*.ico" | grep -E "(icon|apple)" | head -1 > /dev/null; then
            echo "✅ PWA icons found"
          else
            echo "⚠️ PWA icons not found"
            pwa_ready=false
          fi


          echo "pwa-ready=$pwa_ready" >> $GITHUB_OUTPUT


          if [ "$pwa_ready" = "true" ]; then
            echo "✅ PWA validation passed - ready for app store deployment"
          else
            echo "⚠️ PWA validation issues found - review configuration"
          fi
      - name: 🔒 Security Headers Configuration
        run: |
          echo "🔒 Configuring security headers..."

          # Create security headers file for GitHub Pages
          cat > dist/_headers << 'EOF'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
          EOF

          # Add CSP if not already present in HTML
          if ! grep -r "Content-Security-Policy" dist/ > /dev/null 2>&1; then
            echo "Adding Content Security Policy..."
            # This would typically be added via meta tags in the HTML
          fi

          echo "✅ Security headers configured"
      - name: 📤 Upload Production Build
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.run_number }}
          path: |
            dist/
            !dist/**/*.map
          retention-days: 7
          compression-level: 9
  pre-deployment-validation:
    name: "🔧 デプロイ: pre-deployment-validation"
    runs-on: ubuntu-latest
    needs:
      - deployment-setup
      - production-build
    if: env.PERFORMANCE_VALIDATION == 'true'
    outputs:
      validation-status: ${{ steps.validation.outputs.status }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 📥 Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.run_number }}
          path: dist/
      - name: 🚀 Start Local Server for Testing
        id: server
        run: |
          echo "🚀 Starting local server for performance validation..."

          # Install and start serve
          npm install -g serve
          serve -s dist -p 3000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to start
          sleep 5

          # Verify server is running
          if curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Local server started successfully"
          else
            echo "❌ Failed to start local server"
            exit 1
          fi
      - name: 🏮 Lighthouse Pre-Deployment Audit
        run: |
          echo "🏮 Running Lighthouse pre-deployment audit..."

          # Install Lighthouse CI
          npm install -g @lhci/cli@^0.14.0

          # Create Lighthouse configuration
          cat > .lighthouserc.json << EOF
          {
            "ci": {
              "collect": {
                "url": ["http://localhost:3000"],
                "numberOfRuns": 3,
                "settings": {
                  "chromeFlags": ["--no-sandbox", "--headless", "--disable-gpu"],
                  "preset": "desktop"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.8}],
                  "categories:accessibility": ["warn", {"minScore": 0.9}],
                  "categories:best-practices": ["warn", {"minScore": 0.8}],
                  "categories:seo": ["warn", {"minScore": 0.8}]
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": "./lighthouse-results"
              }
            }
          }
          EOF

          # Run Lighthouse audit
          lhci collect --config=.lighthouserc.json || echo "Lighthouse collection completed with warnings"

          # Parse results
          if [ -d "lighthouse-results" ]; then
            latest_report=$(ls -t lighthouse-results/*.json | head -1)
            if [ -n "$latest_report" ]; then
              perf_score=$(jq -r '.categories.performance.score * 100' "$latest_report" 2>/dev/null || echo "0")
              echo "📊 Performance Score: ${perf_score}/100"
              
              if [ "$(echo "$perf_score >= 70" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
                echo "✅ Performance validation passed"
              else
                echo "⚠️ Performance below target (${perf_score}/100 < 70)"
              fi
            fi
          fi
      - name: 📊 Bundle Size Validation
        id: validation
        run: |
          echo "📊 Validating bundle size and performance..."

          build_size="${{ needs.production-build.outputs.build-size }}"
          pwa_ready="${{ needs.production-build.outputs.pwa-ready }}"

          validation_status="passed"

          echo "📋 Pre-Deployment Validation Summary:"
          echo "  Build Size: $build_size"
          echo "  PWA Ready: $pwa_ready"
          echo "  Bundle Hash: ${{ needs.production-build.outputs.bundle-hash }}"

          # Check if validation passes minimum requirements
          if [ "$pwa_ready" != "true" ] && [ "${{ env.PWA_OPTIMIZATION }}" = "true" ]; then
            echo "⚠️ PWA validation failed but continuing with deployment"
            validation_status="warning"
          fi

          echo "status=$validation_status" >> $GITHUB_OUTPUT
          echo "✅ Pre-deployment validation completed: $validation_status"
      - name: 🧹 Cleanup Local Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
    timeout-minutes: 30
  github-pages-deployment:
    name: "🔧 デプロイ: github-pages-deployment"
    runs-on: ubuntu-latest
    needs:
      - deployment-setup
      - production-build
      - pre-deployment-validation
    if: >-
      always() && (needs.pre-deployment-validation.result == 'success' || needs.pre-deployment-validation.result ==
      'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployment-url: ${{ steps.deployment.outputs.page_url }}
      deployment-time: ${{ steps.timing.outputs.deployment-time }}
    steps:
      - name: ⏱️ Start Deployment Timing
        id: start-time
        run: echo "start-time=$(date +%s)" >> $GITHUB_OUTPUT
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: 📥 Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.run_number }}
          path: dist/
      - name: 🔧 Prepare GitHub Pages Deployment
        run: |
          echo "🔧 Preparing optimized deployment for GitHub Pages..."

          # Create deployment directory
          mkdir -p out

          # Copy optimized build
          cp -r dist/* out/

          # Ensure GitHub Pages compatibility
          touch out/.nojekyll

          # Create/verify 404.html for SPA routing
          if [ ! -f "out/404.html" ]; then
            cp out/index.html out/404.html
            echo "✅ SPA routing fallback created"
          fi

          # Verify essential files
          echo "📋 Deployment Verification:"

          required_files=("index.html" "404.html" ".nojekyll")
          for file in "${required_files[@]}"; do
            if [ -f "out/$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file missing"
              exit 1
            fi
          done

          # PWA files verification
          if [ "${{ env.PWA_OPTIMIZATION }}" = "true" ]; then
            pwa_files=("manifest.json")
            for file in "${pwa_files[@]}"; do
              if [ -f "out/$file" ]; then
                echo "  ✅ PWA: $file"
              else
                echo "  ⚠️ PWA: $file missing"
              fi
            done
          fi

          # Generate deployment manifest
          cat > out/deployment-info.json << EOF
          {
            "deployment_id": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -Iseconds)",
            "build_size": "${{ needs.production-build.outputs.build-size }}",
            "bundle_hash": "${{ needs.production-build.outputs.bundle-hash }}",
            "pwa_ready": ${{ needs.production-build.outputs.pwa-ready }},
            "deployment_strategy": "${{ env.DEPLOYMENT_STRATEGY }}",
            "environment": "production"
          }
          EOF

          echo "📦 Final deployment size: $(du -sh out)"
          echo "📁 Total files: $(find out -type f | wc -l)"
      - name: 🔧 Configure Pages
        uses: actions/configure-pages@v4
      - name: 📤 Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: ⏱️ Calculate Deployment Time
        id: timing
        run: |
          start_time="${{ steps.start-time.outputs.start-time }}"
          end_time="$(date +%s)"
          deployment_time=$((end_time - start_time))
          echo "deployment-time=${deployment_time}" >> $GITHUB_OUTPUT
          echo "⏱️ Deployment completed in ${deployment_time} seconds"
    timeout-minutes: 30
  post-deployment-validation:
    name: "🔧 デプロイ: post-deployment-validation"
    runs-on: ubuntu-latest
    needs:
      - github-pages-deployment
    if: env.SKIP_HEALTH_CHECK != 'true' && needs.github-pages-deployment.result == 'success'
    timeout-minutes: 10
    outputs:
      health-status: ${{ steps.health-check.outputs.status }}
      lighthouse-score: ${{ steps.lighthouse.outputs.performance-score }}
    steps:
      - name: ⏳ Wait for Deployment Propagation
        run: |
          echo "⏳ Waiting for deployment to propagate..."
          sleep 60  # Wait for GitHub Pages CDN to update
      - name: 🔍 Comprehensive Health Check
        id: health-check
        run: |
          echo "🔍 Running comprehensive post-deployment health check..."

          site_url="${{ needs.github-pages-deployment.outputs.deployment-url }}"
          echo "Testing site: $site_url"

          health_status="healthy"

          # Basic connectivity test
          echo "📡 Testing basic connectivity..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" "$site_url" || echo "000")

          if [ "$http_code" = "200" ]; then
            echo "  ✅ Site accessible (HTTP $http_code)"
          else
            echo "  ❌ Site not accessible (HTTP $http_code)"
            health_status="unhealthy"
          fi

          # Content validation
          echo "🔍 Testing content delivery..."
          content=$(curl -s "$site_url" || echo "")

          if echo "$content" | grep -q "<title>.*PMP.*Learning" > /dev/null 2>&1; then
            echo "  ✅ Page title present"
          else
            echo "  ⚠️ Expected page title not found"
          fi

          if echo "$content" | grep -q "viewport" > /dev/null 2>&1; then
            echo "  ✅ Mobile viewport meta tag present"
          else
            echo "  ⚠️ Mobile viewport meta tag missing"
          fi

          # PWA validation
          if [ "${{ env.PWA_OPTIMIZATION }}" = "true" ]; then
            echo "📱 Testing PWA components..."
            
            manifest_code=$(curl -s -o /dev/null -w "%{http_code}" "${site_url}manifest.json" || echo "000")
            if [ "$manifest_code" = "200" ]; then
              echo "  ✅ PWA manifest accessible"
            else
              echo "  ⚠️ PWA manifest not accessible (HTTP $manifest_code)"
            fi
            
            # Test service worker registration
            if echo "$content" | grep -q "serviceWorker" > /dev/null 2>&1; then
              echo "  ✅ Service worker registration found"
            else
              echo "  ⚠️ Service worker registration not detected"
            fi
          fi

          # Performance test
          echo "⚡ Testing load performance..."
          load_time=$(curl -w "%{time_total}" -s -o /dev/null "$site_url" || echo "0")
          load_time_ms=$(echo "$load_time * 1000" | bc -l 2>/dev/null || echo "0")

          if [ "$(echo "$load_time < 3.0" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "  ✅ Load time acceptable: ${load_time}s"
          else
            echo "  ⚠️ Load time high: ${load_time}s"
          fi

          echo "status=$health_status" >> $GITHUB_OUTPUT
          echo "🏁 Health check completed: $health_status"
      - name: 🏮 Post-Deployment Lighthouse Audit
        id: lighthouse
        if: env.PERFORMANCE_VALIDATION == 'true'
        run: |
          echo "🏮 Running post-deployment Lighthouse audit..."

          # Install Lighthouse CI
          npm install -g @lhci/cli@^0.14.0

          site_url="${{ needs.github-pages-deployment.outputs.deployment-url }}"

          # Create Lighthouse configuration
          cat > .lighthouserc.json << EOF
          {
            "ci": {
              "collect": {
                "url": ["$site_url"],
                "numberOfRuns": 2,
                "settings": {
                  "chromeFlags": ["--no-sandbox", "--headless", "--disable-gpu"],
                  "preset": "desktop"
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": "./lighthouse-results"
              }
            }
          }
          EOF

          # Run Lighthouse audit
          lhci collect --config=.lighthouserc.json || echo "Lighthouse audit completed with warnings"

          # Parse and report results
          if [ -d "lighthouse-results" ]; then
            latest_report=$(ls -t lighthouse-results/*.json | head -1)
            if [ -n "$latest_report" ]; then
              perf_score=$(jq -r '.categories.performance.score * 100' "$latest_report" 2>/dev/null || echo "0")
              accessibility_score=$(jq -r '.categories.accessibility.score * 100' "$latest_report" 2>/dev/null || echo "0")
              best_practices_score=$(jq -r '.categories["best-practices"].score * 100' "$latest_report" 2>/dev/null || echo "0")
              seo_score=$(jq -r '.categories.seo.score * 100' "$latest_report" 2>/dev/null || echo "0")
              
              echo "📊 Lighthouse Scores:"
              echo "  Performance: ${perf_score}/100"
              echo "  Accessibility: ${accessibility_score}/100"
              echo "  Best Practices: ${best_practices_score}/100"
              echo "  SEO: ${seo_score}/100"
              
              echo "performance-score=${perf_score}" >> $GITHUB_OUTPUT
            fi
          fi
  deployment-report:
    name: "🔧 デプロイ: deployment-report"
    runs-on: ubuntu-latest
    needs:
      - deployment-setup
      - production-build
      - github-pages-deployment
      - post-deployment-validation
    if: always()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: 📊 Generate Comprehensive Deployment Report
        run: >
          echo "📊 Generating comprehensive deployment report..."


          # Collect deployment metrics

          deployment_url="${{ needs.github-pages-deployment.outputs.deployment-url || env.SITE_URL }}"

          deployment_time="${{ needs.github-pages-deployment.outputs.deployment-time || 'N/A' }}"

          build_size="${{ needs.production-build.outputs.build-size }}"

          pwa_ready="${{ needs.production-build.outputs.pwa-ready }}"

          health_status="${{ needs.post-deployment-validation.outputs.health-status || 'skipped' }}"

          lighthouse_score="${{ needs.post-deployment-validation.outputs.lighthouse-score || 'N/A' }}"


          # Create comprehensive report

          cat > deployment-report.md << EOF

          # 🚀 Production Deployment Report


          **Deployment Date**: $(date -Iseconds)  

          **Deployment ID**: ${{ github.run_number }}  

          **Commit**: ${{ github.sha }}  

          **Branch**: ${{ github.ref_name }}  

          **Triggered By**: ${{ github.actor }}  


          ## 📊 Deployment Summary


          | Metric | Value | Status |

          |--------|--------|--------|

          | Deployment URL | [${deployment_url}](${deployment_url}) | $([[ "${{ needs.github-pages-deployment.result }}"
          == "success" ]] && echo "✅ LIVE" || echo "❌ FAILED") |

          | Deployment Time | ${deployment_time}s | $([[ "$deployment_time" != "N/A" && "$deployment_time" -le 300 ]] &&
          echo "✅ GOOD" || echo "⚠️ REVIEW") |

          | Build Size | ${build_size} | $([[ "$build_size" ]] && echo "ℹ️ INFO" || echo "N/A") |

          | PWA Ready | ${pwa_ready} | $([[ "$pwa_ready" == "true" ]] && echo "✅ YES" || echo "⚠️ PARTIAL") |

          | Health Status | ${health_status} | $([[ "$health_status" == "healthy" ]] && echo "✅ HEALTHY" || echo "⚠️
          CHECK") |

          | Lighthouse Score | ${lighthouse_score}/100 | $([[ "$lighthouse_score" != "N/A" && $(echo "$lighthouse_score
          >= 70" | bc -l 2>/dev/null) == "1" ]] && echo "✅ GOOD" || echo "ℹ️ INFO") |


          ## 🎯 Deployment Results


          ### ✅ Successful Components

          EOF


          # Add successful components

          if [[ "${{ needs.deployment-setup.result }}" == "success" ]]; then
            echo "- ✅ **Environment Setup**: DevOps pipeline initialized" >> deployment-report.md
          fi


          if [[ "${{ needs.production-build.result }}" == "success" ]]; then
            echo "- ✅ **Production Build**: Optimized bundle generated ($build_size)" >> deployment-report.md
          fi


          if [[ "${{ needs.github-pages-deployment.result }}" == "success" ]]; then
            echo "- ✅ **GitHub Pages Deploy**: Site deployed successfully" >> deployment-report.md
          fi


          if [[ "$health_status" == "healthy" ]]; then
            echo "- ✅ **Health Check**: All systems operational" >> deployment-report.md
          fi


          # Add warnings/issues if any

          cat >> deployment-report.md << EOF


          ### ⚠️ Items for Review

          EOF


          if [[ "$pwa_ready" != "true" ]] && [[ "${{ env.PWA_OPTIMIZATION }}" == "true" ]]; then
            echo "- ⚠️ **PWA Configuration**: Some PWA features not fully configured" >> deployment-report.md
          fi


          if [[ "$lighthouse_score" != "N/A" && $(echo "$lighthouse_score < 70" | bc -l 2>/dev/null) == "1" ]]; then
            echo "- ⚠️ **Performance**: Lighthouse score below target ($lighthouse_score/100)" >> deployment-report.md
          fi


          if [[ "$health_status" == "unhealthy" ]]; then
            echo "- ⚠️ **Health Check**: Post-deployment validation issues detected" >> deployment-report.md
          fi


          cat >> deployment-report.md << EOF


          ## 📈 Technical Details


          ### Build Information

