      - name: 🎯 Deployment Status Summary
        run: |
          echo "🎯 Final Deployment Status:"

          overall_status="SUCCESS"

          # Check critical components
          if [[ "${{ needs.github-pages-deployment.result }}" != "success" ]]; then
            overall_status="FAILED"
            echo "❌ Deployment FAILED - GitHub Pages deployment unsuccessful"
          elif [[ "${{ needs.production-build.result }}" != "success" ]]; then
            overall_status="FAILED"
            echo "❌ Deployment FAILED - Production build unsuccessful"
          elif [[ "${{ needs.post-deployment-validation.outputs.health-status }}" == "unhealthy" ]]; then
            overall_status="WARNING"
            echo "⚠️ Deployment SUCCESS with WARNINGS - Health check issues"
          else
            echo "✅ Deployment SUCCESSFUL - All systems operational"
          fi

          echo "📊 Overall Status: $overall_status"

          # Set exit code for failure cases
          if [[ "$overall_status" == "FAILED" ]]; then
            exit 1
          fi
      - name: 📤 Upload Deployment Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ github.run_number }}
          path: deployment-report.md
          retention-days: 90
      - name: 💬 Create Deployment Success Issue (If Requested)
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚀 Production Deployment Successful - v${{ github.run_number }}`;
            const body = `
            ## 🎉 Deployment Complete

            **Deployment URL**: ${{ needs.github-pages-deployment.outputs.deployment-url || env.SITE_URL }}
            **Build Size**: ${{ needs.production-build.outputs.build-size }}
            **Deployment Time**: ${{ needs.github-pages-deployment.outputs.deployment-time || 'N/A' }}s
            **PWA Ready**: ${{ needs.production-build.outputs.pwa-ready }}

            ### 📊 Performance
            - Lighthouse Score: ${{ needs.post-deployment-validation.outputs.lighthouse-score || 'N/A' }}/100
            - Health Status: ${{ needs.post-deployment-validation.outputs.health-status || 'N/A' }}

            ### 🔗 Resources
            - [Live Site](${{ needs.github-pages-deployment.outputs.deployment-url || env.SITE_URL }})
            - [Deployment Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---
            *Auto-generated by CD Production Pipeline*
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['deployment', 'production', 'success', 'auto-generated']
            });
