# ============================================================
# Workflow: Reusable Test Workflow
# Purpose: 再利用可能なテスト実行ワークフロー
# Trigger: workflow_call（他のワークフローから呼び出し）
# Dependencies: Node.js, テストフレームワーク
# Author: Claude Code
# Last Modified: 2025-08-12
# ============================================================

name: 🧪 Reusable Tests

# ------------------------------------------------------------
# Trigger Configuration
# ------------------------------------------------------------
on:
  # 他のワークフローから呼び出されるための設定
  workflow_call:
    inputs:
      test-type:
        description: 'Type of tests to run'
        required: true
        type: string
        default: 'all'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '18'
      upload-coverage:
        description: 'Upload coverage to Codecov'
        required: false
        type: boolean
        default: false
    outputs:
      test-status:
        description: 'Test execution status'
        value: ${{ jobs.run-tests.outputs.status }}
      coverage-percentage:
        description: 'Code coverage percentage'
        value: ${{ jobs.run-tests.outputs.coverage }}

# ------------------------------------------------------------
# Environment Variables
# ------------------------------------------------------------
env:
  CACHE_VERSION: 'v2'
  TEST_TIMEOUT: '300000'

# ------------------------------------------------------------
# Jobs Definition
# ------------------------------------------------------------
jobs:
  # ============================================================
  # Job: Run Tests
  # Purpose: 指定されたタイプのテストを実行
  # ============================================================
  run-tests:
    name: Run ${{ inputs.test-type }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    outputs:
      status: ${{ steps.test-result.outputs.status }}
      coverage: ${{ steps.test-result.outputs.coverage }}
    
    steps:
      # ------------------------------------------------------------
      # Step: Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Step: Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      # ------------------------------------------------------------
      # Step: Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed"

      # ------------------------------------------------------------
      # Step: Run tests based on type
      # ------------------------------------------------------------
      - name: Execute tests
        id: test-execution
        run: |
          echo "Running ${{ inputs.test-type }} tests..."
          
          case "${{ inputs.test-type }}" in
            "unit")
              npm run test:run || exit 1
              if [ -f "coverage/lcov.info" ]; then
                npm run test:coverage
              fi
              ;;
            "e2e")
              npm run build || exit 1
              npx playwright install chromium
              npx playwright test || exit 1
              ;;
            "lint")
              npm run lint || exit 1
              ;;
            "type-check")
              npm run typecheck || exit 1
              ;;
            "all")
              npm run test:run || exit 1
              npm run lint || exit 1
              npm run typecheck || exit 1
              ;;
            *)
              echo "Unknown test type: ${{ inputs.test-type }}"
              exit 1
              ;;
          esac
          
          echo "✅ Tests completed"

      # ------------------------------------------------------------
      # Step: Calculate coverage (if applicable)
      # ------------------------------------------------------------
      - name: Calculate coverage
        id: test-result
        if: always()
        run: |
          # Set test status
          if [ "${{ steps.test-execution.outcome }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
          # Calculate coverage if available
          if [ -f "coverage/lcov.info" ]; then
            COVERAGE=$(grep -o '[0-9]*\.[0-9]*%' coverage/lcov.info | head -1 || echo "0%")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage: $COVERAGE"
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Step: Upload coverage to Codecov
      # ------------------------------------------------------------
      - name: Upload coverage
        if: inputs.upload-coverage && inputs.test-type == 'unit'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: ${{ inputs.test-type }}
          fail_ci_if_error: false

      # ------------------------------------------------------------
      # Step: Upload test artifacts
      # ------------------------------------------------------------
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.test-type }}
          path: |
            test-results/
            coverage/
            playwright-report/
          retention-days: 7