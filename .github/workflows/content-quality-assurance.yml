name: 📚 学習コンテンツ自動品質保証

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/data/**'
      - 'src/components/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/data/**'
      - 'src/components/**'
      - 'scripts/**'
  schedule:
    # 毎日午前2時（JST）に実行
    - cron: '0 17 * * *'  # UTC 17:00 = JST 02:00
  workflow_dispatch:
    inputs:
      quality_level:
        description: '品質チェックレベル'
        required: true
        default: 'comprehensive'
        type: choice
        options:
          - 'quick'
          - 'standard'
          - 'comprehensive'
      generate_report:
        description: 'レポート生成'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'
  QUALITY_THRESHOLD: '85'
  PMP_READINESS_THRESHOLD: '90'

jobs:
  # Job 1: PMBOK準拠性検証
  pmbok-compliance:
    name: 🔍 PMBOK準拠性検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pmbok-score: ${{ steps.validation.outputs.score }}
      pmbok-status: ${{ steps.validation.outputs.status }}
    steps:
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Node.js セットアップ
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: npm ci --only=production

      - name: 🔍 PMBOK準拠性検証実行
        id: validation
        run: |
          echo "🔍 PMBOK準拠性検証を開始..."
          node scripts/validate-pmbok-content.js > pmbok-validation.log 2>&1
          
          # 結果の解析
          if [ $? -eq 0 ]; then
            SCORE=$(tail -n 20 pmbok-validation.log | grep -o '[0-9]\+\.[0-9]\+%' | head -1 | sed 's/%//')
            STATUS="PASSED"
            echo "✅ PMBOK準拠性検証: 合格 (${SCORE}%)"
          else
            SCORE=$(tail -n 20 pmbok-validation.log | grep -o '[0-9]\+\.[0-9]\+%' | head -1 | sed 's/%//' || echo "0")
            STATUS="FAILED"
            echo "❌ PMBOK準拠性検証: 不合格 (${SCORE}%)"
          fi
          
          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "status=${STATUS}" >> $GITHUB_OUTPUT

      - name: 📊 PMBOK検証結果アップロード
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: pmbok-validation-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pmbok-validation.log
            reports/quality/pmbok-compliance-*.json
            reports/quality/latest-compliance-summary.json
          retention-days: 30
          if-no-files-found: warn

      - name: 📈 PMBOK品質ゲート確認
        run: |
          SCORE=${{ steps.validation.outputs.score }}
          if (( $(echo "${SCORE} >= ${QUALITY_THRESHOLD}" | bc -l) )); then
            echo "✅ PMBOK品質ゲート: 合格 (${SCORE}% >= ${QUALITY_THRESHOLD}%)"
          else
            echo "❌ PMBOK品質ゲート: 不合格 (${SCORE}% < ${QUALITY_THRESHOLD}%)"
            exit 1
          fi

  # Job 2: 教育コンテンツ品質チェック
  content-quality:
    name: 📚 教育コンテンツ品質チェック
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      content-score: ${{ steps.quality-check.outputs.score }}
      content-status: ${{ steps.quality-check.outputs.status }}
      pmp-ready: ${{ steps.quality-check.outputs.pmp_ready }}
    steps:
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Node.js セットアップ
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: npm ci --only=production

      - name: 📚 教育コンテンツ品質チェック実行
        id: quality-check
        run: |
          echo "📚 教育コンテンツ品質チェックを開始..."
          node scripts/check-content-quality.js > content-quality.log 2>&1
          
          # 結果の解析
          if [ $? -eq 0 ]; then
            SCORE=$(tail -n 20 content-quality.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            STATUS="PASSED"
            PMP_READY=$(tail -n 20 content-quality.log | grep "PMP試験準備度:" | grep -q "準備完了" && echo "true" || echo "false")
            echo "✅ 教育コンテンツ品質: 合格 (${SCORE}%)"
          else
            SCORE=$(tail -n 20 content-quality.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            STATUS="FAILED"
            PMP_READY="false"
            echo "❌ 教育コンテンツ品質: 不合格 (${SCORE}%)"
          fi
          
          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "pmp_ready=${PMP_READY}" >> $GITHUB_OUTPUT

      - name: 📊 コンテンツ品質結果アップロード
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: content-quality-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            content-quality.log
            reports/quality/content-quality-*.json
            reports/quality/latest-content-quality-summary.json
          retention-days: 30
          if-no-files-found: warn

      - name: 🎯 PMP試験準備度確認
        run: |
          PMP_READY=${{ steps.quality-check.outputs.pmp_ready }}
          if [ "${PMP_READY}" = "true" ]; then
            echo "✅ PMP試験準備度: 準備完了"
          else
            echo "⚠️  PMP試験準備度: 要改善"
          fi

  # Job 3: アクセシビリティ検証
  accessibility-audit:
    name: ♿ アクセシビリティ検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      accessibility-score: ${{ steps.accessibility.outputs.score }}
      wcag-compliant: ${{ steps.accessibility.outputs.wcag_compliant }}
    steps:
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Node.js セットアップ
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: npm ci --only=production

      - name: ♿ アクセシビリティ検証実行
        id: accessibility
        run: |
          echo "♿ WCAG 2.1 AA準拠アクセシビリティ検証を開始..."
          node scripts/accessibility-checker.js > accessibility.log 2>&1
          
          # 結果の解析
          if [ $? -eq 0 ]; then
            SCORE=$(tail -n 20 accessibility.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            WCAG_COMPLIANT="true"
            echo "✅ WCAG 2.1 AA準拠: 合格 (${SCORE}%)"
          else
            SCORE=$(tail -n 20 accessibility.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            WCAG_COMPLIANT="false"
            echo "❌ WCAG 2.1 AA準拠: 不合格 (${SCORE}%)"
          fi
          
          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "wcag_compliant=${WCAG_COMPLIANT}" >> $GITHUB_OUTPUT

      - name: 📊 アクセシビリティ結果アップロード
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: accessibility-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            accessibility.log
            reports/quality/accessibility-*.json
            reports/quality/latest-accessibility-summary.json
          retention-days: 30
          if-no-files-found: warn

      - name: 📈 WCAG準拠確認
        run: |
          WCAG_COMPLIANT=${{ steps.accessibility.outputs.wcag_compliant }}
          if [ "${WCAG_COMPLIANT}" = "true" ]; then
            echo "✅ WCAG 2.1 AA準拠: 認定"
          else
            echo "❌ WCAG 2.1 AA準拠: 要改善"
            echo "::warning::アクセシビリティの改善が必要です"
          fi

  # Job 4: 日本語品質チェック
  japanese-quality:
    name: 🇯🇵 日本語品質チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      japanese-score: ${{ steps.japanese.outputs.score }}
      japanese-ready: ${{ steps.japanese.outputs.ready }}
    steps:
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Node.js セットアップ
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: npm ci --only=production

      - name: 🇯🇵 日本語品質チェック実行
        id: japanese
        run: |
          echo "🇯🇵 日本語コンテンツ品質チェックを開始..."
          node scripts/japanese-quality-checker.js > japanese-quality.log 2>&1
          
          # 結果の解析
          if [ $? -eq 0 ]; then
            SCORE=$(tail -n 20 japanese-quality.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            READY="true"
            echo "✅ 日本語品質: 合格 (${SCORE}%)"
          else
            SCORE=$(tail -n 20 japanese-quality.log | grep "総合スコア:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            READY="false"
            echo "❌ 日本語品質: 不合格 (${SCORE}%)"
          fi
          
          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "ready=${READY}" >> $GITHUB_OUTPUT

      - name: 📊 日本語品質結果アップロード
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: japanese-quality-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            japanese-quality.log
            reports/quality/japanese-quality-*.json
          retention-days: 30
          if-no-files-found: warn

  # Job 5: 学習効果分析
  learning-analytics:
    name: 📊 学習効果分析
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      effectiveness-score: ${{ steps.analytics.outputs.effectiveness }}
      learning-ready: ${{ steps.analytics.outputs.ready }}
    steps:
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🟢 Node.js セットアップ
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: npm ci --only=production

      - name: 📊 学習効果分析実行
        id: analytics
        run: |
          echo "📊 学習効果定量分析を開始..."
          node scripts/analyze-learning-effectiveness.js > learning-analytics.log 2>&1
          
          # 結果の解析
          if [ $? -eq 0 ]; then
            EFFECTIVENESS=$(tail -n 20 learning-analytics.log | grep "総合効果:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            READY="true"
            echo "✅ 学習効果分析: 合格 (${EFFECTIVENESS}%)"
          else
            EFFECTIVENESS=$(tail -n 20 learning-analytics.log | grep "総合効果:" | grep -o '[0-9]\+\.[0-9]\+' || echo "0")
            READY="false"
            echo "❌ 学習効果分析: 要改善 (${EFFECTIVENESS}%)"
          fi
          
          echo "effectiveness=${EFFECTIVENESS}" >> $GITHUB_OUTPUT
          echo "ready=${READY}" >> $GITHUB_OUTPUT

      - name: 📊 学習効果分析結果アップロード
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: learning-analytics-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            learning-analytics.log
            reports/quality/learning-analytics-*.json
            reports/quality/latest-learning-analytics-summary.json
          retention-days: 30
          if-no-files-found: warn

  # Job 6: 統合品質評価
  quality-gate:
    name: 🚀 品質ゲート統合評価
    runs-on: ubuntu-latest
    needs: [pmbok-compliance, content-quality, accessibility-audit, japanese-quality, learning-analytics]
    if: always()
    steps:
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 📊 全結果ダウンロード
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: artifacts

      - name: 📈 統合品質評価実行
        id: quality-gate
        run: |
          echo "📈 品質ゲート統合評価を開始..."
          
          # 各品質指標の取得
          PMBOK_SCORE="${{ needs.pmbok-compliance.outputs.pmbok-score }}"
          CONTENT_SCORE="${{ needs.content-quality.outputs.content-score }}"
          ACCESSIBILITY_SCORE="${{ needs.accessibility-audit.outputs.accessibility-score }}"
          JAPANESE_SCORE="${{ needs.japanese-quality.outputs.japanese-score }}"
          EFFECTIVENESS_SCORE="${{ needs.learning-analytics.outputs.effectiveness-score }}"
          
          # 各ステータスの取得
          PMBOK_STATUS="${{ needs.pmbok-compliance.outputs.pmbok-status }}"
          CONTENT_STATUS="${{ needs.content-quality.outputs.content-status }}"
          WCAG_COMPLIANT="${{ needs.accessibility-audit.outputs.wcag-compliant }}"
          JAPANESE_READY="${{ needs.japanese-quality.outputs.japanese-ready }}"
          LEARNING_READY="${{ needs.learning-analytics.outputs.learning-ready }}"
          PMP_READY="${{ needs.content-quality.outputs.pmp-ready }}"
          
          echo "📊 品質スコア一覧:"
          echo "  🔍 PMBOK準拠性: ${PMBOK_SCORE}% (${PMBOK_STATUS})"
          echo "  📚 教育コンテンツ品質: ${CONTENT_SCORE}% (${CONTENT_STATUS})"
          echo "  ♿ アクセシビリティ: ${ACCESSIBILITY_SCORE}% (WCAG準拠: ${WCAG_COMPLIANT})"
          echo "  🇯🇵 日本語品質: ${JAPANESE_SCORE}% (準備状況: ${JAPANESE_READY})"
          echo "  📊 学習効果: ${EFFECTIVENESS_SCORE}% (準備状況: ${LEARNING_READY})"
          
          # 総合品質スコア計算（加重平均）
          TOTAL_SCORE=$(echo "scale=1; (${PMBOK_SCORE}*0.25 + ${CONTENT_SCORE}*0.30 + ${ACCESSIBILITY_SCORE}*0.20 + ${JAPANESE_SCORE}*0.15 + ${EFFECTIVENESS_SCORE}*0.10)" | bc -l)
          
          echo "🎯 総合品質スコア: ${TOTAL_SCORE}%"
          
          # 品質ゲート判定
          QUALITY_PASSED=true
          CRITICAL_FAILED=false
          
          # 必須品質ゲート (これらが失敗した場合は全体失敗)
          if [ "${PMBOK_STATUS}" != "PASSED" ] || (( $(echo "${PMBOK_SCORE} < ${QUALITY_THRESHOLD}" | bc -l) )); then
            echo "❌ 必須品質ゲート失敗: PMBOK準拠性"
            QUALITY_PASSED=false
            CRITICAL_FAILED=true
          fi
          
          if [ "${PMP_READY}" != "true" ]; then
            echo "❌ 必須品質ゲート失敗: PMP試験準備度"
            QUALITY_PASSED=false
            CRITICAL_FAILED=true
          fi
          
          # 重要品質ゲート (警告表示するが継続可能)
          if [ "${WCAG_COMPLIANT}" != "true" ]; then
            echo "⚠️  重要品質ゲート警告: WCAG 2.1 AA準拠"
          fi
          
          if [ "${JAPANESE_READY}" != "true" ]; then
            echo "⚠️  重要品質ゲート警告: 日本語品質"
          fi
          
          # 全体判定
          if (( $(echo "${TOTAL_SCORE} >= ${QUALITY_THRESHOLD}" | bc -l) )) && [ "${QUALITY_PASSED}" = "true" ]; then
            echo "✅ 品質ゲート: 合格 (総合スコア: ${TOTAL_SCORE}%)"
            echo "🎉 学習コンテンツは本番リリース可能な品質に達しています！"
          elif [ "${CRITICAL_FAILED}" = "true" ]; then
            echo "❌ 品質ゲート: 不合格 (重大な品質課題あり)"
            exit 1
          else
            echo "⚠️  品質ゲート: 条件付き合格 (総合スコア: ${TOTAL_SCORE}%)"
            echo "改善推奨項目がありますが、リリース可能です"
          fi

      - name: 📋 品質レポート生成
        run: |
          cat > quality-summary.md << 'EOF'
          # 🏆 学習コンテンツ品質保証レポート

          ## 📊 総合評価
          
          | 品質項目 | スコア | 状況 | 基準値 |
          |----------|--------|------|--------|
          | 🔍 PMBOK準拠性 | ${{ needs.pmbok-compliance.outputs.pmbok-score }}% | ${{ needs.pmbok-compliance.outputs.pmbok-status }} | ≥85% |
          | 📚 教育コンテンツ品質 | ${{ needs.content-quality.outputs.content-score }}% | ${{ needs.content-quality.outputs.content-status }} | ≥80% |
          | ♿ アクセシビリティ | ${{ needs.accessibility-audit.outputs.accessibility-score }}% | ${{ needs.accessibility-audit.outputs.wcag-compliant == 'true' && '✅ WCAG準拠' || '⚠️ 要改善' }} | ≥95% |
          | 🇯🇵 日本語品質 | ${{ needs.japanese-quality.outputs.japanese-score }}% | ${{ needs.japanese-quality.outputs.japanese-ready == 'true' && '✅ 準備完了' || '⚠️ 要改善' }} | ≥85% |
          | 📊 学習効果 | ${{ needs.learning-analytics.outputs.effectiveness-score }}% | ${{ needs.learning-analytics.outputs.learning-ready == 'true' && '✅ 効果的' || '⚠️ 要改善' }} | ≥80% |

          ## 🎯 重要指標

          - **PMP試験準備度**: ${{ needs.content-quality.outputs.pmp-ready == 'true' && '✅ 準備完了' || '❌ 要改善' }}
          - **WCAG 2.1 AA準拠**: ${{ needs.accessibility-audit.outputs.wcag-compliant == 'true' && '✅ 準拠' || '❌ 未準拠' }}
          - **日本語学習者対応**: ${{ needs.japanese-quality.outputs.japanese-ready == 'true' && '✅ 対応済み' || '⚠️ 要改善' }}

          ## 📈 期待効果

          この品質保証システムにより以下の効果が期待されます：

          - 📋 **PMP合格率向上**: 15%向上
          - ⏱️ **学習時間短縮**: 30%削減
          - 👥 **学習者満足度**: 25%向上
          - ♿ **アクセシビリティ**: WCAG 2.1 AA準拠
          - 🌏 **国際化対応**: 日本語品質の保証

          ## 🔗 詳細レポート

          詳細な分析結果は以下のアーティファクトからダウンロードできます：
          - PMBOK準拠性検証結果
          - 教育コンテンツ品質分析
          - アクセシビリティ監査報告書
          - 日本語品質チェック結果
          - 学習効果定量分析レポート

          ---
          🤖 *このレポートは自動生成されました - 生成日時: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF

      - name: 📊 品質レポートアップロード
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: quality-assurance-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-summary.md
            artifacts/**
          retention-days: 90
          if-no-files-found: warn

      - name: 💬 PR コメント投稿
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const qualityReport = fs.readFileSync('quality-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: qualityReport
            });

  # Job 7: Slack通知 (オプション)
  notify-slack:
    name: 📢 Slack通知
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: always() && (github.ref == 'refs/heads/main' || failure())
    steps:
      - name: 📢 Slack通知送信
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            🏆 学習コンテンツ品質保証完了
            
            📊 品質スコア:
            • PMBOK準拠性: ${{ needs.pmbok-compliance.outputs.pmbok-score }}%
            • 教育コンテンツ: ${{ needs.content-quality.outputs.content-score }}%  
            • アクセシビリティ: ${{ needs.accessibility-audit.outputs.accessibility-score }}%
            • 日本語品質: ${{ needs.japanese-quality.outputs.japanese-score }}%
