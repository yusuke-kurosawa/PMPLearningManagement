name: CI/CD Pipeline - PMPLearning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '18'
  CACHE_VERSION: 'v1'

jobs:
  # Phase 1: Basic Quality Gates
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check code formatting
        run: npm run format:check

  # Security and Dependencies
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run security:audit
        continue-on-error: true

      - name: Check for high-severity vulnerabilities
        run: |
          echo "Checking for high-severity vulnerabilities..."
          npm audit --audit-level=high --json > audit-results.json || true
          if [ -s audit-results.json ]; then
            VULNS=$(cat audit-results.json | jq '.vulnerabilities | length // 0')
            echo "Found $VULNS vulnerabilities"
            if [ "$VULNS" -gt "0" ]; then
              echo "❌ High-severity vulnerabilities detected"
              npm audit --audit-level=high
              echo "⚠️  Please review and fix security issues"
            else
              echo "✅ No high-severity vulnerabilities found"
            fi
          else
            echo "✅ Security audit completed successfully"
          fi

  # Build Test
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Check build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build completed successfully"
            echo "Build size:"
            du -sh dist/
          else
            echo "❌ Build failed - no dist directory found"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 1

  # Deploy to GitHub Pages (Only on main branch)
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-test, security-audit]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true

      - name: Copy build output for GitHub Pages
        run: |
          # Copy Vite build output for GitHub Pages
          mkdir -p out
          cp -r dist/* out/
          
          # Ensure proper routing for SPA
          if [ -f "out/index.html" ]; then
            echo "✅ Index.html found in build output"
          else
            echo "❌ No index.html found in build output"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deployment check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-pages]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check site accessibility
        run: |
          URL="https://yusuke-kurosawa.github.io/PMPLearningManagement/"
          echo "Checking: $URL"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is accessible"
          else
            echo "⚠️  Site returned HTTP $HTTP_CODE"
          fi

  # PR Comment for staging info
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🔄 Build Status')
            );
            
            const body = `🔄 **Build Status Update**
            
            - ✅ Linting and formatting checks passed
            - ✅ TypeScript compilation successful  
            - ✅ Build completed successfully
            - 🔍 Security audit completed
            
            **Build Info:**
            - Commit: \`${context.sha.substring(0, 7)}\`
            - Branch: \`${context.ref}\`
            - Build Time: \`${new Date().toISOString()}\`
            
            _This PR is ready for review!_`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }