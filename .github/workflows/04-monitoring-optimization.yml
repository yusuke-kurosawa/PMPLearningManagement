name: 📊 監視・統合 - Image Optimization Pipeline
"on":
  push:
    paths:
      - public/**/*.png
      - public/**/*.jpg
      - public/**/*.jpeg
      - src/**/*.png
      - src/**/*.jpg
      - src/**/*.jpeg
  pull_request:
    paths:
      - public/**/*.png
      - public/**/*.jpg
      - public/**/*.jpeg
      - src/**/*.png
      - src/**/*.jpg
      - src/**/*.jpeg
  workflow_dispatch:
    inputs:
      debug:
        description: デバッグモードを有効にする
        required: false
        default: "false"
        type: boolean
jobs:
  optimize-images:
    name: "📌 処理: Optimize Images"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - name: Install image optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp libjpeg-turbo-progs optipng
          npm install -g imagemin-cli @squoosh/cli
      - name: Install dependencies
        run: npm ci
      - name: Detect changed images
        id: changed-images
        run: >
          echo "Detecting changed image files..."

          git diff --name-only HEAD~1 HEAD | grep -E '\.(png|jpg|jpeg)$' > changed_images.txt || echo "No images
          changed"

          if [ -s changed_images.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed images:"
            cat changed_images.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      - name: Optimize PNG images
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "🖼️ Optimizing PNG images..."
          node ./scripts/optimize-images.js --type=png --input=changed_images.txt
      - name: Optimize JPEG images
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "🖼️ Optimizing JPEG images..."
          node ./scripts/optimize-images.js --type=jpeg --input=changed_images.txt
      - name: Generate WebP variants
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "🚀 Generating WebP variants..."
          node ./scripts/generate-webp.js --input=changed_images.txt
      - name: Generate AVIF variants
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "⚡ Generating AVIF variants..."
          node ./scripts/generate-avif.js --input=changed_images.txt
      - name: Generate responsive image sizes
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "📱 Generating responsive image sizes..."
          node ./scripts/generate-responsive-images.js --input=changed_images.txt
      - name: Update image metadata
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "📊 Updating image metadata..."
          node ./scripts/update-image-metadata.js
      - name: Generate optimization report
        if: steps.changed-images.outputs.has_changes == 'true'
        run: |
          echo "📋 Generating optimization report..."
          node ./scripts/generate-image-report.js
      - name: Upload optimized images
        if: steps.changed-images.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: optimized-images-${{ github.run_id }}
          path: |
            ./public/**/*.webp
            ./public/**/*.avif
            ./image-optimization-report.json
      - name: Comment PR with optimization results
        if: github.event_name == 'pull_request' && steps.changed-images.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = './image-optimization-report.json';

            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              const comment = `## 🖼️ Image Optimization Report
              
              ### Summary
              - **Images Processed**: ${report.processedCount}
              - **Total Size Reduction**: ${report.totalSizeReduction}
              - **Compression Ratio**: ${report.compressionRatio}
              - **WebP Generated**: ${report.webpCount}
              - **AVIF Generated**: ${report.avifCount}
              
              ### Size Breakdown
              | Format | Original Size | Optimized Size | Savings |
              |--------|---------------|----------------|---------|
              ${report.formatBreakdown.map(item => 
                `| ${item.format} | ${item.originalSize} | ${item.optimizedSize} | ${item.savings} |`
              ).join('\\n')}
              
              ### Responsive Images Generated
              ${report.responsiveImages.map(img => 
                `- **${img.name}**: ${img.variants.join(', ')}`
              ).join('\\n')}
              
              ### Performance Impact
              - **Estimated Load Time Improvement**: ${report.loadTimeImprovement}
              - **Bandwidth Savings**: ${report.bandwidthSavings}
              - **Core Web Vitals Impact**: ${report.coreWebVitalsImpact}
              
              ${report.recommendations.length > 0 ? `
              ### Recommendations
              ${report.recommendations.map((rec, i) => `${i + 1}. ${rec}`).join('\\n')}
              ` : ''}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
      - name: Commit optimized images
        if: github.ref == 'refs/heads/main' && steps.changed-images.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/**/*.webp public/**/*.avif
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: optimize images and generate modern formats

            🤖 Generated with Claude Code
            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi
    timeout-minutes: 30
  image-audit:
    name: "📋 監査: Image Quality Audit"
    runs-on: ubuntu-latest
    needs: optimize-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit image quality
        run: |
          echo "🔍 Auditing image quality..."
          node ./scripts/audit-image-quality.js
      - name: Check image accessibility
        run: |
          echo "♿ Checking image accessibility..."
          node ./scripts/check-image-accessibility.js
      - name: Validate image formats
        run: |
          echo "✅ Validating image formats..."
          node ./scripts/validate-image-formats.js
      - name: Generate accessibility report
        run: |
          echo "📋 Generating accessibility report..."
          node ./scripts/generate-accessibility-report.js
    timeout-minutes: 30
  cdn-optimization:
    name: "⚡ 最適化: CDN and Delivery Optimization"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - optimize-images
      - image-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup image CDN configuration
        run: |
          echo "🌐 Setting up CDN configuration..."
          node ./scripts/setup-image-cdn.js
      - name: Generate responsive image manifests
        run: |
          echo "📱 Generating responsive image manifests..."
          node ./scripts/generate-responsive-manifest.js
      - name: Update service worker cache
        run: |
          echo "🔄 Updating service worker with new images..."
          node ./scripts/update-sw-image-cache.js
      - name: Deploy to CDN
        run: |
          echo "🚀 Deploying optimized images..."
          # This would deploy to your CDN service
          echo "CDN deployment would happen here"
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
