# ====================================================================
# 📊 監視・統合 - Bundle Analysis & Optimization
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - コードプッシュ時
#   - プルリクエスト作成・更新時
#   - スケジュール実行
#   - 手動実行
#
# 主な処理:
#   1. 🔍 分析: Bundle Analysis
#   2. ⚡ 最適化: Tree Shaking Optimization
#   3. 🔍 分析: Code Splitting Analysis
#   4. ⚡ パフォーマンス: Performance Regression Check
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F4CA 監視・統合 - Bundle Analysis & Optimization"
'on':
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 2 * * 1
  workflow_dispatch: null
jobs:
  bundle-analysis:
    name: "\U0001F50D 分析: Bundle Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for analysis
        run: npm run build
        env:
          NODE_ENV: production
          GENERATE_SOURCEMAP: false
      - name: Install bundle analyzer
        run: |
          npm install -g webpack-bundle-analyzer
          npm install --save-dev @bundle-analyzer/webpack-plugin
      - name: Analyze bundle
        run: "echo \"\U0001F50D Analyzing bundle composition...\"\nnode ./scripts/analyze-bundle.js\n"
      - name: Check bundle size limits
        run: "echo \"\U0001F4CF Checking bundle size limits...\"\nnode ./scripts/check-bundle-size.js\n"
      - name: Generate optimization report
        run: "echo \"\U0001F4CA Generating optimization recommendations...\"\nnode ./scripts/generate-optimization-report.js\n"
      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: 'bundle-analysis-${{ github.run_id }}'
          path: |
            ./bundle-analysis/
            ./dist/stats.json
            ./bundle-report.html
      - name: Comment PR with bundle analysis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: "const fs = require('fs');\nconst path = './bundle-analysis/bundle-summary.json';\n\nif (fs.existsSync(path)) {\n  const analysis = JSON.parse(fs.readFileSync(path, 'utf8'));\n  \n  const comment = `## \U0001F4E6 Bundle Analysis Report\n  \n  ### Bundle Size Summary\n  - **Total Size**: ${analysis.totalSize}\n  - **Gzipped Size**: ${analysis.gzippedSize}\n  - **Change**: ${analysis.sizeChange} (${analysis.sizeChangePercent})\n  \n  ### Top Large Dependencies\n  ${analysis.largeDependencies.map((dep, i) => \n    `${i + 1}. **${dep.name}**: ${dep.size} (${dep.percentage}%)`\n  ).join('\\\\n')}\n  \n  ### Optimization Opportunities\n  ${analysis.optimizations.map((opt, i) => \n    `${i + 1}. **${opt.type}**: ${opt.description} (${opt.potentialSaving})`\n  ).join('\\\\n')}\n  \n  ### Recommendations\n  ${analysis.recommendations.map((rec, i) => \n    `${i + 1}. ${rec}`\n  ).join('\\\\n')}\n  \n  ${analysis.budgetStatus === 'exceeded' ? '⚠️ **Bundle size budget exceeded!**' : '✅ Bundle size within budget'}\n  \n  [View detailed analysis](${analysis.reportUrl})\n  `;\n  \n  github.rest.issues.createComment({\n    issue_number: context.issue.number,\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    body: comment\n  });\n}\n"
    timeout-minutes: 30
  treeshaking-optimization:
    name: '⚡ 最適化: Tree Shaking Optimization'
    runs-on: ubuntu-latest
    needs: bundle-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install analysis tools
        run: |
          npm install -g webpack-unused
          npm install --save-dev unused-webpack-plugin
          npm install --save-dev duplicate-package-checker-webpack-plugin
      - name: Analyze unused code
        run: "echo \"\U0001F50D Analyzing unused code...\"\nnode ./scripts/analyze-unused-code.js\n"
      - name: Check for duplicate dependencies
        run: "echo \"\U0001F50D Checking for duplicate dependencies...\"\nnode ./scripts/check-duplicate-dependencies.js\n"
      - name: Generate tree shaking report
        run: "echo \"\U0001F333 Generating tree shaking optimization report...\"\nnode ./scripts/generate-treeshaking-report.js\n"
      - name: Create optimization PR
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = './bundle-analysis/treeshaking-report.json';

            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              if (report.optimizationsFound > 0) {
                // Create a new branch for optimizations
                const branchName = `bundle-optimization-${Date.now()}`;
                
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/heads/${branchName}`,
                  sha: context.sha
                });
                
                console.log(`Created optimization branch: ${branchName}`);
              }
            }
    timeout-minutes: 30
  code-splitting-analysis:
    name: "\U0001F50D 分析: Code Splitting Analysis"
    runs-on: ubuntu-latest
    needs: bundle-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Analyze code splitting opportunities
        run: |
          echo "✂️ Analyzing code splitting opportunities..."
          node ./scripts/analyze-code-splitting.js
      - name: Generate route-based splitting recommendations
        run: "echo \"\U0001F6E3️ Analyzing route-based splitting...\"\nnode ./scripts/analyze-route-splitting.js\n"
      - name: Check lazy loading implementation
        run: |
          echo "⏰ Checking lazy loading implementation..."
          node ./scripts/check-lazy-loading.js
      - name: Upload code splitting analysis
        uses: actions/upload-artifact@v3
        with:
          name: 'code-splitting-analysis-${{ github.run_id }}'
          path: ./code-splitting-analysis/
    timeout-minutes: 30
  performance-regression-check:
    name: '⚡ パフォーマンス: Performance Regression Check'
    runs-on: ubuntu-latest
    needs:
      - bundle-analysis
      - treeshaking-optimization
      - code-splitting-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download analysis artifacts
        uses: actions/download-artifact@v3
        with:
          pattern: '*-analysis-*'
          merge-multiple: true
          path: ./analysis-results/
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Check for performance regressions
        run: "echo \"\U0001F4C9 Checking for performance regressions...\"\nnode ./scripts/check-performance-regression.js\n"
      - name: Generate final optimization report
        run: "echo \"\U0001F4CB Generating final optimization report...\"\nnode ./scripts/generate-final-report.js\n"
      - name: Fail if critical regressions found
        run: |
          if [ -f "./analysis-results/critical-regressions.json" ]; then
            echo "❌ Critical performance regressions detected!"
            cat ./analysis-results/critical-regressions.json
            exit 1
          else
            echo "✅ No critical performance regressions detected"
          fi
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
