# ====================================================================
# 🧪 Reusable Tests
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - 他ワークフローからの呼び出し
#
# 主な処理:
#   1. 🧪 テスト: Run ${{ inputs.test-type }} Tests
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F9EA Reusable Tests"
'on':
  workflow_call:
    inputs:
      test-type:
        description: Type of tests to run
        required: true
        type: string
        default: all
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '18'
      upload-coverage:
        description: Upload coverage to Codecov
        required: false
        type: boolean
        default: false
    outputs:
      test-status:
        description: Test execution status
        value: '${{ jobs.run-tests.outputs.status }}'
      coverage-percentage:
        description: Code coverage percentage
        value: '${{ jobs.run-tests.outputs.coverage }}'
env:
  CACHE_VERSION: v2
  TEST_TIMEOUT: '300000'
jobs:
  run-tests:
    name: "\U0001F9EA テスト: Run ${{ inputs.test-type }} Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: '${{ steps.test-result.outputs.status }}'
      coverage: '${{ steps.test-result.outputs.coverage }}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: npm
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed"
      - name: Execute tests
        id: test-execution
        run: |
          echo "Running ${{ inputs.test-type }} tests..."

          case "${{ inputs.test-type }}" in
            "unit")
              npm run test:run || exit 1
              if [ -f "coverage/lcov.info" ]; then
                npm run test:coverage
              fi
              ;;
            "e2e")
              npm run build || exit 1
              npx playwright install chromium
              npx playwright test || exit 1
              ;;
            "lint")
              npm run lint || exit 1
              ;;
            "type-check")
              npm run typecheck || exit 1
              ;;
            "all")
              npm run test:run || exit 1
              npm run lint || exit 1
              npm run typecheck || exit 1
              ;;
            *)
              echo "Unknown test type: ${{ inputs.test-type }}"
              exit 1
              ;;
          esac

          echo "✅ Tests completed"
      - name: Calculate coverage
        id: test-result
        if: always()
        run: |
          # Set test status
          if [ "${{ steps.test-execution.outcome }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

          # Calculate coverage if available
          if [ -f "coverage/lcov.info" ]; then
            COVERAGE=$(grep -o '[0-9]*\.[0-9]*%' coverage/lcov.info | head -1 || echo "0%")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage: $COVERAGE"
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
          fi
      - name: Upload coverage
        if: inputs.upload-coverage && inputs.test-type == 'unit'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: '${{ inputs.test-type }}'
          fail_ci_if_error: false
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'test-results-${{ inputs.test-type }}'
          path: |
            test-results/
            coverage/
            playwright-report/
          retention-days: 7
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
