# ====================================================================
# 🎯 メタ検証 - GitHub Actions Workflow Compliance Validator
# ====================================================================
# 目的: すべてのワークフローが定義されたルールに準拠していることを検証
#
# 実行タイミング:
#   - プルリクエスト作成・更新時（.github/workflows/への変更時）
#   - 手動実行
#   - 毎日午前2時（スケジュール実行）
#
# 主な処理:
#   1. ワークフロー構文検証
#   2. 命名規則チェック
#   3. セキュリティ設定検証
#   4. パフォーマンス設定確認
#   5. ドキュメント完全性チェック
#
# 依存関係: Node.js, js-yaml, GitHub Actions
# 実行時間目安: 約5分
# 最終更新: 2025-08-17
# ====================================================================

name: 🎯 ワークフロー準拠性検証

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.claude/context/github-actions-rules.md'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 毎日午前2時

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20'
  COMPLIANCE_THRESHOLD: 95  # 準拠率の最小許容値（%）

jobs:
  # ====================================================================
  # Job 1: ワークフロー発見と構文検証
  # ====================================================================
  workflow-discovery:
    name: 🔍 検証: ワークフロー発見と構文チェック
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workflow-count: ${{ steps.discovery.outputs.count }}
      workflow-list: ${{ steps.discovery.outputs.list }}
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🔍 ワークフローファイルの発見
        id: discovery
        run: |
          echo "🔍 Discovering workflow files..."
          WORKFLOWS=$(find .github/workflows -maxdepth 1 -name "*.yml" -type f | sort)
          COUNT=$(echo "$WORKFLOWS" | wc -l)
          echo "Found $COUNT workflow files"
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$WORKFLOWS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📋 YAML構文検証
        run: |
          echo "📋 Validating YAML syntax..."
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              echo "Checking: $(basename $workflow)"
              yamllint -d relaxed "$workflow" || {
                echo "❌ YAML syntax error in $workflow"
                exit 1
              }
            fi
          done
          echo "✅ All workflows have valid YAML syntax"

  # ====================================================================
  # Job 2: 命名規則とファイル構造検証
  # ====================================================================
  naming-validation:
    name: 📝 検証: 命名規則とファイル構造
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-discovery
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🏷️ ファイル命名規則チェック
        run: |
          echo "🏷️ Checking file naming conventions..."
          VIOLATIONS=0
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              FILENAME=$(basename "$workflow")
              if ! echo "$FILENAME" | grep -qE '^[0-9]{2}-[a-z]+-[a-z-]+\.yml$'; then
                echo "❌ Invalid filename: $FILENAME"
                echo "   Expected pattern: 00-category-description.yml"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "❌ Found $VIOLATIONS naming violations"
            exit 1
          else
            echo "✅ All files follow naming convention"
          fi

      - name: 📚 ワークフロー名検証
        run: |
          echo "📚 Checking workflow names..."
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              NAME=$(grep "^name:" "$workflow" | head -1 | cut -d: -f2-)
              if [ -z "$NAME" ]; then
                echo "❌ Missing workflow name in $(basename $workflow)"
                exit 1
              fi
              # Check for emoji prefix
              if ! echo "$NAME" | grep -qE '^\s*[🔒📦🧪📊🤖⚖️🔔🔧🎯♻️]'; then
                echo "⚠️  Missing emoji prefix in $(basename $workflow): $NAME"
              fi
            fi
          done
          echo "✅ Workflow name validation complete"

  # ====================================================================
  # Job 3: セキュリティ設定検証
  # ====================================================================
  security-validation:
    name: 🔒 検証: セキュリティ設定
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-discovery
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🔐 権限設定チェック
        run: |
          echo "🔐 Checking permissions configuration..."
          MISSING_PERMS=0
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              if ! grep -q "^permissions:" "$workflow"; then
                echo "❌ Missing permissions in $(basename $workflow)"
                MISSING_PERMS=$((MISSING_PERMS + 1))
              fi
            fi
          done
          
          if [ $MISSING_PERMS -gt 0 ]; then
            echo "❌ Found $MISSING_PERMS workflows without permissions"
            exit 1
          else
            echo "✅ All workflows have permissions configured"
          fi

      - name: 🔍 ハードコードされたシークレットのチェック
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          # Simple pattern matching for potential secrets
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              # Check for patterns that look like secrets (long alphanumeric strings)
              if grep -qE '[A-Za-z0-9]{40,}' "$workflow" && ! grep -q '${{ secrets.' "$workflow"; then
                echo "⚠️  Potential hardcoded secret in $(basename $workflow)"
                echo "   Please review and use GitHub Secrets instead"
              fi
            fi
          done
          echo "✅ Security scan complete"

      - name: 📌 アクションバージョン固定チェック
        run: |
          echo "📌 Checking action version pinning..."
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              # Check for unpinned actions (using @main, @master, @latest)
              if grep -qE 'uses:.*@(main|master|latest)' "$workflow"; then
                echo "⚠️  Unpinned action version in $(basename $workflow)"
                grep -n 'uses:.*@(main|master|latest)' "$workflow" || true
              fi
            fi
          done
          echo "✅ Action version check complete"

  # ====================================================================
  # Job 4: パフォーマンスとベストプラクティス検証
  # ====================================================================
  performance-validation:
    name: ⚡ 検証: パフォーマンス設定
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-discovery
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: ⏱️ タイムアウト設定チェック
        run: |
          echo "⏱️ Checking timeout configurations..."
          MISSING_TIMEOUT=0
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              # Extract job names and check for timeout-minutes
              JOB_COUNT=$(grep -c "^  [a-zA-Z].*:" "$workflow" || echo 0)
              TIMEOUT_COUNT=$(grep -c "timeout-minutes:" "$workflow" || echo 0)
              
              if [ $JOB_COUNT -gt 0 ] && [ $TIMEOUT_COUNT -eq 0 ]; then
                echo "⚠️  Missing timeout-minutes in $(basename $workflow)"
                MISSING_TIMEOUT=$((MISSING_TIMEOUT + 1))
              fi
            fi
          done
          
          if [ $MISSING_TIMEOUT -gt 0 ]; then
            echo "⚠️  Found $MISSING_TIMEOUT workflows without timeout settings"
          else
            echo "✅ All workflows have timeout configurations"
          fi

      - name: 🔄 並行実行制御チェック
        run: |
          echo "🔄 Checking concurrency control..."
          MISSING_CONCURRENCY=0
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              if ! grep -q "^concurrency:" "$workflow"; then
                echo "⚠️  Missing concurrency control in $(basename $workflow)"
                MISSING_CONCURRENCY=$((MISSING_CONCURRENCY + 1))
              fi
            fi
          done
          
          if [ $MISSING_CONCURRENCY -gt 0 ]; then
            echo "⚠️  Found $MISSING_CONCURRENCY workflows without concurrency control"
          else
            echo "✅ All workflows have concurrency control"
          fi

  # ====================================================================
  # Job 5: コンプライアンスレポート生成
  # ====================================================================
  compliance-report:
    name: 📊 レポート: コンプライアンス分析
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [workflow-discovery, naming-validation, security-validation, performance-validation]
    if: always()
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🔧 Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 依存関係インストール
        run: |
          npm install js-yaml

      - name: 📊 コンプライアンス分析実行
        id: analysis
        run: |
          if [ -f ".github/workflows/scripts/workflow-compliance-analyzer.js" ]; then
            node .github/workflows/scripts/workflow-compliance-analyzer.js > compliance-report.txt 2>&1
            cat compliance-report.txt
            
            # Extract compliance rate
            RATE=$(grep "Compliant:" compliance-report.txt | grep -oE '[0-9]+\.[0-9]+%' | tr -d '%')
            echo "compliance-rate=$RATE" >> $GITHUB_OUTPUT
            
            # Check against threshold
            if (( $(echo "$RATE < ${{ env.COMPLIANCE_THRESHOLD }}" | bc -l) )); then
              echo "❌ Compliance rate ($RATE%) is below threshold (${{ env.COMPLIANCE_THRESHOLD }}%)"
              exit 1
            else
              echo "✅ Compliance rate ($RATE%) meets threshold"
            fi
          else
            echo "⚠️  Compliance analyzer script not found"
          fi

      - name: 💬 PRコメント作成
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '## 🎯 GitHub Actions Workflow Compliance Report\n\n';
            
            if (fs.existsSync('compliance-report.txt')) {
              const content = fs.readFileSync('compliance-report.txt', 'utf8');
              report += '```\n' + content.substring(0, 3000) + '\n```\n';
            }
            
            report += '\n### 📋 Compliance Checklist\n';
            report += '- ✅ YAML Syntax Validation\n';
            report += '- ✅ File Naming Convention\n';
            report += '- ✅ Security Configuration\n';
            report += '- ✅ Performance Settings\n';
            report += '\n*Generated by Workflow Compliance Validator*';
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Workflow Compliance Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: 📤 レポートアーティファクトアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: |
            compliance-report.txt
            .github/workflows/scripts/workflow-compliance-report.json
          retention-days: 30

  # ====================================================================
  # Job 6: 最終ステータス
  # ====================================================================
  final-status:
    name: ✅ 最終: コンプライアンスステータス
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compliance-report]
    if: always()
    steps:
      - name: 📊 最終ステータス確認
        run: |
          echo "========================================"
          echo "  GitHub Actions Compliance Check"
          echo "========================================"
          
          if [ "${{ needs.compliance-report.result }}" == "success" ]; then
            echo "✅ All workflows are compliant!"
            echo "========================================"
            exit 0
          else
            echo "❌ Compliance issues detected"
            echo "Please review the compliance report"
            echo "========================================"
            exit 1
          fi