# ====================================================================
# 🔧 Reusable - Node.js Setup
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - 他ワークフローからの呼び出し
#
# 主な処理:
#   1. 🔧 Node.js環境セットアップ
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F527 Reusable - Node.js Setup"
'on':
  workflow_call:
    inputs:
      node-version:
        description: Node.jsのバージョン
        required: false
        type: string
        default: '18'
      install-dependencies:
        description: 依存関係をインストールするか
        required: false
        type: boolean
        default: true
      cache-dependencies:
        description: 依存関係をキャッシュするか
        required: false
        type: boolean
        default: true
jobs:
  setup:
    name: "\U0001F527 Node.js環境セットアップ"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 ソースコード取得"
        uses: actions/checkout@v4
      - name: "\U0001F527 Node.js ${{ inputs.node-version }}セットアップ"
        uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: '${{ inputs.cache-dependencies && ''npm'' || '''' }}'
      - name: "\U0001F4E6 依存関係インストール"
        if: inputs.install-dependencies
        run: npm ci
      - name: "\U0001F4CB 環境情報出力"
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Package.json exists: $(test -f package.json && echo 'Yes' || echo 'No')"
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
