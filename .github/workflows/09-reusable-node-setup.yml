name: 🔧 Reusable - Node.js Setup
"on":
  workflow_call:
    inputs:
      node-version:
        description: Node.jsのバージョン
        required: false
        type: string
        default: "18"
      install-dependencies:
        description: 依存関係をインストールするか
        required: false
        type: boolean
        default: true
      cache-dependencies:
        description: 依存関係をキャッシュするか
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      debug:
        description: デバッグモードを有効にする
        required: false
        default: "false"
        type: boolean
jobs:
  setup:
    name: 🔧 Node.js環境セットアップ
    runs-on: ubuntu-latest
    steps:
      - name: 📥 ソースコード取得
        uses: actions/checkout@v4
      - name: 🔧 Node.js ${{ inputs.node-version }}セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache-dependencies && 'npm' || '' }}
      - name: 📦 依存関係インストール
        if: inputs.install-dependencies
        run: npm ci
      - name: 📋 環境情報出力
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Package.json exists: $(test -f package.json && echo 'Yes' || echo 'No')"
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
