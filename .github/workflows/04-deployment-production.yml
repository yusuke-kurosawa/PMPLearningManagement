name: 🚀 Deployment - Production
"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: デバッグモードを有効にする
        required: false
        default: "false"
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: "🔧 ビルド: build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 ソースコード取得
        uses: actions/checkout@v4
      - name: 🔧 Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - name: 📦 依存関係インストール
        run: npm ci
      - name: 🏗️ ビルド実行
        run: npm run build:optimized
        env:
          NODE_ENV: production
      - name: ⚙️ GitHub Pages設定
        uses: actions/configure-pages@v4
      - name: 📤 アーティファクトアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    name: 🚀 本番デプロイ
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: 🚀 GitHub Pagesデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
