name: Weekly Claude Interaction Summary

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install @octokit/rest

      - name: Generate Claude Interaction Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          node scripts/claude-interaction-analyzer.js

      - name: Create Summary Issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the generated report
            const reportPath = path.join(process.cwd(), 'docs', 'claude-interaction-analysis.md');
            let reportContent = '';
            
            try {
              reportContent = fs.readFileSync(reportPath, 'utf8');
            } catch (error) {
              console.log('No report found, generating basic summary...');
              reportContent = `# Weekly Claude Interaction Summary
              
              No detailed analysis available. Run the analyzer to generate insights.
              
              Generated: ${new Date().toISOString()}`;
            }

            // Get date range for the title
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const dateRange = `${weekAgo.toISOString().split('T')[0]} to ${today.toISOString().split('T')[0]}`;

            const issueBody = `## 📊 Weekly Claude Code Interaction Summary

            **Period:** ${dateRange}
            **Generated:** ${today.toISOString()}

            ${reportContent}

            ---

            ### 🔧 Actions Available
            - 📈 [View Full Analytics](../docs/claude-interaction-analysis.md)
            - 🔍 [Search Claude Issues](../issues?q=is%3Aissue+label%3Aclaude-code)
            - ⚙️ [Manage Automation](../actions)

            ### 📋 Quick Links
            - [Create Manual Log](../issues/new?template=claude-interaction.yml)
            - [Run Analysis](../actions/workflows/weekly-claude-summary.yml)
            - [View Trends](../pulse)

            *This summary is automatically generated every Monday. For real-time insights, run the analyzer manually.*`;

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Claude Summary (${dateRange})`,
              body: issueBody,
              labels: ['claude-code', 'automated', 'summary', 'weekly-report']
            });

            console.log(`Created weekly summary issue #${response.data.number}`);

      - name: Commit analysis results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -f "docs/claude-interaction-analysis.md" ]; then
            git add docs/claude-interaction-analysis.md
            git commit -m "📊 Update Claude interaction analysis [automated]" || echo "No changes to commit"
            git push || echo "Nothing to push"
          fi
