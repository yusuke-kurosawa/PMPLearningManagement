        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📋 週次DevOpsレポートIssueを作成中..."
          
          WEEK_NUMBER=$(date +%U)
          ISSUE_TITLE="📊 DevOps週次分析レポート - Week ${WEEK_NUMBER} ($(date +%Y))"
          
          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body-file devops_comprehensive_report.md \
            --label "devops,analytics,weekly-report,dashboard" || {
            echo "⚠️ Issue作成に失敗しました（既存の可能性あり）"
