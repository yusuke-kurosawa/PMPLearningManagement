# ====================================================================
# ⚖️ Balanced CI Pipeline
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - プルリクエスト作成・更新時
#   - 手動実行
#
# 主な処理:
#   1. 🔄 統合品質・ビルドチェック
#   2. 🤖 Claude統合セキュリティスキャン
#   3. 📊 バランス型CI結果統合
#   4. ✅ バランス型CI成功
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: ⚖️ Balanced CI Pipeline
'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      workflow-type:
        description: 実行するワークフローの種類
        required: false
        type: choice
        options:
          - full
          - quality
          - build
          - security
        default: full
      skip-tests:
        description: テストをスキップする
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  security-events: write
env:
  NODE_VERSION: '20'
  CACHE_VERSION: v2
jobs:
  quality-build-check:
    name: "\U0001F504 統合品質・ビルドチェック"
    uses: ./.github/workflows/00-reusable-workflows.yml
    with:
      workflow-type: full
      node-version: '20'
      skip-tests: '${{ github.event.inputs.skip-tests == ''true'' }}'
    timeout-minutes: 30
  security-scan:
    name: "\U0001F916 Claude統合セキュリティスキャン"
    uses: ./.github/workflows/00-reusable-workflows.yml
    needs: quality-build-check
    with:
      workflow-type: security
      node-version: '20'
      skip-tests: true
    timeout-minutes: 30
  balanced-ci-summary:
    name: "\U0001F4CA バランス型CI結果統合"
    runs-on: ubuntu-latest
    needs:
      - quality-build-check
      - security-scan
    if: always()
    steps:
      - name: "\U0001F4CB 実行結果の分析"
        id: analysis
        run: "echo \"## ⚖️ Balanced CI Pipeline 実行結果\"\necho \"\"\necho \"### \U0001F3AF ジョブ実行状況\"\necho \"- 品質・ビルドチェック: ${{ needs.quality-build-check.result }}\"\necho \"- セキュリティスキャン: ${{ needs.security-scan.result }}\"\necho \"\"\n\n# 成功判定\nif [[ \"${{ needs.quality-build-check.result }}\" == \"success\" && \"${{ needs.security-scan.result }}\" == \"success\" ]]; then\n  echo \"overall_status=success\" >> $GITHUB_OUTPUT\n  echo \"### ✅ 全体ステータス: 成功\"\n  echo \"すべてのチェックが正常に完了しました。\"\n  echo \"\"\n  echo \"**✨ 達成項目:**\"\n  echo \"- ✅ コード品質チェック\"\n  echo \"- ✅ ユニットテスト実行\"\n  echo \"- ✅ プロダクションビルド\"\n  echo \"- ✅ セキュリティスキャン\"\n  echo \"- ✅ PRマージ準備完了\"\nelse\n  echo \"overall_status=failure\" >> $GITHUB_OUTPUT\n  echo \"### ⚠️ 全体ステータス: 要確認\"\n  echo \"一部のチェックで問題が検出されました。\"\nfi\n"
      - name: "\U0001F389 成功時の追加処理"
        if: steps.analysis.outputs.overall_status == 'success'
        run: "echo \"\U0001F680 バランス型CI/CDパイプライン完了\"\necho \"品質・セキュリティ・パフォーマンスのバランスが確保されています。\"\n"
      - name: ⚠️ 失敗時の詳細レポート
        if: steps.analysis.outputs.overall_status == 'failure'
        run: "echo \"\U0001F50D 失敗詳細:\"\necho \"- 品質チェック結果: ${{ needs.quality-build-check.result }}\"\necho \"- セキュリティ結果: ${{ needs.security-scan.result }}\"\necho \"\"\necho \"詳細は各ジョブのログを確認してください。\"\n"
    timeout-minutes: 30
  balanced-ci-success:
    name: ✅ バランス型CI成功
    runs-on: ubuntu-latest
    needs: balanced-ci-summary
    if: needs.balanced-ci-summary.result == 'success'
    steps:
      - name: "\U0001F3C6 最終成功確認"
        run: "echo \"\U0001F3AF バランス型CI/CDパイプライン完全成功\"\necho \"Repository Rulesetsの要求を満たしています。\"\n"
    timeout-minutes: 30
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
