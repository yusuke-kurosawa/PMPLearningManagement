name: 📦 CI/CD - Minimal Status Check
"on":
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: デバッグモードを有効にする
        required: false
        default: "false"
        type: boolean
jobs:
  minimal-status-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Check passed"
    timeout-minutes: 30
    name: "🔧 チェック: minimal-status-check"
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
