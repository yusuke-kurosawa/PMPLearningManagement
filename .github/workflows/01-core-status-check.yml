# ====================================================================
# 📦 CI/CD - Minimal Status Check
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - プルリクエスト作成・更新時
#   - 手動実行
#
# 主な処理:
#   1. ✓ チェック: minimal-status-check
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F4E6 CI/CD - Minimal Status Check"
'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: null
jobs:
  minimal-status-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Check passed"
    timeout-minutes: 30
    name: '✓ チェック: minimal-status-check'
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
