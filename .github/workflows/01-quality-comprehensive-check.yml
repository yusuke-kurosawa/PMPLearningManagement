# ====================================================================
# 🎯 包括的品質チェック / Comprehensive Quality Check
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - コードプッシュ時
#   - プルリクエスト作成・更新時
#   - スケジュール実行
#   - 手動実行
#
# 主な処理:
#   1. 🔍 品質チェック / Quality Check
#   2. 📊 レポート生成 / Generate Report
#   3. 📌 処理: 🔧 自動修正 / Auto Fix
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F3AF 包括的品質チェック / Comprehensive Quality Check"
'on':
  push:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - src/**
      - public/**
      - scripts/**
      - package.json
      - .github/workflows/01-quality-*.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - src/**
      - public/**
      - scripts/**
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      check-type:
        description: チェックタイプ / Check type
        required: false
        default: all
        type: choice
        options:
          - all
          - pmbok
          - content
          - accessibility
          - japanese
      fail-on-error:
        description: エラー時に失敗させる / Fail on error
        required: false
        default: false
        type: boolean
      generate-report:
        description: レポート生成 / Generate report
        required: false
        default: true
        type: boolean
env:
  NODE_VERSION: '18'
  QUALITY_THRESHOLD: 80
  CACHE_VERSION: v1
concurrency:
  group: 'quality-check-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  quality-check:
    name: "\U0001F50D 品質チェック / Quality Check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pmbok-score: '${{ steps.quality.outputs.pmbok-score }}'
      content-score: '${{ steps.quality.outputs.content-score }}'
      accessibility-score: '${{ steps.quality.outputs.accessibility-score }}'
      japanese-score: '${{ steps.quality.outputs.japanese-score }}'
      overall-score: '${{ steps.quality.outputs.overall-score }}'
      status: '${{ steps.evaluate.outputs.status }}'
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト / Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "\U0001F527 環境セットアップ / Setup Environment"
        uses: ./.github/actions/setup-environment
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache-key: 'quality-check-${{ env.CACHE_VERSION }}'
          install-dependencies: true
      - name: "\U0001F3AF 品質チェック実行 / Run Quality Checks"
        id: quality
        uses: ./.github/actions/quality-check
        with:
          check-type: '${{ github.event.inputs.check-type || ''all'' }}'
          fail-on-error: false
          generate-report: true
          upload-artifact: true
          threshold: '${{ env.QUALITY_THRESHOLD }}'
      - name: "\U0001F4CA 結果評価 / Evaluate Results"
        id: evaluate
        run: "echo \"==========================================\"\necho \"\U0001F4CA 品質チェック結果 / Quality Check Results\"\necho \"==========================================\"\n\n# スコア取得\nPMBOK=\"${{ steps.quality.outputs.pmbok-score }}\"\nCONTENT=\"${{ steps.quality.outputs.content-score }}\"\nACCESSIBILITY=\"${{ steps.quality.outputs.accessibility-score }}\"\nJAPANESE=\"${{ steps.quality.outputs.japanese-score }}\"\nOVERALL=\"${{ steps.quality.outputs.overall-score }}\"\nTHRESHOLD=\"${{ env.QUALITY_THRESHOLD }}\"\n\n# ステータス判定\nif [ \"$OVERALL\" -ge \"$THRESHOLD\" ]; then\n  STATUS=\"success\"\n  EMOJI=\"✅\"\n  MESSAGE=\"品質基準を満たしています\"\nelif [ \"$OVERALL\" -ge $((THRESHOLD - 10)) ]; then\n  STATUS=\"warning\"\n  EMOJI=\"⚠️\"\n  MESSAGE=\"品質基準に近づいています\"\nelse\n  STATUS=\"failure\"\n  EMOJI=\"❌\"\n  MESSAGE=\"品質基準を満たしていません\"\nfi\n\necho \"status=$STATUS\" >> $GITHUB_OUTPUT\necho \"emoji=$EMOJI\" >> $GITHUB_OUTPUT\necho \"message=$MESSAGE\" >> $GITHUB_OUTPUT\n\n# サマリー出力\ncat >> $GITHUB_STEP_SUMMARY <<EOF\n## $EMOJI 品質チェック結果\n\n**総合スコア**: ${OVERALL}% / ${THRESHOLD}% (閾値)\n**ステータス**: $MESSAGE\n\n### \U0001F4CA 詳細スコア\n\n| カテゴリ | スコア | 目標 | 状態 |\n|---------|--------|------|------|\n| PMBOK準拠 | ${PMBOK}% | 95% | $([ \"$PMBOK\" -ge 95 ] && echo \"✅\" || echo \"⚠️\") |\n| コンテンツ品質 | ${CONTENT}% | 90% | $([ \"$CONTENT\" -ge 90 ] && echo \"✅\" || echo \"⚠️\") |\n| アクセシビリティ | ${ACCESSIBILITY}% | 95% | $([ \"$ACCESSIBILITY\" -ge 95 ] && echo \"✅\" || echo \"⚠️\") |\n| 日本語品質 | ${JAPANESE}% | 90% | $([ \"$JAPANESE\" -ge 90 ] && echo \"✅\" || echo \"⚠️\") |\n\n### \U0001F517 関連リンク\n\n- [ワークフロー実行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- [コミット](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\nEOF\n"
      - name: "\U0001F4AC PRコメント追加 / Add PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: "const overall = '${{ steps.quality.outputs.overall-score }}';\nconst threshold = '${{ env.QUALITY_THRESHOLD }}';\nconst status = '${{ steps.evaluate.outputs.status }}';\nconst emoji = '${{ steps.evaluate.outputs.emoji }}';\n\nconst comment = `\n## ${emoji} 品質チェック結果\n\n**総合スコア**: ${overall}% / ${threshold}%\n\n<details>\n<summary>\U0001F4CA 詳細スコア</summary>\n\n| カテゴリ | スコア | 目標 |\n|---------|--------|------|\n| PMBOK準拠 | ${{ steps.quality.outputs.pmbok-score }}% | 95% |\n| コンテンツ品質 | ${{ steps.quality.outputs.content-score }}% | 90% |\n| アクセシビリティ | ${{ steps.quality.outputs.accessibility-score }}% | 95% |\n| 日本語品質 | ${{ steps.quality.outputs.japanese-score }}% | 90% |\n\n</details>\n\n${status === 'failure' ? '⚠️ **品質基準を満たしていません。改善が必要です。**' : ''}\n${status === 'warning' ? '\U0001F4DD **品質向上の余地があります。**' : ''}\n${status === 'success' ? '✅ **品質基準を満たしています！**' : ''}\n`;\n\n// 既存コメントを検索\nconst { data: comments } = await github.rest.issues.listComments({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  issue_number: context.issue.number,\n});\n\nconst botComment = comments.find(comment => \n  comment.user.type === 'Bot' && \n  comment.body.includes('品質チェック結果')\n);\n\nif (botComment) {\n  // 既存コメントを更新\n  await github.rest.issues.updateComment({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    comment_id: botComment.id,\n    body: comment\n  });\n} else {\n  // 新規コメントを作成\n  await github.rest.issues.createComment({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number: context.issue.number,\n    body: comment\n  });\n}\n"
  generate-report:
    name: "\U0001F4CA レポート生成 / Generate Report"
    runs-on: ubuntu-latest
    needs: quality-check
    if: always() && (github.event.inputs.generate-report != 'false')
    timeout-minutes: 15
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト / Checkout Repository"
        uses: actions/checkout@v4
      - name: "\U0001F527 環境セットアップ / Setup Environment"
        uses: ./.github/actions/setup-environment
        with:
          node-version: '${{ env.NODE_VERSION }}'
          install-dependencies: false
      - name: "\U0001F4CA レポート生成 / Generate Report"
        uses: ./.github/actions/report-generator
        with:
          report-type: quality
          output-format: all
          upload-artifact: true
          include-trends: true
          comparison-days: 7
      - name: "\U0001F4E2 通知送信 / Send Notification"
        if: needs.quality-check.outputs.status == 'failure'
        uses: ./.github/actions/notification
        with:
          status: '${{ needs.quality-check.outputs.status }}'
          title: 品質チェック結果
          message: |
            品質スコアが基準を満たしていません。
            総合スコア: ${{ needs.quality-check.outputs.overall-score }}%
            PMBOK: ${{ needs.quality-check.outputs.pmbok-score }}%
            コンテンツ: ${{ needs.quality-check.outputs.content-score }}%
            アクセシビリティ: ${{ needs.quality-check.outputs.accessibility-score }}%
            日本語: ${{ needs.quality-check.outputs.japanese-score }}%
          notification-type: none
          create-issue: false
  auto-fix:
    name: "\U0001F4CC 処理: \U0001F527 自動修正 / Auto Fix"
    runs-on: ubuntu-latest
    needs: quality-check
    if: |
      always() && 
      needs.quality-check.outputs.status == 'failure' &&
      github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - name: "\U0001F4E5 リポジトリチェックアウト / Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: '${{ github.head_ref }}'
      - name: "\U0001F527 環境セットアップ / Setup Environment"
        uses: ./.github/actions/setup-environment
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: "\U0001F527 自動修正実行 / Run Auto Fix"
        id: auto-fix
        run: "echo \"\U0001F527 Running auto-fix scripts...\"\n\n# アクセシビリティ修正\nif [ -f \"scripts/fix-accessibility-violations.js\" ]; then\n  echo \"♿ Fixing accessibility issues...\"\n  node scripts/fix-accessibility-violations.js || true\nfi\n\n# コード整形\necho \"\U0001F4DD Formatting code...\"\nnpm run format || true\n\n# リント修正\necho \"\U0001F50D Fixing lint issues...\"\nnpm run lint:fix || true\n\n# 変更確認\nif git diff --quiet; then\n  echo \"No changes made by auto-fix\"\n  echo \"changes=false\" >> $GITHUB_OUTPUT\nelse\n  echo \"Changes made by auto-fix\"\n  echo \"changes=true\" >> $GITHUB_OUTPUT\nfi\n"
      - name: "\U0001F4DD 変更をコミット / Commit Changes"
        if: steps.auto-fix.outputs.changes == 'true'
        run: "git config --local user.email \"action@github.com\"\ngit config --local user.name \"GitHub Action\"\ngit add -A\ngit commit -m \"\U0001F527 自動修正: 品質問題を修正 / Auto-fix: Fix quality issues\"\ngit push\n"
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
