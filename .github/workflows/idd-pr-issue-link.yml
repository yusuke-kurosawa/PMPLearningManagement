name: IDD PR-Issue Auto Link
# PR作成時のIssue自動リンクワークフロー

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  link-issue:
    runs-on: ubuntu-latest
    name: Auto Link Issues to PR
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Link Issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            
            const title = pr.title;
            const body = pr.body || '';
            const branch = pr.head.ref;
            
            // Issue番号を抽出（#123形式）
            const issuePattern = /#(\d+)/g;
            const issueNumbers = new Set();
            
            // タイトル、本文、ブランチ名から抽出
            const sources = [title, body, branch];
            sources.forEach(source => {
              const matches = source.matchAll(issuePattern);
              for (const match of matches) {
                issueNumbers.add(match[1]);
              }
            });
            
            // Closes, Fixes, Resolves キーワードがない場合の処理
            const linkedIssues = Array.from(issueNumbers);
            if (linkedIssues.length === 0) {
              console.log('No issues found to link');
              return;
            }
            
            // PR本文を解析して既にリンクされているIssueを確認
            const linkKeywords = ['closes', 'fixes', 'resolves', 'close', 'fix', 'resolve'];
            const alreadyLinked = new Set();
            
            linkKeywords.forEach(keyword => {
              const regex = new RegExp(`${keyword}\\s+#(\\d+)`, 'gi');
              const matches = body.matchAll(regex);
              for (const match of matches) {
                alreadyLinked.add(match[1]);
              }
            });
            
            // 未リンクのIssueを特定
            const unlinkedIssues = linkedIssues.filter(num => !alreadyLinked.has(num));
            
            if (unlinkedIssues.length === 0) {
              console.log('All issues are already linked');
              return;
            }
            
            // Issue情報を取得して本文を更新
            let updatedBody = body;
            let issueSection = '\n\n## 🔗 関連Issue\n\n';
            
            for (const issueNum of unlinkedIssues) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum)
                });
                
                if (issue.data) {
                  // PRのタイトルやコミットメッセージから判断して適切なキーワードを選択
                  let linkKeyword = 'Related to';
                  if (title.toLowerCase().includes('fix') || title.toLowerCase().includes('修正')) {
                    linkKeyword = 'Fixes';
                  } else if (title.toLowerCase().includes('close') || title.toLowerCase().includes('完了')) {
                    linkKeyword = 'Closes';
                  }
                  
                  issueSection += `- ${linkKeyword} #${issueNum} - ${issue.data.title}\n`;
                }
              } catch (error) {
                console.log(`Issue #${issueNum} not found or inaccessible`);
              }
            }
            
            if (issueSection !== '\n\n## 🔗 関連Issue\n\n') {
              updatedBody += issueSection;
              
              // PR本文を更新
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: updatedBody
              });
              
              console.log(`Linked issues: ${unlinkedIssues.join(', ')}`);
            }

      - name: Check IDD Compliance
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const body = pr.body || '';
            const branch = pr.head.ref;
            
            // Issue番号が含まれているかチェック
            const hasIssueRef = /#\d+/.test(title) || /#\d+/.test(body) || /\d+/.test(branch);
            
            if (!hasIssueRef) {
              // 警告コメントを追加
              const warningComment = `
## ⚠️ IDD準拠チェック

このPRにはIssue参照が見つかりませんでした。

### 📋 IDD (Issue-Driven Development) について

本プロジェクトではIssue-Driven Developmentを採用しています。
すべての変更は対応するIssueと関連付ける必要があります。

### 🔧 修正方法

1. **新しいIssueを作成する**
   - [Issue作成ページ](../../issues/new/choose)から適切なテンプレートを選択
   - 変更内容を説明するIssueを作成

2. **PR本文を更新する**
   - \`Closes #[Issue番号]\` - Issueを自動クローズする場合
   - \`Related to #[Issue番号]\` - 関連するIssueを参照する場合

3. **ブランチ名を修正する**（新規PRの場合）
   - \`feature/123-add-new-feature\` のような形式を使用

---
*このメッセージは自動生成されています。詳細は[IDD実装ガイド](../../docs/idd/IDD_IMPLEMENTATION_STATUS.md)を参照してください。*
              `;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: warningComment
              });
              
              // ラベルを追加
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['IDD:要対応']
              });
            } else {
              // IDD準拠ラベルを追加
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['IDD:準拠']
              });
            }