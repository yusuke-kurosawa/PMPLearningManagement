# ================================================================
# 🔧 再利用可能ワークフロー: Node.js環境セットアップ
# ================================================================
# 目的: Node.js環境のセットアップを標準化
# 使用方法: 他のワークフローから呼び出して使用
# ================================================================

name: '🔧 Reusable - Node.js Setup'

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.jsのバージョン'
        required: false
        type: string
        default: '18'
      install-dependencies:
        description: '依存関係をインストールするか'
        required: false
        type: boolean
        default: true
      cache-dependencies:
        description: '依存関係をキャッシュするか'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: '🔧 Node.js環境セットアップ'
    runs-on: ubuntu-latest
    
    steps:
      # ステップ: ソースコードのチェックアウト
      - name: '📥 ソースコード取得'
        uses: actions/checkout@v4
        
      # ステップ: Node.js環境セットアップ
      - name: '🔧 Node.js ${{ inputs.node-version }}セットアップ'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache-dependencies && 'npm' || '' }}
          
      # ステップ: 依存関係インストール（オプション）
      - name: '📦 依存関係インストール'
        if: inputs.install-dependencies
        run: npm ci
        
      # ステップ: バージョン情報出力
      - name: '📋 環境情報出力'
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Package.json exists: $(test -f package.json && echo 'Yes' || echo 'No')"