# ====================================================================
# 🎯 [Meta] Workflow Validator & Optimizer / ワークフロー検証・最適化
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - コードプッシュ時
#   - プルリクエスト作成・更新時
#   - 手動実行
#   - スケジュール実行
#
# 主な処理:
#   1. 📌 処理: 🔍 [Discovery] Workflow Inventory
#   2. ✔️ 検証: ✅ [Validation] Syntax Check
#   3. 🔒 セキュリティ: 🔒 [Validation] Security Check
#   4. ⚖️ コンプライアンス: 📐 [Standards] Compliance Check
#   5. ✔️ 検証: 📋 [Summary] Validation Results
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F3AF [Meta] Workflow Validator & Optimizer / ワークフロー検証・最適化"
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
'on':
  push:
    paths:
      - .github/workflows/**
      - .github/claude-code-actions/**
    branches:
      - main
      - develop
  pull_request:
    paths:
      - .github/workflows/**
      - .github/claude-code-actions/**
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      validation_type:
        description: Validation type / 検証タイプ
        required: true
        default: full
        type: choice
        options:
          - full
          - syntax
          - security
          - performance
          - dependencies
      auto_fix:
        description: Auto-fix issues / 自動修正
        required: true
        default: true
        type: boolean
  schedule:
    - cron: 0 1 * * 0
env:
  WORKFLOW_STANDARDS_VERSION: 1.0.0
  MAX_WORKFLOW_RUNTIME: 60
  REQUIRED_COMMENT_COVERAGE: 90
jobs:
  workflow-discovery:
    name: "\U0001F4CC 処理: \U0001F50D [Discovery] Workflow Inventory"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workflow_count: '${{ steps.inventory.outputs.workflow_count }}'
      workflow_list: '${{ steps.inventory.outputs.workflow_list }}'
      validation_needed: '${{ steps.inventory.outputs.validation_needed }}'
      categories_found: '${{ steps.inventory.outputs.categories_found }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: '${{ github.token }}'
      - name: "\U0001F4CB Create Workflow Inventory"
        id: inventory
        run: "echo \"\U0001F50D Discovering workflow files...\"\n\n# ワークフロー発見\nworkflows_dir=\".github/workflows\"\nclaude_actions_dir=\".github/claude-code-actions\"\n\n# 通常ワークフロー\nworkflow_files=\"\"\nworkflow_count=0\n\nif [[ -d \"$workflows_dir\" ]]; then\n  while IFS= read -r -d '' file; do\n    if [[ -f \"$file\" ]]; then\n      workflow_files=\"$workflow_files $file\"\n      workflow_count=$((workflow_count + 1))\n    fi\n  done < <(find \"$workflows_dir\" -name \"*.yml\" -o -name \"*.yaml\" -print0)\nfi\n\n# ClaudeCodeActions\nif [[ -d \"$claude_actions_dir\" ]]; then\n  while IFS= read -r -d '' file; do\n    if [[ -f \"$file\" ]]; then\n      workflow_files=\"$workflow_files $file\"\n      workflow_count=$((workflow_count + 1))\n    fi\n  done < <(find \"$claude_actions_dir\" -name \"*.yml\" -o -name \"*.yaml\" -print0)\nfi\n\necho \"\U0001F4CA Found $workflow_count workflow files\"\necho \"workflow_count=$workflow_count\" >> $GITHUB_OUTPUT\necho \"workflow_list=$workflow_files\" >> $GITHUB_OUTPUT\n\n# 検証必要性の判定\nif [[ $workflow_count -gt 0 ]]; then\n  echo \"validation_needed=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"validation_needed=false\" >> $GITHUB_OUTPUT\nfi\n\n# カテゴリ分類\ncategories=\"\"\nfor file in $workflow_files; do\n  filename=$(basename \"$file\")\n  case \"$filename\" in\n    00-meta-*) categories=\"$categories meta\" ;;\n    01-ci-*) categories=\"$categories ci\" ;;\n    02-cd-*) categories=\"$categories cd\" ;;\n    03-quality-*) categories=\"$categories quality\" ;;\n    04-security-*) categories=\"$categories security\" ;;\n    05-performance-*) categories=\"$categories performance\" ;;\n    06-claude-*) categories=\"$categories claude\" ;;\n    07-self-*) categories=\"$categories self\" ;;\n    *) categories=\"$categories uncategorized\" ;;\n  esac\ndone\n\nunique_categories=$(echo \"$categories\" | tr ' ' '\\n' | sort -u | tr '\\n' ' ')\necho \"categories_found=$unique_categories\" >> $GITHUB_OUTPUT\necho \"\U0001F4CB Categories found: $unique_categories\"\n"
      - name: "\U0001F5FA️ Generate Workflow Map"
        run: "echo \"\U0001F5FA️ Generating workflow dependency map...\"\n\nmkdir -p .meta-analysis\n\ncat > .meta-analysis/workflow-map.md << EOF\n# \U0001F3AF Workflow Architecture Map\n\n## \U0001F4CA Summary / サマリー\n- **Total Workflows**: ${{ steps.inventory.outputs.workflow_count }}\n- **Categories**: ${{ steps.inventory.outputs.categories_found }}\n- **Analysis Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n## \U0001F3D7️ Workflow Structure / ワークフロー構造\nEOF\n\n# ワークフローリスト追加\nfor file in ${{ steps.inventory.outputs.workflow_list }}; do\n  echo \"- **$(basename \"$file\")**\" >> .meta-analysis/workflow-map.md\n  if [[ -f \"$file\" ]]; then\n    # 目的の抽出\n    purpose=$(grep -m1 \"^# Purpose:\" \"$file\" | sed 's/^# Purpose: //' || echo \"目的未記載\")\n    echo \"  - Purpose: $purpose\" >> .meta-analysis/workflow-map.md\n  fi\ndone\n"
  syntax-validation:
    name: '✔️ 検証: ✅ [Validation] Syntax Check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workflow-discovery
    if: needs.workflow-discovery.outputs.validation_needed == 'true'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "\U0001F4DD YAML Syntax Validation"
        run: "echo \"\U0001F4DD Validating YAML syntax...\"\n\nvalidation_errors=0\nvalidation_warnings=0\n\n# yamllintインストール\npip install yamllint\n\n# 各ワークフローファイルを検証\nfor file in ${{ needs.workflow-discovery.outputs.workflow_list }}; do\n  if [[ -f \"$file\" ]]; then\n    echo \"\U0001F50D Validating: $file\"\n    \n    # YAML構文チェック\n    if ! yamllint \"$file\" 2>/dev/null; then\n      echo \"❌ Syntax error in: $file\"\n      validation_errors=$((validation_errors + 1))\n    else\n      echo \"✅ Valid syntax: $file\"\n    fi\n  fi\ndone\n\necho \"validation_errors=$validation_errors\" >> $GITHUB_OUTPUT\necho \"validation_warnings=$validation_warnings\" >> $GITHUB_OUTPUT\n\nif [[ $validation_errors -gt 0 ]]; then\n  echo \"❌ Found $validation_errors syntax errors\"\n  exit 1\nelse\n  echo \"✅ All workflow files have valid syntax\"\nfi\n"
        id: yaml-validation
      - name: "\U0001F50D GitHub Actions Schema Validation"
        run: "echo \"\U0001F50D Validating GitHub Actions schema...\"\n\n# action-validatorインストール（npmベース）\nnpm install -g @github/action-validator 2>/dev/null || echo \"Action validator not available\"\n\nschema_errors=0\n\nfor file in ${{ needs.workflow-discovery.outputs.workflow_list }}; do\n  if [[ -f \"$file\" ]]; then\n    echo \"\U0001F4CB Schema check: $file\"\n    \n    # 基本的なGitHub Actions構造チェック\n    if ! grep -q \"^name:\" \"$file\"; then\n      echo \"⚠️ Missing 'name' field in: $file\"\n      schema_errors=$((schema_errors + 1))\n    fi\n    \n    if ! grep -q \"^on:\" \"$file\"; then\n      echo \"⚠️ Missing 'on' field in: $file\"\n      schema_errors=$((schema_errors + 1))\n    fi\n    \n    if ! grep -q \"^jobs:\" \"$file\"; then\n      echo \"⚠️ Missing 'jobs' field in: $file\"\n      schema_errors=$((schema_errors + 1))\n    fi\n  fi\ndone\n\necho \"schema_errors=$schema_errors\" >> $GITHUB_OUTPUT\n\nif [[ $schema_errors -gt 0 ]]; then\n  echo \"⚠️ Found $schema_errors schema issues\"\nelse\n  echo \"✅ All workflows conform to GitHub Actions schema\"\nfi\n"
        id: schema-validation
  security-validation:
    name: "\U0001F512 セキュリティ: \U0001F512 [Validation] Security Check"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: workflow-discovery
    if: needs.workflow-discovery.outputs.validation_needed == 'true'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "\U0001F510 Analyze Workflow Permissions"
        run: "echo \"\U0001F510 Analyzing workflow permissions...\"\n\npermission_violations=0\n\nfor file in ${{ needs.workflow-discovery.outputs.workflow_list }}; do\n  if [[ -f \"$file\" ]]; then\n    echo \"\U0001F50D Checking permissions: $file\"\n    \n    # 権限設定の存在確認\n    if ! grep -q \"permissions:\" \"$file\"; then\n      echo \"⚠️ No permission settings in: $file\"\n      permission_violations=$((permission_violations + 1))\n    else\n      # 過度な権限チェック\n      if grep -q \"permissions:.*write-all\" \"$file\"; then\n        echo \"❌ Excessive permissions (write-all) in: $file\"\n        permission_violations=$((permission_violations + 1))\n      fi\n    fi\n    \n    # シークレット使用の確認\n    if grep -q \"secrets\\.\" \"$file\"; then\n      echo \"\U0001F511 Secret usage detected in: $file\"\n      # ハードコードされたシークレット検査\n      if grep -E \"password|token|key|secret\" \"$file\" | grep -v \"secrets\\.\"; then\n        echo \"❌ Potential hardcoded secret in: $file\"\n        permission_violations=$((permission_violations + 1))\n      fi\n    fi\n  fi\ndone\n\necho \"permission_violations=$permission_violations\" >> $GITHUB_OUTPUT\n\nif [[ $permission_violations -gt 0 ]]; then\n  echo \"❌ Found $permission_violations security violations\"\nelse\n  echo \"✅ No security violations detected\"\nfi\n"
        id: permission-analysis
      - name: "\U0001F6E1️ Validate Third-party Actions"
        run: "echo \"\U0001F6E1️ Validating third-party actions...\"\n\naction_security_issues=0\n\nfor file in ${{ needs.workflow-discovery.outputs.workflow_list }}; do\n  if [[ -f \"$file\" ]]; then\n    echo \"\U0001F50D Checking actions: $file\"\n    \n    # サードパーティアクションの抽出\n    grep -n \"uses:\" \"$file\" | while read -r line; do\n      action=$(echo \"$line\" | sed 's/.*uses: *//' | sed 's/\\s*$//')\n      \n      # GitHubアクション以外をチェック\n      if [[ ! \"$action\" =~ ^actions/ ]] && [[ ! \"$action\" =~ ^github/ ]]; then\n        echo \"\U0001F50D Third-party action found: $action\"\n        \n        # バージョン固定チェック\n        if [[ ! \"$action\" =~ @[a-f0-9]{40}$ ]] && [[ ! \"$action\" =~ @v[0-9]+$ ]]; then\n          echo \"⚠️ Action not pinned to specific version: $action\"\n          action_security_issues=$((action_security_issues + 1))\n        fi\n      fi\n    done\n  fi\ndone\n\necho \"action_security_issues=$action_security_issues\" >> $GITHUB_OUTPUT\necho \"✅ Third-party action security check completed\"\n"
        id: action-security
  standards-compliance:
    name: "⚖️ コンプライアンス: \U0001F4D0 [Standards] Compliance Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workflow-discovery
    if: needs.workflow-discovery.outputs.validation_needed == 'true'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "\U0001F4AC Check Comment Coverage"
        run: "echo \"\U0001F4AC Checking comment coverage...\"\n\ncomment_violations=0\n\nfor file in ${{ needs.workflow-discovery.outputs.workflow_list }}; do\n  if [[ -f \"$file\" ]]; then\n    echo \"\U0001F50D Analyzing comments: $file\"\n    \n    total_lines=$(wc -l < \"$file\")\n    comment_lines=$(grep -c \"^#\" \"$file\" || echo \"0\")\n    \n    if [[ $total_lines -gt 0 ]]; then\n      comment_coverage=$(( comment_lines * 100 / total_lines ))\n      echo \"\U0001F4CA Comment coverage: ${comment_coverage}% in $file\"\n      \n      if [[ $comment_coverage -lt ${{ env.REQUIRED_COMMENT_COVERAGE }} ]]; then\n        echo \"⚠️ Low comment coverage (${comment_coverage}%) in: $file\"\n        comment_violations=$((comment_violations + 1))\n      fi\n    fi\n    \n    # 必須ヘッダーコメントチェック\n    if ! grep -q \"# =================================\" \"$file\"; then\n      echo \"⚠️ Missing standard header comment in: $file\"\n      comment_violations=$((comment_violations + 1))\n    fi\n  fi\ndone\n\necho \"comment_violations=$comment_violations\" >> $GITHUB_OUTPUT\necho \"\U0001F4CB Comment coverage analysis completed\"\n"
        id: comment-check
      - name: "\U0001F4DB Check Naming Conventions"
        run: "echo \"\U0001F4DB Checking naming conventions...\"\n\nnaming_violations=0\n\nfor file in ${{ needs.workflow-discovery.outputs.workflow_list }}; do\n  filename=$(basename \"$file\")\n  echo \"\U0001F50D Checking naming: $filename\"\n  \n  # カテゴリ別命名規則チェック\n  if [[ \"$filename\" =~ ^[0-9]{2}-[a-z]+-[a-z-]+\\.ya?ml$ ]]; then\n    echo \"✅ Naming convention compliant: $filename\"\n  else\n    echo \"⚠️ Naming convention violation: $filename\"\n    naming_violations=$((naming_violations + 1))\n  fi\n  \n  # ワークフロー名の確認（絵文字付き）\n  if [[ -f \"$file\" ]]; then\n    workflow_name=$(grep -m1 \"^name:\" \"$file\" | sed 's/^name: *//' | tr -d '\"')\n    if [[ ! \"$workflow_name\" =~ ^[\U0001F3AF\U0001F504\U0001F680✅\U0001F512⚡\U0001F916\U0001F527] ]]; then\n      echo \"⚠️ Missing emoji in workflow name: $workflow_name\"\n      naming_violations=$((naming_violations + 1))\n    fi\n  fi\ndone\n\necho \"naming_violations=$naming_violations\" >> $GITHUB_OUTPUT\necho \"\U0001F4DB Naming convention check completed\"\n"
        id: naming-check
  meta-validation-summary:
    name: "✔️ 検証: \U0001F4CB [Summary] Validation Results"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - workflow-discovery
      - syntax-validation
      - security-validation
      - standards-compliance
    if: always()
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "\U0001F4CB Generate Validation Report"
        run: "echo \"\U0001F4CB Generating comprehensive validation report...\"\n\nmkdir -p .meta-analysis\n\ncat > .meta-analysis/validation-report.md << EOF\n# \U0001F3AF Meta Workflow Validation Report\n\n## \U0001F4CA Validation Summary / 検証サマリー\n\n- **Workflows Analyzed**: ${{ needs.workflow-discovery.outputs.workflow_count }}\n- **Categories Found**: ${{ needs.workflow-discovery.outputs.categories_found }}\n- **Analysis Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n## \U0001F50D Validation Results / 検証結果\n\n### ✅ Syntax Validation / 構文検証\n- **Status**: ${{ needs.syntax-validation.result }}\n- **Errors Found**: ${{ needs.syntax-validation.outputs.validation_errors || '0' }}\n- **Warnings**: ${{ needs.syntax-validation.outputs.validation_warnings || '0' }}\n\n### \U0001F512 Security Validation / セキュリティ検証  \n- **Status**: ${{ needs.security-validation.result }}\n- **Permission Violations**: ${{ needs.security-validation.outputs.permission_violations || '0' }}\n- **Action Security Issues**: ${{ needs.security-validation.outputs.action_security_issues || '0' }}\n\n### \U0001F4D0 Standards Compliance / 標準準拠\n- **Status**: ${{ needs.standards-compliance.result }}\n- **Comment Violations**: ${{ needs.standards-compliance.outputs.comment_violations || '0' }}\n- **Naming Violations**: ${{ needs.standards-compliance.outputs.naming_violations || '0' }}\n\n## \U0001F3AF Overall Quality Score / 総合品質スコア\n\nEOF\n\n# 品質スコア計算（簡易版）\ntotal_issues=0\ntotal_issues=$(( total_issues + ${SYNTAX_ERRORS:-0} ))\ntotal_issues=$(( total_issues + ${SECURITY_ISSUES:-0} ))\ntotal_issues=$(( total_issues + ${STANDARDS_ISSUES:-0} ))\n\nif [[ $total_issues -eq 0 ]]; then\n  quality_score=100\n  quality_status=\"\U0001F7E2 Excellent\"\nelif [[ $total_issues -le 5 ]]; then\n  quality_score=85\n  quality_status=\"\U0001F7E1 Good\"\nelse\n  quality_score=60\n  quality_status=\"\U0001F534 Needs Improvement\"\nfi\n\necho \"**Quality Score: ${quality_score}/100** ${quality_status}\" >> .meta-analysis/validation-report.md\n\necho \"## \U0001F680 Recommendations / 推奨事項\" >> .meta-analysis/validation-report.md\necho \"\" >> .meta-analysis/validation-report.md\n\nif [[ $total_issues -gt 0 ]]; then\n  echo \"1. **Address Critical Issues**: 重要な問題を優先的に修正\" >> .meta-analysis/validation-report.md\n  echo \"2. **Implement Auto-fixes**: 自動修正可能な問題を修正\" >> .meta-analysis/validation-report.md\n  echo \"3. **Review Security Settings**: セキュリティ設定を見直し\" >> .meta-analysis/validation-report.md\n  echo \"4. **Update Documentation**: ドキュメントの更新\" >> .meta-analysis/validation-report.md\nelse\n  echo \"✅ **All workflows are compliant with standards**\" >> .meta-analysis/validation-report.md\n  echo \"✅ **No immediate action required**\" >> .meta-analysis/validation-report.md\nfi\n\necho \"\" >> .meta-analysis/validation-report.md\necho \"---\" >> .meta-analysis/validation-report.md\necho \"*Generated by Meta Workflow Validator at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*\" >> .meta-analysis/validation-report.md\n"
        env:
          SYNTAX_ERRORS: '${{ needs.syntax-validation.outputs.validation_errors }}'
          SECURITY_ISSUES: '${{ needs.security-validation.outputs.permission_violations }}'
          STANDARDS_ISSUES: '${{ needs.standards-compliance.outputs.comment_violations }}'
      - name: "\U0001F4AC Post Validation Summary"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: '${{ github.token }}'
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('.meta-analysis/validation-report.md', 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
      - name: "\U0001F4E6 Upload Validation Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: 'meta-validation-results-${{ github.run_id }}'
          path: .meta-analysis/
          retention-days: 90
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
