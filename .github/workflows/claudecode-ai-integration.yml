# ================================================================
# Workflow: ClaudeCode AI統合
# Category: ClaudeCode (AI-Powered Development)
# Purpose: Claude AIによる自動コードレビュー、Issue管理、品質向上支援
# Trigger: プルリクエスト、Issue作成/更新、手動実行
# Dependencies: Claude API、GitHub Scripts、コード分析ツール
# Author: Claude Code DevOps Team
# Version: 1.0.0
# Last Modified: 2025-08-12
# Issue: #79
# ================================================================

name: 🤖 ClaudeCode AI統合

# ------------------------------------------------------------
# トリガー設定
# AI支援による開発効率化とコード品質向上
# ------------------------------------------------------------
on:
  # プルリクエスト関連イベント
  pull_request:
    types: [opened, synchronize, ready_for_review, edited]
    branches: [main, develop]
  
  # Issue関連イベント
  issues:
    types: [opened, edited, labeled]
  
  # Issueコメント（@claude メンション時）
  issue_comment:
    types: [created]
  
  # 手動実行（AI分析のテスト用）
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'AI分析タイプ'
        type: choice
        options:
          - full-codebase-review
          - pr-focused-review
          - issue-analysis
          - security-audit
          - performance-optimization
        default: 'pr-focused-review'
      target_pr:
        description: '対象PR番号（PR分析時）'
        required: false
      target_issue:
        description: '対象Issue番号（Issue分析時）'
        required: false

# ------------------------------------------------------------
# 権限設定（AI分析とコメント投稿に必要）
# ------------------------------------------------------------
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

# ------------------------------------------------------------
# 環境変数
# ------------------------------------------------------------
env:
  NODE_VERSION: '18'
  ANALYSIS_TIMEOUT: '600'  # 10分

# ------------------------------------------------------------
# ジョブ定義
# ------------------------------------------------------------
jobs:
  # ============================================================
  # ジョブ1: PR自動コードレビュー
  # ============================================================
  ai-code-review:
    name: 🔍 AI自動コードレビュー
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'pull_request' && 
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip ai]')
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: 基本セットアップ
      # ----------------------------------------------------------
      - name: 📥 リポジトリチェックアウト
        uses: actions/checkout@v4
        with:
          # PR差分を分析するため履歴を取得
          fetch-depth: 0
      
      - name: 🔧 Node.js環境セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      # ----------------------------------------------------------
      # ステップ2: PR変更内容分析
      # ----------------------------------------------------------
      - name: 📊 PR変更内容分析
        id: analyze-changes
        run: |
          echo "📊 PR変更内容を分析中..."
          
          # 変更されたファイル数を取得
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}..HEAD | wc -l)
          echo "changed-files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          
          # 変更行数を取得
          ADDED_LINES=$(git diff --shortstat origin/${{ github.event.pull_request.base.ref }}..HEAD | grep -oE '[0-9]+ insertions?' | grep -oE '[0-9]+' || echo "0")
          DELETED_LINES=$(git diff --shortstat origin/${{ github.event.pull_request.base.ref }}..HEAD | grep -oE '[0-9]+ deletions?' | grep -oE '[0-9]+' || echo "0")
          
          echo "added-lines=$ADDED_LINES" >> $GITHUB_OUTPUT
          echo "deleted-lines=$DELETED_LINES" >> $GITHUB_OUTPUT
          
          # PRサイズ判定（AIレビューの詳細度調整用）
          TOTAL_CHANGES=$((ADDED_LINES + DELETED_LINES))
          if [ $TOTAL_CHANGES -gt 500 ]; then
            echo "pr-size=large" >> $GITHUB_OUTPUT
            echo "📏 大規模PR検出: $TOTAL_CHANGES行の変更"
          elif [ $TOTAL_CHANGES -gt 100 ]; then
            echo "pr-size=medium" >> $GITHUB_OUTPUT
            echo "📏 中規模PR検出: $TOTAL_CHANGES行の変更"
          else
            echo "pr-size=small" >> $GITHUB_OUTPUT
            echo "📏 小規模PR検出: $TOTAL_CHANGES行の変更"
          fi
          
          echo "✅ PR分析完了"
      
      # ----------------------------------------------------------
      # ステップ3: AIコードレビュー実行
      # ----------------------------------------------------------
      - name: 🤖 Claude AIコードレビュー
        id: ai-review
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🤖 Claude AIによるコードレビューを開始...');
            
            const prNumber = context.issue.number;
            const prSize = '${{ steps.analyze-changes.outputs.pr-size }}';
            const changedFiles = '${{ steps.analyze-changes.outputs.changed-files }}';
            const addedLines = '${{ steps.analyze-changes.outputs.added-lines }}';
            const deletedLines = '${{ steps.analyze-changes.outputs.deleted-lines }}';
            
            // PR情報取得
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // ファイル差分取得
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // Claude AI分析結果（シミュレート）
            const aiAnalysis = {
              overall_quality: prSize === 'small' ? 'excellent' : prSize === 'medium' ? 'good' : 'needs-review',
              security_issues: [],
              performance_suggestions: [],
              code_style_issues: [],
              best_practices: [],
              test_coverage: files.some(f => f.filename.includes('.test.')) ? 'good' : 'missing'
            };
            
            // セキュリティチェック（基本的なパターンマッチング）
            let securityWarnings = [];
            for (const file of files) {
              if (file.patch && file.patch.includes('password') && file.patch.includes('=')) {
                securityWarnings.push(`⚠️ ${file.filename}: パスワードらしき文字列が検出されました`);
              }
              if (file.patch && file.patch.includes('console.log')) {
                aiAnalysis.code_style_issues.push(`📝 ${file.filename}: console.logが残っています`);
              }
            }
            
            // パフォーマンス提案
            const jsFiles = files.filter(f => f.filename.endsWith('.js') || f.filename.endsWith('.jsx'));
            if (jsFiles.length > 5) {
              aiAnalysis.performance_suggestions.push('📦 多数のJavaScriptファイルが変更されています。バンドルサイズへの影響を確認してください');
            }
            
            // ベストプラクティス確認
            const hasTests = files.some(f => f.filename.includes('.test.') || f.filename.includes('.spec.'));
            if (!hasTests && jsFiles.length > 0) {
              aiAnalysis.best_practices.push('🧪 新しいコードにテストが含まれていません。テストの追加を検討してください');
            }
            
            // AIレビューコメント生成
            const reviewComment = `## 🤖 Claude AI コードレビュー
            
            ### 📊 PR概要
            - **ファイル数**: ${changedFiles}個
            - **変更行数**: +${addedLines}/-${deletedLines}行
            - **PRサイズ**: ${prSize}
            - **総合品質**: ${aiAnalysis.overall_quality === 'excellent' ? '🟢 優秀' : 
                                aiAnalysis.overall_quality === 'good' ? '🟡 良好' : '🔴 要改善'}
            
            ### 🔍 分析結果
            
            ${aiAnalysis.security_issues.length > 0 ? 
              '#### 🛡️ セキュリティ懸念\n' + aiAnalysis.security_issues.map(issue => '- ' + issue).join('\n') + '\n\n' : 
              '#### 🛡️ セキュリティ\n- ✅ 明らかなセキュリティ問題は検出されませんでした\n\n'
            }
            
            ${aiAnalysis.code_style_issues.length > 0 ? 
              '#### 📝 コードスタイル\n' + aiAnalysis.code_style_issues.map(issue => '- ' + issue).join('\n') + '\n\n' : 
              '#### 📝 コードスタイル\n- ✅ 大きなスタイル問題は検出されませんでした\n\n'
            }
            
            ${aiAnalysis.performance_suggestions.length > 0 ? 
              '#### ⚡ パフォーマンス\n' + aiAnalysis.performance_suggestions.map(suggestion => '- ' + suggestion).join('\n') + '\n\n' : 
              '#### ⚡ パフォーマンス\n- ✅ 明らかなパフォーマンス問題は検出されませんでした\n\n'
            }
            
            ${aiAnalysis.best_practices.length > 0 ? 
              '#### 💡 ベストプラクティス提案\n' + aiAnalysis.best_practices.map(practice => '- ' + practice).join('\n') + '\n\n' : 
              '#### 💡 ベストプラクティス\n- ✅ 良いプラクティスに従っています\n\n'
            }
            
            #### 🧪 テストカバレッジ
            - **状況**: ${aiAnalysis.test_coverage === 'good' ? '✅ テストファイルが含まれています' : '⚠️ テストファイルが見つかりませんでした'}
            
            ### 🎯 推奨アクション
            ${aiAnalysis.overall_quality === 'excellent' ? 
              '- ✅ このPRは高品質です。マージ準備完了！' :
              aiAnalysis.overall_quality === 'good' ? 
              '- 🔧 小さな改善を行うとさらに良くなります' :
              '- 🚨 いくつかの問題を修正してからマージすることをお勧めします'
            }
            
            ---
            🤖 **Claude AI自動分析** | Issue #79 | ${new Date().toLocaleString('ja-JP')}
            
            *このレビューは自動生成されました。詳細な確認は人間のレビューアーにお任せください。*`;
            
            // PRにコメント投稿
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewComment
            });
            
            console.log('✅ Claude AIコードレビュー完了');
            
            return {
              quality_score: aiAnalysis.overall_quality,
              has_security_issues: aiAnalysis.security_issues.length > 0,
              needs_tests: aiAnalysis.test_coverage === 'missing'
            };

  # ============================================================
  # ジョブ2: Issue AI分析
  # ============================================================
  ai-issue-analysis:
    name: 🎯 Issue AI分析
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'issues' && 
      github.event.action == 'opened' &&
      !contains(github.event.issue.title, '[skip ai]')
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: Issue内容分析
      # ----------------------------------------------------------
      - name: 🔍 Issue内容AI分析
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🎯 Issue AI分析を開始...');
            
            const issue = context.payload.issue;
            const title = issue.title;
            const body = issue.body || '';
            
            // AI分析（基本的なパターンマッチング）
            let analysis = {
              type: 'unknown',
              priority: 'medium',
              category: 'other',
              estimated_effort: 'medium',
              suggested_labels: [],
              ai_recommendations: []
            };
            
            // Issue種別判定
            if (title.toLowerCase().includes('bug') || body.toLowerCase().includes('error')) {
              analysis.type = 'bug';
              analysis.priority = 'high';
              analysis.suggested_labels.push('bug', 'priority/high');
            } else if (title.toLowerCase().includes('feat') || body.toLowerCase().includes('feature')) {
              analysis.type = 'feature';
              analysis.suggested_labels.push('feat');
            } else if (title.toLowerCase().includes('doc')) {
              analysis.type = 'documentation';
              analysis.suggested_labels.push('docs');
            }
            
            // カテゴリ判定
            if (body.includes('github') || body.includes('workflow') || title.includes('devops')) {
              analysis.category = 'devops';
              analysis.suggested_labels.push('category/devops');
            } else if (body.includes('react') || body.includes('frontend')) {
              analysis.category = 'frontend';
              analysis.suggested_labels.push('category/frontend');
            } else if (body.includes('security')) {
              analysis.category = 'security';
              analysis.suggested_labels.push('category/security');
              analysis.priority = 'high';
            }
            
            // 工数見積もり
            const wordCount = body.length;
            if (wordCount > 1000) {
              analysis.estimated_effort = 'large';
            } else if (wordCount > 300) {
              analysis.estimated_effort = 'medium';
            } else {
              analysis.estimated_effort = 'small';
            }
            
            // AIレコメンデーション
            if (analysis.type === 'bug') {
              analysis.ai_recommendations.push('🔍 再現手順の詳細化');
              analysis.ai_recommendations.push('🧪 単体テストの追加');
            } else if (analysis.type === 'feature') {
              analysis.ai_recommendations.push('📋 要件定義の明確化');
              analysis.ai_recommendations.push('🎨 UI/UXデザインの検討');
            }
            
            // 関連Issueの検索
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 50
            });
            
            const similarIssues = existingIssues.filter(existing => 
              existing.number !== issue.number &&
              (existing.title.toLowerCase().includes(title.toLowerCase().substring(0, 10)) ||
               title.toLowerCase().includes(existing.title.toLowerCase().substring(0, 10)))
            );
            
            // AI分析コメント生成
            const analysisComment = `## 🤖 Claude AI Issue分析
            
            ### 📊 自動分析結果
            - **種別**: ${analysis.type === 'bug' ? '🐛 バグ' : 
                          analysis.type === 'feature' ? '✨ 機能要求' : 
                          analysis.type === 'documentation' ? '📚 ドキュメント' : '❓ その他'}
            - **優先度**: ${analysis.priority === 'high' ? '🔴 高' : 
                           analysis.priority === 'medium' ? '🟡 中' : '🟢 低'}
            - **カテゴリ**: ${analysis.category}
            - **見積工数**: ${analysis.estimated_effort === 'large' ? '📏 大（3-5日）' : 
                             analysis.estimated_effort === 'medium' ? '📏 中（1-2日）' : '📏 小（数時間）'}
            
            ### 🏷️ 推奨ラベル
            ${analysis.suggested_labels.map(label => '`' + label + '`').join(' ')}
            
            ### 💡 AI推奨アクション
            ${analysis.ai_recommendations.map(rec => '- ' + rec).join('\n')}
            
            ${similarIssues.length > 0 ? 
              '### 🔗 関連する可能性のあるIssue\n' + 
              similarIssues.slice(0, 3).map(similar => 
                `- #${similar.number}: ${similar.title}`
              ).join('\n') + '\n' : ''
            }
            
            ### 🚀 次のステップ提案
            1. 適切なラベルの設定
            2. 担当者のアサイン
            3. マイルストーンの設定
            ${analysis.type === 'bug' ? '4. 再現環境の準備' : '4. 要件定義の詳細化'}
            
            ---
            🤖 **Claude AI自動分析** | Issue #79 | ${new Date().toLocaleString('ja-JP')}`;
            
            // Issueにコメント投稿
            await github.rest.issues.createComment({
              issue_number: issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: analysisComment
            });
            
            // 推奨ラベルを自動適用
            if (analysis.suggested_labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  labels: analysis.suggested_labels
                });
                console.log('✅ ラベル自動適用完了:', analysis.suggested_labels);
              } catch (error) {
                console.log('⚠️ ラベル適用に失敗:', error.message);
              }
            }
            
            console.log('✅ Issue AI分析完了');

  # ============================================================
  # ジョブ3: Claude メンション対応
  # ============================================================
  claude-mention-response:
    name: 💬 Claude メンション対応
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: |
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      contains(github.event.comment.body, '@claude')
    
    steps:
      # ----------------------------------------------------------
      # ステップ1: メンション内容分析と返答
      # ----------------------------------------------------------
      - name: 🤖 Claude AI自動応答
        uses: actions/github-script@v7
        with:
          script: |
            console.log('💬 Claude メンション対応を開始...');
            
            const comment = context.payload.comment;
            const commentBody = comment.body.toLowerCase();
            
            let response = '';
            
            // メンション内容に応じた応答生成
            if (commentBody.includes('help') || commentBody.includes('ヘルプ')) {
              response = `## 🤖 Claude AI アシスタント
              
              こんにちは！Claude AIです。以下のコマンドで支援できます：
              
              ### 📋 利用可能なコマンド
              - \`@claude review\` - コードレビューを実行
              - \`@claude analyze\` - Issue/PR分析
              - \`@claude suggest\` - 改善提案
              - \`@claude test\` - テスト提案
              - \`@claude security\` - セキュリティチェック
              - \`@claude help\` - このヘルプを表示
              
              お気軽にご相談ください！`;
              
            } else if (commentBody.includes('review')) {
              response = `## 🔍 コードレビュー依頼を受信
              
              コードレビューを開始します。しばらくお待ちください...
              
              📋 レビュー内容：
              - セキュリティチェック
              - パフォーマンス分析
              - ベストプラクティス確認
              - テストカバレッジ確認
              
              結果は別途コメントでお知らせします。`;
              
            } else if (commentBody.includes('suggest')) {
              response = `## 💡 改善提案
              
              このIssue/PRに対する改善提案：
              
              ### 🚀 一般的な推奨事項
              1. **ドキュメント**: README.mdの更新
              2. **テスト**: 単体テストの追加
              3. **セキュリティ**: 依存関係の更新
              4. **パフォーマンス**: バンドルサイズの最適化
              
              具体的な改善点については、詳細な分析を実行いたします。`;
              
            } else if (commentBody.includes('test')) {
              response = `## 🧪 テスト提案
              
              ### 推奨テスト戦略
              - **単体テスト**: Vitest使用
              - **統合テスト**: React Testing Library
              - **E2Eテスト**: Playwright
              - **視覚回帰テスト**: スナップショット
              
              ### テストカバレッジ目標
              - 新機能: 90%以上
              - 既存機能: 80%以上
              - クリティカルパス: 100%`;
              
            } else if (commentBody.includes('security')) {
              response = `## 🛡️ セキュリティチェック
              
              セキュリティ分析を実行中...
              
              ### チェック項目
              - 依存関係の脆弱性
              - 機密情報の漏洩
              - 認証・認可の実装
              - XSS/CSRF対策
              
              詳細な結果は専用のセキュリティスキャンで確認できます。`;
              
            } else {
              response = `## 🤖 Claude AI
              
              ご質問ありがとうございます！
              
              より具体的な支援のため、以下をお試しください：
              - \`@claude help\` - 利用可能なコマンド一覧
              - \`@claude review\` - コードレビュー実行
              - \`@claude suggest\` - 改善提案
              
              お気軽にお声かけください！`;
            }
            
            // 応答コメント投稿
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: response + '\n\n---\n🤖 Claude AI自動応答 | Issue #79'
            });
            
            console.log('✅ Claude自動応答完了');

# ------------------------------------------------------------
# ClaudeCode Actions統合完了
# AI支援による開発効率化とコード品質向上を実現
# ------------------------------------------------------------