# ============================================================
# Workflow: ClaudeCode統合ワークフロー
# Category: ClaudeCode (AI-Powered Development)  
# Purpose: ClaudeCodeとの統合、自動コードレビュー、AI支援開発機能
# Trigger: PRイベント、Issue作成、コメント、手動実行
# Dependencies: ClaudeCode API、GitHub Scripts
# Author: Claude Code DevOps Team
# Version: 1.0.0
# Last Modified: 2025-08-12
# ============================================================

name: 🤖 ClaudeCode統合ワークフロー

# ------------------------------------------------------------
# トリガー設定
# ClaudeCodeの各種機能を統合的に提供
# ------------------------------------------------------------
on:
  # プルリクエスト関連イベント
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
  
  # Issue関連イベント  
  issues:
    types: [opened, edited]
    
  # PRやIssueのコメント
  issue_comment:
    types: [created, edited]
    
  # 手動実行（多機能オプション付き）
  workflow_dispatch:
    inputs:
      action-type:
        description: '実行するClaudeCodeアクション'
        required: true
        type: choice
        options:
          - 'full-review'
          - 'code-analysis'
          - 'documentation-update'
          - 'issue-analysis'
          - 'optimization-suggestions'
          - 'security-analysis'
        default: 'full-review'
      target-pr:
        description: '対象PRの番号（空白の場合は最新）'
        required: false
        type: string
      ai-model:
        description: '使用するAIモデル'
        required: false
        type: choice
        options:
          - 'claude-3-opus'
          - 'claude-3-sonnet'
          - 'claude-3-haiku'
        default: 'claude-3-sonnet'

# ------------------------------------------------------------
# 権限設定（ClaudeCode機能用）
# ------------------------------------------------------------
permissions:
  contents: read           # リポジトリ内容の読み取り
  pull-requests: write     # PRコメント・レビューの書き込み
  issues: write           # Issue操作権限
  checks: write           # チェック結果の書き込み
  actions: write          # ワークフロー操作権限

# ------------------------------------------------------------
# 並行実行制御（AIリソース効率化）
# ------------------------------------------------------------
concurrency:
  group: claude-code-${{ github.event.number || github.sha }}
  cancel-in-progress: false  # AI処理は完了まで継続

# ------------------------------------------------------------
# 環境変数（ClaudeCode統合用）
# ------------------------------------------------------------
env:
  # ClaudeCode API設定
  CLAUDE_API_VERSION: 'v1'
  CLAUDE_MAX_TOKENS: '4000'
  CLAUDE_TEMPERATURE: '0.2'
  
  # GitHub統合設定  
  GITHUB_CONTEXT_SIZE: 'large'
  PR_CONTEXT_LINES: '50'
  
  # 日本語対応設定
  CLAUDE_LANGUAGE: 'japanese'
  OUTPUT_FORMAT: 'markdown'

# ------------------------------------------------------------
# ジョブ定義
# ============================================================
jobs:
  # ============================================================
  # Job 1: ClaudeCode コンテキスト分析
  # Purpose: PR/Issueの内容を分析し、適切なClaudeCodeアクションを決定
  # ============================================================
  claude-context-analysis:
    name: 🧠 ClaudeCodeコンテキスト分析
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # 分析結果の出力
      analysis-type: ${{ steps.analyze.outputs.type }}
      priority-level: ${{ steps.analyze.outputs.priority }}
      suggested-actions: ${{ steps.analyze.outputs.actions }}
      code-complexity: ${{ steps.analyze.outputs.complexity }}
      review-focus: ${{ steps.analyze.outputs.focus }}
    
    steps:
      - name: 📂 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧠 ClaudeCodeコンテキスト分析実行
        id: analyze
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            console.log('🤖 ClaudeCodeコンテキスト分析を開始...');
            
            const context = github.context;
            let analysisType = 'general';
            let priority = 'medium';
            let suggestedActions = [];
            let complexity = 'medium';
            let reviewFocus = 'general';
            
            // イベントタイプ別の分析
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              
              // PR規模の分析
              const changedFiles = pr.changed_files || 0;
              const additions = pr.additions || 0;
              const deletions = pr.deletions || 0;
              
              console.log(`📊 PR統計: ${changedFiles}ファイル, +${additions}/-${deletions}行`);
              
              // 複雑度の判定
              if (changedFiles > 20 || additions > 1000) {
                complexity = 'high';
                priority = 'high';
              } else if (changedFiles > 5 || additions > 200) {
                complexity = 'medium';
              } else {
                complexity = 'low';
              }
              
              // タイトルとボディからフォーカス分析
              const title = pr.title.toLowerCase();
              const body = pr.body?.toLowerCase() || '';
              
              if (title.includes('security') || body.includes('security')) {
                reviewFocus = 'security';
                suggestedActions.push('security-analysis');
              }
              
              if (title.includes('performance') || body.includes('performance')) {
                reviewFocus = 'performance';
                suggestedActions.push('performance-analysis');
              }
              
              if (title.includes('refactor') || body.includes('refactor')) {
                reviewFocus = 'architecture';
                suggestedActions.push('architecture-review');
              }
              
              if (title.includes('test') || body.includes('test')) {
                reviewFocus = 'testing';
                suggestedActions.push('test-coverage-analysis');
              }
              
              analysisType = 'pull_request';
              
            } else if (context.eventName === 'issues') {
              analysisType = 'issue';
              const issue = context.payload.issue;
              
              // Issue複雑度の分析
              const bodyLength = issue.body?.length || 0;
              if (bodyLength > 2000) {
                complexity = 'high';
                priority = 'high';
              }
              
              // ラベルによるフォーカス設定
              const labels = issue.labels?.map(l => l.name.toLowerCase()) || [];
              if (labels.includes('bug')) {
                reviewFocus = 'debugging';
                suggestedActions.push('bug-analysis');
              }
              if (labels.includes('enhancement')) {
                reviewFocus = 'feature';
                suggestedActions.push('feature-analysis');
              }
            }
            
            // デフォルトアクション設定
            if (suggestedActions.length === 0) {
              suggestedActions = ['code-review', 'documentation-check'];
            }
            
            console.log('✅ 分析完了:', {
              type: analysisType,
              priority: priority,
              actions: suggestedActions.join(','),
              complexity: complexity,
              focus: reviewFocus
            });
            
            // 出力設定
            core.setOutput('type', analysisType);
            core.setOutput('priority', priority);  
            core.setOutput('actions', suggestedActions.join(','));
            core.setOutput('complexity', complexity);
            core.setOutput('focus', reviewFocus);

  # ============================================================
  # Job 2: ClaudeCode自動コードレビュー
  # Purpose: PRの変更内容に対するAIによる包括的なコードレビュー
  # ============================================================
  claude-code-review:
    name: 👁️  ClaudeCode自動コードレビュー
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: claude-context-analysis
    if: github.event_name == 'pull_request' || github.event.inputs.action-type == 'full-review'
    
    steps:
      - name: 📂 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Node.js環境セットアップ
        uses: ./.github/actions/composite/setup-node-cache
        with:
          node-version: '18'
          install-dependencies: 'true'

      - name: 👁️  ClaudeCodeコードレビュー実行
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            console.log('👁️ ClaudeCodeコードレビューを開始...');
            
            const priority = '${{ needs.claude-context-analysis.outputs.priority-level }}';
            const complexity = '${{ needs.claude-context-analysis.outputs.code-complexity }}';
            const focus = '${{ needs.claude-context-analysis.outputs.review-focus }}';
            
            console.log(`📋 レビュー設定: 優先度=${priority}, 複雑度=${complexity}, フォーカス=${focus}`);
            
            // PR情報の取得
            const pr = github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            // 変更ファイル一覧の取得
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            console.log(`📁 変更ファイル数: ${files.data.length}`);
            
            // ClaudeCodeレビューロジック（詳細実装）
            let reviewComments = [];
            let overallScore = 85; // 初期品質スコア
            
            // ファイル別の詳細分析
            for (const file of files.data.slice(0, 10)) { // 最大10ファイルまで詳細分析
              if (file.filename.endsWith('.js') || file.filename.endsWith('.jsx') || 
                  file.filename.endsWith('.ts') || file.filename.endsWith('.tsx')) {
                
                console.log(`🔍 分析中: ${file.filename}`);
                
                // ファイル内容の分析（模擬実装）
                const analysis = await analyzeCodeFile(file);
                reviewComments.push(...analysis.comments);
                overallScore = Math.min(overallScore, analysis.score);
              }
            }
            
            // レビューコメントの生成
            const reviewBody = generateReviewComment(reviewComments, overallScore, focus, priority);
            
            // PRにレビューコメントを投稿
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: reviewBody,
              event: overallScore >= 80 ? 'APPROVE' : 'REQUEST_CHANGES'
            });
            
            console.log('✅ ClaudeCodeレビュー完了');
            
            // ヘルパー関数群
            async function analyzeCodeFile(file) {
              const comments = [];
              let score = 90;
              
              // 基本的なコード品質チェック（実際のClaudeCode APIを使用する場合は置き換え）
              if (file.additions > 100) {
                comments.push(`⚠️ ${file.filename}: ファイルが大きくなっています。コードの分割を検討してください。`);
                score -= 5;
              }
              
              if (file.filename.includes('test') && file.deletions > file.additions) {
                comments.push(`❌ ${file.filename}: テストコードが削除されています。テストカバレッジを確認してください。`);
                score -= 10;
              }
              
              // セキュリティ関連のチェック
              if (focus === 'security') {
                comments.push(`🔒 ${file.filename}: セキュリティ観点からの詳細レビューが推奨されます。`);
              }
              
              return { comments, score };
            }
            
            function generateReviewComment(comments, score, focus, priority) {
              let reviewBody = `## 🤖 ClaudeCode 自動レビュー結果\\n\\n`;
              reviewBody += `**📊 品質スコア**: ${score}/100\\n`;
              reviewBody += `**🎯 レビューフォーカス**: ${focus}\\n`;
              reviewBody += `**⚡ 優先度**: ${priority}\\n\\n`;
              
              if (comments.length > 0) {
                reviewBody += `### 📝 指摘事項\\n\\n`;
                comments.forEach((comment, index) => {
                  reviewBody += `${index + 1}. ${comment}\\n`;
                });
                reviewBody += `\\n`;
              }
              
              reviewBody += `### 🚀 推奨改善点\\n\\n`;
              
              if (focus === 'security') {
                reviewBody += `- 🔒 セキュリティベストプラクティスの適用\\n`;
                reviewBody += `- 🛡️ 入力値検証の強化\\n`;
              }
              
              if (focus === 'performance') {
                reviewBody += `- ⚡ パフォーマンス最適化の検討\\n`;
                reviewBody += `- 💾 メモリ使用量の最適化\\n`;
              }
              
              reviewBody += `- 📚 ドキュメントの更新\\n`;
              reviewBody += `- 🧪 テストカバレッジの確認\\n`;
              
              reviewBody += `\\n---\\n`;
              reviewBody += `*🤖 このレビューはClaudeCodeにより自動生成されました*`;
              
              return reviewBody;
            }

  # ============================================================
  # Job 3: ClaudeCode Issue分析・提案
  # Purpose: Issueの内容分析と解決提案の生成
  # ============================================================
  claude-issue-analysis:
    name: 📋 ClaudeCode Issue分析
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: claude-context-analysis
    if: github.event_name == 'issues' || github.event.inputs.action-type == 'issue-analysis'
    
    steps:
      - name: 📂 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 📋 Issue分析・提案生成
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            console.log('📋 ClaudeCode Issue分析を開始...');
            
            const issue = context.payload.issue;
            const analysisType = '${{ needs.claude-context-analysis.outputs.analysis-type }}';
            const priority = '${{ needs.claude-context-analysis.outputs.priority-level }}';
            
            console.log(`Issue #${issue.number}: ${issue.title}`);
            
            // Issue内容の分析
            const title = issue.title;
            const body = issue.body || '';
            const labels = issue.labels?.map(l => l.name) || [];
            
            // AI分析ロジック（模擬実装）
            let analysisResult = await analyzeIssue(title, body, labels);
            
            // 分析結果をコメントとして投稿
            const commentBody = generateAnalysisComment(analysisResult, priority);
            
            await github.rest.issues.createComment({
              issue_number: issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
            
            console.log('✅ Issue分析完了');
            
            // ヘルパー関数
            async function analyzeIssue(title, body, labels) {
              let issueType = 'general';
              let severity = 'medium';
              let suggestions = [];
              let estimatedEffort = 'medium';
              
              // タイトル・本文からの分析
              const text = (title + ' ' + body).toLowerCase();
              
              if (text.includes('bug') || text.includes('error') || text.includes('crash')) {
                issueType = 'bug';
                severity = text.includes('critical') || text.includes('urgent') ? 'high' : 'medium';
                suggestions = [
                  '🐛 バグ再現手順の詳細化',
                  '📊 エラーログの収集',
                  '🧪 単体テストの追加',
                  '🔍 根本原因の分析'
                ];
              } else if (text.includes('feature') || text.includes('enhancement')) {
                issueType = 'feature';
                suggestions = [
                  '📋 要件定義の明確化',
                  '🎨 UI/UXデザインの検討',
                  '⚡ パフォーマンス影響の評価',
                  '📚 ドキュメント更新の計画'
                ];
              } else if (text.includes('performance') || text.includes('slow')) {
                issueType = 'performance';
                severity = 'high';
                suggestions = [
                  '📊 パフォーマンス計測の実行',
                  '🔍 ボトルネック分析',
                  '⚡ 最適化戦略の策定',
                  '📈 改善効果の測定計画'
                ];
              }
              
              // 工数見積もり
              if (body.length > 1000 || text.includes('complex')) {
                estimatedEffort = 'high';
              } else if (body.length < 200) {
                estimatedEffort = 'low';
              }
              
              return {
                type: issueType,
                severity: severity,
                suggestions: suggestions,
                effort: estimatedEffort
              };
            }
            
            function generateAnalysisComment(analysis, priority) {
              let comment = `## 🤖 ClaudeCode Issue分析結果\\n\\n`;
              comment += `**📊 分析概要**\\n`;
              comment += `- 📋 Issue種別: ${analysis.type}\\n`;
              comment += `- ⚠️ 重要度: ${analysis.severity}\\n`;
              comment += `- ⏱️ 推定工数: ${analysis.effort}\\n`;
              comment += `- 🎯 優先度: ${priority}\\n\\n`;
              
              if (analysis.suggestions.length > 0) {
                comment += `### 🚀 推奨アクション\\n\\n`;
                analysis.suggestions.forEach((suggestion, index) => {
                  comment += `${index + 1}. ${suggestion}\\n`;
                });
                comment += `\\n`;
              }
              
              comment += `### 🛠️ 次のステップ\\n\\n`;
              comment += `1. 📋 詳細な要件・再現条件の確認\\n`;
              comment += `2. 🎯 担当者のアサイン\\n`;
              comment += `3. 📅 マイルストーンの設定\\n`;
              comment += `4. 🏷️ 適切なラベルの付与\\n\\n`;
              
              comment += `---\\n`;
              comment += `*🤖 この分析はClaudeCodeにより自動生成されました*`;
              
              return comment;
            }

  # ============================================================
  # Job 4: ClaudeCodeドキュメント同期
  # Purpose: コード変更に合わせたドキュメント自動更新提案
  # ============================================================
  claude-docs-sync:
    name: 📚 ClaudeCodeドキュメント同期
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: claude-context-analysis
    if: |
      github.event_name == 'pull_request' || 
      github.event.inputs.action-type == 'documentation-update'
    
    steps:
      - name: 📂 リポジトリチェックアウト
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 📚 ドキュメント同期チェック
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            console.log('📚 ClaudeCodeドキュメント同期チェックを開始...');
            
            // PR内の変更ファイル取得
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            let docsUpdateNeeded = false;
            let suggestions = [];
            
            // コードファイルの変更チェック
            files.data.forEach(file => {
              if (file.filename.match(/\.(js|jsx|ts|tsx)$/)) {
                // API変更の検出
                if (file.patch?.includes('export') || file.patch?.includes('function')) {
                  suggestions.push(`📝 ${file.filename}: API変更に伴うドキュメント更新が必要`);
                  docsUpdateNeeded = true;
                }
                
                // 設定変更の検出
                if (file.filename.includes('config') || file.filename.includes('env')) {
                  suggestions.push(`⚙️ ${file.filename}: 設定変更の説明をREADMEに追加`);
                  docsUpdateNeeded = true;
                }
              }
            });
            
            if (docsUpdateNeeded) {
              const comment = `## 📚 ClaudeCode ドキュメント同期提案\\n\\n` +
                           `以下のファイル変更により、ドキュメント更新が推奨されます:\\n\\n` +
                           suggestions.map((s, i) => `${i + 1}. ${s}`).join('\\n') + 
                           `\\n\\n### 🎯 推奨更新箇所\\n\\n` +
                           `- 📖 README.md - 設定・使用方法\\n` +
                           `- 📋 API.md - API仕様変更\\n` +
                           `- 🔧 SETUP.md - セットアップ手順\\n\\n` +
                           `*🤖 このチェックはClaudeCodeにより実行されました*`;
              
              await github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
            
            console.log('✅ ドキュメント同期チェック完了');

  # ============================================================
  # Job 5: ClaudeCode統合サマリー
  # Purpose: すべてのClaudeCode機能の結果集約とレポート
  # ============================================================
  claude-integration-summary:
    name: 📊 ClaudeCode統合サマリー
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [claude-context-analysis, claude-code-review, claude-issue-analysis, claude-docs-sync]
    if: always()
    
    steps:
      - name: 📊 統合結果サマリー
        run: |
          echo "=== 🤖 ClaudeCode統合ワークフロー結果 ==="
          echo "コンテキスト分析: ${{ needs.claude-context-analysis.result }}"
          echo "コードレビュー: ${{ needs.claude-code-review.result }}"
          echo "Issue分析: ${{ needs.claude-issue-analysis.result }}"
          echo "ドキュメント同期: ${{ needs.claude-docs-sync.result }}"
          echo "============================================"
          
          # GitHub Step Summaryに詳細レポート追加
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🤖 ClaudeCode統合レポート
          
          ### 📊 実行結果サマリー
          | 機能 | ステータス | 詳細 |
          |------|-----------|------|
          | 🧠 コンテキスト分析 | ${{ needs.claude-context-analysis.result }} | 優先度: ${{ needs.claude-context-analysis.outputs.priority-level }} |
          | 👁️ コードレビュー | ${{ needs.claude-code-review.result }} | フォーカス: ${{ needs.claude-context-analysis.outputs.review-focus }} |
          | 📋 Issue分析 | ${{ needs.claude-issue-analysis.result }} | 分析タイプ: ${{ needs.claude-context-analysis.outputs.analysis-type }} |
          | 📚 ドキュメント同期 | ${{ needs.claude-docs-sync.result }} | 同期チェック完了 |
          
          ### 🎯 推奨アクション
          - ${{ needs.claude-context-analysis.outputs.suggested-actions }}
          
          ### 🔧 ClaudeCode設定
          - 🤖 AIモデル: ${{ github.event.inputs.ai-model || 'claude-3-sonnet' }}
          - 🌐 言語: Japanese
          - 📊 複雑度: ${{ needs.claude-context-analysis.outputs.code-complexity }}
          
          ---
          *🤖 このレポートはClaudeCode統合ワークフローにより自動生成されました*
          EOF

      - name: 🎯 最終ステータス判定
        run: |
          # 重要な機能の成功可否をチェック
          CONTEXT_OK="${{ needs.claude-context-analysis.result }}"
          
          if [ "$CONTEXT_OK" = "success" ]; then
            echo "✅ ClaudeCode統合が正常に完了しました"
          else
            echo "⚠️ ClaudeCode統合で一部問題が発生しましたが、継続可能です"
          fi
