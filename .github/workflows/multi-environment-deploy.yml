name: Multi-Environment Deployment

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preview
          - production

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '18'
  DEPLOYMENT_TIMEOUT: '10m'

jobs:
  # Environment Configuration
  setup-environment:
    name: Setup Environment Configuration
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.config.outputs.environment }}
      url: ${{ steps.config.outputs.url }}
      should-deploy: ${{ steps.config.outputs.should-deploy }}
      deployment-type: ${{ steps.config.outputs.deployment-type }}
    steps:
      - name: Determine deployment configuration
        id: config
        run: |
          # Default values
          ENVIRONMENT=""
          URL=""
          SHOULD_DEPLOY="false"
          DEPLOYMENT_TYPE="standard"
          
          # Manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
            SHOULD_DEPLOY="true"
            DEPLOYMENT_TYPE="manual"
          
          # Main branch - production
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVIRONMENT="production"
            SHOULD_DEPLOY="true"
            DEPLOYMENT_TYPE="production"
          
          # Develop branch - staging
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ENVIRONMENT="staging"
            SHOULD_DEPLOY="true"
            DEPLOYMENT_TYPE="staging"
          
          # Release branches - staging
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            ENVIRONMENT="staging"
            SHOULD_DEPLOY="true"
            DEPLOYMENT_TYPE="release-staging"
          
          # Pull requests - preview
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ENVIRONMENT="preview-pr-${{ github.event.number }}"
            SHOULD_DEPLOY="true"
            DEPLOYMENT_TYPE="preview"
          fi
          
          # Set URLs based on environment
          if [ "$ENVIRONMENT" = "production" ]; then
            URL="https://yusuke-kurosawa.github.io/PMPLearningManagement/"
          elif [ "$ENVIRONMENT" = "staging" ]; then
            URL="https://yusuke-kurosawa.github.io/PMPLearningManagement-staging/"
          elif [[ "$ENVIRONMENT" =~ ^preview-pr- ]]; then
            URL="https://yusuke-kurosawa.github.io/PMPLearningManagement-preview-${{ github.event.number }}/"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "should-deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "deployment-type=$DEPLOYMENT_TYPE" >> $GITHUB_OUTPUT
          
          echo "🌍 Environment: $ENVIRONMENT"
          echo "🔗 URL: $URL"
          echo "🚀 Should Deploy: $SHOULD_DEPLOY"
          echo "📦 Deployment Type: $DEPLOYMENT_TYPE"

  # Build with Environment Configuration
  build-for-environment:
    name: Build for ${{ needs.setup-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup-environment]
    if: needs.setup-environment.outputs.should-deploy == 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create environment-specific configuration
        run: |
          ENV="${{ needs.setup-environment.outputs.environment }}"
          
          # Create environment-specific env file
          cat > .env.deployment << EOF
          NODE_ENV=${{ needs.setup-environment.outputs.deployment-type == 'production' && 'production' || 'staging' }}
          VITE_APP_ENVIRONMENT=${{ needs.setup-environment.outputs.environment }}
          VITE_APP_VERSION=${{ github.sha }}
          VITE_APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VITE_APP_BRANCH=${{ github.ref_name }}
          VITE_APP_PR_NUMBER=${{ github.event.number || '' }}
          VITE_APP_BASE_URL=${{ needs.setup-environment.outputs.url }}
          EOF
          
          echo "📋 Environment configuration:"
          cat .env.deployment
        
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: ${{ needs.setup-environment.outputs.deployment-type == 'production' && 'production' || 'development' }}
          VITE_APP_ENVIRONMENT: ${{ needs.setup-environment.outputs.environment }}
          
      - name: Generate deployment manifest
        run: |
          cat > dist/deployment-info.json << EOF
          {
            "environment": "${{ needs.setup-environment.outputs.environment }}",
            "deploymentType": "${{ needs.setup-environment.outputs.deployment-type }}",
            "version": "${{ github.sha }}",
            "buildTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "branch": "${{ github.ref_name }}",
            "prNumber": "${{ github.event.number || null }}",
            "url": "${{ needs.setup-environment.outputs.url }}",
            "commit": {
              "sha": "${{ github.sha }}",
              "message": "${{ github.event.head_commit.message || github.event.pull_request.title }}",
              "author": "${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}"
            }
          }
          EOF
          
          echo "📦 Deployment manifest:"
          cat dist/deployment-info.json | jq .
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.setup-environment.outputs.environment }}
          path: dist/
          retention-days: ${{ needs.setup-environment.outputs.deployment-type == 'production' && 30 || 7 }}

  # Staging Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup-environment, build-for-environment]
    if: >
      needs.setup-environment.outputs.should-deploy == 'true' && 
      (needs.setup-environment.outputs.environment == 'staging' || 
       contains(needs.setup-environment.outputs.environment, 'staging'))
    environment:
      name: staging
      url: ${{ needs.setup-environment.outputs.url }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup-environment.outputs.environment }}
          path: dist/
          
      - name: Deploy to staging branch
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Clone staging branch or create it
          git clone --single-branch --branch gh-pages-staging https://github.com/${{ github.repository }}.git staging-repo || \
          git clone https://github.com/${{ github.repository }}.git staging-repo
          
          cd staging-repo
          
          # Create staging branch if it doesn't exist
          git checkout gh-pages-staging 2>/dev/null || git checkout -b gh-pages-staging
          
          # Clear existing files
          rm -rf * .gitignore .nojekyll 2>/dev/null || true
          
          # Copy new build
          cp -r ../dist/* .
          
          # Add .nojekyll for GitHub Pages
          touch .nojekyll
          
          # Add all changes
          git add -A
          
          # Commit and push
          if ! git diff --cached --exit-code > /dev/null; then
            git commit -m "Deploy staging: ${{ github.sha }} (${{ github.ref_name }})"
            git push origin gh-pages-staging
            echo "✅ Staging deployed successfully"
          else
            echo "ℹ️ No changes to deploy"
          fi

  # Preview Deployment (PR-specific)
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    needs: [setup-environment, build-for-environment]
    if: >
      needs.setup-environment.outputs.should-deploy == 'true' && 
      contains(needs.setup-environment.outputs.environment, 'preview-pr')
    environment:
      name: preview-pr-${{ github.event.number }}
      url: ${{ needs.setup-environment.outputs.url }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup-environment.outputs.environment }}
          path: dist/
          
      - name: Deploy to preview branch
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Clone preview branch or create it
          PREVIEW_BRANCH="gh-pages-preview-${{ github.event.number }}"
          git clone --single-branch --branch $PREVIEW_BRANCH https://github.com/${{ github.repository }}.git preview-repo || \
          git clone https://github.com/${{ github.repository }}.git preview-repo
          
          cd preview-repo
          
          # Create preview branch if it doesn't exist
          git checkout $PREVIEW_BRANCH 2>/dev/null || git checkout -b $PREVIEW_BRANCH
          
          # Clear existing files
          rm -rf * .gitignore .nojekyll 2>/dev/null || true
          
          # Copy new build
          cp -r ../dist/* .
          
          # Add .nojekyll for GitHub Pages
          touch .nojekyll
          
          # Add all changes
          git add -A
          
          # Commit and push
          if ! git diff --cached --exit-code > /dev/null; then
            git commit -m "Deploy preview for PR #${{ github.event.number }}: ${{ github.sha }}"
            git push origin $PREVIEW_BRANCH
            echo "✅ Preview deployed successfully"
          else
            echo "ℹ️ No changes to deploy"
          fi

  # Production Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup-environment, build-for-environment]
    if: >
      needs.setup-environment.outputs.should-deploy == 'true' && 
      needs.setup-environment.outputs.environment == 'production'
    environment:
      name: production
      url: ${{ needs.setup-environment.outputs.url }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup-environment.outputs.environment }}
          path: dist/
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-Deployment Testing
  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [setup-environment, deploy-staging, deploy-preview, deploy-production]
    if: >
      always() && 
      (needs.deploy-staging.result == 'success' || 
       needs.deploy-preview.result == 'success' || 
       needs.deploy-production.result == 'success')
       
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Wait for deployment
        run: sleep 30
        
      - name: Run smoke tests
        run: |
          URL="${{ needs.setup-environment.outputs.url }}"
          if [ -n "$URL" ]; then
            echo "🔍 Testing deployment at: $URL"
            
            # Basic connectivity test
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Site is accessible"
              
              # Check if deployment info is available
              DEPLOY_INFO=$(curl -s "$URL/deployment-info.json" || echo "{}")
              echo "📋 Deployment info:"
              echo "$DEPLOY_INFO" | jq . 2>/dev/null || echo "$DEPLOY_INFO"
            else
              echo "❌ Site returned HTTP $HTTP_CODE"
              exit 1
            fi
          else
            echo "ℹ️ No URL to test"
          fi

  # Update PR with deployment links
  update-pr-comment:
    name: Update PR Comment
    runs-on: ubuntu-latest
    needs: [setup-environment, deploy-preview]
    if: >
      github.event_name == 'pull_request' && 
      needs.deploy-preview.result == 'success'
      
    steps:
      - name: Update PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🚀 Deployment Links')
            );
            
            const previewUrl = '${{ needs.setup-environment.outputs.url }}';
            
            const body = `🚀 **Deployment Links**
            
            ## Preview Environment
            - 🌐 **Preview URL**: ${previewUrl}
            - 📦 **Environment**: \`${{ needs.setup-environment.outputs.environment }}\`
            - 🔄 **Build**: \`${context.sha.substring(0, 7)}\`
            - 📅 **Deployed**: ${new Date().toISOString()}
            
            ## Quick Links
            - [📊 PMBOK Matrix](${previewUrl}#/matrix)
            - [🎯 Mock Exam](${previewUrl}#/mock-exam)
            - [📚 Glossary](${previewUrl}#/glossary)
            - [📈 Progress](${previewUrl}#/progress)
            
            ## Testing
            ✅ Basic smoke tests passed
            
            <details>
            <summary>Deployment Details</summary>
            
            - **Commit**: \`${context.sha}\`
            - **Branch**: \`${{ github.head_ref }}\`
            - **PR**: #${{ github.event.number }}
            - **Workflow**: [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            </details>
            
            _Preview will be automatically cleaned up when PR is closed._`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # Cleanup closed PR previews
  cleanup-preview:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
      - name: Delete preview branch
        run: |
          PREVIEW_BRANCH="gh-pages-preview-${{ github.event.number }}"
          
          # Try to delete the remote branch
          git push origin --delete $PREVIEW_BRANCH 2>/dev/null || echo "Branch $PREVIEW_BRANCH does not exist or already deleted"
          
          echo "🧹 Preview environment cleaned up for PR #${{ github.event.number }}"