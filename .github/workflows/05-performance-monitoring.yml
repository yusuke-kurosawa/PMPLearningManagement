# ================================================================
# Workflow: 05-performance-monitoring
# Purpose: 包括的パフォーマンス監視・最適化・ベンチマーク
#          Comprehensive performance monitoring, optimization, and benchmarking
# Trigger: Deployment, Schedule, Performance degradation alerts
# Dependencies: Lighthouse CI, Bundle analyzer, Core Web Vitals
# Author: Claude Code Actions
# Version: 1.0.0
# Last Updated: 2025-08-12
# ================================================================

name: "⚡ [Performance] Monitoring & Optimization / パフォーマンス監視・最適化"

# --------------------------------
# 📋 Permissions / 権限設定
# --------------------------------
permissions:
  contents: read
  issues: write
  pull-requests: write
  pages: read

# --------------------------------
# 🎯 Triggers / トリガー
# --------------------------------
on:
  # デプロイ完了時 / On deployment completion
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  
  # プルリクエスト時 / On pull requests
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.*'
  
  # 手動実行 / Manual execution
  workflow_dispatch:
    inputs:
      monitoring_scope:
        description: 'Monitoring scope / 監視範囲'
        required: true
        default: 'full'
        type: choice
        options:
          - 'quick'
          - 'standard'
          - 'full'
          - 'benchmark'
      
      target_urls:
        description: 'Target URLs (comma-separated) / 対象URL'
        required: false
        default: 'https://yusuke-kurosawa.github.io/PMPLearningManagement/'
        type: string
  
  # スケジュール実行（毎日午前4時） / Daily at 4 AM
  schedule:
    - cron: '0 4 * * *'
  
  # パフォーマンス劣化アラート / Performance degradation alert
  repository_dispatch:
    types: [performance-alert]

# --------------------------------
# 🌍 Environment / 環境設定
# --------------------------------
env:
  LIGHTHOUSE_THRESHOLD_PERFORMANCE: 90
  LIGHTHOUSE_THRESHOLD_ACCESSIBILITY: 95
  LIGHTHOUSE_THRESHOLD_BEST_PRACTICES: 90
  LIGHTHOUSE_THRESHOLD_SEO: 90
  BUNDLE_SIZE_THRESHOLD_MB: 1.0
  FIRST_CONTENTFUL_PAINT_THRESHOLD: 1.5  # seconds
  LARGEST_CONTENTFUL_PAINT_THRESHOLD: 2.5  # seconds

# --------------------------------
# 🔧 Jobs / ジョブ定義
# ================================
jobs:
  performance-baseline:
    # ================================
    # Job: performance-baseline
    # Description: パフォーマンスベースライン測定
    #              Performance baseline measurement
    # Dependencies: Build artifacts
    # Timeout: 20分
    # ================================
    name: "📊 [Baseline] Performance Measurement"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    outputs:
      lighthouse_performance: ${{ steps.lighthouse.outputs.performance }}
      lighthouse_accessibility: ${{ steps.lighthouse.outputs.accessibility }}
      lighthouse_best_practices: ${{ steps.lighthouse.outputs.best_practices }}
      lighthouse_seo: ${{ steps.lighthouse.outputs.seo }}
      bundle_size_mb: ${{ steps.bundle-analysis.outputs.bundle_size_mb }}
      needs_optimization: ${{ steps.threshold-check.outputs.needs_optimization }}
      performance_grade: ${{ steps.grading.outputs.performance_grade }}
    
    steps:
      # ================
      # Repository Setup
      # 目的: リポジトリとビルド環境準備
      # Purpose: Setup repository and build environment
      # ================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: "📦 Install Dependencies"
        run: |
          echo "📦 Installing dependencies for performance testing..."
          npm ci
      
      # ================
      # Application Build
      # 目的: パフォーマンステスト用ビルド
      # Purpose: Build for performance testing
      # ================
      - name: "🏗️ Build Application"
        run: |
          echo "🏗️ Building optimized application..."
          
          # パフォーマンス最適化ビルド
          NODE_ENV=production npm run build
          
          # ビルド結果の確認
          echo "📊 Build output analysis:"
          if [[ -d "dist" ]]; then
            ls -la dist/
            find dist/ -name "*.js" -exec ls -lh {} \; | head -10
            find dist/ -name "*.css" -exec ls -lh {} \; | head -5
          else
            echo "⚠️ Build directory not found"
          fi
        id: build
      
      # ================
      # Bundle Size Analysis
      # 目的: バンドルサイズの詳細分析
      # Purpose: Detailed bundle size analysis
      # ================
      - name: "📦 Bundle Size Analysis"
        id: bundle-analysis
        run: |
          echo "📦 Analyzing bundle sizes..."
          
          # バンドルアナライザー実行
          echo "🔍 Running bundle analyzer..."
          npm run analyze-bundle 2>/dev/null || echo "Bundle analyzer not configured"
          
          # ファイルサイズ計算
          if [[ -d "dist" ]]; then
            # 総サイズ計算
            total_size_bytes=$(du -sb dist/ | cut -f1)
            total_size_mb=$(echo "scale=2; $total_size_bytes / 1024 / 1024" | bc -l)
            
            # JavaScript ファイルサイズ
            js_size_bytes=$(find dist/ -name "*.js" -exec stat -f%z {} \; 2>/dev/null | awk '{sum += $1} END {print sum}' || echo "0")
            js_size_mb=$(echo "scale=2; $js_size_bytes / 1024 / 1024" | bc -l 2>/dev/null || echo "0")
            
            # CSS ファイルサイズ
            css_size_bytes=$(find dist/ -name "*.css" -exec stat -f%z {} \; 2>/dev/null | awk '{sum += $1} END {print sum}' || echo "0")
            css_size_kb=$(echo "scale=2; $css_size_bytes / 1024" | bc -l 2>/dev/null || echo "0")
            
            # 画像ファイルサイズ
            img_size_bytes=$(find dist/ -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.svg" -o -name "*.webp" 2>/dev/null | xargs stat -f%z 2>/dev/null | awk '{sum += $1} END {print sum}' || echo "0")
            img_size_kb=$(echo "scale=2; $img_size_bytes / 1024" | bc -l 2>/dev/null || echo "0")
            
            echo "📊 Bundle Analysis Results:"
            echo "   Total Size: ${total_size_mb}MB"
            echo "   JavaScript: ${js_size_mb}MB"
            echo "   CSS: ${css_size_kb}KB"
            echo "   Images: ${img_size_kb}KB"
            
            # 出力設定
            echo "bundle_size_mb=$total_size_mb" >> $GITHUB_OUTPUT
            echo "js_size_mb=$js_size_mb" >> $GITHUB_OUTPUT
            echo "css_size_kb=$css_size_kb" >> $GITHUB_OUTPUT
            echo "img_size_kb=$img_size_kb" >> $GITHUB_OUTPUT
            
            # バンドル情報をJSON形式で保存
            cat > bundle-analysis.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_size_mb": $total_size_mb,
            "javascript_size_mb": $js_size_mb,
            "css_size_kb": $css_size_kb,
            "images_size_kb": $img_size_kb,
            "threshold_mb": ${{ env.BUNDLE_SIZE_THRESHOLD_MB }}
          }
          EOF
          else
            echo "⚠️ Build directory not found for bundle analysis"
            echo "bundle_size_mb=0" >> $GITHUB_OUTPUT
          fi
      
      # ================
      # Lighthouse Performance Audit
      # 目的: Lighthouse による包括的パフォーマンス監査
      # Purpose: Comprehensive performance audit with Lighthouse
      # ================
      - name: "🔍 Lighthouse Performance Audit"
        id: lighthouse
        run: |
          echo "🔍 Running Lighthouse performance audit..."
          
          # テストサーバー起動
          echo "🚀 Starting test server..."
          npm run preview &
          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> $GITHUB_OUTPUT
          
          # サーバー起動待機
          sleep 15
          
          # サーバー起動確認
          curl -f http://localhost:4173 > /dev/null 2>&1 || {
            echo "❌ Test server failed to start"
            exit 1
          }
          
          echo "✅ Test server started successfully"
          
          # Lighthouse 実行
          echo "🔍 Running Lighthouse audit..."
          npx lighthouse http://localhost:4173 \
            --output=json \
            --output=html \
            --output-path=lighthouse-results \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --throttling-method=devtools || true
          
          # サーバー停止
          kill $SERVER_PID || true
          
          # Lighthouse 結果解析
          if [[ -f "lighthouse-results.report.json" ]]; then
            echo "📊 Parsing Lighthouse results..."
            
            # スコア抽出
            performance=$(jq -r '.categories.performance.score * 100' lighthouse-results.report.json 2>/dev/null | cut -d. -f1)
            accessibility=$(jq -r '.categories.accessibility.score * 100' lighthouse-results.report.json 2>/dev/null | cut -d. -f1)
            best_practices=$(jq -r '.categories["best-practices"].score * 100' lighthouse-results.report.json 2>/dev/null | cut -d. -f1)
            seo=$(jq -r '.categories.seo.score * 100' lighthouse-results.report.json 2>/dev/null | cut -d. -f1)
            
            # Core Web Vitals 抽出
            fcp=$(jq -r '.audits["first-contentful-paint"].displayValue' lighthouse-results.report.json 2>/dev/null || echo "N/A")
            lcp=$(jq -r '.audits["largest-contentful-paint"].displayValue' lighthouse-results.report.json 2>/dev/null || echo "N/A")
            cls=$(jq -r '.audits["cumulative-layout-shift"].displayValue' lighthouse-results.report.json 2>/dev/null || echo "N/A")
            fid=$(jq -r '.audits["max-potential-fid"].displayValue' lighthouse-results.report.json 2>/dev/null || echo "N/A")
            
            echo "📊 Lighthouse Scores:"
            echo "   Performance: ${performance}/100"
            echo "   Accessibility: ${accessibility}/100"
            echo "   Best Practices: ${best_practices}/100"
            echo "   SEO: ${seo}/100"
            
            echo "📊 Core Web Vitals:"
            echo "   First Contentful Paint: $fcp"
            echo "   Largest Contentful Paint: $lcp"
            echo "   Cumulative Layout Shift: $cls"
            echo "   First Input Delay: $fid"
            
            # 出力設定
            echo "performance=$performance" >> $GITHUB_OUTPUT
            echo "accessibility=$accessibility" >> $GITHUB_OUTPUT
            echo "best_practices=$best_practices" >> $GITHUB_OUTPUT
            echo "seo=$seo" >> $GITHUB_OUTPUT
            echo "fcp=$fcp" >> $GITHUB_OUTPUT
            echo "lcp=$lcp" >> $GITHUB_OUTPUT
            echo "cls=$cls" >> $GITHUB_OUTPUT
            
            # Lighthouse データをJSON形式で保存
            cat > lighthouse-summary.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "scores": {
              "performance": $performance,
              "accessibility": $accessibility,
              "best_practices": $best_practices,
              "seo": $seo
            },
            "core_web_vitals": {
              "first_contentful_paint": "$fcp",
              "largest_contentful_paint": "$lcp",
              "cumulative_layout_shift": "$cls",
              "first_input_delay": "$fid"
            }
          }
          EOF
          else
            echo "❌ Lighthouse results not found"
            # デフォルト値設定
            echo "performance=0" >> $GITHUB_OUTPUT
            echo "accessibility=0" >> $GITHUB_OUTPUT
            echo "best_practices=0" >> $GITHUB_OUTPUT
            echo "seo=0" >> $GITHUB_OUTPUT
          fi
      
      # ================
      # Performance Threshold Check
      # 目的: パフォーマンス閾値のチェック
      # Purpose: Check performance thresholds
      # ================
      - name: "🎯 Performance Threshold Check"
        id: threshold-check
        run: |
          echo "🎯 Checking performance thresholds..."
          
          # 変数取得
          performance="${{ steps.lighthouse.outputs.performance }}"
          accessibility="${{ steps.lighthouse.outputs.accessibility }}"
          best_practices="${{ steps.lighthouse.outputs.best_practices }}"
          seo="${{ steps.lighthouse.outputs.seo }}"
          bundle_size="${{ steps.bundle-analysis.outputs.bundle_size_mb }}"
          
          # 閾値チェック
          needs_optimization=false
          issues=()
          
          # パフォーマンススコア
          if [[ $performance -lt ${{ env.LIGHTHOUSE_THRESHOLD_PERFORMANCE }} ]]; then
            echo "⚠️ Performance score below threshold: $performance < ${{ env.LIGHTHOUSE_THRESHOLD_PERFORMANCE }}"
            needs_optimization=true
            issues+=("performance")
          fi
          
          # アクセシビリティ
          if [[ $accessibility -lt ${{ env.LIGHTHOUSE_THRESHOLD_ACCESSIBILITY }} ]]; then
            echo "⚠️ Accessibility score below threshold: $accessibility < ${{ env.LIGHTHOUSE_THRESHOLD_ACCESSIBILITY }}"
            needs_optimization=true
            issues+=("accessibility")
          fi
          
          # ベストプラクティス
          if [[ $best_practices -lt ${{ env.LIGHTHOUSE_THRESHOLD_BEST_PRACTICES }} ]]; then
            echo "⚠️ Best practices score below threshold: $best_practices < ${{ env.LIGHTHOUSE_THRESHOLD_BEST_PRACTICES }}"
            needs_optimization=true
            issues+=("best-practices")
          fi
          
          # SEO
          if [[ $seo -lt ${{ env.LIGHTHOUSE_THRESHOLD_SEO }} ]]; then
            echo "⚠️ SEO score below threshold: $seo < ${{ env.LIGHTHOUSE_THRESHOLD_SEO }}"
            needs_optimization=true
            issues+=("seo")
          fi
          
          # バンドルサイズ
          if (( $(echo "$bundle_size > ${{ env.BUNDLE_SIZE_THRESHOLD_MB }}" | bc -l) )); then
            echo "⚠️ Bundle size above threshold: ${bundle_size}MB > ${{ env.BUNDLE_SIZE_THRESHOLD_MB }}MB"
            needs_optimization=true
            issues+=("bundle-size")
          fi
          
          echo "needs_optimization=$needs_optimization" >> $GITHUB_OUTPUT
          echo "optimization_issues=${issues[*]}" >> $GITHUB_OUTPUT
          
          if [[ "$needs_optimization" == "true" ]]; then
            echo "🎯 Optimization needed for: ${issues[*]}"
          else
            echo "✅ All performance metrics within thresholds"
          fi
      
      # ================
      # Performance Grading
      # 目的: パフォーマンス総合評価
      # Purpose: Overall performance grading
      # ================
      - name: "🏆 Performance Grading"
        id: grading
        run: |
          echo "🏆 Calculating overall performance grade..."
          
          performance="${{ steps.lighthouse.outputs.performance }}"
          accessibility="${{ steps.lighthouse.outputs.accessibility }}"
          best_practices="${{ steps.lighthouse.outputs.best_practices }}"
          seo="${{ steps.lighthouse.outputs.seo }}"
          
          # 総合スコア計算（重み付き平均）
          # Performance: 40%, Accessibility: 25%, Best Practices: 20%, SEO: 15%
          overall_score=$((
            (performance * 40 + accessibility * 25 + best_practices * 20 + seo * 15) / 100
          ))
          
          # グレード判定
          if [[ $overall_score -ge 90 ]]; then
            grade="A+"
            grade_emoji="🏆"
          elif [[ $overall_score -ge 85 ]]; then
            grade="A"
            grade_emoji="🥇"
          elif [[ $overall_score -ge 80 ]]; then
            grade="B+"
            grade_emoji="🥈"
          elif [[ $overall_score -ge 75 ]]; then
            grade="B"
            grade_emoji="🥉"
          elif [[ $overall_score -ge 70 ]]; then
            grade="C+"
            grade_emoji="📈"
          elif [[ $overall_score -ge 60 ]]; then
            grade="C"
            grade_emoji="⚠️"
          else
            grade="D"
            grade_emoji="🔴"
          fi
          
          echo "📊 Overall Performance Score: ${overall_score}/100"
          echo "🏆 Performance Grade: ${grade_emoji} ${grade}"
          
          echo "performance_grade=${grade_emoji} ${grade}" >> $GITHUB_OUTPUT
          echo "overall_score=$overall_score" >> $GITHUB_OUTPUT

  core-web-vitals:
    # ================================
    # Job: core-web-vitals
    # Description: Core Web Vitals 詳細分析
    #              Detailed Core Web Vitals analysis
    # Dependencies: performance-baseline (parallel)
    # Timeout: 15分
    # ================================
    name: "📈 [Vitals] Core Web Vitals Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: performance-baseline
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ github.token }}
      
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'
      
      # ================
      # Advanced Core Web Vitals Analysis
      # 目的: Core Web Vitals の詳細分析
      # Purpose: Detailed Core Web Vitals analysis
      # ================
      - name: "📈 Detailed Core Web Vitals Analysis"
        run: |
          echo "📈 Analyzing Core Web Vitals in detail..."
          
          # Web Vitals 測定スクリプト実行
          npm ci
          npm run build
          
          # テストサーバー起動
          npm run preview &
          SERVER_PID=$!
          sleep 10
          
          # Core Web Vitals 測定（より詳細な分析）
          echo "🔍 Measuring detailed Core Web Vitals..."
          
          # 複数回測定して平均値を取得
          measurements=()
          for i in {1..3}; do
            echo "📊 Measurement round $i/3..."
            
            npx lighthouse http://localhost:4173 \
              --output=json \
              --output-path="lighthouse-cwv-$i.json" \
              --chrome-flags="--headless --no-sandbox" \
              --throttling-method=devtools \
              --only-categories=performance || true
            
            if [[ -f "lighthouse-cwv-$i.json" ]]; then
              measurements+=("lighthouse-cwv-$i.json")
            fi
            
            sleep 5
          done
          
          # 測定結果の統合分析
          if [[ ${#measurements[@]} -gt 0 ]]; then
            echo "📊 Analyzing ${#measurements[@]} measurements..."
            
            # 平均値計算（簡易実装）
            total_fcp=0
            total_lcp=0
            valid_measurements=0
            
            for file in "${measurements[@]}"; do
              if [[ -f "$file" ]]; then
                fcp_numeric=$(jq -r '.audits["first-contentful-paint"].numericValue // 0' "$file" 2>/dev/null | cut -d. -f1)
                lcp_numeric=$(jq -r '.audits["largest-contentful-paint"].numericValue // 0' "$file" 2>/dev/null | cut -d. -f1)
                
                if [[ $fcp_numeric -gt 0 && $lcp_numeric -gt 0 ]]; then
                  total_fcp=$((total_fcp + fcp_numeric))
                  total_lcp=$((total_lcp + lcp_numeric))
                  valid_measurements=$((valid_measurements + 1))
                fi
              fi
            done
            
            if [[ $valid_measurements -gt 0 ]]; then
              avg_fcp=$((total_fcp / valid_measurements))
              avg_lcp=$((total_lcp / valid_measurements))
              
              avg_fcp_seconds=$(echo "scale=2; $avg_fcp / 1000" | bc -l)
              avg_lcp_seconds=$(echo "scale=2; $avg_lcp / 1000" | bc -l)
              
              echo "📊 Average FCP: ${avg_fcp_seconds}s"
              echo "📊 Average LCP: ${avg_lcp_seconds}s"
              
              # 閾値評価
              if (( $(echo "$avg_fcp_seconds <= ${{ env.FIRST_CONTENTFUL_PAINT_THRESHOLD }}" | bc -l) )); then
                echo "✅ FCP within good threshold"
                fcp_status="good"
              else
                echo "⚠️ FCP needs improvement"
                fcp_status="needs-improvement"
              fi
              
              if (( $(echo "$avg_lcp_seconds <= ${{ env.LARGEST_CONTENTFUL_PAINT_THRESHOLD }}" | bc -l) )); then
                echo "✅ LCP within good threshold"
                lcp_status="good"
              else
                echo "⚠️ LCP needs improvement"
                lcp_status="needs-improvement"
              fi
            else
              echo "⚠️ No valid measurements obtained"
            fi
          else
            echo "❌ No measurements were successful"
          fi
          
          # テストサーバー停止
          kill $SERVER_PID || true
        id: cwv-analysis

  performance-optimization:
    # ================================
    # Job: performance-optimization
    # Description: パフォーマンス最適化の提案と実行
    #              Performance optimization suggestions and execution
    # Dependencies: performance-baseline
    # Timeout: 20分
    # ================================
    name: "⚡ [Optimize] Performance Enhancement"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: performance-baseline
    if: needs.performance-baseline.outputs.needs_optimization == 'true'
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ github.token }}
      
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: "📦 Install Dependencies"
        run: npm ci
      
      # ================
      # Bundle Optimization
      # 目的: バンドル最適化の実行
      # Purpose: Execute bundle optimization
      # ================
      - name: "📦 Bundle Optimization"
        if: contains(needs.performance-baseline.outputs.optimization_issues, 'bundle-size')
        run: |
          echo "📦 Executing bundle optimization..."
          
          # webpack-bundle-analyzer で詳細分析
          npm install --save-dev webpack-bundle-analyzer 2>/dev/null || true
          
          # Tree-shaking の改善
          echo "🌳 Optimizing tree-shaking..."
          
          # 使用されていないコードの特定（簡易版）
          echo "🔍 Identifying unused code..."
          npx depcheck --json > unused-deps.json 2>/dev/null || true
          
          if [[ -f "unused-deps.json" ]]; then
            unused_count=$(jq -r '.dependencies | length' unused-deps.json 2>/dev/null || echo "0")
            echo "📊 Unused dependencies found: $unused_count"
          fi
          
          # コード分割の改善提案
          echo "✂️ Analyzing code splitting opportunities..."
          find src/ -name "*.jsx" -o -name "*.tsx" | xargs wc -l | sort -nr | head -5 | while read line; do
            echo "📋 Large component: $line"
          done
          
          echo "✅ Bundle optimization analysis completed"
        id: bundle-optimization
      
      # ================
      # Image Optimization
      # 目的: 画像最適化の実行
      # Purpose: Execute image optimization
      # ================
      - name: "🖼️ Image Optimization"
        run: |
          echo "🖼️ Executing image optimization..."
          
          # 大きな画像ファイルの特定
          large_images=()
          if [[ -d "public" ]]; then
            while IFS= read -r -d '' img; do
              size=$(stat -f%z "$img" 2>/dev/null || stat -c%s "$img" 2>/dev/null || echo "0")
              if [[ $size -gt 100000 ]]; then  # 100KB以上
                large_images+=("$img")
                echo "🖼️ Large image: $img ($(($size / 1024))KB)"
              fi
            done < <(find public/ src/ -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" \) -print0 2>/dev/null)
          fi
          
          # 画像最適化スクリプト実行
          if [[ -f "scripts/optimize-images.js" ]]; then
            node scripts/optimize-images.js || echo "Image optimization script executed"
          fi
          
          echo "📊 Large images found: ${#large_images[@]}"
          echo "image_optimization_completed=true" >> $GITHUB_OUTPUT
        id: image-optimization
      
      # ================
      # Performance Best Practices
      # 目的: パフォーマンスベストプラクティス実装
      # Purpose: Implement performance best practices
      # ================
      - name: "🚀 Performance Best Practices"
        run: |
          echo "🚀 Implementing performance best practices..."
          
          optimizations_applied=()
          
          # Service Worker の確認と最適化
          if [[ -f "public/sw.js" ]]; then
            echo "✅ Service Worker present"
            optimizations_applied+=("service-worker")
          else
            echo "⚠️ Service Worker not found - consider implementing for caching"
          fi
          
          # Preload/Prefetch の確認
          echo "🔍 Analyzing resource hints..."
          if [[ -f "index.html" ]]; then
            if grep -q "preload\|prefetch" index.html; then
              echo "✅ Resource hints found"
              optimizations_applied+=("resource-hints")
            else
              echo "⚠️ Consider adding preload/prefetch for critical resources"
            fi
          fi
          
          # Font loading 最適化
          echo "🔤 Checking font loading optimization..."
          if [[ -f "src/index.css" ]] && grep -q "font-display" src/index.css; then
            echo "✅ Font display optimization present"
            optimizations_applied+=("font-display")
          else
            echo "⚠️ Consider adding font-display: swap for web fonts"
          fi
          
          echo "optimizations_applied=${optimizations_applied[*]}" >> $GITHUB_OUTPUT
        id: best-practices

  # ================================
  # Job: performance-report
  # Description: 包括的パフォーマンスレポート
  #              Comprehensive performance report
  # Dependencies: All performance jobs
  # Timeout: 15分
  # ================================
  performance-report:
    name: "📋 [Report] Performance Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [performance-baseline, core-web-vitals, performance-optimization]
    if: always()
    
    steps:
      - name: "📋 Generate Performance Report"
        run: |
          echo "📋 Generating comprehensive performance report..."
          
          cat > performance-report.md << EOF
          # ⚡ Performance Monitoring Report
          
          ## 🏆 Performance Grade / パフォーマンスグレード
          
          **Overall Grade**: ${{ needs.performance-baseline.outputs.performance_grade }}
          
          ## 📊 Lighthouse Metrics / Lighthouse指標
          
          | Metric | Score | Threshold | Status |
          |--------|-------|-----------|---------|
          | **Performance** | ${{ needs.performance-baseline.outputs.lighthouse_performance }}/100 | ${{ env.LIGHTHOUSE_THRESHOLD_PERFORMANCE }} | $([ "${{ needs.performance-baseline.outputs.lighthouse_performance }}" -ge "${{ env.LIGHTHOUSE_THRESHOLD_PERFORMANCE }}" ] && echo "✅ Pass" || echo "⚠️ Needs Improvement") |
          | **Accessibility** | ${{ needs.performance-baseline.outputs.lighthouse_accessibility }}/100 | ${{ env.LIGHTHOUSE_THRESHOLD_ACCESSIBILITY }} | $([ "${{ needs.performance-baseline.outputs.lighthouse_accessibility }}" -ge "${{ env.LIGHTHOUSE_THRESHOLD_ACCESSIBILITY }}" ] && echo "✅ Pass" || echo "⚠️ Needs Improvement") |
          | **Best Practices** | ${{ needs.performance-baseline.outputs.lighthouse_best_practices }}/100 | ${{ env.LIGHTHOUSE_THRESHOLD_BEST_PRACTICES }} | $([ "${{ needs.performance-baseline.outputs.lighthouse_best_practices }}" -ge "${{ env.LIGHTHOUSE_THRESHOLD_BEST_PRACTICES }}" ] && echo "✅ Pass" || echo "⚠️ Needs Improvement") |
          | **SEO** | ${{ needs.performance-baseline.outputs.lighthouse_seo }}/100 | ${{ env.LIGHTHOUSE_THRESHOLD_SEO }} | $([ "${{ needs.performance-baseline.outputs.lighthouse_seo }}" -ge "${{ env.LIGHTHOUSE_THRESHOLD_SEO }}" ] && echo "✅ Pass" || echo "⚠️ Needs Improvement") |
          
          ## 📦 Bundle Analysis / バンドル分析
          
          - **Total Bundle Size**: ${{ needs.performance-baseline.outputs.bundle_size_mb }}MB
          - **Threshold**: ${{ env.BUNDLE_SIZE_THRESHOLD_MB }}MB
          - **Status**: $([ "${{ needs.performance-baseline.outputs.bundle_size_mb }}" \< "${{ env.BUNDLE_SIZE_THRESHOLD_MB }}" ] && echo "✅ Within Limit" || echo "⚠️ Exceeds Threshold")
          
          ## 📈 Core Web Vitals / コアウェブバイタル
          
          - **First Contentful Paint**: ${{ needs.performance-baseline.outputs.lighthouse_fcp || 'N/A' }}
          - **Largest Contentful Paint**: ${{ needs.performance-baseline.outputs.lighthouse_lcp || 'N/A' }}
          - **Cumulative Layout Shift**: ${{ needs.performance-baseline.outputs.lighthouse_cls || 'N/A' }}
          
          ## 🔧 Optimization Status / 最適化状況
          
          - **Optimization Required**: ${{ needs.performance-baseline.outputs.needs_optimization }}
          - **Optimization Job**: ${{ needs.performance-optimization.result }}
          EOF
          
          if [[ "${{ needs.performance-optimization.result }}" == "success" ]]; then
            cat >> performance-report.md << EOF
          - **Bundle Optimization**: Completed
          - **Image Optimization**: ${{ needs.performance-optimization.outputs.image_optimization_completed || 'N/A' }}
          - **Best Practices Applied**: ${{ needs.performance-optimization.outputs.optimizations_applied || 'N/A' }}
          EOF
          fi
          
          cat >> performance-report.md << EOF
          
          ## 🎯 Performance Recommendations / パフォーマンス推奨事項
          
          ### 🔴 Critical Priority / 重要優先度
          EOF
          
          # 重要な推奨事項を動的に追加
          if [[ "${{ needs.performance-baseline.outputs.lighthouse_performance }}" -lt "70" ]]; then
            echo "- **Critical Performance Issues**: Address fundamental performance problems immediately"
          fi >> performance-report.md
          
          if [[ "${{ needs.performance-baseline.outputs.bundle_size_mb }}" > "2" ]]; then
            echo "- **Bundle Size Reduction**: Implement aggressive code splitting and tree-shaking"
          fi >> performance-report.md
          
          cat >> performance-report.md << EOF
          
          ### 🟡 High Priority / 高優先度
          - Implement advanced caching strategies
          - Optimize critical rendering path
          - Enable compression (Gzip/Brotli)
          - Optimize images and fonts
          
          ### 🟢 Medium Priority / 中優先度
          - Implement progressive web app features
          - Add resource hints (preload, prefetch)
          - Optimize third-party scripts
          - Monitor real user metrics (RUM)
          
          ## 📊 Performance Trends / パフォーマンストレンド
          
          *Historical performance data will be available after multiple runs*
          
          ## 📞 Next Actions / 次のアクション
          
          1. **Review Critical Issues**: Address any performance scores below 70
          2. **Implement Optimizations**: Apply recommended performance improvements
          3. **Monitor Regularly**: Set up continuous performance monitoring
          4. **Update Baselines**: Adjust performance thresholds as needed
          5. **User Experience Focus**: Prioritize optimizations that improve user experience
          
          ---
          *Generated by Performance Monitoring System at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          *Next monitoring: $(date -u -d '+1 day' '+%Y-%m-%d %H:%M:%S UTC')*
          EOF
          
          echo "✅ Performance report generated"
      
      # ================
      # Create Performance Issue (if needed)
      # 目的: パフォーマンス問題のIssue作成
      # Purpose: Create performance issue if needed
      # ================
      - name: "🚨 Create Performance Issue"
        if: needs.performance-baseline.outputs.needs_optimization == 'true' && (needs.performance-baseline.outputs.lighthouse_performance < 60 || needs.performance-baseline.outputs.bundle_size_mb > 2)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const performanceScore = '${{ needs.performance-baseline.outputs.lighthouse_performance }}';
            const bundleSize = '${{ needs.performance-baseline.outputs.bundle_size_mb }}';
            
            let priority = 'medium';
            if (performanceScore < 50 || bundleSize > 3) {
              priority = 'critical';
            } else if (performanceScore < 70 || bundleSize > 2) {
              priority = 'high';
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚡ Performance Degradation Detected - ${priority.toUpperCase()} Priority`,
              body: `
            ## ⚡ Performance Alert - Action Required
            
            **Performance Score**: ${performanceScore}/100
            **Bundle Size**: ${bundleSize}MB
            **Priority**: ${priority.toUpperCase()}
            **Detection Date**: ${new Date().toISOString()}
            
            ### 📊 Current Metrics
            - Lighthouse Performance: ${performanceScore}/100 (Target: ${{ env.LIGHTHOUSE_THRESHOLD_PERFORMANCE }})
            - Bundle Size: ${bundleSize}MB (Target: <${{ env.BUNDLE_SIZE_THRESHOLD_MB }}MB)
            - Optimization Required: ${{ needs.performance-baseline.outputs.needs_optimization }}
            
            ### 🎯 Issues Detected
            ${{ needs.performance-baseline.outputs.optimization_issues }}
            
            ### 📋 Recommended Actions
            1. Review performance report in workflow artifacts
            2. Implement bundle size optimization
            3. Address Lighthouse performance recommendations
            4. Monitor Core Web Vitals improvements
            5. Consider implementing performance budget
            
            ### 🔗 Related Reports
            - Performance Report: Available in workflow artifacts
            - Bundle Analysis: Check bundle-analysis.json
            - Lighthouse Report: Review lighthouse-results.report.html
            
            **This issue was automatically created by the Performance Monitoring System.**
              `,
              labels: ['performance', priority, 'optimization', 'auto-generated']
            });
      
      # ================
      # Upload Performance Reports
      # 目的: パフォーマンスレポートのアーティファクト保存
      # Purpose: Save performance reports as artifacts
      # ================
      - name: "📦 Upload Performance Reports"
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: performance-report-${{ github.run_id }}
          path: |
            performance-report.md
            lighthouse-results.report.html
            lighthouse-results.report.json
            lighthouse-summary.json
            bundle-analysis.json
            lighthouse-cwv-*.json
            unused-deps.json
          retention-days: 90
