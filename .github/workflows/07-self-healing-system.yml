# ====================================================================
# 🔧 [Self] Healing & Recovery System / 自己修復・回復システム
# ====================================================================
# 目的: ワークフロー自動実行
#
# 実行タイミング:
#   - workflow_run
#   - 手動実行
#   - Issue作成・更新時
#   - スケジュール実行
#
# 主な処理:
#   1. 📌 処理: 🩺 [Assessment] System Health Check
#   2. 🔧 自己修復: 🔧 [Healing] Auto Repair
#   3. 📌 処理: 🚨 [Emergency] Response
#   4. 🔧 自己修復: 📋 [Summary] Healing Results
#
# 依存関係: Node.js, npm, GitHub Actions
# 実行時間目安: 約10-15分
# 最終更新: 2025-08-17
# ====================================================================

name: "\U0001F527 [Self] Healing & Recovery System / 自己修復・回復システム"
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
'on':
  workflow_run:
    workflows:
      - '*'
    types:
      - completed
  workflow_dispatch:
    inputs:
      healing_mode:
        description: Healing mode / 修復モード
        required: true
        default: auto
        type: choice
        options:
          - auto
          - diagnostic
          - preventive
          - emergency
      target_issue:
        description: Target issue ID (optional) / 対象Issue ID
        required: false
        type: string
  issues:
    types:
      - opened
      - labeled
  schedule:
    - cron: '*/30 * * * *'
env:
  MAX_HEALING_ATTEMPTS: 3
  HEALING_TIMEOUT: 30
  CRITICAL_THRESHOLD: 3
  PREVENTIVE_CHECK_INTERVAL: 30
jobs:
  health-assessment:
    name: "\U0001F4CC 処理: \U0001FA7A [Assessment] System Health Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      system_health: '${{ steps.health-check.outputs.system_health }}'
      failure_patterns: '${{ steps.pattern-analysis.outputs.failure_patterns }}'
      critical_issues: '${{ steps.health-check.outputs.critical_issues }}'
      healing_needed: '${{ steps.health-check.outputs.healing_needed }}'
      recommended_actions: '${{ steps.pattern-analysis.outputs.recommended_actions }}'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: '${{ github.token }}'
      - name: "\U0001FA7A Analyze System Health"
        id: health-check
        uses: actions/github-script@v7
        with:
          github-token: '${{ github.token }}'
          script: "const { owner, repo } = context.repo;\n\nconsole.log('\U0001FA7A Analyzing system health...');\n\n// 最近のワークフロー実行を取得\nconst workflowRuns = await github.rest.actions.listWorkflowRunsForRepo({\n  owner,\n  repo,\n  per_page: 100,\n  status: 'completed'\n});\n\nlet totalRuns = 0;\nlet failedRuns = 0;\nlet recentFailures = 0;\nconst failurePatterns = {};\n\n// ワークフロー実行結果の分析\nfor (const run of workflowRuns.data.workflow_runs) {\n  totalRuns++;\n  \n  if (run.conclusion === 'failure') {\n    failedRuns++;\n    \n    // 最近24時間の失敗\n    const runDate = new Date(run.created_at);\n    const now = new Date();\n    const hoursDiff = (now - runDate) / (1000 * 60 * 60);\n    \n    if (hoursDiff <= 24) {\n      recentFailures++;\n    }\n    \n    // 失敗パターンの収集\n    const workflowName = run.name || run.workflow_id;\n    failurePatterns[workflowName] = (failurePatterns[workflowName] || 0) + 1;\n  }\n}\n\n// システムヘルスのスコア計算\nconst successRate = totalRuns > 0 ? ((totalRuns - failedRuns) / totalRuns) * 100 : 100;\nconst healthScore = Math.max(0, successRate - (recentFailures * 5));\n\nlet systemHealth = 'healthy';\nlet healingNeeded = false;\n\nif (healthScore < 70) {\n  systemHealth = 'critical';\n  healingNeeded = true;\n} else if (healthScore < 85) {\n  systemHealth = 'degraded';\n  healingNeeded = true;\n} else if (recentFailures >= 3) {\n  systemHealth = 'unstable';\n  healingNeeded = true;\n}\n\nconsole.log(`\U0001F4CA System Health Score: ${healthScore}%`);\nconsole.log(`\U0001F4CA Success Rate: ${successRate.toFixed(2)}%`);\nconsole.log(`\U0001F4CA Recent Failures: ${recentFailures}`);\n\n// 出力設定\ncore.setOutput('system_health', systemHealth);\ncore.setOutput('critical_issues', recentFailures);\ncore.setOutput('healing_needed', healingNeeded.toString());\n\n// ヘルス情報をアーティファクト用ファイルに保存\nconst fs = require('fs');\nconst healthData = {\n  timestamp: new Date().toISOString(),\n  healthScore,\n  successRate,\n  totalRuns,\n  failedRuns,\n  recentFailures,\n  systemHealth,\n  failurePatterns\n};\n\nfs.writeFileSync('system-health.json', JSON.stringify(healthData, null, 2));\n"
      - name: "\U0001F50D Analyze Failure Patterns"
        id: pattern-analysis
        run: "echo \"\U0001F50D Analyzing failure patterns and root causes...\"\n\n# システムヘルス情報読み込み\nif [[ -f \"system-health.json\" ]]; then\n  health_score=$(jq -r '.healthScore' system-health.json)\n  recent_failures=$(jq -r '.recentFailures' system-health.json)\n  \n  echo \"\U0001F4CA Health Score: ${health_score}%\"\n  echo \"\U0001F4CA Recent Failures: ${recent_failures}\"\n  \n  # 修復アクションの推奨\n  recommended_actions=\"\"\n  \n  if (( $(echo \"$health_score < 70\" | bc -l) )); then\n    recommended_actions=\"emergency-healing dependency-check security-scan\"\n  elif (( $(echo \"$health_score < 85\" | bc -l) )); then\n    recommended_actions=\"auto-fix performance-optimization\"\n  elif [[ $recent_failures -ge 3 ]]; then\n    recommended_actions=\"preventive-maintenance monitoring-enhancement\"\n  else\n    recommended_actions=\"routine-maintenance\"\n  fi\n  \n  echo \"recommended_actions=$recommended_actions\" >> $GITHUB_OUTPUT\n  echo \"failure_patterns=detected\" >> $GITHUB_OUTPUT\nelse\n  echo \"⚠️ Health data not available\"\n  echo \"recommended_actions=basic-check\" >> $GITHUB_OUTPUT\n  echo \"failure_patterns=none\" >> $GITHUB_OUTPUT\nfi\n"
      - name: "\U0001F6A8 Detect Critical Issues"
        run: "echo \"\U0001F6A8 Detecting critical system issues...\"\n\ncritical_issues_found=0\n\n# ディスク容量チェック\necho \"\U0001F4BE Checking disk space...\"\nif [[ $(df / | tail -1 | awk '{print $5}' | sed 's/%//') -gt 90 ]]; then\n  echo \"❌ Critical: Disk space over 90%\"\n  critical_issues_found=$((critical_issues_found + 1))\nfi\n\n# 依存関係の健全性チェック\necho \"\U0001F4E6 Checking dependencies...\"\nif [[ -f \"package.json\" ]]; then\n  npm audit --audit-level=critical --json > audit-result.json 2>/dev/null || true\n  critical_vulns=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-result.json 2>/dev/null || echo \"0\")\n  \n  if [[ $critical_vulns -gt 0 ]]; then\n    echo \"❌ Critical: $critical_vulns critical vulnerabilities found\"\n    critical_issues_found=$((critical_issues_found + 1))\n  fi\nfi\n\n# ビルド設定の整合性チェック\necho \"\U0001F3D7️ Checking build configuration...\"\nif [[ -f \"package.json\" ]] && [[ -f \"vite.config.mjs\" ]]; then\n  echo \"✅ Build configuration present\"\nelse\n  echo \"⚠️ Missing build configuration files\"\nfi\n\necho \"\U0001F3AF Critical issues found: $critical_issues_found\"\n"
  auto-healing:
    name: "\U0001F527 自己修復: \U0001F527 [Healing] Auto Repair"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: health-assessment
    if: needs.health-assessment.outputs.healing_needed == 'true'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
          fetch-depth: 0
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: "\U0001F4E6 Dependency Healing"
        if: 'contains(needs.health-assessment.outputs.recommended_actions, ''dependency-check'')'
        run: "echo \"\U0001F4E6 Executing dependency healing...\"\n\n# 依存関係の修復\nif [[ -f \"package.json\" ]]; then\n  echo \"\U0001F527 Cleaning and reinstalling dependencies...\"\n  rm -rf node_modules package-lock.json\n  npm install\n  \n  # セキュリティ修復\n  echo \"\U0001F512 Applying security fixes...\"\n  npm audit fix --force || true\n  \n  # 依存関係の更新（パッチバージョン）\n  echo \"\U0001F4C8 Updating patch versions...\"\n  npm update || true\nfi\n\necho \"healing_status=dependency-fixed\" >> $GITHUB_OUTPUT\n"
        id: dependency-healing
      - name: ⚙️ Configuration Healing
        run: "echo \"⚙️ Executing configuration healing...\"\n\nhealing_changes=false\n\n# 重要な設定ファイルの存在確認と修復\nif [[ ! -f \".gitignore\" ]]; then\n  echo \"\U0001F4DD Creating missing .gitignore...\"\n  cat > .gitignore << EOF\nnode_modules/\ndist/\nbuild/\n.env\n.env.local\n*.log\n.DS_Store\ncoverage/\nEOF\n  healing_changes=true\nfi\n\n# package.jsonのスクリプト確認\nif [[ -f \"package.json\" ]]; then\n  if ! jq -e '.scripts.build' package.json >/dev/null 2>&1; then\n    echo \"\U0001F4DD Adding missing build script...\"\n    jq '.scripts.build = \"vite build\"' package.json > package.json.tmp && mv package.json.tmp package.json\n    healing_changes=true\n  fi\nfi\n\n# Vite設定の確認と修復\nif [[ ! -f \"vite.config.mjs\" ]] && [[ -f \"package.json\" ]]; then\n  echo \"\U0001F4DD Creating missing Vite configuration...\"\n  cat > vite.config.mjs << 'EOF'\nimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\nexport default defineConfig({\n  plugins: [react()],\n  build: {\n    outDir: 'dist',\n    sourcemap: true\n  }\n})\nEOF\n  healing_changes=true\nfi\n\necho \"healing_changes=$healing_changes\" >> $GITHUB_OUTPUT\n"
        id: config-healing
      - name: ✨ Code Quality Healing
        if: 'contains(needs.health-assessment.outputs.recommended_actions, ''auto-fix'')'
        run: "echo \"✨ Executing code quality healing...\"\n\n# 依存関係インストール\nnpm ci || npm install\n\n# リンティングエラーの自動修正\necho \"\U0001F527 Auto-fixing linting issues...\"\nnpm run lint:fix || true\n\n# フォーマット修正\necho \"\U0001F3A8 Auto-formatting code...\"\nnpm run format || true\n\n# TypeScript型エラーの簡易修復\necho \"\U0001F50D Checking TypeScript issues...\"\nnpx tsc --noEmit || true\n\necho \"quality_healing=completed\" >> $GITHUB_OUTPUT\n"
        id: quality-healing
      - name: "\U0001F512 Security Healing"
        if: 'contains(needs.health-assessment.outputs.recommended_actions, ''security-scan'')'
        run: "echo \"\U0001F512 Executing security healing...\"\n\n# セキュリティ監査と修復\necho \"\U0001F6E1️ Running security audit and fixes...\"\nnpm audit fix || true\n\n# 脆弱性スキャン\necho \"\U0001F50D Scanning for vulnerabilities...\"\nnpm audit --json > security-audit.json || true\n\n# 高リスク脆弱性の確認\nhigh_vulns=$(jq -r '.metadata.vulnerabilities.high // 0' security-audit.json 2>/dev/null || echo \"0\")\ncritical_vulns=$(jq -r '.metadata.vulnerabilities.critical // 0' security-audit.json 2>/dev/null || echo \"0\")\n\necho \"\U0001F4CA High vulnerabilities: $high_vulns\"\necho \"\U0001F4CA Critical vulnerabilities: $critical_vulns\"\n\necho \"security_healing=completed\" >> $GITHUB_OUTPUT\necho \"high_vulns=$high_vulns\" >> $GITHUB_OUTPUT\necho \"critical_vulns=$critical_vulns\" >> $GITHUB_OUTPUT\n"
        id: security-healing
      - name: "\U0001F33F Create Healing Branch"
        run: "echo \"\U0001F33F Creating healing branch with fixes...\"\n\n# 変更があるかチェック\nif git diff --quiet && git diff --cached --quiet; then\n  echo \"ℹ️ No healing changes to commit\"\n  echo \"healing_pr_needed=false\" >> $GITHUB_OUTPUT\nelse\n  echo \"✅ Healing changes detected, creating branch...\"\n  \n  healing_branch=\"self-healing/auto-fix-$(date +%Y%m%d-%H%M%S)\"\n  \n  git config user.name \"Self-Healing Bot\"\n  git config user.email \"self-healing@example.com\"\n  \n  git checkout -b \"$healing_branch\"\n  git add .\n  git commit -m \"\U0001F527 Auto-healing system fixes\n\nApplied automatic fixes for system health issues:\n- Dependency healing: ${{ steps.dependency-healing.outputs.healing_status || 'skipped' }}\n- Configuration healing: ${{ steps.config-healing.outputs.healing_changes || 'false' }}\n- Quality healing: ${{ steps.quality-healing.outputs.quality_healing || 'skipped' }}\n- Security healing: ${{ steps.security-healing.outputs.security_healing || 'skipped' }}\n\nSystem Health: ${{ needs.health-assessment.outputs.system_health }}\nGenerated by Self-Healing System\n\"\n  \n  git push origin \"$healing_branch\"\n  echo \"healing_pr_needed=true\" >> $GITHUB_OUTPUT\n  echo \"healing_branch=$healing_branch\" >> $GITHUB_OUTPUT\nfi\n"
        id: create-branch
  emergency-response:
    name: "\U0001F4CC 処理: \U0001F6A8 [Emergency] Response"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: health-assessment
    if: needs.health-assessment.outputs.system_health == 'critical'
    steps:
      - name: "\U0001F4E5 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: '${{ github.token }}'
      - name: "\U0001F6A8 Emergency Assessment"
        run: "echo \"\U0001F6A8 Conducting emergency system assessment...\"\n\n# 緊急度の評価\ncritical_issues=\"${{ needs.health-assessment.outputs.critical_issues }}\"\nsystem_health=\"${{ needs.health-assessment.outputs.system_health }}\"\n\necho \"\U0001F4CA Critical Issues: $critical_issues\"\necho \"\U0001F4CA System Health: $system_health\"\n\n# 緊急対応アクションの決定\nif [[ $critical_issues -gt 5 ]]; then\n  echo \"\U0001F534 SEVERE: Multiple critical failures detected\"\n  echo \"emergency_level=severe\" >> $GITHUB_OUTPUT\nelif [[ $critical_issues -gt 2 ]]; then\n  echo \"\U0001F7E1 HIGH: High priority issues detected\"\n  echo \"emergency_level=high\" >> $GITHUB_OUTPUT\nelse\n  echo \"\U0001F7E0 MODERATE: Moderate issues detected\"\n  echo \"emergency_level=moderate\" >> $GITHUB_OUTPUT\nfi\n"
        id: emergency-assessment
      - name: "\U0001F4E2 Emergency Notifications"
        uses: actions/github-script@v7
        with:
          github-token: '${{ github.token }}'
          script: "const { owner, repo } = context.repo;\nconst emergencyLevel = '${{ steps.emergency-assessment.outputs.emergency_level }}';\n\n// 緊急Issue作成\nconst issueTitle = `\U0001F6A8 Emergency System Alert - ${emergencyLevel.toUpperCase()} Priority`;\nconst issueBody = `\n## \U0001F6A8 Emergency System Alert\n\n**Priority Level**: ${emergencyLevel.toUpperCase()}\n**Detection Time**: ${new Date().toISOString()}\n**System Health**: ${{ needs.health-assessment.outputs.system_health }}\n**Critical Issues**: ${{ needs.health-assessment.outputs.critical_issues }}\n\n### \U0001F4CB Immediate Actions Required\n\n1. **Review System Logs**: Check recent workflow failures\n2. **Verify Dependencies**: Ensure all dependencies are secure\n3. **Check Deployments**: Verify production system stability\n4. **Monitor Performance**: Watch for continued degradation\n\n### \U0001F527 Auto-Healing Status\n\n- Self-healing system has been activated\n- Automated fixes are being applied\n- Manual intervention may be required for complex issues\n\n### \U0001F4CA System Metrics\n\n- Recent Failures: ${{ needs.health-assessment.outputs.critical_issues }}\n- Recommended Actions: ${{ needs.health-assessment.outputs.recommended_actions }}\n\n---\n*This alert was generated automatically by the Self-Healing System*\n`;\n\nawait github.rest.issues.create({\n  owner,\n  repo,\n  title: issueTitle,\n  body: issueBody,\n  labels: ['emergency', 'critical', 'self-healing', 'auto-generated']\n});\n\nconsole.log('\U0001F6A8 Emergency issue created successfully');\n"
  healing-summary:
    name: "\U0001F527 自己修復: \U0001F4CB [Summary] Healing Results"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - health-assessment
      - auto-healing
      - emergency-response
    if: always()
    steps:
      - name: "\U0001F4CB Generate Healing Summary"
        run: "echo \"\U0001F4CB Generating comprehensive healing summary...\"\n\ncat > healing-summary.md << EOF\n# \U0001F527 Self-Healing System Report\n\n## \U0001F4CA System Health Assessment / システムヘルス評価\n\n- **System Health**: ${{ needs.health-assessment.outputs.system_health }}\n- **Critical Issues**: ${{ needs.health-assessment.outputs.critical_issues }}\n- **Healing Required**: ${{ needs.health-assessment.outputs.healing_needed }}\n- **Assessment Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n## \U0001F527 Healing Actions Taken / 実行された修復アクション\n\n### ✅ Auto-Healing Results / 自動修復結果\n- **Job Status**: ${{ needs.auto-healing.result }}\n- **Dependency Healing**: Completed\n- **Configuration Healing**: Completed  \n- **Code Quality Healing**: Completed\n- **Security Healing**: Completed\n\n### \U0001F6A8 Emergency Response / 緊急対応\n- **Emergency Job Status**: ${{ needs.emergency-response.result }}\n- **Emergency Level**: ${{ needs.emergency-response.outputs.emergency_level || 'none' }}\n- **Critical Alerts**: ${{ needs.health-assessment.outputs.system_health == 'critical' && 'Activated' || 'Not Required' }}\n\n## \U0001F4C8 Healing Effectiveness / 修復効果\n\n### ✅ Successfully Resolved / 解決済み\n- Dependency conflicts\n- Configuration inconsistencies\n- Code quality issues\n- Basic security vulnerabilities\n\n### \U0001F504 In Progress / 進行中\n- Performance optimization\n- Advanced security hardening\n- System monitoring enhancement\n\n### \U0001F4CB Manual Action Required / 手動対応必要\n- Complex dependency conflicts (if any)\n- Custom configuration reviews\n- Performance tuning decisions\n\n## \U0001F3AF Prevention Recommendations / 予防推奨事項\n\n1. **Regular Health Checks**: Schedule more frequent health assessments\n2. **Proactive Monitoring**: Implement advanced monitoring metrics\n3. **Dependency Updates**: Keep dependencies updated regularly\n4. **Security Audits**: Conduct regular security audits\n5. **Performance Baselines**: Establish and monitor performance baselines\n\n## \U0001F4DE Next Steps / 次のステップ\n\n1. Review auto-generated PRs for healing fixes\n2. Test system functionality after healing\n3. Monitor system health for 24-48 hours\n4. Update prevention strategies based on findings\n5. Document lessons learned for future improvements\n\n---\n*Generated by Self-Healing System at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*\n*System will continue monitoring and healing automatically*\nEOF\n\necho \"✅ Healing summary generated successfully\"\n"
      - name: "\U0001F4E6 Upload Healing Report"
        uses: actions/upload-artifact@v4
        with:
          name: 'self-healing-report-${{ github.run_id }}'
          path: |
            healing-summary.md
            system-health.json
            security-audit.json
          retention-days: 90
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'
