name: Claude Code Interaction Logger

on:
  workflow_dispatch:
    inputs:
      interaction_type:
        description: 'Type of Claude interaction'
        required: true
        default: 'Feature Implementation'
        type: choice
        options:
        - Feature Implementation
        - Bug Fix
        - Refactoring
        - Architecture Decision
        - Performance Optimization
        - Documentation Update
        - Testing
        - Configuration Change
        - Discussion/Analysis
      
      priority:
        description: 'Priority level'
        required: true
        default: 'Medium'
        type: choice
        options:
        - Critical
        - High
        - Medium
        - Low
        - Info
      
      title:
        description: 'Brief title for the interaction'
        required: true
        type: string
      
      user_request:
        description: 'User request/instruction'
        required: true
        type: string
      
      claude_analysis:
        description: 'Claude analysis summary'
        required: true
        type: string
      
      implementation:
        description: 'Implementation details'
        required: true
        type: string

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const timestamp = new Date().toISOString();
            const sessionId = `claude-${timestamp.replace(/[:.]/g, '-')}`;
            
            const issueBody = `## 🤖 Claude Code Interaction Log

            **Session ID:** ${sessionId}
            **Timestamp:** ${timestamp}
            **Model:** claude-opus-4-1-20250805

            ### 📝 User Request/Instruction
            ${context.payload.inputs.user_request}

            ### 🧠 Claude's Analysis
            ${context.payload.inputs.claude_analysis}

            ### ⚙️ Implementation Details
            ${context.payload.inputs.implementation}

            ### 📊 Metadata
            - **Type:** ${context.payload.inputs.interaction_type}
            - **Priority:** ${context.payload.inputs.priority}
            - **Workflow Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            ---
            *This issue was automatically generated by the Claude Code Interaction Logger*`;

            const labels = [
              'claude-code',
              'automated',
              `type:${context.payload.inputs.interaction_type.toLowerCase().replace(' ', '-')}`,
              `priority:${context.payload.inputs.priority.toLowerCase()}`
            ];

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Claude-Log] ${context.payload.inputs.title}`,
              body: issueBody,
              labels: labels
            });

            console.log(`Created issue #${response.data.number}: ${response.data.html_url}`);
            
            return response.data.number;
