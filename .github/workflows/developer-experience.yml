# ====================================================================
# 開発者体験向上パイプライン
# ====================================================================
# 目的: 開発者の生産性を向上させるツールやプロセスを
#      自動化し、開発体験を最適化する
# 
# 実行タイミング:
#   - main/developブランチへのプッシュ時
#   - プルリクエスト時
#   - 手動実行（workflow_dispatch）
#
# 主な処理:
#   1. 開発環境の自動セットアップ
#   2. コード品質レポートの生成
#   3. ドキュメントの自動更新
#   4. 開発メトリクスの収集
#   5. DXスコアの計測と改善提案
# ====================================================================

name: 🛠️ 開発者体験向上

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Type of developer experience enhancement'
        required: true
        default: 'setup'
        type: choice
        options:
          - setup
          - benchmark
          - health-check
          - documentation
          - environment-info
  push:
    branches: [main, develop]
    paths:
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.config.*'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  # Development Environment Setup and Validation
  dev-environment-setup:
    name: Development Environment Setup
    runs-on: ubuntu-latest
    if: inputs.action_type == 'setup' || github.event_name != 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        
      - name: Setup PMP Learning Project
        id: setup
        uses: ./.github/actions/setup-project
        with:
          node-version: '18'
          install-deps: true
          setup-cache: true
          install-browsers: false
          run-health-check: true
          
      - name: Validate development tools
        run: |
          echo "🔧 Validating development tools..."
          
          # Check essential commands
          TOOLS=("node" "npm" "npx" "git")
          for tool in "${TOOLS[@]}"; do
            if command -v $tool &> /dev/null; then
              VERSION=$($tool --version 2>/dev/null || echo "unknown")
              echo "✅ $tool: $VERSION"
            else
              echo "❌ $tool: not found"
            fi
          done
          
          # Check npm scripts
          echo ""
          echo "📜 Available npm scripts:"
          npm run 2>&1 | grep "^  " || echo "No scripts found"
          
      - name: Generate development quick start guide
        run: |
          cat > DEV_QUICK_START.md << 'EOF'
          # 🚀 Quick Start Guide for PMP Learning Management
          
          ## Prerequisites
          - Node.js 18+ 
          - npm 8+
          - Git
          
          ## Setup Commands
          ```bash
          # Clone the repository
          git clone https://github.com/yusuke-kurosawa/PMPLearningManagement.git
          cd PMPLearningManagement
          
          # Install dependencies
          npm ci
          
          # Start development server
          npm run dev
          ```
          
          ## Useful Commands
          | Command | Description |
          |---------|-------------|
          | `npm run dev` | Start development server |
          | `npm run build` | Build for production |
          | `npm run test` | Run unit tests |
          | `npm run test:e2e` | Run end-to-end tests |
          | `npm run lint` | Check code quality |
          | `npm run format` | Format code |
          | `npm run typecheck` | Check TypeScript |
          
          ## Development URLs
          - **Local**: http://localhost:3000
          - **Production**: https://yusuke-kurosawa.github.io/PMPLearningManagement/
          
          ## Project Structure
          ```
          src/
          ├── components/     # React components
          ├── pages/         # Page components  
          ├── data/          # Data files and fixtures
          ├── services/      # Business logic
          ├── utils/         # Utility functions
          └── styles/        # CSS and styling
          ```
          
          ## Getting Help
          - 📖 [Full Documentation](docs/README.md)
          - 🐛 [Report Issues](https://github.com/yusuke-kurosawa/PMPLearningManagement/issues)
          - 🔧 [Contributing Guide](CONTRIBUTING.md)
          EOF
          
          echo "📖 Quick start guide generated"
          
      - name: Upload development artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: dev-environment-setup
          path: |
            DEV_QUICK_START.md
          retention-days: 7

  # Performance Benchmarking
  performance-benchmark:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    if: inputs.action_type == 'benchmark' || github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        
      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '18'
          install-deps: true
          
      - name: Build performance benchmark
        run: |
          echo "⚡ Running performance benchmarks..."
          
          # Build timing
          BUILD_START=$(date +%s)
          npm run build
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          
          # Bundle size analysis
          if [ -d "dist" ]; then
            BUNDLE_SIZE=$(du -sb dist/ | cut -f1)
            BUNDLE_SIZE_MB=$(echo "scale=2; $BUNDLE_SIZE / 1024 / 1024" | bc)
          else
            BUNDLE_SIZE_MB="0"
          fi
          
          # Test execution timing
          TEST_START=$(date +%s)
          npm run test:run > /dev/null 2>&1 || true
          TEST_END=$(date +%s)
          TEST_TIME=$((TEST_END - TEST_START))
          
          # Lint timing
          LINT_START=$(date +%s)
          npm run lint > /dev/null 2>&1 || true
          LINT_END=$(date +%s)
          LINT_TIME=$((LINT_END - LINT_START))
          
          # Generate benchmark report
          cat > performance-benchmark.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "environment": {
              "node": "$(node --version)",
              "npm": "$(npm --version)",
              "os": "$(uname -s)"
            },
            "metrics": {
              "buildTime": ${BUILD_TIME},
              "bundleSizeMB": ${BUNDLE_SIZE_MB},
              "testTime": ${TEST_TIME},
              "lintTime": ${LINT_TIME}
            },
            "commit": "${{ github.sha }}"
          }
          EOF
          
          echo "📊 Performance Benchmark Results:"
          echo "  Build Time: ${BUILD_TIME}s"
          echo "  Bundle Size: ${BUNDLE_SIZE_MB}MB"
          echo "  Test Time: ${TEST_TIME}s"  
          echo "  Lint Time: ${LINT_TIME}s"
          
      - name: Compare with baseline
        run: |
          # This would typically compare against stored baseline metrics
          # For now, we'll provide thresholds
          
          BUILD_TIME=$(cat performance-benchmark.json | jq '.metrics.buildTime')
          BUNDLE_SIZE=$(cat performance-benchmark.json | jq '.metrics.bundleSizeMB')
          
          echo "🎯 Performance Analysis:"
          
          # Build time check (should be under 60s)
          if [ "$BUILD_TIME" -lt "60" ]; then
            echo "✅ Build time is acceptable ($BUILD_TIME s)"
          else
            echo "⚠️ Build time is high ($BUILD_TIME s) - consider optimization"
          fi
          
          # Bundle size check (should be under 10MB)
          if (( $(echo "$BUNDLE_SIZE < 10" | bc -l) )); then
            echo "✅ Bundle size is acceptable (${BUNDLE_SIZE}MB)"
          else
            echo "⚠️ Bundle size is large (${BUNDLE_SIZE}MB) - consider optimization"
          fi
          
      - name: Upload benchmark results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: performance-benchmark
          path: performance-benchmark.json
          retention-days: 30

  # Project Health Check
  project-health-check:
    name: Project Health Check
    runs-on: ubuntu-latest
    if: inputs.action_type == 'health-check' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        
      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '18'
          install-deps: true
          run-health-check: true
          
      - name: Comprehensive health analysis
        run: |
          echo "🏥 Running comprehensive project health check..."
          
          # Initialize health report
          cat > health-report.json << 'EOF'
          {
            "timestamp": "",
            "overallHealth": "unknown",
            "checks": {
              "dependencies": {"status": "unknown", "details": []},
              "codeQuality": {"status": "unknown", "details": []},
              "security": {"status": "unknown", "details": []},
              "performance": {"status": "unknown", "details": []},
              "documentation": {"status": "unknown", "details": []}
            },
            "recommendations": []
          }
          EOF
          
          # Update timestamp
          jq --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" '.timestamp = $timestamp' health-report.json > temp.json && mv temp.json health-report.json
          
          # Dependency health
          echo "📦 Checking dependency health..."
          if npm audit --audit-level=high --json > audit-results.json 2>/dev/null; then
            VULN_COUNT=$(cat audit-results.json | jq '.vulnerabilities | length // 0')
            if [ "$VULN_COUNT" -eq "0" ]; then
              jq '.checks.dependencies.status = "healthy" | .checks.dependencies.details = ["No high-severity vulnerabilities"]' health-report.json > temp.json && mv temp.json health-report.json
            else
              jq --arg count "$VULN_COUNT" '.checks.dependencies.status = "warning" | .checks.dependencies.details = [$count + " vulnerabilities found"]' health-report.json > temp.json && mv temp.json health-report.json
            fi
          fi
          
          # Code quality health
          echo "✨ Checking code quality..."
          if npm run lint > /dev/null 2>&1; then
            jq '.checks.codeQuality.status = "healthy" | .checks.codeQuality.details = ["Linting passed"]' health-report.json > temp.json && mv temp.json health-report.json
          else
            jq '.checks.codeQuality.status = "warning" | .checks.codeQuality.details = ["Linting issues found"]' health-report.json > temp.json && mv temp.json health-report.json
          fi
          
          # TypeScript health
          if npm run typecheck > /dev/null 2>&1; then
            jq '.checks.codeQuality.details += ["TypeScript compilation passed"]' health-report.json > temp.json && mv temp.json health-report.json
          else
            jq '.checks.codeQuality.details += ["TypeScript compilation issues"]' health-report.json > temp.json && mv temp.json health-report.json
          fi
          
          # Build health
          echo "🔨 Checking build health..."
          if npm run build > /dev/null 2>&1; then
            jq '.checks.performance.status = "healthy" | .checks.performance.details = ["Build successful"]' health-report.json > temp.json && mv temp.json health-report.json
          else
            jq '.checks.performance.status = "error" | .checks.performance.details = ["Build failed"]' health-report.json > temp.json && mv temp.json health-report.json
          fi
          
          # Documentation health
          echo "📚 Checking documentation health..."
          DOC_FILES=(README.md CONTRIBUTING.md docs/README.md)
          DOC_COUNT=0
          for doc in "${DOC_FILES[@]}"; do
            if [ -f "$doc" ]; then
              DOC_COUNT=$((DOC_COUNT + 1))
            fi
          done
          
          if [ "$DOC_COUNT" -ge "2" ]; then
            jq --arg count "$DOC_COUNT" '.checks.documentation.status = "healthy" | .checks.documentation.details = [$count + " documentation files found"]' health-report.json > temp.json && mv temp.json health-report.json
          else
            jq --arg count "$DOC_COUNT" '.checks.documentation.status = "warning" | .checks.documentation.details = ["Limited documentation (" + $count + " files)"]' health-report.json > temp.json && mv temp.json health-report.json
          fi
          
          # Calculate overall health
          HEALTHY_COUNT=$(cat health-report.json | jq '[.checks[] | select(.status == "healthy")] | length')
          WARNING_COUNT=$(cat health-report.json | jq '[.checks[] | select(.status == "warning")] | length')  
          ERROR_COUNT=$(cat health-report.json | jq '[.checks[] | select(.status == "error")] | length')
          
          if [ "$ERROR_COUNT" -gt "0" ]; then
            OVERALL="critical"
          elif [ "$WARNING_COUNT" -gt "2" ]; then
            OVERALL="warning"
          else
            OVERALL="healthy"
          fi
          
          jq --arg overall "$OVERALL" '.overallHealth = $overall' health-report.json > temp.json && mv temp.json health-report.json
          
          echo "📋 Health Check Summary:"
          echo "  Overall: $OVERALL"
          echo "  Healthy: $HEALTHY_COUNT checks"
          echo "  Warning: $WARNING_COUNT checks"
          echo "  Error: $ERROR_COUNT checks"
          
      - name: Generate health recommendations
        run: |
          # Add specific recommendations based on health status
          WARNING_COUNT=$(cat health-report.json | jq '[.checks[] | select(.status == "warning")] | length')
          ERROR_COUNT=$(cat health-report.json | jq '[.checks[] | select(.status == "error")] | length')
          
          RECOMMENDATIONS=()
          
          if [ "$ERROR_COUNT" -gt "0" ]; then
            RECOMMENDATIONS+=("Fix critical build or compilation errors immediately")
          fi
          
          if [ "$WARNING_COUNT" -gt "0" ]; then
            RECOMMENDATIONS+=("Address code quality and security warnings")
            RECOMMENDATIONS+=("Update dependencies with known vulnerabilities")
          fi
          
          RECOMMENDATIONS+=("Run 'npm audit fix' to automatically resolve dependencies")
          RECOMMENDATIONS+=("Use 'npm run lint:fix' to automatically fix linting issues")
          RECOMMENDATIONS+=("Consider adding more comprehensive documentation")
          
          # Convert array to JSON and update report
          printf '%s\n' "${RECOMMENDATIONS[@]}" | jq -R . | jq -s . > recommendations.json
          jq --slurpfile recs recommendations.json '.recommendations = $recs[0]' health-report.json > temp.json && mv temp.json health-report.json
          
      - name: Upload health report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: project-health-report
          path: health-report.json
          retention-days: 30

  # Environment Information Collection
  environment-info:
    name: Environment Information
    runs-on: ${{ matrix.os }}
    if: inputs.action_type == 'environment-info' || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
        
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        
      - name: Collect environment information
        run: |
          echo "🌍 Collecting environment information..."
          
          cat > env-info-${{ matrix.os }}-node${{ matrix.node-version }}.json << EOF
          {
            "os": "${{ matrix.os }}",
            "nodeVersion": "${{ matrix.node-version }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "system": {
              "platform": "$(uname -s 2>/dev/null || echo 'Windows')",
              "architecture": "$(uname -m 2>/dev/null || echo 'unknown')",
              "kernel": "$(uname -r 2>/dev/null || echo 'unknown')"
            }
          }
          EOF
          
      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Test project compatibility
        run: |
          echo "🧪 Testing project compatibility..."
          
          # Install dependencies
          npm ci --prefer-offline --no-audit
          
          # Test basic commands
          RESULTS=()
          
          if npm run lint > /dev/null 2>&1; then
            RESULTS+=("lint: pass")
          else
            RESULTS+=("lint: fail")
          fi
          
          if npm run typecheck > /dev/null 2>&1; then
            RESULTS+=("typecheck: pass")
          else
            RESULTS+=("typecheck: fail")
          fi
          
          if npm run build > /dev/null 2>&1; then
            RESULTS+=("build: pass")
          else
            RESULTS+=("build: fail")
          fi
          
          if npm run test:run > /dev/null 2>&1; then
            RESULTS+=("test: pass")
          else
            RESULTS+=("test: fail")
          fi
          
          # Update environment info with results
          printf '%s\n' "${RESULTS[@]}" | jq -R . | jq -s . > results.json
          jq --slurpfile results results.json '.compatibility = $results[0]' env-info-${{ matrix.os }}-node${{ matrix.node-version }}.json > temp.json
          mv temp.json env-info-${{ matrix.os }}-node${{ matrix.node-version }}.json
          
          echo "✅ Compatibility test completed"
          
      - name: Upload environment info
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: environment-info-${{ matrix.os }}-node${{ matrix.node-version }}
          path: env-info-${{ matrix.os }}-node${{ matrix.node-version }}.json
          retention-days: 30

  # Create Developer Experience Summary
  developer-summary:
    name: Developer Experience Summary
    runs-on: ubuntu-latest
    needs: [dev-environment-setup, performance-benchmark, project-health-check]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: artifacts/
          
      - name: Generate developer experience report
        run: |
          echo "📊 Generating comprehensive developer experience report..."
          
          cat > developer-experience-report.md << EOF
          # Developer Experience Report
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow:** [Developer Experience Enhancement](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ## 🚀 Setup & Environment
          EOF
          
          if [ -f "artifacts/dev-environment-setup/DEV_QUICK_START.md" ]; then
            echo "✅ Development environment setup completed successfully" >> developer-experience-report.md
            echo "- Quick start guide generated" >> developer-experience-report.md
            echo "- All development tools validated" >> developer-experience-report.md
          else
            echo "⚠️ Development environment setup had issues" >> developer-experience-report.md
          fi
          
          echo "" >> developer-experience-report.md
          echo "## ⚡ Performance Metrics" >> developer-experience-report.md
          
          if [ -f "artifacts/performance-benchmark/performance-benchmark.json" ]; then
            BUILD_TIME=$(cat artifacts/performance-benchmark/performance-benchmark.json | jq '.metrics.buildTime')
            BUNDLE_SIZE=$(cat artifacts/performance-benchmark/performance-benchmark.json | jq '.metrics.bundleSizeMB')
            echo "- **Build Time:** ${BUILD_TIME}s" >> developer-experience-report.md
            echo "- **Bundle Size:** ${BUNDLE_SIZE}MB" >> developer-experience-report.md
          else
            echo "- Performance benchmark data not available" >> developer-experience-report.md
          fi
          
          echo "" >> developer-experience-report.md
          echo "## 🏥 Project Health" >> developer-experience-report.md
          
          if [ -f "artifacts/project-health-report/health-report.json" ]; then
            OVERALL_HEALTH=$(cat artifacts/project-health-report/health-report.json | jq -r '.overallHealth')
            HEALTHY_COUNT=$(cat artifacts/project-health-report/health-report.json | jq '[.checks[] | select(.status == "healthy")] | length')
            WARNING_COUNT=$(cat artifacts/project-health-report/health-report.json | jq '[.checks[] | select(.status == "warning")] | length')
            
            case $OVERALL_HEALTH in
              "healthy") HEALTH_EMOJI="✅" ;;
              "warning") HEALTH_EMOJI="⚠️" ;;
              "critical") HEALTH_EMOJI="❌" ;;
              *) HEALTH_EMOJI="❓" ;;
            esac
            
            echo "- **Overall Health:** $HEALTH_EMOJI $OVERALL_HEALTH" >> developer-experience-report.md
            echo "- **Healthy Checks:** $HEALTHY_COUNT" >> developer-experience-report.md
            echo "- **Warnings:** $WARNING_COUNT" >> developer-experience-report.md
          else
            echo "- Project health data not available" >> developer-experience-report.md
          fi
          
          echo "" >> developer-experience-report.md
          echo "## 📋 Quick Actions for Developers" >> developer-experience-report.md
          echo "" >> developer-experience-report.md
          echo "### Getting Started" >> developer-experience-report.md
          echo '```bash' >> developer-experience-report.md
          echo "# Setup development environment" >> developer-experience-report.md
          echo "npm ci" >> developer-experience-report.md
          echo "npm run dev" >> developer-experience-report.md
          echo '```' >> developer-experience-report.md
          echo "" >> developer-experience-report.md
          echo "### Common Commands" >> developer-experience-report.md
          echo "- \`npm run lint\` - Check code quality" >> developer-experience-report.md
          echo "- \`npm run test\` - Run tests" >> developer-experience-report.md
          echo "- \`npm run build\` - Build for production" >> developer-experience-report.md
          echo "- \`npm run format\` - Format code" >> developer-experience-report.md
          echo "" >> developer-experience-report.md
          echo "### Troubleshooting" >> developer-experience-report.md
          echo "- \`npm run lint:fix\` - Auto-fix linting issues" >> developer-experience-report.md
          echo "- \`npm audit fix\` - Fix security vulnerabilities" >> developer-experience-report.md
          echo "- \`rm -rf node_modules package-lock.json && npm install\` - Reset dependencies" >> developer-experience-report.md
          
          echo "✅ Developer experience report generated"
          
      - name: Upload comprehensive report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: developer-experience-report
          path: developer-experience-report.md
          retention-days: 90

  # Update PR with developer insights
  update-pr-with-insights:
    name: Update PR with Developer Insights
    runs-on: ubuntu-latest
    needs: [project-health-check]
    if: github.event_name == 'pull_request' && always()
    
    steps:
      - name: Add developer experience comment to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const healthStatus = '${{ needs.project-health-check.result }}';
            
            let statusEmoji, statusText;
            if (healthStatus === 'success') {
              statusEmoji = '✅';
              statusText = 'Healthy';
            } else if (healthStatus === 'failure') {
              statusEmoji = '❌';
              statusText = 'Issues Detected';
            } else {
              statusEmoji = '⚠️';
              statusText = 'Unknown';
            }
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🛠️ Developer Experience')
            );
            
            const body = `🛠️ **Developer Experience Check**
            
            **Project Health:** ${statusEmoji} ${statusText}
            
            ## Quick Start for Reviewers
            \`\`\`bash
            # Test this PR locally
            gh pr checkout ${{ github.event.number }}
            npm ci
            npm run dev
            \`\`\`
            
            ## Validation Results
            - **Setup:** Automated development environment validation completed
            - **Health Check:** ${statusText.toLowerCase()}
            - **Performance:** Build and bundle metrics collected
            
            ## Useful Commands
            - \`npm run test\` - Run all tests
            - \`npm run lint\` - Check code quality  
            - \`npm run build\` - Test production build
            - \`npm run typecheck\` - Validate TypeScript
            
            ## Resources
            - 📊 [View detailed reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📖 [Development Guide](DEV_QUICK_START.md)
            
            ---
            *Developer experience validation by GitHub Actions*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
