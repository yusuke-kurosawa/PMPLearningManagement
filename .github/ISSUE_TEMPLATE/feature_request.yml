name: ✨ Feature Request
description: 新機能の提案と機能拡張の要求（Enhancement）
title: "[Feature]: "
labels: ["enhancement", "needs-analysis"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request
        
        PMPLearningManagementの新機能をご提案いただき、ありがとうございます。
        詳細な要件をご提供いただくことで、より良い機能を開発できます。

  - type: checkboxes
    id: prechecks
    attributes:
      label: 🔍 事前確認
      description: 機能要求前に以下をご確認ください
      options:
        - label: 既存のissueで同様の機能が提案されていないことを確認した
          required: true
        - label: 現在の機能で要件を満たせないことを確認した
          required: true
        - label: この機能がプロジェクトの目標に合致することを確認した
          required: true

  - type: input
    id: feature_title
    attributes:
      label: 🎯 機能名
      description: 提案する機能の名前を簡潔に記載してください
      placeholder: "例: AI学習コーチング機能、音声読み上げ機能、チーム学習モード"
    validations:
      required: true

  - type: dropdown
    id: feature_type
    attributes:
      label: 📋 機能カテゴリ
      description: この機能はどのカテゴリに属しますか？
      options:
        - "学習機能の拡張（フラッシュカード、進捗管理など）"
        - "視覚化の改善（新しいチャート、グラフ機能）"
        - "試験機能の強化（模擬試験、分析機能）"
        - "PWA機能（オフライン、プッシュ通知など）"
        - "ユーザーエクスペリエンス（UI/UX改善）"
        - "アクセシビリティ（障害者対応機能）"
        - "パフォーマンス（速度向上、最適化）"
        - "コラボレーション（チーム機能、共有機能）"
        - "統合機能（外部システム連携）"
        - "管理機能（ユーザー管理、統計など）"
        - "セキュリティ（認証、暗号化など）"
        - "その他"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 📊 優先度
      description: この機能の重要度を評価してください
      options:
        - "Critical - ビジネスクリティカル（必須機能）"
        - "High - 高優先度（競合優位性の向上）"
        - "Medium - 中優先度（ユーザーエクスペリエンス向上）"
        - "Low - 低優先度（Nice to have）"
        - "Future - 将来検討（ロードマップ候補）"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: 🎯 解決したい課題・背景
      description: |
        現在どのような課題があり、この機能でどのように解決したいかを説明してください。
        ユーザーストーリーの形式でも構いません。
      placeholder: |
        例:
        **現在の課題**:
        - PMP学習者が自分の弱点を客観的に把握できない
        - 学習効率が悪く、無駄な時間を費やしている
        - 個別最適化された学習パスが提供されていない
        
        **ユーザーストーリー**:
        PMP学習者として、AIが私の学習履歴を分析して個別最適化された学習プランを提供してほしい。
        そうすることで、効率的に弱点を克服し、試験合格率を向上させたい。
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 💡 提案する解決策
      description: |
        具体的にどのような機能・仕組みで課題を解決するかを詳細に説明してください。
        UI/UXのアイデアやワイヤーフレームがあれば含めてください。
      placeholder: |
        例:
        **AIコーチング機能**:
        1. 学習履歴の分析（正答率、学習時間、弱点分野）
        2. 個別学習プランの自動生成
        3. リアルタイムでの学習アドバイス
        4. 進捗に基づく学習プランの動的調整
        
        **UI設計**:
        - ダッシュボードに「AIコーチ」タブを追加
        - 学習開始前に推奨問題セットを表示
        - 学習中にヒントやアドバイスをポップアップ表示
        
        **技術要件**:
        - OpenAI GPT-4 API integration
        - 学習データの機械学習分析
        - パーソナライゼーションエンジン
    validations:
      required: true

  - type: textarea
    id: user_stories
    attributes:
      label: 👥 ユーザーストーリー
      description: |
        異なるユーザータイプの視点から、この機能がどのように使われるかを記載してください。
        As a [ユーザータイプ], I want [機能] so that [目的/価値] の形式で記載。
      placeholder: |
        **PMP受験者として**:
        - As a PMP受験者, I want AIコーチから学習アドバイスを受けたい so that 効率的に弱点を克服できる
        - As a PMP受験者, I want 個人最適化された問題セットを受けたい so that 限られた時間で最大の学習効果を得られる
        
        **PMP有資格者として**:
        - As a PMP有資格者, I want 最新のPMBOK情報を自動で取得したい so that 継続的に知識をアップデートできる
        
        **学習管理者として**:
        - As a 企業の学習管理者, I want チーム全体の学習進捗を把握したい so that 適切なサポートを提供できる
      value: |
        **[ユーザータイプ]として**:
        - As a [ユーザータイプ], I want [機能] so that [目的/価値]
        - As a [ユーザータイプ], I want [機能] so that [目的/価値]
        
        **[別のユーザータイプ]として**:
        - As a [ユーザータイプ], I want [機能] so that [目的/価値]
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: ✅ 受け入れ基準
      description: |
        この機能が完成したと判断する具体的な基準をチェックボックス形式で記載してください。
        テスト可能で測定可能な基準にしてください。
      placeholder: |
        例:
        - [ ] ユーザーはダッシュボードからAIコーチ機能にアクセスできる
        - [ ] AIは過去30日間の学習履歴を分析して弱点を特定する
        - [ ] 個別最適化された問題セット（10-20問）が自動生成される
        - [ ] 学習中にリアルタイムでヒントやアドバイスが表示される
        - [ ] ユーザーはAIコーチのアドバイスを評価（Good/Bad）できる
        - [ ] AIコーチ機能は日本語と英語に対応している
        - [ ] レスポンス時間は3秒以内
        - [ ] モバイルデバイスで正常に動作する
        - [ ] オフライン時は過去のアドバイスをキャッシュから表示する
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: mockup_wireframe
    attributes:
      label: 🎨 モックアップ・ワイヤーフレーム
      description: |
        UI/UXのアイデア、ワイヤーフレーム、モックアップがあれば添付または記載してください。
        画像ファイルをドラッグ&ドロップできます。
      placeholder: |
        例:
        ```
        ┌─────────────────────────────────────┐
        │ Dashboard                      [⚙] │
        ├─────┬─────┬─────┬──────┬───────────┤
        │ Home│Study│Exam │Visual│ AI Coach │
        └─────┴─────┴─────┴──────┴───────────┘
        
        AI Coach Recommendations:
        ┌─────────────────────────────────────┐
        │ 🤖 Today's Learning Plan            │
        │                                     │
        │ Based on your recent performance:   │
        │ • Focus on Risk Management (67%)    │
        │ • Practice Stakeholder Mgmt (72%)   │
        │                                     │
        │ [Start Recommended Session] [Skip]  │
        └─────────────────────────────────────┘
        ```

  - type: dropdown
    id: target_users
    attributes:
      label: 👥 対象ユーザー
      description: この機能は主にどのようなユーザーを対象としますか？
      options:
        - "すべてのユーザー（初心者から上級者まで）"
        - "PMP初学者・受験予定者"
        - "PMP受験中の学習者"
        - "PMP有資格者（継続学習）"
        - "企業・組織の学習管理者"
        - "モバイルユーザー"
        - "PWA・オフラインユーザー"
        - "アクセシビリティが必要なユーザー"
        - "チーム・グループ学習者"
        - "エンタープライズユーザー"
    validations:
      required: true

  - type: dropdown
    id: implementation_complexity
    attributes:
      label: 🔧 実装複雑度（予想）
      description: この機能の技術的な実装難易度をどの程度と予想しますか？
      options:
        - "Simple - 1-2週間（既存機能の拡張・UI改善）"
        - "Medium - 1-2ヶ月（新機能、API統合）"
        - "Complex - 3-6ヶ月（アーキテクチャ変更、外部統合）"
        - "Epic - 6ヶ月以上（大規模機能、システム刷新）"
        - "不明（技術調査が必要）"

  - type: textarea
    id: technical_considerations
    attributes:
      label: 🏗️ 技術的検討事項
      description: |
        この機能を実装する上で考慮すべき技術的な要素があれば記載してください。
        依存関係、パフォーマンス、セキュリティ、スケーラビリティなど。
      placeholder: |
        例:
        **技術依存関係**:
        - OpenAI GPT-4 API (外部サービス依存)
        - 新しいバックエンドエンドポイント
        - ユーザー学習履歴のデータ分析基盤
        
        **パフォーマンス考慮**:
        - AI応答時間の最適化（3秒以内）
        - 大量データ処理のためのキャッシュ戦略
        - モバイル環境でのレスポンシブ対応
        
        **セキュリティ**:
        - 個人学習データの暗号化
        - 外部API通信の安全性確保
        - プライバシー保護（GDPR準拠）
        
        **スケーラビリティ**:
        - 同時ユーザー数の増加対応
        - AI処理負荷の分散
        - データベース容量の拡張性

  - type: textarea
    id: business_value
    attributes:
      label: 💰 ビジネス価値・ROI
      description: |
        この機能がビジネスにもたらす価値や、投資対効果について記載してください。
        ユーザー獲得、満足度向上、競合優位性など。
      placeholder: |
        例:
        **ビジネス価値**:
        - PMP合格率向上によるユーザー満足度向上
        - 個別最適化による学習効率向上（学習時間30%短縮）
        - AI機能による競合サービスとの差別化
        - プレミアム機能としての収益向上
        
        **定量的効果（予想）**:
        - ユーザー継続率 +25%
        - PMP合格率 +15%
        - 学習完了率 +40%
        - プレミアム版conversion rate +20%
        
        **定性的効果**:
        - ブランド認知度の向上
        - 口コミ・紹介による新規ユーザー獲得
        - エンタープライズ顧客への訴求力向上

  - type: checkboxes
    id: feature_flags
    attributes:
      label: 🚩 機能フラグ・特性
      description: この機能に関連する特性をチェックしてください
      options:
        - label: モバイル対応が重要
        - label: オフライン動作が必要
        - label: アクセシビリティ対応が必要
        - label: 多言語対応が必要
        - label: リアルタイム処理が必要
        - label: 外部API統合が必要
        - label: 大容量データ処理が必要
        - label: セキュリティ要件が高い
        - label: パフォーマンス要件が高い
        - label: エンタープライズ機能として位置づけ
        - label: プレミアム機能として課金対象
        - label: 段階的リリース（Feature Flag）を推奨

  - type: textarea
    id: alternatives_considered
    attributes:
      label: 🔄 検討した代替案
      description: |
        この機能以外に検討した解決方法や代替案があれば記載してください。
        なぜその案を採用しなかったのかも含めて。
      placeholder: |
        例:
        **代替案1: 手動での学習プラン作成**
        - 理由: ユーザーが自分で弱点を分析してプランを作成
        - 却下理由: 時間がかかり、客観性に欠ける
        
        **代替案2: 既存ツールの統合**
        - 理由: Anki等の既存フラッシュカードツールと連携
        - 却下理由: UX統合が困難、データ移行コストが高い
        
        **代替案3: ルールベースの推薦システム**
        - 理由: AIではなく事前定義ルールで学習内容を推薦
        - 却下理由: 柔軟性に欠け、個別最適化が困難

  - type: textarea
    id: success_metrics
    attributes:
      label: 📊 成功指標（KPI）
      description: |
        この機能が成功したかどうかを測定するための具体的な指標を記載してください。
        リリース後の効果測定に使用します。
      placeholder: |
        例:
        **定量指標**:
        - AIコーチ機能の利用率: 60%以上
        - 学習セッション完了率: 現在の70%から85%へ向上
        - 平均学習時間: 20%短縮
        - PMP合格率: 現在の78%から90%へ向上
        - ユーザー満足度スコア: 4.2/5.0以上
        
        **定性指標**:
        - ユーザーフィードバックでの満足度
        - カスタマーサポート問い合わせの減少
        - SNS・レビューでの肯定的な言及
        
        **測定期間**:
        - 短期（1ヶ月後）: 利用率、初期満足度
        - 中期（3ヶ月後）: 学習効果、継続率
        - 長期（6ヶ月後）: 合格率、ROI
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 📝 追加情報・補足
      description: |
        上記に含まれない追加情報があれば記載してください。
        参考資料、競合調査、ユーザーフィードバック、関連Issueなど。
      placeholder: |
        例:
        **参考情報**:
        - 関連Issue: #123, #456
        - 競合調査: 〇〇サービスでは類似機能を提供済み
        - ユーザーからの要望件数: 50件以上（過去6ヶ月）
        
        **参考資料**:
        - PMI公式ガイドライン
        - 学習科学に関する研究論文
        - AI推薦システムのベストプラクティス
        
        **制約・注意事項**:
        - 開発リソースの制約
        - 外部API利用料金の予算
        - 既存ユーザーへの影響最小化

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 🤖 自動処理について
        
        このFeature RequestはClaude AIによって自動的に：
        - ビジネス価値の分析
        - 技術的実現性の評価  
        - 実装優先度の推定
        - 関連Issue・機能との連携分析
        - Epic分解の提案
        
        が実行されます。詳細な技術検討が必要な場合は、`@claude implement` コマンドを使用してください。
        
        **開発計画**: 承認後、詳細な技術仕様書とImplementation Planが自動生成されます。