name: "🔬 Technical Spike"
description: "Research and investigation task for complex technical implementations"
title: "[SPIKE] "
labels: ["type:spike", "research", "needs-investigation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Technical Spike Template
        Use this template for time-boxed research and investigation of complex technical solutions.
        
        **Purpose**: Reduce uncertainty, validate approaches, and provide implementation guidance.
        **Time-box**: 2-5 story points (1-2.5 days maximum)

  - type: input
    id: related-epic
    attributes:
      label: "Related Epic/Feature"
      description: "Link to the main feature this spike supports"
      placeholder: "#45 - AI Coaching System"
    validations:
      required: true

  - type: dropdown
    id: spike-category
    attributes:
      label: "Spike Category"
      description: "What type of technical investigation is this?"
      options:
        - "Architecture Design - System design and technology selection"
        - "Proof of Concept - Validate technical feasibility"
        - "Performance Analysis - Scalability and optimization research"
        - "Integration Research - Third-party service evaluation"
        - "Security Assessment - Security implications and requirements"
        - "Data Modeling - Database design and data flow analysis"
        - "AI/ML Feasibility - Machine learning approach validation"
        - "Infrastructure Planning - DevOps and deployment strategy"
    validations:
      required: true

  - type: textarea
    id: research-questions
    attributes:
      label: "Research Questions"
      description: "Specific questions this spike should answer"
      placeholder: |
        - What is the best approach for implementing real-time AI coaching?
        - Which vector database provides optimal performance for our use case?
        - How can we achieve 90%+ test coverage for ML components?
        - What are the scalability limitations of different architectures?
        - How do we ensure data privacy and security compliance?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Spike Success Criteria"
      description: "What deliverables constitute a successful spike?"
      placeholder: |
        - [ ] Technical approach recommendation with pros/cons analysis
        - [ ] Proof of concept code demonstrating key concepts
        - [ ] Performance benchmarks and scalability assessment
        - [ ] Implementation cost and timeline estimates
        - [ ] Risk assessment and mitigation strategies
        - [ ] Architecture diagrams and technical documentation
    validations:
      required: true

  - type: dropdown
    id: complexity-level
    attributes:
      label: "Technical Complexity"
      description: "How complex is this investigation?"
      options:
        - "Low - Simple research with clear solutions available"
        - "Medium - Requires evaluation of multiple approaches"
        - "High - Complex integration or novel technology"
        - "Very High - Cutting-edge technology or architectural challenges"
    validations:
      required: true

  - type: checkboxes
    id: technical-areas
    attributes:
      label: "Technical Areas to Investigate"
      description: "Check all areas this spike should cover"
      options:
        - label: "API design and data modeling"
        - label: "Database performance and scalability"
        - label: "AI/ML model integration and inference"
        - label: "Real-time communication and WebSocket"
        - label: "Authentication and authorization"
        - label: "Caching and performance optimization"
        - label: "Testing strategies and automation"
        - label: "Deployment and infrastructure"
        - label: "Security and compliance"
        - label: "Monitoring and observability"

  - type: textarea
    id: constraints-assumptions
    attributes:
      label: "Constraints & Assumptions"
      description: "What limitations or assumptions should guide this research?"
      placeholder: |
        - Budget: $X maximum for third-party services
        - Timeline: Must integrate with Q2 2024 roadmap
        - Technology stack: Must be compatible with React/Node.js
        - Performance: Must support 1000+ concurrent users
        - Compliance: Must meet data privacy requirements
        - Team skills: Consider current team expertise

  - type: input
    id: timebox-estimate
    attributes:
      label: "Time-box Estimate"
      description: "Maximum time to spend on this spike"
      placeholder: "3 story points / 1.5 days"
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: "Expected Deliverables"
      description: "What artifacts should be produced?"
      placeholder: |
        - Technical recommendation document
        - Proof of concept repository/branch
        - Architecture diagrams (C4 model preferred)
        - Performance benchmark results
        - Implementation plan and estimates
        - Risk assessment matrix
        - Follow-up issues for implementation

  - type: textarea
    id: success-metrics
    attributes:
      label: "How to Measure Success"
      description: "How will we know this spike provided value?"
      placeholder: |
        - Clear technical direction established
        - Implementation risks identified and mitigated
        - Team confidence in chosen approach increased
        - Follow-up stories can be estimated accurately
        - Stakeholder concerns addressed with data

  - type: input
    id: expert-consultation
    attributes:
      label: "Subject Matter Experts"
      description: "Who should be consulted during this spike?"
      placeholder: "@ml-engineer-1, @security-expert, @architecture-team"

  - type: textarea
    id: follow-up-planning
    attributes:
      label: "Follow-up Planning"
      description: "What happens after this spike is completed?"
      placeholder: |
        - Create detailed implementation stories
        - Schedule architecture review with stakeholders
        - Update project roadmap based on findings
        - Plan next phase spikes if needed
        - Communicate findings to development teams