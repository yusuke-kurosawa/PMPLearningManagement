name: ✨ 機能要望
description: 新しい機能や改善を提案する
title: "[機能] "
labels: ["✨ 新機能", "🔍 トリアージ中"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        新機能の提案をありがとうございます！
        あなたのアイデアがプロジェクトをより良くするのに役立ちます。

  - type: textarea
    id: description
    attributes:
      label: 機能の説明
      description: 提案する機能について明確で簡潔な説明をしてください
      placeholder: この機能は何をするものですか？
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: この機能がどのような問題を解決するか説明してください
      placeholder: 現在どのような問題や不便があるのか...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どのように実装すべきか、あなたの考えを説明してください
      placeholder: この機能をどのように実装すべきか...
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: ユーザーストーリー
      description: |
        以下の形式で記述してください：
        **〜として** [ユーザータイプ]
        **〜したい** [機能]
        **なぜなら** [価値/利益]
      placeholder: |
        **学習者として**
        **進捗を視覚的に確認したい**
        **なぜなら、モチベーション維持に役立つから**

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: この機能の優先度をどう考えますか？
      options:
        - 🔴 必須 - この機能なしではプロダクトが成立しない
        - 🟠 重要 - 多くのユーザーに大きな価値を提供
        - 🟡 あると良い - ユーザー体験を向上させる
        - 🟢 将来的に - 長期的な改善項目
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影響範囲
      description: この機能が影響する領域を選択してください（複数選択可）
      multiple: true
      options:
        - 🎨 UI/UX
        - ⚙️ バックエンド
        - 📱 モバイル
        - 🗄️ データベース
        - 🔌 API
        - 🏗️ インフラ
        - 📚 学習機能
        - 🤖 AI/ML
        - 🔒 セキュリティ
        - ⚡ パフォーマンス

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の解決策があれば記載してください
      placeholder: 他に考えられる実装方法...

  - type: textarea
    id: success_criteria
    attributes:
      label: 成功基準
      description: この機能が成功したかどうかをどのように測定しますか？
      placeholder: |
        - ユーザーエンゲージメントが20%向上
        - 学習完了率が15%改善
        - サポート問い合わせが30%減少

  - type: textarea
    id: mockups
    attributes:
      label: モックアップ/ワイヤーフレーム
      description: 視覚的な説明があればスクリーンショットやリンクを追加してください

  - type: textarea
    id: technical_notes
    attributes:
      label: 技術的な考慮事項
      description: 実装に関する技術的な注意点があれば記載してください
      placeholder: |
        - 必要な新しいパッケージ
        - パフォーマンスへの影響
        - セキュリティ上の考慮事項

  - type: textarea
    id: additional_context
    attributes:
      label: 追加情報
      description: その他の関連情報やリンクがあれば記載してください

  - type: checkboxes
    id: checklist
    attributes:
      label: チェックリスト
      description: 以下の項目を確認してください
      options:
        - label: 既存のIssueを検索し、同様の提案がないことを確認しました
          required: true
        - label: この機能がプロジェクトの目標に合致することを確認しました
        - label: 実装の複雑さと価値のバランスを考慮しました
        - label: ユーザーの観点から価値を説明しました