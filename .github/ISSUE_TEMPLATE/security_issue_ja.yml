name: 🔒 セキュリティ問題
description: セキュリティ脆弱性や関連する懸念を報告する
title: "[セキュリティ] "
labels: ["🔒 セキュリティ", "🔴 緊急", "🔍 トリアージ中"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        🚨 **重要なセキュリティ通知**
        ユーザーデータやシステムの整合性を損なう可能性のある重大なセキュリティ脆弱性の場合は、
        公開Issueを作成する代わりに、GitHubのセキュリティアドバイザリ機能を通じて、
        またはsecurity@example.comにメールで非公開で報告してください。

  - type: textarea
    id: summary
    attributes:
      label: セキュリティ問題の概要
      description: セキュリティ問題の明確で簡潔な説明
      placeholder: 発見したセキュリティ問題について説明してください...
    validations:
      required: true

  - type: checkboxes
    id: affected_components
    attributes:
      label: 影響を受けるコンポーネント
      description: 該当するすべての項目をチェックしてください
      options:
        - label: 認証システム
        - label: 認可/RBAC
        - label: データストレージ/データベース
        - label: APIエンドポイント
        - label: ユーザー入力検証
        - label: セッション管理
        - label: ファイルアップロード/ダウンロード
        - label: 外部統合
        - label: モバイルアプリ
        - label: その他（詳細を記載）

  - type: checkboxes
    id: vulnerability_type
    attributes:
      label: 脆弱性の種類
      description: 該当する脆弱性の種類を選択してください
      options:
        - label: SQLインジェクション
        - label: クロスサイトスクリプティング（XSS）
        - label: クロスサイトリクエストフォージェリ（CSRF）
        - label: 認証バイパス
        - label: 認可バイパス
        - label: データ漏洩
        - label: 安全でない直接オブジェクト参照
        - label: セキュリティ設定ミス
        - label: 機密データの露出
        - label: その他（詳細を記載）

  - type: dropdown
    id: severity
    attributes:
      label: 深刻度評価
      description: この脆弱性の深刻度を選択してください
      options:
        - 🔴 緊急 - システム全体の侵害が可能
        - 🟠 高 - 重大なデータ漏洩または権限昇格
        - 🟡 中 - 限定的なデータ漏洩または機能バイパス
        - 🟢 低 - 最小限の影響での情報開示
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 再現手順
      description: セキュリティ問題を再現するための詳細な手順
      placeholder: |
        1. '...' に移動
        2. '....' としてログイン
        3. '....' に移動
        4. '....' アクションを実行
        5. セキュリティ問題を確認
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 期待されるセキュリティ動作
      description: セキュリティの観点から何が起こるべきか
      placeholder: 正常なセキュリティ動作...

  - type: textarea
    id: actual_issue
    attributes:
      label: 実際のセキュリティ問題
      description: セキュリティリスクを生じさせる実際の動作
      placeholder: 発見したセキュリティ問題の詳細...

  - type: textarea
    id: proof_of_concept
    attributes:
      label: 概念実証（PoC）
      description: 該当する場合、安全な概念実証を提供してください（害を与えないことを確認してください）
      render: shell

  - type: checkboxes
    id: impact_assessment
    attributes:
      label: 潜在的な影響
      description: 可能性のある影響をすべて選択してください
      options:
        - label: データ漏洩の可能性
        - label: ユーザーアカウントの侵害
        - label: システム整合性の侵害
        - label: サービス拒否の可能性
        - label: 権限昇格
        - label: 情報開示

  - type: checkboxes
    id: affected_users
    attributes:
      label: 影響を受けるユーザー
      description: 影響を受けるユーザーグループを選択してください
      options:
        - label: すべてのユーザー
        - label: 認証済みユーザーのみ
        - label: 管理者ユーザーのみ
        - label: 特定のユーザーロール
        - label: ゲスト/未認証ユーザー

  - type: input
    id: environment
    attributes:
      label: 環境
      description: 問題が発見された環境
      placeholder: 本番環境/ステージング/開発環境

  - type: textarea
    id: mitigation_suggestions
    attributes:
      label: 緩和策の提案
      description: この問題を修正する方法についての提案があれば記載してください
      placeholder: |
        - 提案1
        - 提案2
        - 提案3

  - type: textarea
    id: additional_context
    attributes:
      label: 追加情報
      description: セキュリティ問題に関するその他の情報を追加してください

  - type: input
    id: reporter_contact
    attributes:
      label: 報告者の連絡先（オプション）
      description: フォローアップのためのメールアドレスまたはGitHubユーザー名
      placeholder: your-email@example.com

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      description: 以下の項目を確認してください
      options:
        - label: これが正当なセキュリティ問題であることを確認しました
          required: true
        - label: この問題を他の場所で公開していません
          required: true
        - label: 問題を再現するのに十分な情報を提供しました
          required: true
        - label: この問題が高優先度として扱われることを理解しています
          required: true
        - label: 必要に応じて追加情報を提供する意思があります