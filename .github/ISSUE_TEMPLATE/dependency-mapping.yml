name: "🔗 Dependency Mapping & Roadmap"
description: "Map dependencies between issues and create development roadmap"
title: "[DEPENDENCY] "
labels: ["dependency-mapping", "roadmap-planning", "type:planning"]
assignees: ["yusuke-kurosawa"]
body:
  - type: markdown
    attributes:
      value: |
        ## Dependency Mapping & Development Roadmap
        Use this template to define dependencies between features and create a prioritized development roadmap.

  - type: input
    id: epic-reference
    attributes:
      label: "Epic/Feature Reference"
      description: "Reference to the main epic or feature"
      placeholder: "#45 - Authentication System"
    validations:
      required: true

  - type: dropdown
    id: dependency-type
    attributes:
      label: "Dependency Type"
      description: "What type of dependency mapping is this?"
      options:
        - "Technical Dependencies - Component/Service Dependencies"
        - "Feature Dependencies - User Story Prerequisites"
        - "Infrastructure Dependencies - Platform/Service Requirements"
        - "Data Dependencies - Database/API Prerequisites"
        - "Integration Dependencies - Third-party Service Requirements"
    validations:
      required: true

  - type: textarea
    id: prerequisite-issues
    attributes:
      label: "Prerequisite Issues (Blockers)"
      description: "List issues that must be completed before this can start"
      placeholder: |
        - #40 - API Backend Implementation (BLOCKS this issue)
        - #38 - TypeScript Migration (BLOCKS this issue)  
        - #47 - Test Framework Setup (BLOCKS this issue)
        
        Format: #issue-number - Issue Title (relationship)
    validations:
      required: false

  - type: textarea
    id: dependent-issues
    attributes:
      label: "Dependent Issues (Blocked)"
      description: "List issues that are blocked by or depend on this issue"
      placeholder: |
        - #41 - Real-time Sync (BLOCKED BY this issue)
        - #33 - Notification System (DEPENDS ON this issue)
        - #37 - Learning Dashboard (DEPENDS ON this issue)
        
        Format: #issue-number - Issue Title (relationship)
    validations:
      required: false

  - type: dropdown
    id: roadmap-quarter
    attributes:
      label: "Target Roadmap Quarter"
      description: "When should this be delivered based on dependencies?"
      options:
        - "Q1 2024 (Jan-Mar) - Foundation & Core Infrastructure"
        - "Q2 2024 (Apr-Jun) - User Experience & Learning Features" 
        - "Q3 2024 (Jul-Sep) - Advanced Features & AI Integration"
        - "Q4 2024 (Oct-Dec) - Optimization & Advanced Analytics"
        - "Q1 2025 (Jan-Mar) - Next Generation Features"
    validations:
      required: true

  - type: textarea
    id: parallel-work
    attributes:
      label: "Parallel Development Opportunities"
      description: "What work can be done in parallel without dependencies?"
      placeholder: |
        - UI/UX design work can start immediately
        - Database schema design can proceed in parallel
        - Unit test development can begin with interface definitions
        - Documentation and user stories can be refined

  - type: checkboxes
    id: critical-path
    attributes:
      label: "Critical Path Analysis"
      description: "Mark if this issue is on the critical path for major milestones"
      options:
        - label: "Blocks MVP release"
        - label: "Blocks beta launch"
        - label: "Blocks production deployment"
        - label: "Blocks performance milestones"
        - label: "Blocks security compliance"
        - label: "Blocks mobile app release"

  - type: dropdown
    id: team-coordination
    attributes:
      label: "Cross-Team Coordination Required"
      description: "Does this require coordination across teams?"
      options:
        - "Single team implementation"
        - "Frontend-Backend coordination"
        - "DevOps-Development coordination"
        - "Design-Development coordination"
        - "All teams coordination required"
    validations:
      required: true

  - type: textarea
    id: risk-mitigation
    attributes:
      label: "Dependency Risk Mitigation"
      description: "How to mitigate risks from dependencies?"
      placeholder: |
        - Parallel development strategies
        - Fallback plans for blocked dependencies
        - Mock services or stubs for development
        - Alternative implementation approaches
        - Communication protocols for dependency updates

  - type: input
    id: estimated-effort
    attributes:
      label: "Estimated Total Effort"
      description: "Story points or time estimate including dependencies"
      placeholder: "8 story points / 2 weeks"

  - type: textarea
    id: success-criteria
    attributes:
      label: "Roadmap Success Criteria"
      description: "How will we know the dependency roadmap is successful?"
      placeholder: |
        - Zero blocking dependencies during sprints
        - Teams can work in parallel effectively
        - Development velocity remains consistent
        - Integration points are clearly defined and tested