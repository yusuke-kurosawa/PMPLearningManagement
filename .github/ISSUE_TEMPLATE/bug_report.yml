name: 🐛 Bug Report
description: バグの報告とトラブルシューティング（既存機能の不具合）
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        
        PMPLearningManagementでバグを発見していただき、ありがとうございます。
        詳細な情報をご提供いただくことで、迅速な修正が可能になります。

  - type: checkboxes
    id: prechecks
    attributes:
      label: 🔍 事前確認
      description: バグ報告前に以下をご確認ください
      options:
        - label: 既存のissueで同様の問題が報告されていないことを確認した
          required: true
        - label: 最新版で問題が再現されることを確認した
          required: true
        - label: ブラウザのキャッシュをクリアして再試行した
          required: true

  - type: input
    id: summary
    attributes:
      label: 📋 問題の概要
      description: バグの内容を1行で簡潔に説明してください
      placeholder: "例: PWA版でオフライン時にフラッシュカードが表示されない"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 緊急度
      description: このバグの影響度を選択してください
      options:
        - "Critical - アプリが使用不可能"
        - "High - 主要機能に影響"
        - "Medium - 一部機能に影響"
        - "Low - 軽微な問題"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 🎯 影響コンポーネント
      description: 問題が発生しているコンポーネントを選択してください
      options:
        - "PMBOKマトリックス"
        - "視覚化（ネットワーク図、サンキー図など）"
        - "学習機能（フラッシュカード、進捗管理）"
        - "模擬試験"
        - "用語集"
        - "PWA機能（オフライン、プッシュ通知）"
        - "認証・ユーザー管理"
        - "モバイル・レスポンシブ"
        - "パフォーマンス"
        - "その他"
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: 🔴 現在の動作（バグの症状）
      description: 実際に起きている問題を詳細に説明してください
      placeholder: |
        例:
        - フラッシュカード学習画面でカードをクリックしても反応しない
        - エラーメッセージ「TypeError: Cannot read property 'name' of undefined」が表示される
        - ページが白い画面のまま読み込まれない
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: ✅ 期待される動作
      description: 本来どのように動作すべきかを説明してください
      placeholder: |
        例:
        - カードをクリックすると3Dアニメーションで裏面が表示される
        - エラーが発生せずに正常にデータが読み込まれる
        - ページが正常に表示される
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 🔄 再現手順
      description: バグを再現するための詳細なステップを記載してください
      placeholder: |
        1. ホームページにアクセス
        2. 「フラッシュカード学習」をクリック
        3. プロセス群「開始」を選択
        4. 最初のカードをクリック
        5. エラーが発生
      value: |
        1. 
        2. 
        3. 
        4. 
        5. 
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 💻 実行環境
      description: 問題が発生している環境を詳細に記載してください
      placeholder: |
        - OS: Windows 11, macOS 13.1, Ubuntu 22.04
        - ブラウザ: Chrome 120.0.0.0, Safari 16.1, Firefox 119.0
        - デバイス: iPhone 14, Samsung Galaxy S23, MacBook Pro M2
        - 画面サイズ: 1920x1080, 375x812（モバイル）
        - ネットワーク: オフライン、4G、WiFi
        - アクセス方法: PWA、ブラウザ、モバイルアプリ
      value: |
        - **OS**: 
        - **ブラウザ**: 
        - **デバイス**: 
        - **画面サイズ**: 
        - **ネットワーク**: 
        - **アクセス方法**: 
    validations:
      required: true

  - type: textarea
    id: console_errors
    attributes:
      label: 🚨 コンソールエラー・ログ
      description: |
        ブラウザのDevTools（F12）で確認できるエラーメッセージを貼り付けてください。
        画像のスクリーンショットがあれば、さらに役立ちます。
      placeholder: |
        例:
        ```
        TypeError: Cannot read property 'name' of undefined
            at FlashCard.jsx:45:12
            at Array.map (<anonymous>)
            at FlashCardLearning.jsx:123:8
        ```
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 スクリーンショット・画面録画
      description: |
        問題を視覚的に示すスクリーンショットや画面録画があれば添付してください。
        ファイルをドラッグ&ドロップまたは貼り付けできます。

  - type: textarea
    id: workaround
    attributes:
      label: 🔧 回避策
      description: 一時的な回避方法があれば記載してください
      placeholder: |
        例:
        - ページをリロードすると一時的に解決する
        - プライベートブラウジングでは動作する
        - 特定のデバイスでは問題なし

  - type: dropdown
    id: frequency
    attributes:
      label: 📊 発生頻度
      description: このバグはどのくらいの頻度で発生しますか？
      options:
        - "常に（100%）"
        - "頻繁に（80-99%）"
        - "時々（20-79%）"
        - "稀に（1-19%）"
        - "不明"
    validations:
      required: true

  - type: checkboxes
    id: additional_info
    attributes:
      label: 📋 追加情報
      description: 該当する項目にチェックを入れてください
      options:
        - label: このバグはセキュリティに関連する可能性がある
        - label: このバグはパフォーマンスに影響する
        - label: このバグはアクセシビリティに関連する
        - label: このバグはPWA機能に関連する
        - label: このバグはモバイルデバイス特有の問題
        - label: このバグは特定のユーザーデータで発生する
        - label: 修正の緊急性が高い（本番環境に影響）

  - type: textarea
    id: additional_context
    attributes:
      label: 📝 その他の情報
      description: |
        上記に含まれない追加情報があれば記載してください。
        例：関連するIssue番号、過去の修正履歴、ビジネス影響など
      placeholder: |
        例:
        - 関連Issue: #123, #456
        - 前回の修正でデグレードした可能性
        - 本番環境で100人以上のユーザーに影響
        - PMP試験直前の学習者に影響大

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 🤖 自動処理について
        
        このIssueは作成後、Claude AIによって自動的に：
        - 分類とラベル付け
        - 優先度の設定  
        - 関連Issue検出
        - 修正担当者の推薦
        
        が実行されます。追加情報が必要な場合は、`@claude analyze` コマンドを使用してください。
        
        **緊急の場合**: セキュリティやクリティカルなバグの場合は、SlackやDiscordで直接開発チームにお知らせください。