name: 📚 Epic - Large Feature Initiative
description: 大規模な機能開発・システム改善のエピック（複数スプリントにまたがる大きな取り組み）
title: "[Epic]: "
labels: ["epic", "needs-breakdown", "planning"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Epic - Large Feature Initiative
        
        エピックは複数の関連するユーザーストーリーや機能をグループ化した大きな取り組みです。
        通常3ヶ月から1年程度の開発期間を要する大規模な機能やシステム改善を計画する際に使用します。

  - type: checkboxes
    id: epic_prechecks
    attributes:
      label: 🔍 エピック作成前の確認
      description: エピック作成前に以下をご確認ください
      options:
        - label: このエピックは既存の機能やエピックと重複していない
          required: true
        - label: このエピックは明確なビジネス価値を提供する
          required: true
        - label: このエピックは複数のスプリント（3ヶ月以上）を要する規模である
          required: true
        - label: ステークホルダーとの初期合意が取れている
          required: true

  - type: input
    id: epic_title
    attributes:
      label: 🎯 エピック名
      description: このエピックの名前を簡潔で分かりやすく記載してください
      placeholder: "例: PMBOK第7版対応とパフォーマンスドメイン実装、エンタープライズ認証システム統合"
    validations:
      required: true

  - type: dropdown
    id: epic_category
    attributes:
      label: 📋 エピックカテゴリ
      description: このエピックはどのような種類の取り組みですか？
      options:
        - "新プロダクト・メジャー機能（New Product/Feature）"
        - "システム・アーキテクチャ改善（Architecture）"
        - "ユーザーエクスペリエンス刷新（UX/UI Redesign）"
        - "パフォーマンス・スケーラビリティ向上（Performance）"
        - "セキュリティ・コンプライアンス対応（Security）"
        - "外部統合・API開発（Integration）"
        - "技術負債解消・リファクタリング（Technical Debt）"
        - "インフラ・DevOps改善（Infrastructure）"
        - "国際化・多言語対応（i18n/l10n）"
        - "アクセシビリティ改善（Accessibility）"
        - "データ分析・BI機能（Analytics）"
        - "規制対応・標準準拠（Compliance）"
    validations:
      required: true

  - type: dropdown
    id: business_priority
    attributes:
      label: 🚀 ビジネス優先度
      description: このエピックのビジネス上の重要度を選択してください
      options:
        - "Critical - 事業継続に必須（規制対応、セキュリティ等）"
        - "High - 戦略的重要性が高い（競合優位性、売上直結）"
        - "Medium - 重要だが緊急性は中程度（改善、効率化）"
        - "Low - 将来的に重要（技術負債解消、基盤整備）"
    validations:
      required: true

  - type: textarea
    id: epic_vision
    attributes:
      label: 🌟 エピックビジョン・ゴール
      description: |
        このエピックで実現したいビジョンや最終的なゴールを記載してください。
        なぜこのエピックが重要で、完成時にどのような価値を提供するかを明確に。
      placeholder: |
        例:
        **ビジョン**: 
        PMBOK第7版に完全対応し、従来のプロセス中心の学習から、パフォーマンスドメイン中心の現代的なプロジェクトマネジメント学習を実現する。
        
        **ゴール**:
        - PMBOK第7版の12の原則と8つのパフォーマンスドメインを完全に網羅した学習環境を提供
        - 従来のプロセス群・知識エリア表示と新しいパフォーマンスドメイン表示のシームレスな切り替え
        - 新しいPMP試験（2024年以降）に完全対応した模擬試験機能
        - ユーザーが時代に対応したプロジェクトマネジメント知識を効率的に習得できる環境の実現
        
        **成功イメージ**:
        「PMPLearningManagementは業界で最も先進的なPMBOK第7版対応学習プラットフォームとして認知され、合格率95%以上を実現する」
    validations:
      required: true

  - type: textarea
    id: business_case
    attributes:
      label: 💰 ビジネスケース・投資対効果
      description: |
        なぜこのエピックに投資すべきなのか、期待される効果とROIを記載してください。
        定量的・定性的な効果の両方を含めてください。
      placeholder: |
        例:
        **投資理由**:
        - PMBOK第7版は2021年リリース後、PMI認定試験の標準となりつつある
        - 競合サービスの多くは第6版対応に留まっており、第7版対応で差別化可能
        - エンタープライズ顧客からの要望が急増（50社以上から問い合わせ）
        
        **期待効果**:
        定量効果:
        - 新規ユーザー獲得: +40%（年間2,000人増）
        - エンタープライズ契約: +300%（月間$50,000→$200,000）
        - PMP合格率向上: 85%→95%
        - ユーザー継続率: +25%
        
        定性効果:
        - 業界リーダーとしての地位確立
        - ブランド認知度・信頼性の大幅向上
        - 競合に対する技術的優位性の確保
        - 将来的な新機能開発の基盤確立
        
        **ROI試算**:
        - 投資額: $500,000（開発コスト）
        - 期待収益: $2,000,000/年（新規契約＋既存売上増）
        - ROI: 400% (12ヶ月回収)
    validations:
      required: true

  - type: textarea
    id: target_users_personas
    attributes:
      label: 👥 対象ユーザー・ペルソナ
      description: |
        このエピックの主要対象ユーザーとペルソナを詳細に記載してください。
        各ペルソナのニーズ、課題、期待する価値を含めてください。
      placeholder: |
        例:
        **プライマリーペルソナ**: 
        **新PMP受験者（佐藤さん、32歳、ITプロジェクトマネージャー）**
        - 現状: PMBOK第6版の情報が混在していて最新情報が分からない
        - ニーズ: 2024年以降の新試験に確実に合格したい
        - 期待価値: 最新の試験傾向に対応した効率的な学習
        
        **セカンダリーペルソナ**:
        **企業研修責任者（田中さん、45歳、人事部長）**
        - 現状: 社員のPM育成に最新のPMBOK対応が必要
        - ニーズ: 組織全体で統一された最新の学習環境
        - 期待価値: エンタープライズ対応と学習管理機能
        
        **PMP有資格者（継続学習）**
        - 現状: 既存知識のアップデートが必要
        - ニーズ: 第7版への知識移行とPDU取得
        - 期待価値: 既存知識からのスムーズな移行支援
    validations:
      required: true

  - type: textarea
    id: high_level_requirements
    attributes:
      label: 📋 ハイレベル要件
      description: |
        このエピックで実装すべき主要な機能・要件を箇条書きで記載してください。
        詳細仕様ではなく、全体像を把握できるレベルで。
      placeholder: |
        例:
        **コア機能要件**:
        - PMBOK第7版データモデルの実装（12原則、8パフォーマンスドメイン）
        - 第6版⇔第7版のビューモード切り替え機能
        - パフォーマンスドメインベースの新しい視覚化
        - 新試験形式対応の模擬試験機能（180問→200問、新問題形式）
        
        **ユーザーエクスペリエンス要件**:
        - 既存ユーザーの学習データ移行・統合
        - 第6版から第7版への学習パス提供
        - 新旧PMBOKの比較・マッピング機能
        - 段階的移行のためのガイダンス機能
        
        **技術要件**:
        - データベーススキーマの拡張・移行
        - 既存APIの後方互換性維持
        - 新しいデータ構造への対応
        - パフォーマンス影響の最小化
        
        **非機能要件**:
        - 既存機能の品質維持（リグレッション防止）
        - 国際化対応（英語、日本語、将来的に他言語）
        - アクセシビリティ基準の維持
        - セキュリティレベルの維持・向上
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: ✅ 成功基準・完了条件
      description: |
        このエピックが成功したと判断するための具体的で測定可能な基準を記載してください。
        技術的基準とビジネス基準の両方を含めてください。
      placeholder: |
        例:
        **技術的成功基準**:
        - [ ] PMBOK第7版データが完全に実装されている（12原則、8ドメイン）
        - [ ] 第6版⇔第7版切り替えが3秒以内で完了する
        - [ ] 既存ユーザーのデータが100%正常に移行されている  
        - [ ] 新試験形式（200問）の模擬試験が正常動作する
        - [ ] 既存機能の回帰テストが100%通過している
        - [ ] Core Web Vitals の基準を満たしている
        
        **ビジネス成功基準**:
        - [ ] β版で90%以上のユーザー満足度を達成
        - [ ] リリース後3ヶ月で新規ユーザー+30%達成
        - [ ] エンタープライズ顧客からの採用決定を3社以上獲得
        - [ ] 競合調査で「第7版対応度No.1」の評価獲得
        - [ ] PMP合格率が90%以上を達成・維持
        
        **ユーザビリティ成功基準**:
        - [ ] 新機能の利用率が60%以上
        - [ ] ユーザーサポート問い合わせが20%以下増加に抑制
        - [ ] 学習完了率が現在の水準を維持（85%以上）
    validations:
      required: true

  - type: textarea
    id: epic_breakdown
    attributes:
      label: 🗂️ エピック分解（初期案）
      description: |
        このエピックを実装するための主要なフェーズやユーザーストーリーに分解してください。
        詳細な見積もりは不要ですが、実装順序や依存関係が分かる程度に。
      placeholder: |
        例:
        **Phase 1: 基盤・データ整備（3ヶ月）**
        - PMBOK第7版データモデル設計・実装
        - データベーススキーマ拡張・移行
        - 第6版データとの互換性確保
        - 基本的なCRUD API実装
        
        **Phase 2: コア機能実装（4ヶ月）**
        - パフォーマンスドメイン視覚化機能
        - 第6版⇔第7版ビューモード切り替え
        - 新しい学習進捗管理システム
        - 比較・マッピング機能
        
        **Phase 3: 試験機能対応（2ヶ月）**
        - 新試験形式の問題データ整備
        - 200問形式の模擬試験機能
        - 第7版ベースの結果分析機能
        - アダプティブテスト機能（将来対応）
        
        **Phase 4: UX改善・最適化（2ヶ月）**
        - 移行ガイダンス機能
        - 新ユーザー向けオンボーディング
        - 既存ユーザー向け移行支援
        - パフォーマンス最適化
        
        **Phase 5: 検証・展開（1ヶ月）**
        - β版リリース・フィードバック収集
        - 最終調整・バグ修正
        - 正式リリース・マーケティング
        - ドキュメント・サポート整備
      value: |
        **Phase 1: [フェーズ名]（期間）**
        - [機能・タスク1]
        - [機能・タスク2]
        
        **Phase 2: [フェーズ名]（期間）**  
        - [機能・タスク1]
        - [機能・タスク2]
    validations:
      required: true

  - type: textarea
    id: technical_architecture
    attributes:
      label: 🏗️ 技術アーキテクチャ概要
      description: |
        このエピックの実装に必要な技術的なアーキテクチャの変更や追加を記載してください。
        新しい技術スタック、外部連携、インフラ要件など。
      placeholder: |
        例:
        **アーキテクチャ変更**:
        - データモデルの拡張（Process-based → Domain-based hybrid）
        - 新しいマイクロサービスの追加（PMBOK Version Manager）
        - GraphQL スキーマの拡張
        - Redis キャッシュ戦略の見直し
        
        **新技術要件**:
        - データ移行ツールの開発（Node.js/TypeScript）
        - バージョン管理システム（Git-like for PMBOK data）
        - A/Bテスト基盤（新旧UI比較用）
        - 分析基盤強化（第7版学習効果測定）
        
        **外部連携**:
        - PMI公式データとの同期機能
        - 新試験プロバイダーとの連携検討
        - 企業SSO統合の強化
        
        **インフラ要件**:
        - データベース容量の倍増対応
        - CDN戦略の見直し（新アセット配信）
        - 監視・ログ分析の強化
        - 災害復旧計画の更新

  - type: textarea
    id: risks_assumptions
    attributes:
      label: ⚠️ リスク・仮定・制約
      description: |
        このエピック実装における主要なリスク、仮定、制約を記載してください。
        技術的リスク、ビジネスリスク、外部依存、リソース制約など。
      placeholder: |
        例:
        **高リスク**:
        - PMI公式ガイドの解釈に不確実性（専門家レビュー必須）
        - 大規模データ移行によるサービス停止リスク
        - 競合他社の先行リリースによる優位性減少
        - 新試験の詳細仕様が不明確（PMI発表待ち）
        
        **中リスク**:
        - 既存ユーザーの第7版への適応度合い
        - パフォーマンス影響（データ量倍増）
        - 開発チームのPMBOK第7版理解度不足
        
        **主要仮定**:
        - PMI公式ガイドが2024年Q1に最終確定される
        - 既存ユーザーの80%以上が第7版移行を希望
        - エンタープライズ顧客の予算確保が可能
        - 開発チームのリソースが確保できる
        
        **制約条件**:
        - 予算上限: $500,000
        - 開発期間: 最大12ヶ月
        - チーム規模: 最大8名
        - 既存機能の品質低下は許容不可
        - GDPR等コンプライアンス要件の維持

  - type: textarea
    id: stakeholders
    attributes:
      label: 👥 ステークホルダー・関係者
      description: |
        このエピックに関わるステークホルダーとその役割・期待を記載してください。
        意思決定者、開発チーム、ユーザー代表、外部パートナーなど。
      placeholder: |
        例:
        **意思決定者**:
        - CEO: 戦略的投資判断、最終承認
        - CTO: 技術的実現性評価、アーキテクチャ承認
        - CPO: プロダクト戦略、UX要件定義
        
        **開発チーム**:
        - テックリード: 技術設計、実装リード
        - フロントエンド開発者: UI/UX実装
        - バックエンド開発者: API・データ基盤
        - DevOpsエンジニア: インフラ・デプロイ
        
        **ビジネス関係者**:
        - プロダクトマネージャー: 要件定義、優先順位
        - マーケティング: ポジショニング、プロモーション
        - セールス: 顧客要望収集、契約交渉
        - カスタマーサクセス: ユーザー移行支援
        
        **外部関係者**:
        - PMP有資格者コミュニティ: フィードバック、テスト協力
        - エンタープライズ顧客: 要件提供、パイロット参加
        - PMI認定機関: 標準準拠の確認
    validations:
      required: true

  - type: dropdown
    id: estimated_timeline
    attributes:
      label: 📅 想定タイムライン
      description: このエピック全体の完成までの想定期間を選択してください
      options:
        - "3-6ヶ月（中規模エピック）"
        - "6-9ヶ月（大規模エピック）"
        - "9-12ヶ月（メガエピック）"
        - "12ヶ月以上（戦略的取り組み）"
        - "段階的リリース（継続的開発）"
    validations:
      required: true

  - type: dropdown
    id: team_size
    attributes:
      label: 👨‍💻 想定チームサイズ
      description: このエピックの実装に必要な開発チームの規模を選択してください
      options:
        - "2-3名（小規模チーム）"
        - "4-6名（中規模チーム）"  
        - "7-10名（大規模チーム）"
        - "10名以上（複数チーム体制）"
        - "段階的スケール（フェーズにより変動）"

  - type: checkboxes
    id: epic_characteristics
    attributes:
      label: 🏷️ エピック特性
      description: このエピックに該当する特性をチェックしてください
      options:
        - label: 収益に直結する戦略的エピック
        - label: 競合優位性確保のためのエピック
        - label: 技術負債解消・基盤改善エピック
        - label: 規制対応・コンプライアンス要件
        - label: ユーザーエクスペリエンス改善エピック
        - label: スケーラビリティ・パフォーマンス改善
        - label: セキュリティ・プライバシー強化
        - label: 国際化・多言語対応
        - label: アクセシビリティ改善
        - label: エンタープライズ機能強化
        - label: データ・分析基盤改善
        - label: 外部システム統合

  - type: textarea
    id: dependencies
    attributes:
      label: 🔗 依存関係・前提条件
      description: |
        このエピックの開始や完了に必要な依存関係や前提条件を記載してください。
        他のエピック、外部システム、法的要件、リソース確保など。
      placeholder: |
        例:
        **開始前の前提条件**:
        - PMI公式ガイド第7版の最終版入手
        - PMBOK専門家との契約締結
        - データ移行計画の承認
        - 予算・リソースの正式確保
        
        **他のエピック/プロジェクトへの依存**:
        - エピック#123「新認証システム」の完了が必要
        - プロジェクト「データベース基盤刷新」との調整必要
        
        **外部依存**:
        - PMI機関からの正式認定取得
        - 新試験プロバイダーとの契約締結
        - 企業顧客との要件確認会議完了
        
        **技術的前提条件**:
        - Node.js 18+ 対応完了
        - PostgreSQL 14+ 移行完了  
        - 新CI/CDパイプライン構築完了

  - type: textarea
    id: communication_plan
    attributes:
      label: 📢 コミュニケーション計画
      description: |
        このエピック実行中のステークホルダーへの報告・コミュニケーション計画を記載してください。
        定期報告、マイルストーン、重要な意思決定ポイントなど。
      placeholder: |
        例:
        **定期報告**:
        - 週次: 開発チーム内進捗報告（毎週金曜）
        - 隔週: ステークホルダー向けプログレスレポート
        - 月次: 役員向けサマリーレポート・リスク評価
        
        **重要マイルストーン**:
        - Phase 1完了: 技術設計レビュー会議
        - Phase 2完了: β版デモ・フィードバック収集
        - Phase 3完了: 最終リリース承認会議
        
        **意思決定ポイント**:
        - Go/No-Go決定: Phase 1完了時点
        - 追加予算承認: Phase 2中間点
        - リリース延期判断: Phase 4完了時点
        
        **コミュニケーション手段**:
        - Slack（日常コミュニケーション）
        - 月次報告書（経営陣向け）
        - ユーザーコミュニティ向け進捗共有

