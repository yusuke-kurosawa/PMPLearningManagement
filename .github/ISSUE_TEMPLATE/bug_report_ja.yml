name: 🐛 バグ報告
description: バグや不具合を報告する
title: "[バグ] "
labels: ["🐛 バグ", "🔍 トリアージ中"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        バグを報告していただきありがとうございます！
        できるだけ詳しい情報を提供していただけると、迅速な解決に役立ちます。

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグについて明確で簡潔な説明をしてください
      placeholder: 何が起きているのか説明してください...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記載してください
      placeholder: |
        1. '...' に移動
        2. '...' をクリック
        3. '...' までスクロール
        4. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 何が起こるべきだったか説明してください
      placeholder: 正常に動作した場合の期待される結果...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起きたか説明してください
      placeholder: 実際に発生したエラーや問題...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 重要度
      description: このバグの重要度を選択してください
      options:
        - 🔴 緊急 - システム全体に影響
        - 🟠 高 - 主要機能が使用不可
        - 🟡 中 - 機能は動作するが問題あり
        - 🟢 低 - 軽微な問題
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: 影響を受けるブラウザ
      description: このバグが発生するブラウザを選択してください（複数選択可）
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - その他

  - type: input
    id: version
    attributes:
      label: アプリケーションバージョン
      description: 使用しているアプリケーションのバージョン
      placeholder: 例：v1.2.3

  - type: textarea
    id: environment
    attributes:
      label: 環境情報
      description: |
        例：
        - OS: Windows 11
        - ブラウザ: Chrome 120
        - デバイス: Desktop
      value: |
        - OS: 
        - ブラウザ: 
        - デバイス: 

  - type: textarea
    id: logs
    attributes:
      label: エラーログ
      description: 関連するエラーログやコンソール出力があれば貼り付けてください
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: スクリーンショット
      description: 問題を示すスクリーンショットを追加してください（ドラッグ＆ドロップ可能）

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他の関連情報があれば記載してください

  - type: checkboxes
    id: terms
    attributes:
      label: チェックリスト
      description: 以下の項目を確認してください
      options:
        - label: 既存のIssueを検索し、重複していないことを確認しました
          required: true
        - label: 最新バージョンで問題が発生することを確認しました
        - label: 再現可能な手順を提供しました
        - label: 必要に応じてスクリーンショットやログを添付しました