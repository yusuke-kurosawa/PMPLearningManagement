# ====================================================================
# オブザーバビリティ&監視パイプライン
# ====================================================================
# 目的: Prometheus、Grafana、Lokiなどの監視スタックをデプロイし、
#      アプリケーションの可観測性を確保する
# 
# 実行タイミング:
#   - mainブランチへのプッシュ時（監視設定変更時）
#   - 手動実行（workflow_dispatch）
#
# 主な処理:
#   1. Prometheusのデプロイと設定
#   2. Grafanaダッシュボードの構築
#   3. Lokiによるログ集約設定
#   4. アラートマネージャーの設定
#   5. 監視スタックのヘルスチェック
# ====================================================================

name: 🔍 オブザーバビリティスタックデプロイ

on:
  push:
    branches: [main]
    paths:
      - 'deployment/monitoring/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy monitoring'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  CLUSTER_NAME: pmp-learning-cluster
  MONITORING_NAMESPACE: monitoring

jobs:
  # Deploy Prometheus Stack
  deploy-prometheus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Configure kubectl
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          fi
          export KUBECONFIG=kubeconfig

      - name: Create Monitoring Namespace
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl create namespace ${{ env.MONITORING_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.MONITORING_NAMESPACE }} istio-injection=enabled --overwrite

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo add elastic https://helm.elastic.co
          helm repo update

      - name: Deploy Prometheus
        env:
          KUBECONFIG: kubeconfig
        run: |
          # Apply custom Prometheus configuration
          kubectl apply -f deployment/monitoring/prometheus-config.yaml
          
          # Install Prometheus using Helm
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace ${{ env.MONITORING_NAMESPACE }} \
            --set prometheus.prometheusSpec.configMapReload.enabled=true \
            --set prometheus.prometheusSpec.additionalScrapeConfigs[0].job_name='pmp-learning' \
            --set prometheus.prometheusSpec.retention=30d \
            --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage=50Gi \
            --set grafana.adminPassword='${{ secrets.GRAFANA_ADMIN_PASSWORD }}' \
            --set grafana.persistence.enabled=true \
            --set grafana.persistence.size=10Gi \
            --set alertmanager.alertmanagerSpec.storage.volumeClaimTemplate.spec.resources.requests.storage=10Gi \
            --wait --timeout=600s

      - name: Deploy Custom Dashboards
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl apply -f deployment/monitoring/grafana-dashboards.yaml
          
          # Restart Grafana to pick up new dashboards
          kubectl rollout restart deployment/prometheus-grafana -n ${{ env.MONITORING_NAMESPACE }}

      - name: Verify Prometheus Deployment
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=prometheus -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=grafana -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s

  # Deploy Distributed Tracing (Jaeger)
  deploy-jaeger:
    runs-on: ubuntu-latest
    needs: deploy-prometheus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Configure kubectl
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          fi
          export KUBECONFIG=kubeconfig

      - name: Deploy Jaeger
        env:
          KUBECONFIG: kubeconfig
        run: |
          # Install Jaeger Operator
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl create -f https://github.com/jaegertracing/jaeger-operator/releases/download/v1.51.0/jaeger-operator.yaml -n observability

          # Wait for operator to be ready
          kubectl wait --for=condition=available deployment/jaeger-operator -n observability --timeout=300s

          # Deploy Jaeger instance
          cat << EOF | kubectl apply -f -
          apiVersion: jaegertracing.io/v1
          kind: Jaeger
          metadata:
            name: jaeger
            namespace: ${{ env.MONITORING_NAMESPACE }}
          spec:
            strategy: production
            storage:
              type: elasticsearch
              elasticsearch:
                nodeCount: 3
                resources:
                  requests:
                    memory: "2Gi"
                    cpu: "500m"
                  limits:
                    memory: "4Gi"
                    cpu: "1000m"
                redundancyPolicy: SingleRedundancy
            query:
              replicas: 2
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "200m"
            collector:
              replicas: 3
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
          EOF

      - name: Verify Jaeger Deployment
        env:
          KUBECONFIG: kubeconfig
        run: |
          # Wait for Jaeger components to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=jaeger -n ${{ env.MONITORING_NAMESPACE }} --timeout=600s

  # Deploy OpenTelemetry Collector
  deploy-opentelemetry:
    runs-on: ubuntu-latest
    needs: deploy-jaeger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          fi
          export KUBECONFIG=kubeconfig

      - name: Create Observability Secrets
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl create secret generic observability-secrets \
            --from-literal=honeycomb-api-key='${{ secrets.HONEYCOMB_API_KEY }}' \
            --from-literal=datadog-api-key='${{ secrets.DATADOG_API_KEY }}' \
            --namespace ${{ env.MONITORING_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy OpenTelemetry Collector
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl apply -f deployment/monitoring/opentelemetry-config.yaml

      - name: Verify OpenTelemetry Deployment
        env:
          KUBECONFIG: kubeconfig
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=opentelemetry-collector -n ${{ env.MONITORING_NAMESPACE }} --timeout=300s

  # Deploy Log Aggregation (ELK Stack)
  deploy-elk:
    runs-on: ubuntu-latest
    needs: deploy-opentelemetry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Configure kubectl
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          fi
          export KUBECONFIG=kubeconfig

      - name: Deploy Elasticsearch
        env:
          KUBECONFIG: kubeconfig
        run: |
          helm upgrade --install elasticsearch elastic/elasticsearch \
            --namespace ${{ env.MONITORING_NAMESPACE }} \
            --set replicas=3 \
            --set minimumMasterNodes=2 \
            --set volumeClaimTemplate.resources.requests.storage=30Gi \
            --set resources.requests.memory=2Gi \
            --set resources.requests.cpu=500m \
            --set resources.limits.memory=4Gi \
            --set resources.limits.cpu=1000m \
            --wait --timeout=600s

      - name: Deploy Kibana
        env:
          KUBECONFIG: kubeconfig
        run: |
          helm upgrade --install kibana elastic/kibana \
            --namespace ${{ env.MONITORING_NAMESPACE }} \
            --set service.type=ClusterIP \
            --set resources.requests.memory=1Gi \
            --set resources.requests.cpu=500m \
            --wait --timeout=300s

      - name: Deploy Filebeat
        env:
          KUBECONFIG: kubeconfig
        run: |
          helm upgrade --install filebeat elastic/filebeat \
            --namespace ${{ env.MONITORING_NAMESPACE }} \
            --set filebeatConfig.filebeat.yml='
              filebeat.inputs:
              - type: container
                paths:
                  - /var/log/containers/*pmp-learning*.log
                processors:
                - add_kubernetes_metadata:
                    host: ${NODE_NAME}
                    matchers:
                    - logs_path:
                        logs_path: "/var/log/containers/"
              output.elasticsearch:
                hosts: ["elasticsearch-master:9200"]
                index: "pmp-learning-logs-%{+yyyy.MM.dd}"
            ' \
            --wait --timeout=300s

  # Setup SLI/SLO Monitoring
  deploy-slo-monitoring:
    runs-on: ubuntu-latest
    needs: [deploy-prometheus, deploy-jaeger, deploy-opentelemetry, deploy-elk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          else
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          fi
          export KUBECONFIG=kubeconfig

      - name: Deploy SLO Configuration
        env:
          KUBECONFIG: kubeconfig
        run: |
          # Create SLO recording rules
          cat << 'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: slo-rules
            namespace: ${{ env.MONITORING_NAMESPACE }}
            labels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: slo-rules
          data:
            slo-rules.yml: |
              groups:
              - name: slo-rules
                interval: 30s
                rules:
                # Availability SLI: Percentage of successful requests
                - record: pmp_learning:availability:ratio_rate5m
                  expr: |
                    sum(rate(http_requests_total{job=~"pmp-learning-.*",status!~"5.."}[5m]))
                    /
                    sum(rate(http_requests_total{job=~"pmp-learning-.*"}[5m]))

                # Latency SLI: 95th percentile response time
                - record: pmp_learning:latency:p95_5m
                  expr: |
                    histogram_quantile(0.95,
                      sum(rate(http_request_duration_seconds_bucket{job=~"pmp-learning-.*"}[5m])) by (le)
                    ) * 1000

                # Error Budget Burn Rate (1h)
                - record: pmp_learning:error_budget_burn_rate:1h
                  expr: |
                    (1 - pmp_learning:availability:ratio_rate5m) * 60 * 60
                    /
                    (1 - 0.999)  # 99.9% availability SLO

                # SLO Alerts
                - alert: HighErrorBudgetBurnRate
                  expr: pmp_learning:error_budget_burn_rate:1h > 14.4
                  for: 2m
                  labels:
                    severity: critical
                    slo: availability
                  annotations:
                    summary: "High error budget burn rate"
                    description: "Error budget will be exhausted in {{ $value }} hours if current rate continues"

                - alert: LatencySLOViolation
                  expr: pmp_learning:latency:p95_5m > 1000
                  for: 5m
                  labels:
                    severity: warning
                    slo: latency
                  annotations:
                    summary: "Latency SLO violation"
                    description: "95th percentile latency is {{ $value }}ms"
          EOF

      - name: Create SLO Dashboard
        env:
          KUBECONFIG: kubeconfig
        run: |
          cat << 'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: slo-dashboard
            namespace: ${{ env.MONITORING_NAMESPACE }}
            labels:
              grafana_dashboard: "1"
              app.kubernetes.io/name: grafana
          data:
            slo-dashboard.json: |
              {
                "dashboard": {
                  "id": null,
                  "title": "PMP Learning - SLI/SLO Dashboard",
                  "tags": ["pmp-learning", "slo"],
                  "panels": [
                    {
                      "id": 1,
                      "title": "Availability SLI",
                      "type": "gauge",
                      "targets": [
                        {
                          "expr": "pmp_learning:availability:ratio_rate5m * 100",
                          "legendFormat": "Availability %"
                        }
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "min": 99,
                          "max": 100,
                          "unit": "percent",
                          "thresholds": {
                            "steps": [
                              {"color": "red", "value": 99},
                              {"color": "yellow", "value": 99.9},
                              {"color": "green", "value": 99.95}
                            ]
                          }
                        }
                      },
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
                    },
                    {
                      "id": 2,
                      "title": "Latency SLI (p95)",
                      "type": "gauge",
                      "targets": [
                        {
                          "expr": "pmp_learning:latency:p95_5m",
                          "legendFormat": "P95 Latency"
                        }
                      ],
                      "fieldConfig": {
                        "defaults": {
                          "min": 0,
                          "max": 2000,
                          "unit": "ms",
                          "thresholds": {
                            "steps": [
                              {"color": "green", "value": 0},
                              {"color": "yellow", "value": 500},
                              {"color": "red", "value": 1000}
                            ]
                          }
                        }
                      },
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
                    },
                    {
                      "id": 3,
                      "title": "Error Budget Burn Rate",
                      "type": "graph",
                      "targets": [
                        {
                          "expr": "pmp_learning:error_budget_burn_rate:1h",
                          "legendFormat": "Burn Rate (hours to exhaustion)"
                        }
                      ],
                      "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
                    }
                  ],
                  "time": {"from": "now-4h", "to": "now"},
                  "refresh": "30s"
                }
              }
          EOF

      - name: Verify All Components
        env:
          KUBECONFIG: kubeconfig
        run: |
          echo "Verifying observability stack deployment..."
          
          # Check Prometheus
          kubectl get pods -l app.kubernetes.io/name=prometheus -n ${{ env.MONITORING_NAMESPACE }}
          
          # Check Grafana
          kubectl get pods -l app.kubernetes.io/name=grafana -n ${{ env.MONITORING_NAMESPACE }}
          
          # Check Jaeger
          kubectl get pods -l app.kubernetes.io/name=jaeger -n ${{ env.MONITORING_NAMESPACE }}
          
          # Check OpenTelemetry Collector
          kubectl get pods -l app.kubernetes.io/name=opentelemetry-collector -n ${{ env.MONITORING_NAMESPACE }}
          
          # Check ELK Stack
          kubectl get pods -l app=elasticsearch-master -n ${{ env.MONITORING_NAMESPACE }}
          kubectl get pods -l app=kibana -n ${{ env.MONITORING_NAMESPACE }}
          
          echo "✅ Observability stack deployed successfully!"

      - name: Output Access Information
        run: |
          echo "🔍 Observability Stack Access Information:"
          echo "======================================"
          echo "Grafana: kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/prometheus-grafana 3000:80"
          echo "Prometheus: kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/prometheus-kube-prometheus-prometheus 9090:9090"
          echo "Jaeger: kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/jaeger-query 16686:16686"
          echo "Kibana: kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/kibana-kibana 5601:5601"
          echo ""
          echo "🚀 Next steps:"
          echo "1. Configure application instrumentation"
          echo "2. Set up alerting channels (Slack, Email, PagerDuty)"
          echo "3. Create custom dashboards for business metrics"
          echo "4. Configure log retention policies"