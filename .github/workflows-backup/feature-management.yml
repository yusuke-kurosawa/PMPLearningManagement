      - name: Final Quality Gate Assessment
        run: |
          echo "🏁 Final Quality Gate Assessment"
          
          LEAD_TIME="${{ needs.value-stream-management.outputs.lead-time }}"
          DEPLOYMENT_FREQ="${{ needs.value-stream-management.outputs.deployment-frequency }}"
          BUSINESS_VALUE="${{ needs.value-stream-management.outputs.business-value }}"
          
          # Quality gate criteria
          LEAD_TIME_THRESHOLD=2.0
          DEPLOYMENT_FREQ_THRESHOLD=0.5
          BUSINESS_VALUE_THRESHOLD=75
          
          echo "Quality Gate Evaluation:"
          echo "- Lead Time: $LEAD_TIME days (threshold: <$LEAD_TIME_THRESHOLD days)"
          echo "- Deployment Frequency: $DEPLOYMENT_FREQ/day (threshold: >$DEPLOYMENT_FREQ_THRESHOLD/day)"
          echo "- Business Value Score: $BUSINESS_VALUE/100 (threshold: >$BUSINESS_VALUE_THRESHOLD)"
          
          # Evaluate quality gates
          GATES_PASSED=0
          GATES_TOTAL=3
          
          if (( $(echo "$LEAD_TIME < $LEAD_TIME_THRESHOLD" | bc -l) )); then
            echo "✅ Lead Time Quality Gate: PASSED"
            GATES_PASSED=$((GATES_PASSED + 1))
          else
            echo "❌ Lead Time Quality Gate: FAILED"
          fi
          
          if (( $(echo "$DEPLOYMENT_FREQ > $DEPLOYMENT_FREQ_THRESHOLD" | bc -l) )); then
            echo "✅ Deployment Frequency Quality Gate: PASSED"
            GATES_PASSED=$((GATES_PASSED + 1))
          else
            echo "❌ Deployment Frequency Quality Gate: FAILED"
          fi
          
          if (( $(echo "$BUSINESS_VALUE > $BUSINESS_VALUE_THRESHOLD" | bc -l) )); then
            echo "✅ Business Value Quality Gate: PASSED"
            GATES_PASSED=$((GATES_PASSED + 1))
          else
            echo "❌ Business Value Quality Gate: FAILED"
          fi
          
          if [ $GATES_PASSED -eq $GATES_TOTAL ]; then
            echo ""
            echo "🎉 ALL QUALITY GATES PASSED! ($GATES_PASSED/$GATES_TOTAL)"
            echo "🚀 System ready for enterprise production deployment!"
            exit 0
          else
            echo ""
            echo "⚠️ Quality Gates Status: $GATES_PASSED/$GATES_TOTAL passed"
            echo "🔄 System requires optimization before production deployment"
            exit 1
          fi

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_number }}
          path: integration-test-report.md
          retention-days: 365