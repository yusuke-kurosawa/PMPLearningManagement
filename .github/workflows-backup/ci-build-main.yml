# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ Workflow: ci-build-main                                                  ║
# ║ Category: CI - Continuous Integration                                     ║
# ║ Purpose: メインCI/CDパイプライン - マルチステージビルドと品質ゲート          ║
# ║ Trigger: プッシュ、プルリクエスト、手動実行                                ║
# ║ Dependencies: devops-workflow-template.yml                               ║
# ║ Inputs: environment, parallel-execution, quality-gate-level              ║
# ║ Outputs: build-artifacts, test-results, quality-metrics                  ║
# ║ Secrets Required: CLAUDE_API_KEY, CODECOV_TOKEN                          ║
# ║ Author: Claude DevOps Agent                                               ║
# ║ Version: 2.0.0                                                            ║
# ║ Last Modified: 2025-08-12                                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: 🚀 CI - Main Build Pipeline

on:
  push:
    branches: [main, develop, test/**, feature/**]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging  
          - production
        default: 'development'
      parallel-execution:
        description: 'Enable parallel job execution'
        required: false
        type: boolean
        default: true
      quality-gate-level:
        description: 'Quality gate enforcement level'
        required: false
        type: choice
        options:
          - strict
          - moderate
          - lenient
        default: 'moderate'
      force-full-test:
        description: 'Force full test suite execution'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  ENVIRONMENT: ${{ inputs.environment || 'development' }}
  PARALLEL_JOBS: ${{ inputs.parallel-execution && '4' || '1' }}
  QUALITY_LEVEL: ${{ inputs.quality-gate-level || 'moderate' }}
  
  # Build optimizations
  CI: true
  FORCE_COLOR: 1
  NODE_OPTIONS: '--max-old-space-size=6144'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  
  # Cache settings
  HUSKY: 0
  DISABLE_ESLINT_PLUGIN: false

permissions:
  contents: read
  actions: read
  security-events: write
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: ci-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Stage 1: 基盤セットアップ & 変更検出
  # ═══════════════════════════════════════════════════════════════════════
  setup-and-detect:
    name: 🔧 Setup & Change Detection
    uses: ./.github/workflows/templates/devops-workflow-template.yml
    with:
      workflow-category: 'ci'
      environment: ${{ inputs.environment || 'development' }}
      node-version: '18'
      enable-caching: true
      enable-notifications: false
      parallel-jobs: 4
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

  change-detection:
    name: 📊 Intelligent Change Detection
    runs-on: ubuntu-latest
    needs: [setup-and-detect]
    outputs:
      has-code-changes: ${{ steps.changes.outputs.code }}
      has-test-changes: ${{ steps.changes.outputs.tests }}
      has-config-changes: ${{ steps.changes.outputs.config }}
      has-docs-changes: ${{ steps.changes.outputs.docs }}
      affected-areas: ${{ steps.analysis.outputs.areas }}
      test-strategy: ${{ steps.strategy.outputs.strategy }}
      
    steps:
      - name: 📥 Checkout for Analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Detect Changed Files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
            tests:
              - '**/*.test.js'
              - '**/*.test.jsx'
              - '**/*.spec.js'
              - 'tests/**'
            config:
              - 'package.json'
              - 'vite.config.js'
              - 'tailwind.config.js'
              - '*.config.js'
            docs:
              - '**.md'
              - 'docs/**'

      - name: 📈 Impact Analysis
        id: analysis
        run: |
          echo "🔍 Analyzing change impact..."
          affected_areas=""
          
          if [ "${{ steps.changes.outputs.code }}" == "true" ]; then
            affected_areas="${affected_areas},frontend"
          fi
          if [ "${{ steps.changes.outputs.tests }}" == "true" ]; then
            affected_areas="${affected_areas},testing"
          fi
          if [ "${{ steps.changes.outputs.config }}" == "true" ]; then
            affected_areas="${affected_areas},build"
          fi
          
          affected_areas="${affected_areas#,}"  # Remove leading comma
          echo "areas=${affected_areas}" >> $GITHUB_OUTPUT
          echo "📊 Affected areas: ${affected_areas}"

      - name: 🎯 Test Strategy Selection
        id: strategy
        run: |
          if [ "${{ inputs.force-full-test }}" == "true" ]; then
            strategy="full"
          elif [ "${{ steps.changes.outputs.code }}" == "true" ] && [ "${{ steps.changes.outputs.tests }}" == "true" ]; then
            strategy="comprehensive"
          elif [ "${{ steps.changes.outputs.code }}" == "true" ]; then
            strategy="focused"
          else
            strategy="minimal"
          fi
          
          echo "strategy=${strategy}" >> $GITHUB_OUTPUT
          echo "🎯 Test strategy: ${strategy}"

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 2: 並列品質チェック
  # ═══════════════════════════════════════════════════════════════════════
  quality-checks:
    name: 🎯 Quality Assurance Matrix
    runs-on: ubuntu-latest
    needs: [setup-and-detect, change-detection]
    if: needs.change-detection.outputs.has-code-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, type-check, security, format]
        
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔍 ESLint Analysis
        if: matrix.check-type == 'lint'
        run: |
          echo "🔍 Running ESLint with detailed reporting..."
          npm run lint -- --format=json --output-file=eslint-report.json || true
          npm run lint -- --format=stylish
          
          if [ -f eslint-report.json ]; then
            echo "📊 ESLint Summary:"
            jq -r '.[] | select(.errorCount > 0 or .warningCount > 0) | "❌ \(.filePath): \(.errorCount) errors, \(.warningCount) warnings"' eslint-report.json || true
          fi

      - name: 🏗️ TypeScript Type Check
        if: matrix.check-type == 'type-check'
        run: |
          if [ -f tsconfig.json ]; then
            echo "🏗️ Running TypeScript type checking..."
            npx tsc --noEmit --skipLibCheck
          else
            echo "ℹ️ No tsconfig.json found, skipping type check"
          fi

      - name: 🔒 Security Audit
        if: matrix.check-type == 'security'
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=high --json > security-audit.json || true
          
          if [ -f security-audit.json ]; then
            vulnerabilities=$(jq -r '.metadata.vulnerabilities | keys[] as $k | "\($k): \(.[$k])"' security-audit.json 2>/dev/null || echo "0 vulnerabilities")
            echo "🔒 Security Summary: $vulnerabilities"
          fi

      - name: 💅 Code Formatting
        if: matrix.check-type == 'format'
        run: |
          echo "💅 Checking code formatting..."
          npm run format:check || {
            echo "❌ Code formatting issues detected"
            echo "💡 Run 'npm run format' to fix formatting"
            exit 1
          }

      - name: 📊 Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ matrix.check-type }}-${{ github.run_number }}
          path: |
            eslint-report.json
            security-audit.json
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 3: テスト実行マトリックス
  # ═══════════════════════════════════════════════════════════════════════
  test-execution:
    name: 🧪 Test Execution Matrix
    runs-on: ubuntu-latest
    needs: [setup-and-detect, change-detection]
    if: needs.change-detection.outputs.has-code-changes == 'true' || needs.change-detection.outputs.has-test-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: [unit, integration, e2e]
        include:
          - test-type: unit
            command: 'test'
            timeout: 10
          - test-type: integration  
            command: 'test:integration'
            timeout: 15
          - test-type: e2e
            command: 'test:e2e'
            timeout: 20
            
    timeout-minutes: ${{ matrix.timeout }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🧪 Execute ${{ matrix.test-type }} Tests
        run: |
          echo "🧪 Running ${{ matrix.test-type }} tests..."
          
          # Test strategy based on change detection
          strategy="${{ needs.change-detection.outputs.test-strategy }}"
          echo "📊 Test strategy: $strategy"
          
          if [ "$strategy" == "minimal" ] && [ "${{ matrix.test-type }}" == "e2e" ]; then
            echo "⏭️ Skipping E2E tests for minimal changes"
            exit 0
          fi
          
          npm run ${{ matrix.command }} -- --reporter=json --outputFile=test-results-${{ matrix.test-type }}.json || test_exit_code=$?
          npm run ${{ matrix.command }}
          
          exit ${test_exit_code:-0}

      - name: 📊 Test Results Analysis  
        if: always()
        run: |
          if [ -f test-results-${{ matrix.test-type }}.json ]; then
            echo "📊 ${{ matrix.test-type }} Test Summary:"
            jq -r '"✅ Passed: \(.stats.passes) | ❌ Failed: \(.stats.failures) | ⏭️  Skipped: \(.stats.pending) | ⏱️  Duration: \(.stats.duration)ms"' test-results-${{ matrix.test-type }}.json || true
          fi

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-type }}-${{ github.run_number }}
          path: |
            test-results-${{ matrix.test-type }}.json
            coverage/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 4: ビルドと成果物生成
  # ═══════════════════════════════════════════════════════════════════════
  build-and-package:
    name: 📦 Build & Package
    runs-on: ubuntu-latest
    needs: [setup-and-detect, change-detection, quality-checks]
    if: always() && (needs.quality-checks.result == 'success' || needs.change-detection.outputs.has-code-changes != 'true')
    
    outputs:
      build-size: ${{ steps.analysis.outputs.build-size }}
      bundle-size: ${{ steps.analysis.outputs.bundle-size }}
      build-time: ${{ steps.timing.outputs.duration }}
      
    steps:
      - name: ⏱️ Start Build Timing
        id: start-time
        run: echo "start-time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🏗️ Production Build
        env:
          NODE_ENV: production
          VITE_BUILD_TIMESTAMP: ${{ github.run_number }}
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "🏗️ Building production artifacts..."
          npm run build
          
          echo "✅ Build completed successfully"
          ls -la dist/

      - name: 📊 Build Analysis
        id: analysis
        run: |
          if [ -d dist ]; then
            build_size=$(du -sh dist | cut -f1)
            
            # Find main bundle file
            main_bundle=$(find dist -name "*.js" -type f | head -1)
            if [ -n "$main_bundle" ]; then
              bundle_size=$(stat -c%s "$main_bundle" | numfmt --to=iec-i --suffix=B)
            else
              bundle_size="unknown"
            fi
            
            echo "build-size=${build_size}" >> $GITHUB_OUTPUT
            echo "bundle-size=${bundle_size}" >> $GITHUB_OUTPUT
            
            echo "📊 Build Analysis:"
            echo "  Total Size: ${build_size}"
            echo "  Main Bundle: ${bundle_size}"
            
            # Generate build manifest
            cat > dist/build-manifest.json << EOF
          {
            "build_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -Iseconds)",
            "environment": "${{ env.ENVIRONMENT }}",
            "build_size": "${build_size}",
            "bundle_size": "${bundle_size}"
          }
          EOF
            
          else
            echo "❌ Build directory not found"
            exit 1
          fi

      - name: ⏱️ Calculate Build Time
        id: timing
        run: |
          start_time="${{ steps.start-time.outputs.start-time }}"
          end_time="$(date +%s)"
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> $GITHUB_OUTPUT
          echo "⏱️ Build completed in ${duration} seconds"

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_number }}
          path: |
            dist/
            !dist/**/*.map
          retention-days: 30
          compression-level: 9

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 5: 品質ゲート最終判定
  # ═══════════════════════════════════════════════════════════════════════
  quality-gate:
    name: 🚪 Quality Gate Enforcement
    runs-on: ubuntu-latest
    needs: [setup-and-detect, change-detection, quality-checks, test-execution, build-and-package]
    if: always()
    
    steps:
      - name: 📊 Collect Results
        id: collect
        run: |
          echo "📊 Collecting pipeline results..."
          
          # Job status collection
          setup_status="${{ needs.setup-and-detect.result }}"
          quality_status="${{ needs.quality-checks.result }}"
          test_status="${{ needs.test-execution.result }}"
          build_status="${{ needs.build-and-package.result }}"
          
          echo "🔍 Pipeline Status Summary:"
          echo "  Setup: ${setup_status}"
          echo "  Quality Checks: ${quality_status}"
          echo "  Test Execution: ${test_status}"
          echo "  Build & Package: ${build_status}"
          
          # Quality gate logic based on level
          quality_level="${{ env.QUALITY_LEVEL }}"
          echo "🚪 Quality Gate Level: ${quality_level}"
          
          case "${quality_level}" in
            "strict")
              if [[ "${quality_status}" != "success" || "${test_status}" != "success" || "${build_status}" != "success" ]]; then
                echo "gate_result=failed" >> $GITHUB_OUTPUT
                echo "❌ STRICT: All stages must pass"
              else
                echo "gate_result=passed" >> $GITHUB_OUTPUT
                echo "✅ STRICT: All quality gates passed"
              fi
              ;;
            "moderate")
              if [[ "${build_status}" != "success" ]]; then
                echo "gate_result=failed" >> $GITHUB_OUTPUT
                echo "❌ MODERATE: Build must succeed"
              elif [[ "${quality_status}" == "failure" && "${test_status}" == "failure" ]]; then
                echo "gate_result=failed" >> $GITHUB_OUTPUT
                echo "❌ MODERATE: Both quality and tests cannot fail"
              else
                echo "gate_result=passed" >> $GITHUB_OUTPUT
                echo "✅ MODERATE: Quality gate conditions met"
              fi
              ;;
            "lenient")
              if [[ "${build_status}" == "success" ]]; then
                echo "gate_result=passed" >> $GITHUB_OUTPUT
                echo "✅ LENIENT: Build succeeded, allowing through"
              else
                echo "gate_result=failed" >> $GITHUB_OUTPUT
                echo "❌ LENIENT: Build failed, cannot proceed"
              fi
              ;;
          esac

      - name: 📈 Generate Pipeline Report
        run: |
          cat > pipeline-report.md << EOF
          # 🚀 CI Pipeline Report
          
          ## 📊 Pipeline Summary
          - **Run Number**: ${{ github.run_number }}
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Environment**: ${{ env.ENVIRONMENT }}
          - **Quality Level**: ${{ env.QUALITY_LEVEL }}
          - **Triggered By**: ${{ github.actor }}
          
          ## 🎯 Results
          | Stage | Status | Duration |
          |-------|--------|----------|
          | Setup | ${{ needs.setup-and-detect.result }} | ${{ needs.setup-and-detect.outputs.execution-time }}s |
          | Quality Checks | ${{ needs.quality-checks.result }} | - |
          | Test Execution | ${{ needs.test-execution.result }} | - |
          | Build & Package | ${{ needs.build-and-package.result }} | ${{ needs.build-and-package.outputs.build-time }}s |
          
          ## 📦 Build Metrics  
          - **Build Size**: ${{ needs.build-and-package.outputs.build-size }}
          - **Bundle Size**: ${{ needs.build-and-package.outputs.bundle-size }}
          
          ## 🚪 Quality Gate
          **Result**: ${{ steps.collect.outputs.gate_result }}
          
          ---
          *Generated by DevOps CI Pipeline v2.0.0*
          EOF
          
          cat pipeline-report.md

      - name: 🚪 Quality Gate Decision
        run: |
          if [ "${{ steps.collect.outputs.gate_result }}" == "failed" ]; then
            echo "❌ Quality Gate FAILED - Pipeline rejected"
            exit 1
          else
            echo "✅ Quality Gate PASSED - Pipeline approved"
          fi

      - name: 📤 Upload Pipeline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_number }}
          path: pipeline-report.md
          retention-days: 90