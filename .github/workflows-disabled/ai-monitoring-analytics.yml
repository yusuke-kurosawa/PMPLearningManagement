import json
import random
import numpy as np
from datetime import datetime, timedelta

# Simulate real-time monitoring data
def generate_monitoring_data():
    base_time = datetime.now()
    data_points = []
    
    for i in range(100):
        timestamp = base_time - timedelta(minutes=i)
        
        # Normal patterns with occasional anomalies
        is_anomaly = random.random() < 0.05  # 5% anomaly rate
        
        if is_anomaly:
            # Inject anomalies
            response_time = random.uniform(2000, 5000)  # High response time
            error_rate = random.uniform(0.1, 0.3)  # High error rate
            cpu_usage = random.uniform(85, 98)  # High CPU
        else:
            # Normal values
            response_time = random.uniform(80, 150)
            error_rate = random.uniform(0.001, 0.02)
            cpu_usage = random.uniform(20, 60)
            
        data_point = {
            \"timestamp\": timestamp.isoformat(),
            \"metrics\": {
                \"response_time_ms\": round(response_time, 2),
                \"error_rate\": round(error_rate, 4),
                \"cpu_usage_percent\": round(cpu_usage, 2),
                \"memory_usage_percent\": round(random.uniform(40, 80), 2),
                \"active_users\": random.randint(800, 1200),
                \"throughput_rps\": random.randint(500, 1500)
            },
            \"anomaly\": is_anomaly,
            \"anomaly_score\": random.uniform(0.8, 0.95) if is_anomaly else random.uniform(0.1, 0.3)
        }
        data_points.append(data_point)
    
    return data_points

# AI Anomaly Detection Analysis
monitoring_data = generate_monitoring_data()
anomalies_detected = [dp for dp in monitoring_data if dp['anomaly']]

# AI Model Performance Simulation
ai_detection_results = {
    \"analysis_timestamp\": datetime.now().isoformat(),
    \"data_points_analyzed\": len(monitoring_data),
    \"anomalies_detected\": len(anomalies_detected),
    \"ai_model_performance\": {
        \"accuracy\": 0.97,
        \"precision\": 0.94,
        \"recall\": 0.96,
        \"f1_score\": 0.95,
        \"false_positive_rate\": 0.02
    },
    \"detection_categories\": {
        \"performance_anomalies\": 3,
        \"security_anomalies\": 1,
        \"business_anomalies\": 2,
        \"infrastructure_anomalies\": 1
    },
    \"automated_responses\": [
        {
            \"anomaly_type\": \"high_response_time\",
            \"action_taken\": \"Auto-scaled application instances\",
