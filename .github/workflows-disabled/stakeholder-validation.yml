name: "Stakeholder Validation Workflow"

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  issue_comment:
    types: [created]

jobs:
  validation-triage:
    if: contains(github.event.issue.labels.*.name, 'needs-validation')
    runs-on: ubuntu-latest
    steps:
      - name: Add validation timeline comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            
            const validationComment = `## 🔍 Stakeholder Validation Process Initiated
            
            **Timeline**: 5 business days for validation completion
            **Next Steps**:
            1. ✅ Issue created and triaged
            2. 🔄 Stakeholder review in progress
            3. ⏳ Awaiting validation feedback
            4. ⏳ Validation decision
            5. ⏳ Ready for development (if approved)
            
            **Validation Criteria**:
            - [ ] Business value confirmed
            - [ ] Technical feasibility verified
            - [ ] Resource allocation approved
            - [ ] Success metrics defined
            - [ ] Risk assessment completed
            
            **Stakeholders**: Please review and provide feedback within 3 business days.
            Use 👍 for approval, 👎 for rejection, or comment with concerns.
            
            cc: @yusuke-kurosawa`;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: validationComment
            });

      - name: Set validation deadline
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            
            // Calculate deadline (5 business days)
            const now = new Date();
            let deadline = new Date(now);
            let daysAdded = 0;
            
            while (daysAdded < 5) {
              deadline.setDate(deadline.getDate() + 1);
              const dayOfWeek = deadline.getDay();
              if (dayOfWeek !== 0 && dayOfWeek !== 6) { // Not weekend
                daysAdded++;
              }
            }
            
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['validation-in-progress', 'priority:high']
            });

  validation-approval:
    if: contains(github.event.issue.labels.*.name, 'validation-approved')
    runs-on: ubuntu-latest
    steps:
      - name: Create development tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const originalIssue = context.issue;
            
            const devIssue = await github.rest.issues.create({
              owner,
              repo,
              title: `[DEV] ${originalIssue.title.replace('[VALIDATION]', '')}`,
              body: `## Development Implementation
              
              **Validated Feature**: Closes #${originalIssue.number}
              **Status**: Ready for development assignment
              
              ### Implementation Checklist
              - [ ] Technical spike completed (if required)
              - [ ] Detailed user stories created
              - [ ] Test cases defined
              - [ ] Implementation completed
              - [ ] Code review passed
              - [ ] Tests passing (90%+ coverage)
              - [ ] Stakeholder review
              - [ ] Production deployment
              
              ### Development Team Assignment
              Will be assigned based on skill requirements and team capacity.
              
              **Original validation**: #${originalIssue.number}`,
              labels: ['type:feature', 'status:ready-for-dev', 'validated-feature']
            });
            
            // Link the issues
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: originalIssue.number,
              body: `✅ **Validation Approved** - Development tracking issue created: #${devIssue.data.number}`
            });
            
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: originalIssue.number,
              labels: ['validation-completed', 'status:approved']
            });

  validation-rejection:
    if: contains(github.event.issue.labels.*.name, 'validation-rejected')
    runs-on: ubuntu-latest
    steps:
      - name: Handle rejection
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `## ❌ Validation Rejected
              
              This feature request has been rejected by stakeholders.
              
              **Next Steps**:
              - Review stakeholder feedback
              - Consider alternative approaches
              - Refine requirements and resubmit if appropriate
              
              The issue will be closed but can be reopened with updated requirements.`
            });
            
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['validation-completed', 'status:rejected']
            });

  validation-timeout:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check overdue validations
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            
            // Get issues with validation labels that are overdue
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'needs-validation',
              state: 'open'
            });
            
            const now = new Date();
            const overdueThreshold = 7; // days
            
            for (const issue of issues.data) {
              const createdDate = new Date(issue.created_at);
              const daysSinceCreated = (now - createdDate) / (1000 * 60 * 60 * 24);
              
              if (daysSinceCreated > overdueThreshold) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `⚠️ **Validation Overdue**
                  
                  This validation request has been pending for ${Math.floor(daysSinceCreated)} days.
                  
                  **Action Required**: Please provide validation decision or extend deadline.
                  
                  @yusuke-kurosawa`
                });
                
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: ['validation-overdue']
                });
              }
            }

# Schedule to run validation timeout check daily at 9 AM UTC
on:
  schedule:
    - cron: '0 9 * * *'