# Istio Service Mesh Configuration
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pmp-learning-gateway
  namespace: pmp-learning
  labels:
    app.kubernetes.io/name: pmp-learning-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - pmp-learning.com
    - www.pmp-learning.com
    - api.pmp-learning.com
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: pmp-learning-tls
    hosts:
    - pmp-learning.com
    - www.pmp-learning.com
    - api.pmp-learning.com

---
# Virtual Service for routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pmp-learning-virtualservice
  namespace: pmp-learning
  labels:
    app.kubernetes.io/name: pmp-learning-virtualservice
    app.kubernetes.io/component: routing
spec:
  hosts:
  - pmp-learning.com
  - www.pmp-learning.com
  - api.pmp-learning.com
  gateways:
  - pmp-learning-gateway
  http:
  # API Routes
  - match:
    - headers:
        host:
          exact: api.pmp-learning.com
      uri:
        prefix: /
    route:
    - destination:
        host: pmp-learning-backend-service
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://pmp-learning.com
      - exact: https://www.pmp-learning.com
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - x-requested-with
      maxAge: 24h
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
  # Frontend Routes  
  - match:
    - headers:
        host:
          regex: "(pmp-learning\\.com|www\\.pmp-learning\\.com)"
      uri:
        prefix: /
    route:
    - destination:
        host: pmp-learning-frontend-service
        port:
          number: 80
    timeout: 15s

---
# Destination Rule for load balancing and circuit breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: pmp-learning-frontend-destination
  namespace: pmp-learning
spec:
  host: pmp-learning-frontend-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
    circuitBreaker:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_CONN
  subsets:
  - name: v1
    labels:
      version: v1

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: pmp-learning-backend-destination
  namespace: pmp-learning
spec:
  host: pmp-learning-backend-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 20
        maxRetries: 3
    circuitBreaker:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: ROUND_ROBIN
  subsets:
  - name: v1
    labels:
      version: v1

---
# PeerAuthentication for mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: pmp-learning
spec:
  mtls:
    mode: STRICT

---
# AuthorizationPolicy for access control
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pmp-learning-auth
  namespace: pmp-learning
spec:
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  - when:
    - key: source.ip
      notValues: ["192.168.1.100/24"] # Block specific IP ranges if needed

---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pmp-learning-monitor
  namespace: pmp-learning
  labels:
    app.kubernetes.io/name: pmp-learning
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pmp-learning-frontend
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  - port: metrics
    interval: 30s
    path: /metrics
    targetPort: 9090