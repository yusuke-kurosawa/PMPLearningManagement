# Prometheus Alert Rules for PMPLearningManagement\n# Enterprise-grade SLO/SLI monitoring and alerting\n\ngroups:\n  # ========================================\n  # Service Level Objectives (SLO) Alerts\n  # ========================================\n  - name: slo_availability\n    rules:\n      - alert: SLOAvailabilityViolation\n        expr: pmp_learning_slo_compliance_ratio{slo_id=\"availability_99_9\"} < 0.999\n        for: 1m\n        labels:\n          severity: critical\n          category: availability\n          slo_id: availability_99_9\n          team: sre\n        annotations:\n          summary: \"Service availability SLO violation\"\n          description: \"Service availability is {{ $value | humanizePercentage }}, below the 99.9% SLO target\"\n          runbook_url: \"https://runbooks.pmp-learning.com/slo/availability_99_9\"\n          dashboard_url: \"https://grafana.pmp-learning.com/d/slo-availability\"\n\n      - alert: SLOAvailabilityWarning\n        expr: pmp_learning_slo_compliance_ratio{slo_id=\"availability_99_9\"} < 0.995\n        for: 2m\n        labels:\n          severity: warning\n          category: availability\n          slo_id: availability_99_9\n          team: sre\n        annotations:\n          summary: \"Service availability approaching SLO threshold\"\n          description: \"Service availability is {{ $value | humanizePercentage }}, approaching 99.9% SLO threshold\"\n\n  - name: slo_performance\n    rules:\n      - alert: SLOLatencyP95Violation\n        expr: pmp_learning_slo_compliance_ratio{slo_id=\"latency_p95_500ms\"} > 0.5\n        for: 2m\n        labels:\n          severity: high\n          category: performance\n          slo_id: latency_p95_500ms\n          team: backend\n        annotations:\n          summary: \"P95 latency SLO violation\"\n          description: \"P95 response time is {{ $value }}s, exceeding 500ms SLO target\"\n          runbook_url: \"https://runbooks.pmp-learning.com/slo/latency_p95_500ms\"\n\n      - alert: SLOLatencyP99Violation\n        expr: pmp_learning_slo_compliance_ratio{slo_id=\"latency_p99_1s\"} > 1.0\n        for: 3m\n        labels:\n          severity: medium\n          category: performance\n          slo_id: latency_p99_1s\n          team: backend\n        annotations:\n          summary: \"P99 latency SLO violation\"\n          description: \"P99 response time is {{ $value }}s, exceeding 1s SLO target\"\n\n  - name: slo_business\n    rules:\n      - alert: SLOExamPassRateViolation\n        expr: pmp_learning_slo_compliance_ratio{slo_id=\"exam_pass_rate_75\"} < 0.75\n        for: 1h\n        labels:\n          severity: medium\n          category: business\n          slo_id: exam_pass_rate_75\n          team: product\n        annotations:\n          summary: \"Exam pass rate SLO violation\"\n          description: \"Exam pass rate is {{ $value | humanizePercentage }}, below 75% SLO target\"\n\n      - alert: SLOLearningCompletionViolation\n        expr: pmp_learning_slo_compliance_ratio{slo_id=\"learning_completion_80\"} < 0.8\n        for: 2h\n        labels:\n          severity: low\n          category: business\n          slo_id: learning_completion_80\n          team: education\n        annotations:\n          summary: \"Learning completion rate SLO violation\"\n          description: \"Learning completion rate is {{ $value | humanizePercentage }}, below 80% SLO target\"\n\n  # ========================================\n  # Infrastructure Alerts\n  # ========================================\n  - name: infrastructure_critical\n    rules:\n      - alert: ServiceDown\n        expr: up{job=~\"pmp-learning.*\"} == 0\n        for: 1m\n        labels:\n          severity: critical\n          team: sre\n        annotations:\n          summary: \"Service {{ $labels.instance }} is down\"\n          description: \"{{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute\"\n\n      - alert: HighMemoryUsage\n        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90\n        for: 5m\n        labels:\n          severity: critical\n          team: sre\n        annotations:\n          summary: \"High memory usage on {{ $labels.instance }}\"\n          description: \"Memory usage is {{ $value | humanize }}% on {{ $labels.instance }}\"\n\n      - alert: HighCPUUsage\n        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 85\n        for: 10m\n        labels:\n          severity: warning\n          team: sre\n        annotations:\n          summary: \"High CPU usage on {{ $labels.instance }}\"\n          description: \"CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}\"\n\n      - alert: DiskSpaceLow\n        expr: (node_filesystem_avail_bytes{fstype!=\"tmpfs\"} / node_filesystem_size_bytes{fstype!=\"tmpfs\"}) * 100 < 10\n        for: 5m\n        labels:\n          severity: warning\n          team: sre\n        annotations:\n          summary: \"Low disk space on {{ $labels.instance }}\"\n          description: \"Disk usage is {{ $value | humanize }}% full on {{ $labels.instance }} {{ $labels.device }}\"\n\n  - name: application_performance\n    rules:\n      - alert: HighErrorRate\n        expr: (\n          sum(rate(pmp_learning_http_requests_total{status_code=~\"5..\"}[5m])) /\n          sum(rate(pmp_learning_http_requests_total[5m]))\n        ) * 100 > 5\n        for: 3m\n        labels:\n          severity: high\n          team: backend\n        annotations:\n          summary: \"High error rate detected\"\n          description: \"Error rate is {{ $value | humanize }}% (threshold: 5%)\"\n\n      - alert: SlowResponseTime\n        expr: histogram_quantile(0.95, rate(pmp_learning_http_request_duration_seconds_bucket[5m])) > 1\n        for: 5m\n        labels:\n          severity: warning\n          team: backend\n        annotations:\n          summary: \"Slow response time\"\n          description: \"95th percentile response time is {{ $value | humanizeDuration }}\"\n\n      - alert: DatabaseConnectionPoolExhausted\n        expr: pmp_learning_db_connection_pool_size{status=\"active\"} / pmp_learning_db_connection_pool_size{status=\"total\"} > 0.9\n        for: 3m\n        labels:\n          severity: high\n          team: database\n        annotations:\n          summary: \"Database connection pool nearly exhausted\"\n          description: \"{{ $value | humanizePercentage }} of database connections are active\"\n\n      - alert: SlowDatabaseQueries\n        expr: histogram_quantile(0.95, rate(pmp_learning_db_query_duration_seconds_bucket[5m])) > 0.5\n        for: 5m\n        labels:\n          severity: warning\n          team: database\n        annotations:\n          summary: \"Slow database queries detected\"\n          description: \"95th percentile database query time is {{ $value | humanizeDuration }}\"\n\n  # ========================================\n  # Cache Performance Alerts\n  # ========================================\n  - name: cache_performance\n    rules:\n      - alert: LowCacheHitRate\n        expr: (\n          sum(rate(pmp_learning_cache_operations_total{result=\"hit\"}[5m])) /\n          sum(rate(pmp_learning_cache_operations_total[5m]))\n        ) < 0.8\n        for: 10m\n        labels:\n          severity: warning\n          team: backend\n        annotations:\n          summary: \"Low cache hit rate\"\n          description: \"Cache hit rate is {{ $value | humanizePercentage }} (threshold: 80%)\"\n\n      - alert: RedisConnectionFailure\n        expr: pmp_learning_redis_connections_failed_total > 0\n        for: 1m\n        labels:\n          severity: high\n          team: sre\n        annotations:\n          summary: \"Redis connection failures detected\"\n          description: \"{{ $value }} Redis connection failures in the last minute\"\n\n  # ========================================\n  # Business Logic Alerts\n  # ========================================\n  - name: business_metrics\n    rules:\n      - alert: LowUserEngagement\n        expr: rate(pmp_learning_learning_sessions_total[1h]) < 100\n        for: 1h\n        labels:\n          severity: low\n          team: product\n        annotations:\n          summary: \"Low user engagement\"\n          description: \"Learning sessions per hour: {{ $value | humanize }} (threshold: 100)\"\n\n      - alert: HighExamFailureRate\n        expr: (\n          sum(rate(pmp_learning_exam_attempts_total{result=\"fail\"}[6h])) /\n          sum(rate(pmp_learning_exam_attempts_total[6h]))\n        ) > 0.4\n        for: 30m\n        labels:\n          severity: medium\n          team: education\n        annotations:\n          summary: \"High exam failure rate\"\n          description: \"Exam failure rate is {{ $value | humanizePercentage }} (threshold: 40%)\"\n\n      - alert: SubscriptionChurnSpike\n        expr: increase(pmp_learning_subscription_cancellations_total[24h]) > 50\n        for: 1h\n        labels:\n          severity: high\n          team: business\n        annotations:\n          summary: \"Subscription churn spike detected\"\n          description: \"{{ $value }} subscription cancellations in the last 24 hours\"\n\n  # ========================================\n  # Security Alerts\n  # ========================================\n  - name: security_alerts\n    rules:\n      - alert: SuspiciousTraffic\n        expr: rate(pmp_learning_http_requests_total{status_code=\"429\"}[5m]) > 10\n        for: 2m\n        labels:\n          severity: medium\n          team: security\n        annotations:\n          summary: \"High rate of 429 responses detected\"\n          description: \"{{ $value }} requests/second are being rate limited\"\n\n      - alert: AuthenticationFailureSpike\n        expr: rate(pmp_learning_auth_failures_total[5m]) > 5\n        for: 3m\n        labels:\n          severity: high\n          team: security\n        annotations:\n          summary: \"Authentication failure spike\"\n          description: \"{{ $value }} authentication failures per second\"\n\n      - alert: UnauthorizedAccessAttempts\n        expr: rate(pmp_learning_http_requests_total{status_code=\"403\"}[5m]) > 2\n        for: 5m\n        labels:\n          severity: medium\n          team: security\n        annotations:\n          summary: \"High rate of unauthorized access attempts\"\n          description: \"{{ $value }} unauthorized access attempts per second\"\n\n  # ========================================\n  # Error Budget Alerts\n  # ========================================\n  - name: error_budget\n    rules:\n      - alert: ErrorBudgetExhausted\n        expr: pmp_learning_error_budget_remaining < 0.1\n        for: 5m\n        labels:\n          severity: critical\n          team: sre\n        annotations:\n          summary: \"Error budget nearly exhausted for {{ $labels.slo_id }}\"\n          description: \"Error budget remaining: {{ $value | humanizePercentage }}\"\n          runbook_url: \"https://runbooks.pmp-learning.com/error-budget/{{ $labels.slo_id }}\"\n\n      - alert: ErrorBudgetBurnRateHigh\n        expr: (\n          pmp_learning_error_budget_remaining offset 1h -\n          pmp_learning_error_budget_remaining\n        ) > 0.02\n        for: 15m\n        labels:\n          severity: warning\n          team: sre\n        annotations:\n          summary: \"High error budget burn rate for {{ $labels.slo_id }}\"\n          description: \"Error budget burn rate: {{ $value | humanizePercentage }}/hour\"\n\n  # ========================================\n  # Custom Application Alerts\n  # ========================================\n  - name: application_specific\n    rules:\n      - alert: FlashcardAccuracyDrop\n        expr: avg_over_time(pmp_learning_flashcard_accuracy[1h]) < 0.7\n        for: 30m\n        labels:\n          severity: low\n          team: education\n        annotations:\n          summary: \"Flashcard accuracy below threshold\"\n          description: \"Average flashcard accuracy: {{ $value | humanizePercentage }}\"\n\n      - alert: StudySessionDurationAnomaly\n        expr: (\n          avg_over_time(pmp_learning_study_session_duration_minutes[1h]) >\n          avg_over_time(pmp_learning_study_session_duration_minutes[7d]) * 2\n        )\n        for: 15m\n        labels:\n          severity: low\n          team: product\n        annotations:\n          summary: \"Unusual study session duration pattern\"\n          description: \"Current avg session: {{ $value | humanizeDuration }}\"\n\n      - alert: WebSocketConnectionsHigh\n        expr: pmp_learning_websocket_connections > 1000\n        for: 10m\n        labels:\n          severity: warning\n          team: backend\n        annotations:\n          summary: \"High number of WebSocket connections\"\n          description: \"{{ $value }} active WebSocket connections\"\n\n  # ========================================\n  # Predictive Alerts (Future Implementation)\n  # ========================================\n  - name: predictive_alerts\n    rules:\n      - alert: PredictedResourceExhaustion\n        # This would use machine learning models to predict resource exhaustion\n        # expr: pmp_learning_predicted_memory_exhaustion_hours < 4\n        expr: 'vector(0)' # Placeholder\n        for: 10m\n        labels:\n          severity: warning\n          team: sre\n        annotations:\n          summary: \"Predicted resource exhaustion\"\n          description: \"Resources predicted to be exhausted in {{ $value }} hours\"\n\n      - alert: PredictedTrafficSpike\n        # This would predict traffic spikes based on historical patterns\n        # expr: pmp_learning_predicted_traffic_spike_confidence > 0.8\n        expr: 'vector(0)' # Placeholder\n        for: 5m\n        labels:\n          severity: low\n          team: sre\n        annotations:\n          summary: \"Predicted traffic spike\"\n          description: \"Traffic spike predicted with {{ $value | humanizePercentage }} confidence\""