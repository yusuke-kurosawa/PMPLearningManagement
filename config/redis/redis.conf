# Redis Configuration for PMP Learning Management
# Developer 3: API Rate Limiting・DDoS防止・Redis実装

# Network and Connection
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300
protected-mode yes

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16
syslog-enabled no

# Snapshotting (Persistence)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Kernel OOM Score
oom-score-adj no

# Security
# requirepass defined via command line
# maxclients defined via command line

# Rate Limiting Specific Settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Client Management
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 0

# Event Notification
notify-keyspace-events ""

# Advanced Config
dynamic-hz yes
aof-rewrite-incremental-fsync yes

# Threading (Redis 6.0+)
# io-threads 4
# io-threads-do-reads no

# TLS (if needed)
# port 0
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt

# Modules (if any)
# loadmodule /path/to/module.so

# Custom settings for Rate Limiting
# These help with the specific operations used by our rate limiting system

# Optimize for sorted sets (used in sliding window)
zset-max-ziplist-entries 64
zset-max-ziplist-value 32

# Optimize for hash operations (used for user reputation)
hash-max-ziplist-entries 256
hash-max-ziplist-value 32

# Set reasonable timeouts for Lua scripts
lua-time-limit 5000

# Disable some potentially slow operations for security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command DEBUG ""
# rename-command CONFIG ""  # Uncomment in production

# Enable keyspace notifications for monitoring
notify-keyspace-events "Ex"  # Enable expired events