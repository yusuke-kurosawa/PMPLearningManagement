# Redis Sentinel Configuration for High Availability
# Developer 3: API Rate Limiting・DDoS防止・Redis実装

# Basic Configuration
port 26379
bind 0.0.0.0

# Sentinel Configuration
sentinel monitor pmp-master 172.18.0.3 6379 2
sentinel auth-pass pmp-master ${REDIS_PASSWORD:-redispass123}
sentinel down-after-milliseconds pmp-master 10000
sentinel parallel-syncs pmp-master 1
sentinel failover-timeout pmp-master 60000

# Logging
logfile ""
loglevel notice

# Security
# sentinel auth-user <master-name> <username>
# sentinel auth-pass <master-name> <password>

# Scripts (Optional)
# sentinel client-reconfig-script pmp-master /path/to/script.sh

# Notification Scripts (Optional) 
# sentinel notification-script pmp-master /path/to/notify.sh

# Working Directory
dir /tmp

# Additional Configuration
sentinel deny-scripts-reconfig yes
sentinel resolve-hostnames no
sentinel announce-hostnames no

# Performance
sentinel myid $(openssl rand -hex 20)