# Gitleaks configuration file
title = "PMPLearningManagement Security Config"

[extend]
# Extend default rules
useDefault = true

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''
tags = ["jwt", "token"]

[[rules]]
id = "api-key-generic"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)['"]*\s*[:=]\s*['"][a-z0-9_-]{20,}['"]'''
tags = ["api", "key"]

[[rules]]
id = "database-connection"
description = "Database Connection String"
regex = '''(?i)(mongodb|mysql|postgres|oracle)://[^\s'"]+'''
tags = ["database", "connection"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN [A-Z]+ PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,255}'''
tags = ["github", "token"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]{9}/[A-Z0-9]{9}/[a-zA-Z0-9]{24}'''
tags = ["slack", "webhook"]

# Allowlist for specific files or patterns
[[rules.allowlist]]
description = "Ignore test files"
paths = [
    '''.*_test\..*''',
    '''.*\.test\..*''',
    '''.*/test/.*''',
    '''.*/tests/.*''',
    '''.*/__tests__/.*'''
]

[[rules.allowlist]]
description = "Ignore example configs"
paths = [
    '''.*\.example\..*''',
    '''.*\.sample\..*''',
    '''.*\.template\..*'''
]

[[rules.allowlist]]
description = "Ignore documentation"
paths = [
    '''.*\.md$''',
    '''.*\.txt$''',
    '''.*/docs/.*'''
]

[[rules.allowlist]]
description = "Ignore common false positives"
regexes = [
    '''example_key_here''',
    '''your_key_here''',
    '''replace_with_your_key''',
    '''sk_test_.*'''
]