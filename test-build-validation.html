<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Validation Test</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>React Vendor Chunk Validation Test</h1>
    <div id="test-results"></div>

    <script type="module">
        const results = [];
        const resultsDiv = document.getElementById('test-results');

        function logResult(type, message, details = null) {
            results.push({ type, message, details });
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${type.toUpperCase()}:</strong> ${message}`;
            if (details) {
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(details, null, 2);
                div.appendChild(pre);
            }
            resultsDiv.appendChild(div);
        }

        // Test 1: Check if React loads
        try {
            const reactScript = document.createElement('script');
            reactScript.type = 'module';
            reactScript.textContent = `
                import React from './dist/assets/react-vendor-D1wuzz9w.js';
                window.__REACT_LOADED__ = true;
                console.log('React loaded:', React);
            `;
            document.head.appendChild(reactScript);

            setTimeout(() => {
                if (window.__REACT_LOADED__) {
                    logResult('success', 'React vendor chunk loaded successfully');
                } else {
                    logResult('error', 'React vendor chunk failed to load');
                }
            }, 1000);
        } catch (error) {
            logResult('error', 'Failed to load React vendor chunk', {
                message: error.message,
                stack: error.stack
            });
        }

        // Test 2: Listen for runtime errors
        window.addEventListener('error', (event) => {
            if (event.filename.includes('react-vendor')) {
                logResult('error', 'Runtime error in react-vendor chunk', {
                    message: event.message,
                    filename: event.filename,
                    line: event.lineno,
                    column: event.colno
                });
            }
        });

        window.addEventListener('unhandledrejection', (event) => {
            logResult('error', 'Unhandled promise rejection', {
                reason: event.reason
            });
        });

        // Test 3: Check for TDZ errors
        const originalError = console.error;
        console.error = function(...args) {
            const message = args.join(' ');
            if (message.includes('Cannot access') && message.includes('before initialization')) {
                logResult('error', 'TDZ Error Detected!', {
                    message: message
                });
            }
            originalError.apply(console, args);
        };

        logResult('info', 'Test initialized. Waiting for results...');
    </script>
</body>
</html>
